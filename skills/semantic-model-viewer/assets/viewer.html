<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Semantic Model Viewer</title>
<meta name="description" content="Source text and its Semantic Model side by side (Two Pane), or the model forming step by step (Formation).">
<style>
/*
  Semantic Model Viewer — one HTML, two views of one Semantic Model (semantic-model/1).
  Two Pane: source and model side by side, synchronized both ways.
  Formation: the model forming from a focus, or in reading order, with each element rising from its words.
  The page never derives meaning from the source text; it only reads the embedded model.
*/
:root {
  --bg: #f6f6f3;
  --panel: #ffffff;
  --fg: #1c1e23;
  --muted: #646a75;
  --line: #d8dadf;
  --node: #ffffff;
  --node-line: #8f96a3;
  --edge: #7c8390;
  --accent: #2563d9;
  --accent-rgb: 37, 99, 217;
  --evidence: #b86e00;
  --evidence-rgb: 184, 110, 0;
  --uncertain: #b24a1e;
  --pos: #c4532d;
  --neg: #2b7f8f;
  --chip: #eef0f4;
  --shadow: 0 8px 28px rgba(20, 24, 33, .12);
  --font: system-ui, -apple-system, "Hiragino Sans", "Hiragino Kaku Gothic ProN", "Noto Sans JP", "Yu Gothic UI", "Yu Gothic", Meiryo, sans-serif;
  --mono: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #121418; --panel: #1a1d23; --fg: #e8eaee; --muted: #9aa1ad; --line: #2c3038;
    --node: #1f232a; --node-line: #737b88; --edge: #8a919d;
    --accent: #6b9dff; --accent-rgb: 107, 157, 255;
    --evidence: #f0a73a; --evidence-rgb: 240, 167, 58; --uncertain: #f08a5d;
    --pos: #f08a6a; --neg: #5cc2d1;
    --chip: #262a32; --shadow: 0 8px 28px rgba(0, 0, 0, .45);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #121418; --panel: #1a1d23; --fg: #e8eaee; --muted: #9aa1ad; --line: #2c3038;
  --node: #1f232a; --node-line: #737b88; --edge: #8a919d;
  --accent: #6b9dff; --accent-rgb: 107, 157, 255;
  --evidence: #f0a73a; --evidence-rgb: 240, 167, 58; --uncertain: #f08a5d;
  --pos: #f08a6a; --neg: #5cc2d1;
  --chip: #262a32; --shadow: 0 8px 28px rgba(0, 0, 0, .45);
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { height: 100%; }
body { margin: 0; background: var(--bg); color: var(--fg); font: 14px/1.6 var(--font); display: grid; grid-template-rows: auto minmax(0, 1fr); grid-template-columns: minmax(0, 1fr); overflow: hidden; }
button, select { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

/* ---------- header ---------- */
header { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 16px; padding: 10px 16px; border-bottom: 1px solid var(--line); background: var(--panel); }
.titles { min-width: 0; flex: 1 1 260px; }
.titles h1 { font-size: 16px; line-height: 1.3; margin: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.titles .src { color: var(--muted); font-size: 12px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.titles .src a { color: inherit; }
.seg-ctl { display: inline-flex; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; background: var(--bg); }
.seg-ctl button { border: 0; background: transparent; padding: 5px 12px; font-size: 13px; }
.seg-ctl button + button { border-left: 1px solid var(--line); }
.seg-ctl button[aria-pressed="true"] { background: var(--accent); color: #fff; }
.ctl-label { font-size: 11px; color: var(--muted); margin-right: 6px; letter-spacing: .04em; }
.ctl { display: inline-flex; align-items: center; }
.ctl[hidden] { display: none; }

/* ---------- panes ---------- */
main { display: grid; grid-template-columns: minmax(280px, 41%) minmax(0, 1fr); min-height: 0; }
#sourceWrap { position: relative; min-height: 0; border-right: 1px solid var(--line); background: var(--panel); }
#sourcePane { position: absolute; inset: 0; overflow: auto; padding: 22px 30px 40vh 26px; scroll-behavior: auto; }
#source { white-space: pre-wrap; font-size: 15px; line-height: 2; max-width: 44em; margin: 0; overflow-wrap: anywhere; }
#ticks { position: absolute; top: 0; right: 0; width: 8px; bottom: 0; pointer-events: none; }
#ticks i { position: absolute; right: 1px; width: 6px; height: 3px; border-radius: 2px; background: var(--accent); pointer-events: auto; cursor: pointer; }
#ticks i.ev { background: var(--evidence); }
#ticks i.weak { opacity: .45; }

.seg { border-radius: 3px; cursor: pointer; transition: background-color .15s, box-shadow .15s; text-decoration: underline dotted rgba(var(--accent-rgb), .22); text-underline-offset: 4px; text-decoration-thickness: 1px; }
body.focusing .seg { text-decoration-color: transparent; }
.seg.lit { background-color: rgba(var(--accent-rgb), calc(var(--hl) * .36)); }
.seg.hot { box-shadow: inset 0 -2px 0 var(--accent); background-color: rgba(var(--accent-rgb), .30); }
.seg.ev { background-color: rgba(var(--evidence-rgb), .22); box-shadow: inset 0 -2px 0 var(--evidence); }
.seg.flash { animation: flash 1.2s ease-out; }
@keyframes flash { 0%, 30% { background-color: rgba(var(--accent-rgb), .55); } 100% { background-color: transparent; } }
/* formation states */
body.formation .seg { cursor: default; text-decoration-color: transparent; }
body.formation #source { color: var(--muted); }
.seg.formed { color: var(--fg); background-color: rgba(var(--accent-rgb), .08); }
.seg.current { color: var(--fg); background-color: rgba(var(--accent-rgb), .32); box-shadow: inset 0 -2px 0 var(--accent); }
#source .reading { color: var(--fg); }

#graphPane { position: relative; min-height: 0; overflow: hidden; }
#graph { position: absolute; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; cursor: grab; user-select: none; -webkit-user-select: none; }
#graph.panning { cursor: grabbing; }

/* ---------- graph ---------- */
.node { --hl: 1; opacity: calc(.12 + .88 * var(--hl)); transition: opacity .2s; cursor: pointer; }
.node .box { fill: var(--node); stroke: var(--node-line); stroke-width: 1.2; }
.node .box2 { fill: none; stroke: var(--node-line); stroke-width: .9; }
.node text { fill: var(--fg); dominant-baseline: central; text-anchor: middle; pointer-events: none; }
.node .tag { fill: var(--muted); font-family: var(--mono); letter-spacing: .02em; }
.node .badge circle { fill: var(--chip); stroke: var(--node-line); stroke-width: .8; }
.node .badge text { fill: var(--muted); font-weight: 700; }
.node .qmark circle { fill: var(--uncertain); }
.node .qmark text { fill: #fff; font-weight: 700; }
.node.prov-inferred .box, .node.prov-uncertain .box { stroke-dasharray: 5 3; }
.node.prov-uncertain .box { stroke: var(--uncertain); }
.node.prov-abstracted .box { stroke-dasharray: 1.5 2.5; stroke-width: 1.6; }
.node.is-focus .box { stroke: var(--accent); stroke-width: 2.6; fill: color-mix(in srgb, var(--accent) 12%, var(--node)); }
.node.is-near .box { stroke: var(--accent); stroke-width: 1.7; }
.node.is-evidence .box { stroke: var(--evidence); stroke-width: 2.2; }
.node.is-hover .box { stroke-width: 2.6; }
.node.in-view .box { fill: color-mix(in srgb, var(--accent) 6%, var(--node)); }
.node.tiny text, .node.tiny .badge, .node.tiny .qmark, .node.tiny .box, .node.tiny .box2 { display: none; }
.node .dot { display: none; fill: var(--node-line); }
.node.tiny .dot { display: inline; }
.node.tiny.is-focus .dot, .node.tiny.is-near .dot { fill: var(--accent); }
.node.tiny.is-evidence .dot { fill: var(--evidence); }
.node.notag .tag { display: none; }
.node .ring { fill: none; stroke: var(--accent); stroke-width: 2; opacity: 0; }

.edge { --hl: 1; opacity: calc(var(--edge-idle, .55) * (1 - var(--focusing, 0)) + var(--focusing, 0) * (.06 + .94 * var(--hl))); transition: opacity .2s; cursor: pointer; }
.edge .line { fill: none; stroke: var(--edge); stroke-width: 1.3; }
.edge .arrow { fill: var(--edge); }
.edge .hit { fill: none; stroke: transparent; stroke-width: 12; }
.edge .elabel { fill: var(--muted); font-size: 10.5px; text-anchor: middle; dominant-baseline: central; paint-order: stroke; stroke: var(--bg); stroke-width: 3.5px; stroke-linejoin: round; pointer-events: none; }
.edge.prov-inferred .line, .edge.prov-uncertain .line { stroke-dasharray: 6 4; }
.edge.prov-uncertain .line { stroke: var(--uncertain); }
.edge.prov-abstracted .line { stroke-dasharray: 1.5 3; }
.edge.pol-plus .line { stroke: var(--pos); }
.edge.pol-plus .arrow { fill: var(--pos); }
.edge.pol-minus .line { stroke: var(--neg); }
.edge.pol-minus .arrow { fill: var(--neg); }
.node text.state { fill: var(--muted); text-anchor: start; }
.node .state-when { fill: var(--accent); font-weight: 600; }
.node.nostate .state, .node.nostate .state-when, .node.nostate .sep { display: none; }
.node .sep { stroke: var(--line); stroke-width: 1; }
.node.role-conclusion .box { stroke-width: 2.4; stroke: var(--fg); }
.node.role-conclusion .box2 { stroke: var(--fg); }
.edge.is-focus .line, .edge.is-near .line { stroke: var(--accent); stroke-width: 2.2; }
.edge.is-focus .arrow, .edge.is-near .arrow { fill: var(--accent); }
.edge.is-focus .elabel, .edge.is-near .elabel { fill: var(--fg); font-weight: 600; }
.edge.is-evidence .line { stroke: var(--evidence); stroke-width: 2.2; }
.edge.is-evidence .arrow { fill: var(--evidence); }
.edge.is-hover .line { stroke-width: 2.6; }
.edge.nolabel .elabel { display: none; }
.edge.is-focus.nolabel .elabel, .edge.is-near.nolabel .elabel, .edge.is-evidence.nolabel .elabel { display: inline; }

.partof { fill: none; stroke: var(--node-line); stroke-width: 1; stroke-dasharray: 1 4; stroke-linecap: round; opacity: .55; pointer-events: none; }
.basis { fill: none; stroke: var(--evidence); stroke-width: 1.4; stroke-dasharray: 2 4; stroke-linecap: round; opacity: 0; pointer-events: none; transition: opacity .2s; }
.basis.on { opacity: .9; }
body.focusing .partof { opacity: .18; }

/* formation visibility */
.f-hidden { display: none; }
body.formation .node, body.formation .edge { --focusing: 1; }
body.formation .node.formed { --hl: .62; }
body.formation .edge.formed { --hl: .5; }
body.formation .node.current { --hl: 1; }
body.formation .node.current .box { stroke: var(--accent); stroke-width: 2.4; }
body.formation .edge.current { --hl: 1; }
body.formation .edge.current .line { stroke: var(--accent); stroke-width: 2.2; }
body.formation .edge.current .arrow { fill: var(--accent); }
body.formation .edge.current .elabel { display: inline; fill: var(--fg); font-weight: 600; }
body.formation.complete .node, body.formation.complete .edge { --hl: 1; }
body.formation .partof { opacity: .35; }

/* ---------- overlays ---------- */
.overlay { position: absolute; pointer-events: none; }
.overlay > * { pointer-events: auto; }
#tools { right: 12px; bottom: 12px; display: flex; gap: 6px; }
.icon-btn { width: 32px; height: 32px; border-radius: 8px; border: 1px solid var(--line); background: var(--panel); box-shadow: var(--shadow); display: grid; place-items: center; font-size: 16px; line-height: 1; }
.icon-btn[aria-pressed="true"] { background: var(--accent); color: #fff; border-color: var(--accent); }
.text-btn { height: 32px; padding: 0 10px; border-radius: 8px; border: 1px solid var(--line); background: var(--panel); box-shadow: var(--shadow); font-size: 12px; }
.text-btn[aria-pressed="true"] { background: var(--accent); color: #fff; border-color: var(--accent); }
#legend { left: 12px; bottom: 12px; background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 8px 10px; font-size: 11.5px; color: var(--muted); box-shadow: var(--shadow); display: grid; gap: 3px; }
#legend svg { vertical-align: middle; margin-right: 6px; }
#legend[hidden] { display: none; }
#offscreen { inset: 0; }
#offscreen .chip { position: absolute; transform: translate(-50%, -50%); max-width: 150px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; font-size: 11px; padding: 2px 8px; border-radius: 999px; background: var(--panel); border: 1.5px solid var(--accent); color: var(--fg); box-shadow: var(--shadow); cursor: pointer; }
#offscreen .chip.ev { border-color: var(--evidence); }
#offscreen .chip.weak { opacity: .7; border-style: dashed; }

#details { right: 12px; top: 12px; width: min(340px, calc(100% - 24px)); max-height: calc(100% - 76px); overflow: auto; background: var(--panel); border: 1px solid var(--line); border-radius: 12px; box-shadow: var(--shadow); padding: 12px 14px; font-size: 13px; }
#details[hidden] { display: none; }
#details.compact { width: min(300px, calc(100% - 24px)); padding: 8px 12px; opacity: .96; }
#details.compact h2 { font-size: 14px; margin: 2px 0 2px; }
#details h2 { font-size: 15px; line-height: 1.35; margin: 4px 0 8px; }
#details .meta { display: flex; flex-wrap: wrap; gap: 4px; }
#details .pill { font-size: 11px; padding: 1px 8px; border-radius: 999px; background: var(--chip); color: var(--muted); }
#details .pill.prov-explicit { color: var(--fg); }
#details .pill.prov-inferred, #details .pill.prov-abstracted { color: var(--evidence); }
#details .pill.prov-uncertain { color: var(--uncertain); }
#details .pin { font-size: 11px; color: var(--accent); }
#details .close { margin-left: auto; border: 0; background: transparent; color: var(--muted); font-size: 18px; line-height: 1; padding: 0 2px; }
#details h3 { font-size: 11px; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); margin: 12px 0 4px; font-weight: 600; }
#details ul { list-style: none; margin: 0; padding: 0; display: grid; gap: 3px; }
#details li button { all: unset; cursor: pointer; display: block; width: 100%; border-radius: 6px; padding: 2px 6px; margin: 0 -6px; }
#details li button:hover, #details li button:focus-visible { background: var(--chip); }
#details .q { color: var(--fg); }
#details .q::before { content: "「"; color: var(--muted); }
#details .q::after { content: "」"; color: var(--muted); }
#details .note { background: var(--chip); border-radius: 8px; padding: 6px 8px; margin-top: 8px; }
#details .arrowtxt { color: var(--muted); }
#details .extra { font-family: var(--mono); font-size: 11.5px; white-space: pre-wrap; overflow-wrap: anywhere; color: var(--muted); }
#details .hint { color: var(--muted); }
#details .actions { margin-top: 10px; display: flex; gap: 6px; flex-wrap: wrap; }
#details .actions button { border: 1px solid var(--line); background: var(--bg); border-radius: 8px; padding: 3px 10px; font-size: 12px; }

#problems { left: 12px; top: 12px; max-width: min(420px, calc(100% - 24px)); background: var(--panel); border: 1px solid var(--uncertain); color: var(--uncertain); border-radius: 10px; padding: 6px 10px; font-size: 12px; box-shadow: var(--shadow); }
#problems[hidden] { display: none; }

/* formation bar */
#fbar { left: 12px; right: 12px; bottom: 12px; display: none; flex-direction: column; gap: 8px; }
body.formation #fbar { display: flex; }
body.formation #tools, body.formation #legend, body.formation #details { display: none; }
#caption { align-self: center; max-width: min(760px, 100%); background: var(--panel); border: 1px solid var(--line); border-radius: 12px; box-shadow: var(--shadow); padding: 8px 14px; text-align: center; }
#caption .phase { font-size: 11px; letter-spacing: .08em; text-transform: uppercase; color: var(--accent); font-weight: 700; }
#caption .main { font-size: 15px; font-weight: 600; line-height: 1.45; }
#caption .quote { font-size: 12.5px; color: var(--muted); margin-top: 2px; overflow: hidden; text-overflow: ellipsis; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; }
#controls { align-self: center; display: flex; flex-wrap: wrap; justify-content: center; align-items: center; gap: 6px; background: var(--panel); border: 1px solid var(--line); border-radius: 12px; box-shadow: var(--shadow); padding: 6px 8px; }
#controls select { border: 1px solid var(--line); border-radius: 8px; background: var(--bg); padding: 3px 6px; font-size: 12px; max-width: 180px; }
#progress { font-family: var(--mono); font-size: 12px; color: var(--muted); min-width: 64px; text-align: center; }
#steps { right: 12px; top: 12px; width: min(300px, calc(100% - 24px)); max-height: calc(100% - 210px); overflow: auto; background: var(--panel); border: 1px solid var(--line); border-radius: 12px; box-shadow: var(--shadow); padding: 8px; font-size: 12px; display: none; }
body.formation #steps.open { display: block; }
#steps h3 { font-size: 11px; letter-spacing: .06em; text-transform: uppercase; color: var(--accent); margin: 8px 6px 2px; }
#steps button { all: unset; display: block; width: 100%; box-sizing: border-box; padding: 3px 6px; border-radius: 6px; cursor: pointer; color: var(--muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
#steps button:hover { background: var(--chip); }
#steps button.done { color: var(--fg); }
#steps button.now { background: rgba(var(--accent-rgb), .14); color: var(--fg); font-weight: 600; }

.ghost { position: fixed; left: 0; top: 0; z-index: 20; pointer-events: none; padding: 1px 6px; border-radius: 6px; background: rgba(var(--accent-rgb), .9); color: #fff; font-size: 13px; white-space: nowrap; box-shadow: var(--shadow); }

@media (max-width: 860px) {
  body { overflow: auto; }
  main { grid-template-columns: minmax(0, 1fr); grid-template-rows: 42vh 58vh; }
  header { padding: 8px 12px; }
  #sourceWrap { border-right: 0; border-bottom: 1px solid var(--line); }
  #sourcePane { padding: 14px 18px 30vh 16px; }
  #details { top: auto; bottom: 56px; max-height: 45%; }
  #legend { display: none; }
  body.formation main { grid-template-rows: 30vh 70vh; }
  #caption { padding: 6px 10px; }
  #caption .main { font-size: 13.5px; }
  #caption .quote { display: none; }
  #controls { gap: 4px; padding: 5px 6px; }
  #controls select { max-width: 120px; }
  #controls .icon-btn { width: 30px; height: 30px; }
}
@media (prefers-reduced-motion: reduce) {
  * { transition: none !important; animation: none !important; }
}
</style>
</head>
<body>
<header>
  <div class="titles"><h1 id="title">Semantic Model</h1><div class="src" id="sourceLine"></div></div>
  <div class="ctl"><span class="ctl-label" data-i18n="view">VIEW</span>
    <div class="seg-ctl" id="modeCtl" role="group">
      <button type="button" data-mode="two-pane" aria-pressed="true" data-i18n="twoPane">Two Pane</button>
      <button type="button" data-mode="formation" aria-pressed="false" data-i18n="formation">Formation</button>
    </div>
  </div>
  <div class="ctl" id="levelWrap" hidden><span class="ctl-label" data-i18n="scale">SCALE</span>
    <div class="seg-ctl" id="levelCtl" role="group"></div>
  </div>
</header>
<main>
  <div id="sourceWrap">
    <div id="sourcePane" tabindex="0" aria-label="Source text"><p id="source"></p></div>
    <div id="ticks" aria-hidden="true"></div>
  </div>
  <div id="graphPane">
    <svg id="graph" role="group" aria-label="Semantic Model graph">
      <g id="layer-hulls"></g>
      <g id="layer-partof"></g>
      <g id="layer-basis"></g>
      <g id="layer-edges"></g>
      <g id="layer-nodes"></g>
    </svg>
    <div class="overlay" id="offscreen"></div>
    <div class="overlay" id="problems" hidden></div>
    <aside class="overlay" id="details" hidden aria-live="polite"></aside>
    <div class="overlay" id="legend"></div>
    <div class="overlay" id="tools">
      <button type="button" class="text-btn" id="followBtn" aria-pressed="false" data-i18n="follow">Follow text</button>
      <button type="button" class="icon-btn" id="zoomOut" aria-label="Zoom out">−</button>
      <button type="button" class="icon-btn" id="zoomIn" aria-label="Zoom in">+</button>
      <button type="button" class="icon-btn" id="fitBtn" aria-label="Fit">⤢</button>
    </div>
    <nav class="overlay" id="steps" aria-label="Formation steps"></nav>
    <div class="overlay" id="fbar">
      <div id="caption" aria-live="polite"><div class="phase"></div><div class="main"></div><div class="quote"></div></div>
      <div id="controls">
        <select id="strategySel" aria-label="Formation order">
          <option value="focus" data-i18n="byFocus">From a focus</option>
          <option value="reading" data-i18n="byReading">In reading order</option>
        </select>
        <select id="focusSel" aria-label="Focus node"></select>
        <button type="button" class="icon-btn" id="restartBtn" aria-label="Restart">⏮</button>
        <button type="button" class="icon-btn" id="prevBtn" aria-label="Previous step">◀</button>
        <button type="button" class="icon-btn" id="playBtn" aria-label="Play">▶</button>
        <button type="button" class="icon-btn" id="nextBtn" aria-label="Next step">▶|</button>
        <button type="button" class="icon-btn" id="endBtn" aria-label="Show all">⏭</button>
        <span id="progress">0 / 0</span>
        <select id="speedSel" aria-label="Speed">
          <option value="0.5">0.5×</option><option value="1" selected>1×</option><option value="2">2×</option><option value="4">4×</option>
        </select>
        <button type="button" class="text-btn" id="stepsBtn" aria-pressed="false" data-i18n="steps">Steps</button>
      </div>
    </div>
  </div>
</main>

<!-- The Semantic Model (semantic-model/1). build_viewer.py replaces this block. -->
<script type="application/json" id="semantic-model">
{
  "version": "semantic-model/1",
  "sourceText": "AはBを使ってCした。DはCに影響した。",
  "nodes": [
    {"id": "a", "label": "A", "type": "actor", "provenance": "explicit", "sourceSpans": [{"start": 0, "end": 1, "text": "A"}]},

/* =====================================================================
   7. Two Pane: focus, highlight by semantic distance, evidence tracing
   ===================================================================== */
let mode = 'two-pane';
let hover = null;        // {vid, mid}
let pinned = null;       // {vid, mid}

function distances(startVid) {

  const queue = [[0, startVid]];
  while (queue.length) {
    queue.sort((a, b) => a[0] - b[0]);
    const [d, u] = queue.shift();
    if (d > dist.get(u) || d >= 5) continue;
    for (const [v, w] of G.adj.get(u) || []) {
      const nd = d + w;

}

  svg.style.setProperty('--focusing', f ? 1 : 0);
  layers.basis.querySelectorAll('.basis').forEach(b => b.classList.remove('on'));
  if (!f) {
    nodeDom.forEach(({ g }) => { g.style.setProperty('--hl', 1); g.classList.remove('is-focus', 'is-near', 'is-evidence', 'is-hover'); });
    edgeDom.forEach(({ g }) => { g.style.setProperty('--hl', 1); g.classList.remove('is-focus', 'is-near', 'is-evidence', 'is-hover'); });
    segs.forEach(s => { s.el.classList.remove('lit', 'hot', 'ev'); s.el.style.removeProperty('--hl'); });

  const evVis = new Set([...ev].map(el => visOf(el, G)).filter(Boolean));
  const intensityOfVis = vid => INTENSITY(dist.has(vid) ? dist.get(vid) : Infinity);

    const i = Math.max(intensityOfVis(id), evVis.has(id) ? .8 : 0);
    g.style.setProperty('--hl', i);

    g.classList.toggle('is-near', id !== f.vid && intensityOfVis(id) >= .6);
    g.classList.toggle('is-evidence', evVis.has(id) && id !== f.vid);
    g.classList.toggle('is-hover', !!(pinned && hover && hover.vid === id && id !== pinned.vid));
  });

    const i = Math.max(intensityOfVis(id), evVis.has(id) ? .8 : 0);
    g.style.setProperty('--hl', i);
    g.classList.toggle('is-focus', id === f.vid);
    g.classList.toggle('is-near', id !== f.vid && intensityOfVis(id) >= .6);
    g.classList.toggle('is-evidence', evVis.has(id) && id !== f.vid);
    g.classList.toggle('is-hover', !!(pinned && hover && hover.vid === id && id !== pinned.vid));
  });

    const fromVis = new Set(focusEls.map(el => visOf(el, G)));

  });

      add.push(v.kind === 'edge' ? { id: vid, from: shown.has(v.a.id) ? v.a.id : v.b.id } : { id: vid });
    });
    if (add.length) steps.push({ phase: st.phase && PHASES.includes(st.phase) ? st.phase : 'custom', add, caption: st.caption });
  });
  const rest = [];
  G.nodes.forEach(n => { if (!shown.has(n.id)) { shown.add(n.id); rest.push({ id: n.id }); } });
  G.edges.forEach(e => { if (!shown.has(e.id)) { shown.add(e.id); rest.push({ id: e.id, from: e.a.id }); } });
  if (rest.length) steps.push({ phase: 'overall', add: rest });
  return steps;
}
function buildPlan() {
  const custom = viewOpt.formation && Array.isArray(viewOpt.formation.steps) && formation.strategy === 'custom';
  let steps;
  if (custom) steps = planCustom(viewOpt.formation.steps);
  else if (formation.strategy === 'reading') steps = planReading();
  else {
    let f = formation.focusId && els.get(formation.focusId);
    f = f && f.kind === 'node' ? repAt(f, G.L) : defaultFocus();
    formation.focusId = f.id;
    steps = planFocus(f);
  }
  // make sure every edge knows which end it grows from
  const seen = new Set();
  steps.forEach(st => st.add.forEach(it => {
    const v = G.byId.get(it.id);
    if (v.kind === 'edge' && !it.from) it.from = seen.has(v.a.id) ? v.a.id : v.b.id;
    seen.add(it.id);
  }));
  steps.push({ phase: 'complete', add: [] });
  formation.steps = steps;
  formation.k = -1;
  renderStepList();
  // pace: keep the whole run near two minutes at 1×
  const est = steps.reduce((s, st) => s + stepMs(st, 1), 0) / 1000;
  const sel = $('#speedSel');
  sel.value = est > 360 ? '4' : est > 170 ? '2' : '1';
  formation.speed = +sel.value;
}
function captionOf(st) {
  if (st.caption) return st.caption;
  if (st.phase === 'complete') return T.phase_complete;
  const parts = st.add.map(it => G.byId.get(it.id)).filter(Boolean);
  const edges = parts.filter(p => p.kind === 'edge'), ns = parts.filter(p => p.kind === 'node');
  if (edges.length === 1 && ns.length <= 1) {
    const e = edges[0];
    return relLine(e.rels[0]) + (e.rels.length > 1 ? ` +${e.rels.length - 1}` : '');
  }
  const names = ns.map(n => n.label + (n.states && n.states.length === 1 && ns.length === 1 ? `（${n.states[0].label}）` : ''));
  if (!names.length && edges.length) return edges.slice(0, 3).map(e => relLine(e.rels[0])).join(' / ') + (edges.length > 3 ? ` +${edges.length - 3}` : '');
  if (!names.length && st.revisit && st.revisit.length) return st.revisit.map(id => G.byId.get(id).label).join(' · ');
  return names.slice(0, 4).join(' · ') + (names.length > 4 ? ` +${names.length - 4}` : '');
}
function stepSpans(st) {
  const out = [];
  st.add.forEach(it => {
    const v = G.byId.get(it.id);
    const ms = v.kind === 'edge' ? v.rels : (G.members.get(v.id) || [v]);
    ms.forEach(m => m.spans.forEach(sp => out.push({ sp, el: m })));
  });
  (st.revisit || []).forEach(id => (G.members.get(id) || []).forEach(m => m.spans.forEach(sp => {
    if (!st.cursor || (sp.start >= st.cursor[0] && sp.start < st.cursor[1])) out.push({ sp, el: m });
  })));
  return out;
}
function stepMs(st, speed = formation.speed) {
  if (!st) return 0;
  if (st.phase === 'complete') return 1600 / speed;
  const n = st.add.length + (st.revisit ? st.revisit.length * .4 : 0);
  return (700 + Math.min(n, 10) * 170 + Math.min(Array.from(captionOf(st)).length, 60) * 12) / speed;
}
function renderStepList() {
  const box = $('#steps');
  box.replaceChildren();
  let last = null;
  formation.steps.forEach((st, k) => {
    if (st.phase !== last) { box.append(h('h3', {}, T['phase_' + st.phase] || st.phase)); last = st.phase; }
    const b = h('button', { 'data-k': k, title: captionOf(st) }, `${k + 1}. ${captionOf(st)}`);
    b.addEventListener('click', () => { pause(); showStep(k); });
    box.append(b);
  });
}
function markStepList() {
  $$('#steps button').forEach(b => {
    const k = +b.dataset.k;
    b.classList.toggle('done', k < formation.k);
    b.classList.toggle('now', k === formation.k);
    if (k === formation.k) b.scrollIntoView({ block: 'nearest' });
  });
  $('#progress').textContent = `${Math.max(0, formation.k + 1)} / ${formation.steps.length}`;
}
function formedThrough(k) {
  const set = new Set();
  for (let i = 0; i <= k && i < formation.steps.length; i++) formation.steps[i].add.forEach(it => set.add(it.id));
  if (k >= formation.steps.length - 1) { G.nodes.forEach(n => set.add(n.id)); G.edges.forEach(e => set.add(e.id)); }
  return set;
}
// draw the state after step k (no animation)
function showStep(k, opts = {}) {
  formation.k = clamp(k, -1, formation.steps.length - 1);
  const st = formation.steps[formation.k];
  const formed = formedThrough(formation.k);
  const current = new Set(st ? st.add.map(it => it.id) : []);
  const done = formation.k === formation.steps.length - 1;
  document.body.classList.toggle('complete', done);
  nodeDom.forEach(({ g }, id) => {
    g.classList.toggle('f-hidden', !formed.has(id));
    g.classList.toggle('formed', formed.has(id));
    g.classList.toggle('current', current.has(id) || !!(st && st.revisit && st.revisit.includes(id)));
  });
  edgeDom.forEach(({ g, line }, id) => {
    g.classList.toggle('f-hidden', !formed.has(id));
    g.classList.toggle('formed', formed.has(id));
    g.classList.toggle('current', current.has(id));
    line.style.strokeDasharray = ''; line.style.strokeDashoffset = '';
  });
  $$('.partof', layers.partof).forEach((p, i) => {
    const [pa, c] = G.partof[i];
    p.classList.toggle('f-hidden', !(formed.has(pa.id) && formed.has(c.id)));
  });
  // text: formed spans faintly, this step's spans strongly
  const formedEls = new Set();
  formed.forEach(id => { const v = G.byId.get(id); (v.kind === 'edge' ? v.rels : G.members.get(id) || [v]).forEach(m => formedEls.add(m)); });
  const curSpans = st ? stepSpans(st) : [];
  const curKeys = new Set(curSpans.map(o => o.sp.start + ':' + o.sp.end));
  segs.forEach(s => {
    s.el.classList.toggle('formed', s.owners.some(o => formedEls.has(o.el)));
    s.el.classList.toggle('current', s.owners.some(o => curKeys.has(o.sp.start + ':' + o.sp.end) && o.len <= 120));
  });
  markReading(st && st.cursor);
  // caption
  $('#caption .phase').textContent = st ? (T['phase_' + st.phase] || st.phase) : '';
  $('#caption .main').textContent = st ? captionOf(st) : '';
  const q = st ? (st.cursor ? slice(st.cursor[0], st.cursor[1]) : curSpans.slice(0, 2).map(o => '「' + quoteOf(o.sp) + '」').join(' ')) : '';
  $('#caption .quote').textContent = q;
  markStepList();
  if (opts.camera !== false) formationCamera(opts.ms);
  if (opts.scroll !== false) scrollToStep(st);
}
let readingMark = null;
function markReading(cursor) {
  if (readingMark) readingMark.forEach(s => s.el.classList.remove('reading'));
  readingMark = null;
  if (!cursor) return;
  // the sentence being read gets full ink
  readingMark = [...segs, ...plains].filter(s => s.start < cursor[1] && s.end > cursor[0]);
  readingMark.forEach(s => s.el.classList.add('reading'));
}
function formationCamera(ms = 700) {
  const st = formation.steps[formation.k];
  const formed = [...formedThrough(formation.k)].filter(id => G.byId.get(id).kind === 'node');
  if (!st || st.phase === 'complete' || !formed.length) { fitAll(ms); return; }
  let ids = formed;
  if (formation.strategy === 'reading') {
    const cur = st.add.map(it => G.byId.get(it.id)).flatMap(v => v.kind === 'edge' ? [v.a.id, v.b.id] : [v.id]);
    const rv = st.revisit || [];
    ids = [...new Set([...cur, ...rv])];
    if (!ids.length) ids = formed;
  }
  const b = bboxOf(ids);
  const minW = Math.min(LY.w, 520), minH = Math.min(LY.h, 360);
  if (b.w < minW) { b.x -= (minW - b.w) / 2; b.w = minW; }
  if (b.h < minH) { b.y -= (minH - b.h) / 2; b.h = minH; }
  moveCamera(fitBox(b, 40, formation.strategy === 'reading' ? 1.05 : 1.3), ms);
}
function scrollToStep(st) {
  if (!st) return;
  const target = st.cursor ? segs.find(s => s.start >= st.cursor[0]) : (() => { const sp = stepSpans(st).map(o => o.sp).sort((a, b) => a.start - b.start)[0]; return sp && firstSegOfSpan(sp); })();
  if (!target) return;
  const pr = sourcePane.getBoundingClientRect(), r = target.el.getBoundingClientRect();
  if (r.top < pr.top + pr.height * .15 || r.bottom > pr.bottom - pr.height * .25) {
    sourcePane.scrollTo({ top: sourcePane.scrollTop + r.top - pr.top - pr.height * .3, behavior: reduceMotion ? 'auto' : 'smooth' });
  }
}

// animate the transition into step k: items start one after another, overlapping,
// and a relation waits until both of its ends are on screen
async function animateStep(k) {
  const token = ++formation.token;
  const st = formation.steps[k];
  if (!st) return;
  const prevFormed = formedThrough(k - 1);
  showStep(k, { ms: 650 });
  if (reduceMotion) return;
  const items = st.add.filter(it => !prevFormed.has(it.id));
  items.forEach(it => { const d = nodeDom.get(it.id) || edgeDom.get(it.id); if (d) d.g.style.visibility = 'hidden'; });
  await sleep(220 / formation.speed);
  const lead = items.filter(it => !it.via);
  const stagger = clamp(2400 / Math.max(1, lead.length), 120, 260) / formation.speed;
  const dur = clamp(1 - (lead.length - 3) * .06, .45, 1);
  const ready = new Map();
  let slot = 0, ghosts = 0;
  for (const it of items) {
    if (it.via) continue;                      // brought in by its relation
    const v = G.byId.get(it.id);
    const delay = slot++ * stagger;
    if (v.kind === 'node') {
      const fly = ghosts++ < 6;
      ready.set(v.id, (async () => { await sleep(delay); if (token === formation.token) await emergeNode(v, token, dur, fly); })());
    } else {
      const far = items.find(x => x.via === v.id);
      const ends = [ready.get(v.a.id), ready.get(v.b.id)].filter(Boolean);   // fixed now, before this relation registers its far end
      const run = (async () => {
        await sleep(delay);
        await Promise.all(ends);
        if (token !== formation.token) return;
        await growEdge(v, it.from, token, dur);
        if (far && token === formation.token) await popNode(G.byId.get(far.id), dur);
      })();
      ready.set(v.id, run);
      if (far) ready.set(far.id, run);
    }
  }
  await Promise.all(ready.values());
  if (token !== formation.token) return;
  (st.revisit || []).forEach(id => pulse(id));
  items.forEach(it => { const d = nodeDom.get(it.id) || edgeDom.get(it.id); if (d) d.g.style.visibility = ''; });
}
function screenOfSpan(v) {
  const ms = G.members.get(v.id) || [v];
  const sp = ms.flatMap(m => m.spans).sort((a, b) => a.start - b.start)[0];
  if (!sp) return null;
  const seg = firstSegOfSpan(sp);
  if (!seg) return null;
  const r = seg.el.getBoundingClientRect(), pr = sourcePane.getBoundingClientRect();
  if (r.bottom < pr.top || r.top > pr.bottom || !r.width) return null;
  return { x: r.left, y: r.top, text: quoteOf(sp) };
}
async function emergeNode(v, token, dur = 1, fly = true) {
  const d = nodeDom.get(v.id);
  if (!d) return;
  const from = fly ? screenOfSpan(v) : null;
  if (from) {
    const gp = graphPane.getBoundingClientRect();
    const to = toScreen(LY.pos.get(v.id));
    const ghost = h('div', { class: 'ghost' }, Array.from(from.text).length > 18 ? Array.from(from.text).slice(0, 17).join('') + '…' : from.text);
    document.body.append(ghost);
    const anim = ghost.animate([
      { transform: `translate(${from.x}px, ${from.y}px) scale(1)`, opacity: .95 },
      { transform: `translate(${gp.left + to.x - 30}px, ${gp.top + to.y - 12}px) scale(1.08)`, opacity: .9 }
    ], { duration: 620 * dur / formation.speed, easing: 'cubic-bezier(.3,.7,.2,1)', fill: 'forwards' });
    await anim.finished.catch(() => {});
    ghost.remove();
    if (token !== formation.token) return;
  } else if (v.derivedFrom.length || v.children.length) {
    // no words of its own: it condenses out of what it was derived from
    [...v.derivedFrom, ...v.children].forEach(b => { const vid = visOf(b, G); if (vid) pulse(vid); });
    await sleep(300 * dur / formation.speed);
  }
  await popNode(v, dur);
}
async function popNode(v, dur = 1) {
  const d = nodeDom.get(v.id);
  if (!d) return;
  d.g.style.visibility = '';
  const a = d.body.animate([{ transform: 'scale(.55)', opacity: 0 }, { transform: 'scale(1.06)', opacity: 1, offset: .7 }, { transform: 'scale(1)', opacity: 1 }],
    { duration: 480 * dur / formation.speed, easing: 'ease-out' });
  await a.finished.catch(() => {});
}
async function growEdge(e, fromId, token, dur = 1) {
  const d = edgeDom.get(e.id);
  if (!d) return;
  const len = d.len || 1;
  d.g.style.visibility = '';
  const fromA = fromId === e.a.id;
  const arrows = $$('.arrow, .elabel', d.g);
  arrows.forEach(a => a.style.opacity = 0);
  d.line.style.strokeDasharray = `${len} ${len}`;
  const anim = d.line.animate([{ strokeDashoffset: fromA ? len : -len }, { strokeDashoffset: 0 }], { duration: 560 * dur / formation.speed, easing: 'ease-in-out', fill: 'forwards' });
  await anim.finished.catch(() => {});
  anim.cancel();
  d.line.style.strokeDasharray = '';
  if (token !== formation.token) { arrows.forEach(a => a.style.opacity = ''); return; }
  arrows.forEach(a => { a.style.opacity = ''; a.animate([{ opacity: 0 }, { opacity: 1 }], { duration: 220 / formation.speed }); });
}
function pulse(id) {
  const d = nodeDom.get(id);
  if (!d || reduceMotion) return;
  const ring = d.body.querySelector('.ring');
  ring.animate([{ opacity: .9, transform: 'scale(1)' }, { opacity: 0, transform: 'scale(1.18)' }], { duration: 700, easing: 'ease-out' });
}

async function play() {
  if (formation.playing) return;
  formation.playing = true;
  $('#playBtn').textContent = '❚❚'; $('#playBtn').setAttribute('aria-label', 'Pause');
  const myToken = ++formation.playToken;
  if (formation.k >= formation.steps.length - 1) showStep(-1, { camera: false });
  while (formation.playing && formation.playToken === myToken && formation.k < formation.steps.length - 1) {
    const k = formation.k + 1;
    const t0 = performance.now();
    await animateStep(k);
    if (formation.playToken !== myToken || !formation.steps[k]) break;
    const rest = stepMs(formation.steps[k]) - (performance.now() - t0);
    if (rest > 0) await sleep(rest);
  }
  if (formation.playToken === myToken) pause();
}
function pause() {
  formation.playing = false;
  formation.playToken = (formation.playToken || 0) + 1;
  $('#playBtn').textContent = '▶'; $('#playBtn').setAttribute('aria-label', 'Play');
}
function stepBy(dir) {
  pause();
  const k = clamp(formation.k + dir, -1, formation.steps.length - 1);
  if (dir > 0) animateStep(k); else showStep(k);
}
function formationKey(ev) {
  if (ev.key === ' ') { ev.preventDefault(); formation.playing ? pause() : play(); }
  else if (ev.key === 'ArrowRight') { ev.preventDefault(); stepBy(1); }
  else if (ev.key === 'ArrowLeft') { ev.preventDefault(); stepBy(-1); }
  else if (ev.key === 'Home') { ev.preventDefault(); pause(); showStep(-1); }
  else if (ev.key === 'End') { ev.preventDefault(); pause(); showStep(formation.steps.length - 1); }
}
$('#playBtn').onclick = () => (formation.playing ? pause() : play());
$('#prevBtn').onclick = () => stepBy(-1);
$('#nextBtn').onclick = () => stepBy(1);
$('#restartBtn').onclick = () => { pause(); showStep(-1); play(); };
$('#endBtn').onclick = () => { pause(); showStep(formation.steps.length - 1); };
$('#speedSel').onchange = ev => { formation.speed = +ev.target.value; };
$('#stepsBtn').onclick = ev => { const open = $('#steps').classList.toggle('open'); ev.currentTarget.setAttribute('aria-pressed', String(open)); };
$('#strategySel').onchange = ev => { formation.strategy = ev.target.value; restartFormation(); };
$('#focusSel').onchange = ev => { formation.focusId = ev.target.value; formation.strategy = 'focus'; $('#strategySel').value = 'focus'; restartFormation(); };
function fillFocusSelect() {
  const sel = $('#focusSel');
  sel.replaceChildren(...[...G.nodes].sort((a, b) => a._pos - b._pos).map(n => h('option', { value: n.id }, n.label)));
  sel.value = formation.focusId || '';
  sel.disabled = formation.strategy !== 'focus';
}
function restartFormation(autoplay = true) {
  pause();
  formation.token++;
  buildPlan();
  fillFocusSelect();
  $('#strategySel').value = formation.strategy === 'reading' ? 'reading' : 'focus';
  showStep(-1, { ms: 0 });
  if (formation.strategy !== 'reading') {
    const f = LY.pos.get(formation.focusId);
    if (f) moveCamera(fitBox({ x: f.x - 260, y: f.y - 180, w: 520, h: 360 }, 30, 1.4), 0);
  } else sourcePane.scrollTo({ top: 0 });
  if (autoplay) setTimeout(play, 400);
}

/* =====================================================================
   9. Modes and levels
   ===================================================================== */
function setMode(m) {
  if (m === mode && m !== 'formation') return;
  mode = m;
  $$('#modeCtl button').forEach(b => b.setAttribute('aria-pressed', String(b.dataset.mode === m)));
  document.body.classList.toggle('formation', m === 'formation');
  document.body.classList.remove('complete');
  if (m === 'formation') {
    if (pinned) {
      const v = G.byId.get(pinned.vid);
      if (v && v.kind === 'node' && !formation.pinnedUsed) formation.focusId = v.id;
    }
    hover = null; pinned = null;
    document.body.classList.remove('focusing');
    svg.style.setProperty('--focusing', 1);
    nodeDom.forEach(({ g }) => { g.classList.remove('is-focus', 'is-near', 'is-evidence', 'is-hover', 'in-view'); g.style.removeProperty('--hl'); });
    edgeDom.forEach(({ g }) => { g.classList.remove('is-focus', 'is-near', 'is-evidence', 'is-hover'); g.style.removeProperty('--hl'); });
    segs.forEach(s => { s.el.classList.remove('lit', 'hot', 'ev'); s.el.style.removeProperty('--hl'); });
    $('#ticks').replaceChildren(); $('#offscreen').replaceChildren();
    restartFormation(true);
  } else {
    pause(); formation.token++;
    nodeDom.forEach(({ g }) => { g.classList.remove('f-hidden', 'formed', 'current'); g.style.visibility = ''; });
    edgeDom.forEach(({ g, line }) => { g.classList.remove('f-hidden', 'formed', 'current'); g.style.visibility = ''; line.style.strokeDasharray = ''; });
    $$('.partof').forEach(p => p.classList.remove('f-hidden'));
    segs.forEach(s => s.el.classList.remove('formed', 'current', 'reading'));
    plains.forEach(s => s.el.classList.remove('reading'));
    applyHighlight();
    fitAll(400);
  }
}
$$('#modeCtl button').forEach(b => b.addEventListener('click', () => setMode(b.dataset.mode)));

let level = 0;
function setLevel(L, first = false) {
  level = clamp(L, 0, maxDepth);
  $$('#levelCtl button').forEach(b => b.setAttribute('aria-pressed', String(+b.dataset.level === level)));
  G = levelGraph(level);
  LY = layoutLevel(level);
  renderGraph();
  if (mode === 'two-pane') {
    if (pinned) { const el = pinned.mid ? els.get(pinned.mid) : null; pinned = el ? { vid: visOf(el, G), mid: el.id } : null; }
    hover = null;
    applyHighlight();
    if (!first) fitAll(350);
  } else {
    const f = formation.focusId && els.get(formation.focusId);
    if (f) formation.focusId = repAt(f, level).id;
    restartFormation(true);
  }
}
(function levelControls() {
  if (!maxDepth) return;
  $('#levelWrap').hidden = false;
  const box = $('#levelCtl');
  for (let L = 0; L <= maxDepth; L++) {
    const name = L === 0 ? T.overview : L === maxDepth ? T.detail : `${T.level} ${L + 1}`;
    const b = h('button', { type: 'button', 'data-level': L, 'aria-pressed': 'false', title: `${levelGraph(L).nodes.length} nodes` }, name);
    b.addEventListener('click', () => setLevel(L));
    box.append(b);
  }
})();

/* =====================================================================
   10. Start
   ===================================================================== */
$('#title').textContent = meta.title || viewOpt.title || 'Semantic Model';
document.title = (meta.title || 'Semantic Model') + ' — Semantic Model Viewer';
(function sourceLine() {
  const s = meta.source;
  const box = $('#sourceLine');
  if (!s) { box.textContent = `${nodes.length} nodes · ${rels.length} relations`; return; }
  if (typeof s === 'string') { box.textContent = s; return; }
  const parts = [s.publisher, s.title || s.document, s.date].filter(Boolean).join(' · ');
  box.append(parts || '');
  if (s.url && /^https?:\/\//.test(s.url)) { box.append(' '); box.append(h('a', { href: s.url, target: '_blank', rel: 'noopener' }, '↗')); }
  box.append(` · ${nodes.length} nodes · ${rels.length} relations`);
})();
if (problems.length) {
  const p = $('#problems');
  p.hidden = false;
  p.title = problems.join('\n');
  p.textContent = `${T.problems} (${problems.length})`;
  console.warn('Semantic Model problems:\n' + problems.join('\n'));
}
new ResizeObserver(() => resizePane()).observe(graphPane);
resizePane();
const startLevel = viewOpt.level === 'detail' ? maxDepth : Number.isInteger(viewOpt.level) ? viewOpt.level : 0;
setLevel(startLevel, true);
fitAll(0);
if (textLen > 1500 && viewOpt.follow !== false) setFollow(true);
if (viewOpt.mode === 'formation') setMode('formation');

// A small handle for automated checks; not used by the page itself.
window.__semanticViewer = {
  get mode() { return mode; }, get level() { return level; }, get pinned() { return pinned; }, get hover() { return hover; },
  get steps() { return formation.steps; }, get step() { return formation.k; }, get strategy() { return formation.strategy; }, get focusId() { return formation.focusId; },
  problems, setMode, setLevel, setPinned, showStep, pause, play,
  graph: () => G, layout: () => LY, camera: () => ({ ...cam })
};
})();
