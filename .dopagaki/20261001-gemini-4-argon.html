<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Gemini 4 Argon Hype Reel</title>
<meta name="description" content="An unofficial, auto-playing dopagaki-style recap of Google's Gemini 4 Argon announcement (Sep 30, 2026): game UI x jackpot hype x anime-OP cuts x short-video editing.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Anton&family=Barlow:wght@600;700;800;900&family=Chakra+Petch:wght@500;700&family=Dela+Gothic+One&display=swap">
<style>
/* Layout: fixed 1920x1080 stage scaled to fit and letterboxed on black; bg canvas / slide DOM / fx canvas under a game HUD. Palette = argon discharge-tube violet + table-highlight blue + jackpot gold */
:root{
  --ink:#07060f; --paper:#f4f2ff; --dim:#a29fcc;
  --ar:#b38cff; --ar2:#7b4dff; --blue:#8fd0ff; --gold:#ffd23f; --red:#ff3b4e; --hot:#ff2fa8;
  --f-disp:"Anton","Impact","Haettenschweiler","Arial Narrow Bold",sans-serif;
  --f-body:"Barlow","Helvetica Neue",Arial,sans-serif;
  --f-hud:"Chakra Petch",ui-monospace,"SFMono-Regular",monospace;
  --f-sfx:"Dela Gothic One","Hiragino Kaku Gothic ProN","Yu Gothic",sans-serif;
  color-scheme:dark;
}
html,body{height:100%;margin:0;background:#000;overflow:hidden}
body{color:var(--paper);font-family:var(--f-body);-webkit-font-smoothing:antialiased}
#viewport{position:fixed;inset:0;overflow:hidden;background:#000;user-select:none;-webkit-user-select:none}
#viewport.idle{cursor:none}
#stage{position:absolute;left:50%;top:50%;width:1920px;height:1080px;margin:-540px 0 0 -960px;transform-origin:50% 50%;overflow:hidden;background:var(--ink)}
#cam{position:absolute;inset:0;transform-origin:50% 50%}
#bg{position:absolute;inset:0;width:100%;height:100%}
#layer,#out{position:absolute;inset:0}
#fx{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
#overlay{position:absolute;inset:0;pointer-events:none;background:repeating-linear-gradient(0deg,rgba(0,0,0,.16) 0 2px,transparent 2px 4px),radial-gradient(ellipse at center,transparent 58%,rgba(0,0,0,.6) 100%)}
#noise{position:absolute;inset:-100px;pointer-events:none;opacity:.07;background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='220' height='220'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.85' numOctaves='2' stitchTiles='stitch'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>");animation:noise .5s steps(5) infinite}
@keyframes noise{0%{transform:translate(0,0)}20%{transform:translate(-40px,20px)}40%{transform:translate(30px,-50px)}60%{transform:translate(-60px,-10px)}80%{transform:translate(20px,40px)}100%{transform:translate(0,0)}}
#flash{position:absolute;inset:0;pointer-events:none}
.flash{position:absolute;inset:0}

/* ---------- typography primitives ---------- */
.slide{position:absolute;inset:0;overflow:hidden}
.full{position:absolute;inset:0}
.pos{position:absolute;white-space:nowrap}
.disp{font-family:var(--f-disp);font-weight:400;font-synthesis:none;line-height:1;letter-spacing:.01em;text-transform:uppercase}
.bk{font-family:var(--f-body);font-weight:900;line-height:1.08;text-transform:uppercase;letter-spacing:.01em}
.bd{font-family:var(--f-body);font-weight:700;line-height:1.3}
.hudf{font-family:var(--f-hud);font-weight:700;letter-spacing:.16em}
.tabnum{font-variant-numeric:tabular-nums}
.ch{display:inline-block;white-space:pre}
.pct{font-size:.55em;margin-left:.04em}
.rgb{text-shadow:-.03em 0 rgba(255,47,168,.95),.03em 0 rgba(143,208,255,.95),0 0 .12em rgba(255,255,255,.35)}
.arx{color:#fff;text-shadow:0 0 .03em #fff,0 0 .12em var(--ar),0 0 .3em var(--ar2),0 0 .6em rgba(123,77,255,.6)}
.goldx{color:#fff4b8;text-shadow:0 .015em 0 #ffb300,0 .03em 0 #e08a00,0 .045em 0 #b86400,0 .06em 0 #7a3f00,0 .075em 0 #3d1f00,0 0 .2em rgba(255,190,40,.8),0 0 .5em rgba(255,110,0,.5)}
.redx{color:#fff;text-shadow:0 .025em 0 var(--red),0 .05em 0 #a3001a,0 .075em 0 #4d000c,0 0 .25em rgba(255,59,78,.9)}
.stroke-w{color:transparent;-webkit-text-stroke:7px #fff}
.stroke-ar{color:transparent;-webkit-text-stroke:8px var(--ar);filter:drop-shadow(0 0 26px rgba(179,140,255,.8))}
.cap{background:var(--gold);color:#0a0a0a;padding:.06em .4em .1em;box-shadow:.12em .12em 0 #000;font-family:var(--f-body);font-weight:900;text-transform:uppercase}
.chip{display:inline-block;font:700 26px/1 var(--f-hud);letter-spacing:.2em;padding:12px 18px 10px;border:3px solid currentColor;background:rgba(7,6,15,.6)}
.hdr{display:flex;align-items:center;gap:28px}
.h1{font-size:62px;color:#fff}
.hsub{font-size:28px;color:var(--dim);margin-top:6px}
.cur{color:var(--hot);animation:blink .5s steps(1) infinite}
@keyframes blink{50%{opacity:0}}
.sfx{font:400 160px/1 var(--f-sfx);color:#fff;-webkit-text-stroke:10px #07060f;paint-order:stroke fill;text-shadow:0 0 30px rgba(179,140,255,.9);transform:rotate(-12deg)}
.el{display:grid;grid-template-rows:auto 1fr auto;width:176px;height:196px;box-sizing:border-box;padding:10px 14px 12px;border:5px solid var(--ar);background:rgba(20,10,44,.85);box-shadow:0 0 30px var(--ar),inset 0 0 26px rgba(179,140,255,.35);color:#fff}
.el .z{font:700 28px/1 var(--f-hud)}
.el .s{font:400 104px/1 var(--f-disp);text-align:center;align-self:center}
.el .m{font:700 18px/1 var(--f-hud);letter-spacing:.24em;text-align:center}

/* ---------- hook / opening ---------- */
.hk-bar{position:relative;width:1300px;height:30px;border:3px solid rgba(255,255,255,.55);box-sizing:border-box}
.hk-bar i{position:absolute;inset:0;transform-origin:0 50%;transform:scaleX(.064);background:linear-gradient(90deg,var(--ar2),var(--ar),var(--gold));box-shadow:0 0 24px rgba(179,140,255,.8)}
.hk-bar span{position:absolute;top:40px;transform:translateX(-50%);font-size:26px;color:#d9caff}
.band-hot>div{width:2600px;padding:18px 0 22px;background:var(--hot);color:#fff;text-align:center;font:400 104px/1 var(--f-disp);letter-spacing:.04em;transform:rotate(-5deg);border-block:6px solid #fff}
.sweep{color:transparent;background:linear-gradient(100deg,transparent 42%,rgba(255,255,255,.95) 50%,transparent 58%) no-repeat;background-size:300% 100%;-webkit-background-clip:text;background-clip:text}
.chap{display:flex;gap:18px}
.chap span{font:900 30px/1 var(--f-body);text-transform:uppercase;padding:13px 20px;color:#07060f}
.chap i{font:700 20px var(--f-hud);font-style:normal;margin-right:10px;letter-spacing:.1em}

/* ---------- status ---------- */
.panel{position:absolute;box-sizing:border-box;padding:28px 36px;display:flex;flex-direction:column;gap:12px;background:linear-gradient(180deg,rgba(22,14,48,.9),rgba(8,6,20,.94));border:2px solid rgba(179,140,255,.65);box-shadow:inset 0 0 0 1px rgba(179,140,255,.14),0 0 50px rgba(179,140,255,.18)}
.st-unit{font-size:22px;color:var(--dim)}
.st-big .lbl{font-size:26px;color:var(--ar)}
.st-big .v{font-size:190px;color:#fff;height:196px}
.cells{display:flex;gap:6px}
.cells i{flex:1;height:38px;border:2px solid rgba(255,255,255,.3);transform:skewX(-18deg)}
.cells i.on{background:var(--ar);border-color:var(--ar);box-shadow:0 0 14px var(--ar)}
.cells i.max{background:var(--gold);border-color:var(--gold);box-shadow:0 0 18px var(--gold)}
.cells-mk{position:relative;height:30px;font-size:22px;color:#d9caff}
.cells-mk span{position:absolute;top:0;transform:translateX(-50%)}
.cells-mk span:last-child{transform:translateX(-100%)}
.st-row{display:grid;grid-template-columns:250px 1fr;align-items:center;min-height:62px;padding:0 16px;font:800 32px var(--f-body);color:#fff;background:linear-gradient(90deg,rgba(179,140,255,.14),transparent 75%);border-left:4px solid var(--ar)}
.st-row .lbl{font:700 22px var(--f-hud);letter-spacing:.14em;color:var(--dim)}
.gbar{position:absolute;transform-origin:50% 100%;background:linear-gradient(180deg,#e9e4ff,#8d86b8 30%,#3b3660);box-shadow:0 0 18px rgba(179,140,255,.25)}
.gbar.argon{background:linear-gradient(180deg,#e8f6ff,var(--blue) 28%,#2a6e9e);box-shadow:0 0 34px rgba(143,208,255,.7)}
.gval{position:absolute;text-align:center;font-size:52px;color:#fff}
.gname{position:absolute;text-align:center;font-size:19px;color:#c9c4ee;letter-spacing:.08em}
.g128{display:flex;align-items:center;gap:22px;padding:10px 18px;border:2px solid rgba(143,208,255,.6);background:rgba(143,208,255,.08)}
.g128 .hudf{font-size:22px;color:var(--blue)}
.g128 b{font-size:54px;color:#fff;font-weight:400}
.bdg{font:700 20px/1 var(--f-hud);letter-spacing:.14em;padding:9px 12px 7px;background:var(--blue);color:#07060f}
.stampr>div{font:400 76px/1 var(--f-disp);color:var(--red);border:10px solid var(--red);padding:14px 26px 16px;transform:rotate(-10deg);background:rgba(255,255,255,.95);box-shadow:0 0 40px rgba(255,59,78,.6);letter-spacing:.03em}
.stampg>div{font:400 76px/1 var(--f-disp);color:#07060f;border:10px solid #07060f;padding:14px 26px 16px;transform:rotate(-8deg);background:var(--gold);box-shadow:0 0 50px rgba(255,210,63,.7);letter-spacing:.03em}

/* ---------- reach ---------- */
.lbar{position:absolute;transform-origin:50% 100%;background:linear-gradient(180deg,#e9e4ff,#8d86b8 30%,#3b3660)}
.lbar.argon{background:linear-gradient(180deg,#fff7c9,var(--gold) 25%,#b36b00);box-shadow:0 0 60px rgba(255,210,63,.75)}
.qbox{width:220px;height:420px;display:grid;place-items:center;border:5px dashed var(--gold);background:rgba(255,210,63,.07);box-sizing:border-box;animation:qp .5s ease-in-out infinite alternate}
.qbox .disp{font-size:220px;color:var(--gold);text-shadow:0 0 40px var(--gold)}
@keyframes qp{to{box-shadow:0 0 60px rgba(255,210,63,.6);background:rgba(255,210,63,.16)}}
.vig{background:radial-gradient(ellipse at center,transparent 35%,rgba(255,0,40,.55) 100%);animation:beat .8s ease-out infinite;pointer-events:none}
@keyframes beat{0%{opacity:.95}18%{opacity:.35}32%{opacity:.8}100%{opacity:.2}}
.gauge{display:flex;align-items:center;gap:12px}
.gauge i{width:96px;height:32px;border:3px solid rgba(255,255,255,.5);transform:skewX(-20deg)}
.gauge i.on{background:var(--gold);box-shadow:0 0 24px var(--gold);border-color:var(--gold)}
.g-l{font:700 28px var(--f-hud);letter-spacing:.2em;color:#fff;margin-right:12px}
.g-m{font:700 28px var(--f-hud);color:rgba(255,255,255,.55);margin-left:14px;letter-spacing:.2em;min-width:190px}
.g-m.on{color:var(--gold);animation:blink .25s steps(1) infinite}
.cd{font-size:460px;color:#fff;text-shadow:0 0 40px var(--red),0 0 100px var(--red)}
.cutin>div{width:2600px;height:130px;background:var(--red);color:#07060f;display:flex;align-items:center;font:400 84px/1 var(--f-disp);transform:rotate(-4deg);overflow:hidden;border-block:6px solid #fff}
.cutin span{display:block;white-space:nowrap;letter-spacing:.03em}

/* ---------- combo ---------- */
.kcard{width:500px;box-sizing:border-box;padding:26px 30px 28px;white-space:normal;display:flex;flex-direction:column;gap:8px;background:linear-gradient(180deg,rgba(28,16,60,.94),rgba(8,6,20,.96));border:3px solid var(--ar);box-shadow:0 0 40px rgba(179,140,255,.35);position:relative}
.kl{font-size:18px;color:var(--ar)}
.kt{font-size:40px;color:#fff}
.kd{font-size:24px;color:#c9c4ee;min-height:62px}
.kv{font-size:150px;color:#fff;margin:6px 0 4px}
.kr{display:grid;grid-template-columns:1fr auto;row-gap:6px;font-size:19px;color:#b5b0dc;letter-spacing:.06em;border-top:2px solid rgba(255,255,255,.18);padding-top:12px}
.kr b{color:#fff;font-weight:700}
.ktag{position:absolute;right:-18px;top:-22px;font-size:22px;padding:10px 14px 8px;background:var(--gold);color:#07060f;transform:rotate(6deg);box-shadow:4px 4px 0 #07060f}
.combo{display:flex;align-items:baseline;gap:18px;font:400 64px/1 var(--f-disp);color:#fff;letter-spacing:.04em;text-shadow:0 0 24px rgba(179,140,255,.9)}
.combo b{font-weight:400;font-size:1.5em;color:var(--gold);text-shadow:0 0 30px rgba(255,210,63,.9)}
.banner>div{width:1920px;padding:30px 0;background:#07060f;border-block:6px solid var(--gold);display:flex;align-items:center;justify-content:center;gap:40px;font:400 90px/1 var(--f-disp);color:#fff;letter-spacing:.02em}
.banner .hudf{font-size:30px;color:var(--gold)}

/* ---------- rush ---------- */
.rbgt{font:400 230px/1 var(--f-disp);text-transform:uppercase;opacity:.08;white-space:nowrap}
.rcat{font:700 32px/1 var(--f-hud);letter-spacing:.24em}
.rname{font:900 92px/1 var(--f-body);text-transform:uppercase}
.rnum{font:400 380px/1 var(--f-disp)}
.rriv{font:700 28px/1 var(--f-hud);letter-spacing:.1em;padding:12px 22px 10px}
.rwin>div{font:400 110px/1 var(--f-disp);color:#fff;background:var(--ar2);border:8px solid #fff;padding:10px 30px 14px;transform:rotate(12deg);box-shadow:0 0 50px rgba(123,77,255,.8);letter-spacing:.04em}
.rtag>div{font:400 54px/1 var(--f-disp);color:#07060f;background:#fff;padding:12px 30px 14px;transform:rotate(-8deg);box-shadow:8px 8px 0 #07060f;letter-spacing:.04em}
.rdraw>div{font:400 130px/1 var(--f-disp);color:#fff;background:var(--hot);border:8px solid #fff;padding:10px 40px 14px;transform:rotate(-6deg);box-shadow:0 0 50px rgba(255,47,168,.8)}

/* ---------- boss ---------- */
.siren{position:absolute;left:50%;top:50%;width:3200px;height:3200px;margin:-1600px 0 0 -1600px;background:conic-gradient(from 0deg,rgba(255,40,60,.28) 0 16deg,transparent 16deg 180deg,rgba(255,40,60,.28) 180deg 196deg,transparent 196deg);animation:spin 1.6s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.vrow{position:absolute;left:150px;width:1620px;height:104px;display:grid;grid-template-columns:560px 200px 120px 200px 340px 1fr;align-items:center;background:linear-gradient(90deg,rgba(24,18,44,.9),rgba(10,8,20,.85));border-left:6px solid rgba(162,159,204,.6);box-sizing:border-box;padding-left:26px}
.vn b{display:block;font:900 40px/1.05 var(--f-body);color:#fff;text-transform:uppercase}
.vn small{display:block;font:700 17px/1.2 var(--f-hud);color:var(--dim);letter-spacing:.12em;margin-top:6px}
.va{font-size:76px;color:#cfcbe6;text-align:center}
.vvs{font-size:44px;color:var(--dim);text-align:center}
.vb{font-size:76px;color:#fff;text-align:center}
.vr{font-size:22px;color:#c9c4ee;letter-spacing:.12em}
.vl{display:grid;place-items:center}
.vl span{font:700 20px/1 var(--f-hud);color:#c9c4ee;border:2px solid rgba(201,196,238,.5);padding:8px 12px 6px;letter-spacing:.16em}
.tally{display:flex;flex-direction:column;align-items:center;gap:26px;padding:40px 70px 46px;background:rgba(10,8,22,.94);border:4px solid #fff;box-shadow:0 0 60px rgba(179,140,255,.4)}
.tally .tt{font-size:30px;color:#d9caff}
.tg{display:flex;gap:80px}
.tg>div{display:flex;flex-direction:column;align-items:center;gap:6px}
.tg b{font-size:250px;font-weight:400;line-height:1}
.tg span{font-size:30px;letter-spacing:.2em}
.tg .w b,.tg .w span{color:var(--blue)} .tg .w b{text-shadow:0 0 40px rgba(143,208,255,.8)}
.tg .t b,.tg .t span{color:#fff}
.tg .l b,.tg .l span{color:var(--dim)}

/* ---------- coding / inside google ---------- */
.mchip{font:700 28px/1 var(--f-hud);letter-spacing:.2em;padding:12px 18px 10px;border:3px solid currentColor}
.band-gold>div{font:400 74px/1 var(--f-disp);color:#07060f;background:var(--gold);padding:12px 40px 16px;transform:rotate(-3deg);letter-spacing:.04em;box-shadow:8px 8px 0 #07060f}
.tchip{display:inline-block;font:700 24px/1 var(--f-hud);letter-spacing:.12em;padding:12px 16px 10px;border:3px solid var(--blue);color:var(--blue);background:rgba(7,6,15,.6);margin:0 8px}
.next{display:flex;flex-direction:column;align-items:center;gap:14px;padding:40px 80px 46px;background:rgba(7,6,15,.94);border-block:6px solid var(--blue);width:1920px;box-sizing:border-box;white-space:normal;text-align:center}

/* ---------- cyber ---------- */
.aband>div{width:2600px;padding:18px 0 22px;background:#fff;color:var(--red);text-align:center;font:400 100px/1 var(--f-disp);transform:rotate(-3deg);letter-spacing:.12em}
.radar{position:relative;width:640px;height:640px;border-radius:50%;background:repeating-radial-gradient(circle,transparent 0 78px,rgba(255,59,78,.4) 78px 81px),radial-gradient(circle,rgba(255,59,78,.16),transparent 70%);border:3px solid rgba(255,59,78,.7);overflow:hidden}
.radar::before{content:"";position:absolute;inset:0;background:linear-gradient(90deg,transparent 49.8%,rgba(255,59,78,.5) 50%,transparent 50.2%),linear-gradient(0deg,transparent 49.8%,rgba(255,59,78,.5) 50%,transparent 50.2%)}
.radar i{position:absolute;inset:0;border-radius:50%;background:conic-gradient(from 0deg,rgba(255,59,78,.75),transparent 70deg);animation:spin 1.4s linear infinite}
.scan{display:flex;flex-direction:column;gap:12px;width:760px}
.scan .hudf{font-size:26px;color:var(--red);animation:blink .4s steps(1) infinite}
.scan .tr{height:26px;border:3px solid rgba(255,59,78,.8);position:relative}
.scan .tr i{position:absolute;inset:0;background:var(--red);transform-origin:0 50%;transform:scaleX(0);box-shadow:0 0 20px var(--red)}

/* ---------- shield ---------- */
.scard{position:absolute;width:600px;box-sizing:border-box;padding:24px 30px 26px;display:flex;flex-direction:column;gap:10px;white-space:normal;background:linear-gradient(180deg,rgba(14,26,44,.92),rgba(6,8,18,.95));border:2px solid rgba(143,208,255,.6)}
.scard .hudf{font-size:20px;color:var(--blue)}
.scard .bk{font-size:44px;color:#fff}
.scard .bd{font-size:26px;color:#c4d6ea;font-weight:700}
.shield path{fill:rgba(143,208,255,.06);stroke:rgba(143,208,255,.55);stroke-width:4}
.shield path.on{fill:rgba(143,208,255,.5);stroke:#fff;filter:drop-shadow(0 0 18px rgba(143,208,255,.9))}
.scount{font:400 64px/1 var(--f-disp);color:#fff;letter-spacing:.06em}
.fbox{width:480px;box-sizing:border-box;padding:30px 18px;text-align:center;font:900 42px/1.1 var(--f-body);text-transform:uppercase;color:#fff;border:4px solid var(--blue);background:rgba(143,208,255,.1);white-space:normal}
.farrow{width:440px;height:12px;background:var(--blue);transform-origin:0 50%;box-shadow:0 0 20px var(--blue)}

/* ---------- price ---------- */
.ptag{display:flex;align-items:center;gap:26px;width:760px;height:178px;box-sizing:border-box;padding:0 40px;background:linear-gradient(90deg,rgba(255,210,63,.18),rgba(7,6,15,.9) 60%);border:3px solid var(--gold);box-shadow:0 0 30px rgba(255,210,63,.25)}
.ptag b{font-size:130px;font-weight:400;color:var(--gold);text-shadow:0 0 30px rgba(255,210,63,.6);min-width:300px}
.ptag .bk{display:block;font-size:46px;color:#fff}
.ptag small{display:block;font-size:20px;color:#d8cfa6;margin-top:8px}
.node{position:absolute;width:46px;height:46px;margin:-23px 0 0 -23px;border-radius:50%;border:5px solid var(--ar);background:#07060f;box-sizing:border-box}
.node.now{background:var(--gold);border-color:#fff;box-shadow:0 0 30px var(--gold)}
.stx{white-space:normal;width:640px;display:flex;flex-direction:column;gap:6px}
.stx .hudf{font-size:22px;color:var(--ar)}
.stx .bk{font-size:42px;color:#fff}
.stx small{font:700 24px var(--f-body);color:var(--gold)}
.here{font:700 22px/1 var(--f-hud);letter-spacing:.16em;color:#07060f;background:var(--gold);padding:9px 12px 7px;animation:blink .5s steps(1) infinite}

/* ---------- final ---------- */
.crack{position:absolute;inset:0;filter:drop-shadow(0 0 6px #fff)}
.crack path{fill:none;stroke:#fff;stroke-width:3;stroke-dasharray:1;stroke-dashoffset:1;animation:crack .25s ease-out forwards}
@keyframes crack{to{stroke-dashoffset:0}}
.res{width:1560px;box-sizing:border-box;padding:26px 46px 30px;background:linear-gradient(180deg,rgba(24,14,50,.95),rgba(8,6,20,.97));border:4px solid var(--gold);box-shadow:0 0 0 2px #07060f,0 0 80px rgba(255,210,63,.4);white-space:normal;display:flex;flex-direction:column}
.res-h{display:flex;align-items:baseline;justify-content:space-between;border-bottom:2px solid rgba(255,210,63,.5);padding-bottom:12px;margin-bottom:6px}
.res-h .hudf{font-size:40px;color:var(--gold)}
.res-h .hd{font:700 26px var(--f-hud);letter-spacing:.14em;color:#e0d6ff}
.rr{display:grid;grid-template-columns:330px 1fr 430px;align-items:center;min-height:78px;border-bottom:1px solid rgba(255,255,255,.13)}
.rr span{font:700 24px var(--f-hud);letter-spacing:.14em;color:#c9c0ee}

function h(tag, cls, html, parent, style) {

}
/* positioned wrapper (centered with translate) + inner element for animation */
function P(parent, x, y, cls, html, style, ax = .5, ay = .5) {

    return A(el, [

/* ---------- flash / camera ---------- */
let lastFlash = 0;

const CAM = {z: 1, r: 0, x: 0, y: 0, pz: 0, amp: 0, t: 0, d: 1};

/* ---------- background canvas (half resolution) ---------- */
const BG = (() => {

/* ---------- transitions ---------- */
function freeze(node) { node.getAnimations({subtree: true}).forEach(a => { try { a.commitStyles(); } catch (e) {} a.cancel(); }); }
const TR = {
  cut(n) { n.remove(); },
  zoom(n) { A(n, [{transform: 'scale(1)', filter: 'blur(0px)', opacity: 1}, {transform: 'scale(2.4)', filter: 'blur(16px)', opacity: 0}], .42, IN).onfinish = () => n.remove(); flash('#ffffff', .4, .9); },
  spin(n) { A(n, [{transform: 'rotate(0deg) scale(1)', opacity: 1}, {transform: 'rotate(-40deg) scale(.05)', opacity: .2}], .42, IN).onfinish = () => n.remove(); flash('#ffffff', .3, .6); },
  shatter(n) {
    const cols = 4, rows = 3, pts = [];
    for (let j = 0; j <= rows; j++) { pts[j] = []; for (let i = 0; i <= cols; i++) { const ex = i === 0 || i === cols, ey = j === 0 || j === rows; pts[j][i] = [i / cols * 100 + (ex ? 0 : rnd(-7, 7)), j / rows * 100 + (ey ? 0 : rnd(-9, 9))]; } }
    const par = n.parentNode;
    for (let j = 0; j < rows; j++) for (let i = 0; i < cols; i++) {
      const p = [pts[j][i], pts[j][i+1], pts[j+1][i+1], pts[j+1][i]];
      const cl = n.cloneNode(true); cl.style.clipPath = 'polygon(' + p.map(q => q[0] + '% ' + q[1] + '%').join(',') + ')';
      par.appendChild(cl);
      const cx = (p[0][0] + p[2][0]) / 2 - 50, cy = (p[0][1] + p[2][1]) / 2 - 50;
      A(cl, [{transform: 'none', opacity: 1}, {transform: `translate(${cx * rnd(14, 24)}px,${cy * rnd(14, 24) + 300}px) rotate(${rnd(-50, 50)}deg) scale(${rnd(.6, .9)})`, opacity: 0}], rnd(.5, .7), 'cubic-bezier(.4,0,.8,.5)', {delay: Math.hypot(cx, cy) * .002}).onfinish = () => cl.remove();
    }
    n.remove(); flash('#ffffff', .3, .8); shake(18, .3);
  },
  split(n) {
    const a = n.cloneNode(true); a.style.clipPath = 'inset(0 0 50% 0)'; n.style.clipPath = 'inset(50% 0 0 0)'; n.parentNode.appendChild(a);
    A(a, [{transform: 'none'}, {transform: 'translateY(-110%) rotate(-3deg)'}], .45, IN).onfinish = () => a.remove();
    A(n, [{transform: 'none'}, {transform: 'translateY(110%) rotate(3deg)'}], .45, IN).onfinish = () => n.remove();
    flash('#ffffff', .25, .5);
  },
  glitch(n) {
    const k = [];
    for (let i = 0; i < 7; i++) k.push({transform: `translate(${rnd(-90, 90)}px,${rnd(-20, 20)}px) skewX(${rnd(-20, 20)}deg)`, clipPath: `inset(${rnd(0, 55)}% 0 ${rnd(0, 40)}% 0)`, filter: `hue-rotate(${rnd(0, 360)}deg) saturate(3)`, opacity: 1, easing: 'steps(1,end)'});
    k.push({opacity: 0});
    A(n, k, .38, 'linear').onfinish = () => n.remove();
  },
  invert(n) { n.style.filter = 'invert(1) hue-rotate(180deg)'; A(n, [{transform: 'scale(1)', opacity: 1}, {transform: 'scale(1.25)', opacity: 0}], .32, IN).onfinish = () => n.remove(); flash('#ffffff', .2, .5); },
  wipe(n) {
    const b = h('div', 'wipe', null, $('#out'));
    A(b, [{transform: 'translateX(-130%) skewX(-18deg)'}, {transform: 'translateX(130%) skewX(-18deg)'}], .55, SNAP).onfinish = () => b.remove();
    A(n, [{opacity: 1}, {opacity: 1, offset: .45}, {opacity: 0, offset: .46}, {opacity: 0}], .55, 'linear').onfinish = () => n.remove();
  },
};

/* ---------- player ---------- */
const OFF = []; let TOTAL = 0;
SLIDES.forEach((s, i) => { OFF[i] = TOTAL; TOTAL += s.dur; });
const fmtT = s => { const m = Math.floor(s / 60), r = s - m * 60; return String(m).padStart(2, '0') + ':' + r.toFixed(1).padStart(4, '0'); };

function go(i, mode) {
  i = Math.max(0, Math.min(SLIDES.length - 1, i));
  const out = $('#out');
  if (E.slide) {
    const old = E.slide;
    freeze(old);
    if (mode === 'manual') out.innerHTML = '';
    out.appendChild(old);
    (TR[mode === 'manual' ? 'glitch' : SLIDES[E.i].trans] || TR.cut)(old);
  }
  E.i = i; E.t = 0; E.ci = 0; E.cues = []; E.ticks.clear(); E.ended = false;
  FX.stopStreams(); camReset();
  const def = SLIDES[i];
  BG.set(def.bg);
  SC.reset();
  SLIDES.slice(0, i).forEach(s => (s.marks || []).forEach(id => SC.hit(id, false)));
  SC.show(!!def.score);
  const root = h('div', 'slide', null, $('#layer'));
  E.slide = root;
  def.build(makeCtx(root));
  const g = $('#hud-genre'); g.textContent = def.genre; fx.glitch(g, .3);
  $('#hud-stage').textContent = `STAGE ${String(i + 1).padStart(2, '0')}/${SLIDES.length}`;
  hudMode();
}
function end() { E.ended = true; hudMode(); }
let pausedAnims = [];
function setPlaying(p) {
  if (p === E.playing) return;
  E.playing = p;
  if (!p) { pausedAnims = document.getAnimations().filter(a => a.playState === 'running'); pausedAnims.forEach(a => a.pause()); }
  else { pausedAnims.forEach(a => { try { a.play(); } catch (e) {} }); pausedAnims = []; }
  hudMode();
}
function restart() { $('#out').innerHTML = ''; FX.clear(); setPlaying(true); go(0, 'manual'); }
function toggle() { if (E.ended) restart(); else setPlaying(!E.playing); }
function nav(d) { setPlaying(true); if (d > 0 && E.i === SLIDES.length - 1) { E.t = SLIDES[E.i].dur; return; } go(E.i + d, 'manual'); }
function hudMode() {
  const m = $('#hud-mode');
  m.textContent = E.ended ? '■ END · R' : E.playing ? '▶ AUTO' : '❚❚ PAUSE';
  m.classList.toggle('p', !E.playing || E.ended);
  const b = $('#b-play'); b.textContent = E.playing && !E.ended ? '❚❚' : '▶'; b.setAttribute('aria-label', E.playing && !E.ended ? 'Pause' : 'Play');
}

let last = performance.now();
function loop(now) {
  let dt = (now - last) / 1000; last = now;
  if (dt > .25) dt = .25;
  const pdt = E.playing ? dt : 0;
  if (E.playing && !E.ended) {
    E.t += dt;
    while (E.ci < E.cues.length && E.cues[E.ci].t <= E.t) { const q = E.cues[E.ci++]; try { q.fn(); } catch (err) { console.error(err); } }
    for (const f of [...E.ticks]) f(E.t, dt);
    if (E.t >= SLIDES[E.i].dur) { if (E.i < SLIDES.length - 1) go(E.i + 1, 'auto'); else end(); }
  }
  BG.step(pdt); FX.step(pdt); camStep(pdt);
  const tot = OFF[E.i] + Math.min(E.t, SLIDES[E.i].dur);
  $('#hud-time').textContent = fmtT(tot) + ' / ' + fmtT(TOTAL);
  PSEG.forEach((s, i) => { s.style.transform = `scaleX(${i < E.i ? 1 : i === E.i ? Math.min(1, E.t / SLIDES[i].dur) : 0})`; });
  requestAnimationFrame(loop);
}

/* ---------- HUD / controls ---------- */
const PSEG = SLIDES.map(s => { const i = h('i', '', null, $('#prog'), {flex: String(s.dur)}); return h('b', '', null, i); });
const tk = TICKER.map(s => `${s}<em>◆</em>`).join('');
$('#ticker').innerHTML = tk + tk;

function fit() { const s = Math.min(innerWidth / W, innerHeight / H); $('#stage').style.transform = `scale(${s})`; }
addEventListener('resize', fit);

const ctrl = $('#ctrl'), vp = $('#viewport');
let idleT = 0;
function wake() { ctrl.classList.remove('hide'); vp.classList.remove('idle'); clearTimeout(idleT); idleT = setTimeout(() => { ctrl.classList.add('hide'); vp.classList.add('idle'); }, 2200); }
addEventListener('mousemove', wake); addEventListener('touchstart', wake, {passive: true});
async function fullscreen() { try { if (document.fullscreenElement) await document.exitFullscreen(); else await document.documentElement.requestFullscreen(); } catch (e) {} }
$('#b-prev').addEventListener('click', e => { e.stopPropagation(); nav(-1); });
$('#b-next').addEventListener('click', e => { e.stopPropagation(); nav(1); });
$('#b-play').addEventListener('click', e => { e.stopPropagation(); toggle(); });
$('#b-re').addEventListener('click', e => { e.stopPropagation(); restart(); });
$('#b-fs').addEventListener('click', e => { e.stopPropagation(); fullscreen(); });
ctrl.addEventListener('click', e => e.stopPropagation());
vp.addEventListener('click', e => {
  const x = e.clientX / innerWidth;
  if (x < .22) nav(-1); else if (x > .78) nav(1); else toggle();
});
addEventListener('keydown', e => {
  if (e.target.closest && e.target.closest('button') && (e.key === ' ' || e.key === 'Enter')) return;
  const k = e.key;
  if (k === ' ' || k === 'k' || k === 'K') { e.preventDefault(); toggle(); }
  else if (k === 'ArrowRight' || k === 'l' || k === 'L' || k === 'PageDown') { e.preventDefault(); nav(1); }
  else if (k === 'ArrowLeft' || k === 'j' || k === 'J' || k === 'PageUp') { e.preventDefault(); nav(-1); }
  else if (k === 'r' || k === 'R' || k === 'Home') restart();
  else if (k === 'f' || k === 'F') fullscreen();
  else if (k === 'h' || k === 'H') $('#hud').classList.toggle('off');
});
let autoPaused = false;
document.addEventListener('visibilitychange', () => {
  if (document.hidden && E.playing) { autoPaused = true; setPlaying(false); }
  else if (!document.hidden && autoPaused) { autoPaused = false; last = performance.now(); setPlaying(true); }
});

/* ---------- boot: load the faces (incl. the SFX glyphs) first, then AUTO play ---------- */
async function boot() {
  fit();
  const sfx = 'ドン!!ゴドーン';
  try {
    await Promise.race([
      Promise.all([document.fonts.load('400 100px "Anton"', 'GEMINI 4 ARGON 0123456789%'), document.fonts.load('900 40px "Barlow"'), document.fonts.load('700 40px "Barlow"'), document.fonts.load('700 20px "Chakra Petch"'), document.fonts.load('400 100px "Dela Gothic One"', sfx)]),
      new Promise(res => setTimeout(res, 4000)),
    ]);
  } catch (e) {}
  wake();
  go(0, 'auto');
  last = performance.now();
  requestAnimationFrame(loop);
}
boot();
})();
