<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>ITZ採用サイト ドパガキ版</title>
<meta name="description" content="アイティソリューションズ株式会社のリクルーティングサイトの内容を、ゲーム×パチンコ×アニメOP×ショート動画の過剰演出で約110秒のAUTO再生モーションプレゼンにした非公式の作例。">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Dela+Gothic+One&family=DotGothic16&family=Noto+Sans+JP:wght@700;900&family=Orbitron:wght@700;900&display=swap">
<style>
/* Layout: fixed 1920x1080 stage scaled to fit and letterboxed on black; depth = bg / back canvas / scene DOM / front canvas, under a game HUD, flash and transition overlays */
:root{
  --void:#000; --ink:#070612; --paper:#f6f7ff; --dim:#9aa0c4;
  --cyan:#16e6ff; --pink:#ff2e8a; --gold:#ffd21a; --orange:#ff7a1a; --violet:#7b4dff; --red:#ff2b3d; --lime:#b4ff2e;
  --f-impact:"Dela Gothic One","Noto Sans JP","Hiragino Kaku Gothic ProN","Yu Gothic",sans-serif;
  --f-body:"Noto Sans JP","Hiragino Kaku Gothic ProN","Yu Gothic","Meiryo",sans-serif;
  --f-num:"Orbitron","Dela Gothic One","Noto Sans JP",sans-serif;
  --f-pixel:"DotGothic16","Noto Sans JP",monospace;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0;background:var(--void);overflow:hidden}
html{font-synthesis:style}
body{color:var(--paper);font-family:var(--f-body);-webkit-font-smoothing:antialiased}
#viewport{position:fixed;inset:0;overflow:hidden;background:var(--void);user-select:none;-webkit-user-select:none;cursor:pointer}
#viewport.idle{cursor:none}
#stage{position:absolute;left:50%;top:50%;width:1920px;height:1080px;margin:-540px 0 0 -960px;overflow:hidden;background:var(--ink);transform-origin:50% 50%}
#cam,#rig,#bg,#scene,#hud,#fxo,#trans,#scan{position:absolute;inset:0}
#cam,#rig{transform-origin:50% 50%}
#cam{z-index:0}
#bg,#scene{overflow:hidden}
#hud,#fxo,#trans,#scan{pointer-events:none;overflow:hidden}
canvas.fx{position:absolute;left:0;top:0;width:1920px;height:1080px;pointer-events:none}
#scan{background:repeating-linear-gradient(0deg,rgba(0,0,0,.13) 0 2px,transparent 2px 4px),radial-gradient(ellipse at center,transparent 62%,rgba(0,0,0,.5) 100%)}
#noise{position:absolute;inset:-120px;opacity:.06;background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='240' height='240'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='2' stitchTiles='stitch'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>");animation:noise .5s steps(4) infinite}
@keyframes noise{0%{transform:translate(0,0)}25%{transform:translate(-50px,30px)}50%{transform:translate(40px,-60px)}75%{transform:translate(-30px,-20px)}100%{transform:translate(0,0)}}
.warm{position:absolute;left:-99999px;top:0;width:3000px;opacity:0;pointer-events:none;font-size:16px}

/* ---------- primitives ---------- */
.pin{position:absolute;width:0;height:0}
.pin>.m{position:absolute;left:0;top:0;transform:translate(-50%,-50%);width:max-content;text-align:center}
.full{position:absolute;inset:0}
.flexc{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px}
.cut{position:absolute;inset:0;overflow:hidden}
.imp{font-family:var(--f-impact);font-weight:400;line-height:1.08}
.num{font-family:var(--f-num);font-weight:900;line-height:1;letter-spacing:.01em;font-variant-numeric:tabular-nums}
.pix{font-family:var(--f-pixel);line-height:1.2}
.bd{font-family:var(--f-body);font-weight:900;line-height:1.3}
.sk{-webkit-text-stroke:var(--sw,12px) var(--sc,#000);paint-order:stroke fill}
.chroma{text-shadow:-7px 0 0 rgba(255,46,138,.9),7px 0 0 rgba(22,230,255,.9)}
.gl{animation:glt .24s steps(2) infinite}
@keyframes glt{0%{text-shadow:-12px 0 0 var(--pink),12px 0 0 var(--cyan)}50%{text-shadow:14px 3px 0 var(--pink),-14px -3px 0 var(--cyan)}100%{text-shadow:-5px 0 0 var(--pink),5px 0 0 var(--cyan)}}
@keyframes blink{50%{opacity:0}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes tape{to{transform:translateX(-50%)}}
@keyframes hue{to{filter:hue-rotate(360deg)}}
@keyframes up{to{transform:translateY(-16px)}}

/* backgrounds */
.solid{position:absolute;inset:0}
.rays{position:absolute;left:50%;top:50%;width:3400px;height:3400px;margin:-1700px 0 0 -1700px;background:repeating-conic-gradient(from 0deg,var(--r1) 0deg 6deg,var(--r2) 6deg 12deg);animation:spin var(--rs,16s) linear infinite}
.rays.rb{background:repeating-conic-gradient(from 0deg,#ff2b3d 0deg 10deg,#ff7a1a 10deg 20deg,#ffd21a 20deg 30deg,#b4ff2e 30deg 40deg,#16e6ff 40deg 50deg,#7b4dff 50deg 60deg)}
.grid{position:absolute;left:-50%;width:200%;bottom:-2%;height:62%;transform:perspective(700px) rotateX(64deg);transform-origin:50% 100%;background-image:linear-gradient(var(--gl) 3px,transparent 3px),linear-gradient(90deg,var(--gl) 3px,transparent 3px);background-size:140px 140px;animation:gridmv var(--gs,1s) linear infinite;-webkit-mask-image:linear-gradient(to top,#000 35%,transparent);mask-image:linear-gradient(to top,#000 35%,transparent)}
@keyframes gridmv{to{background-position:0 140px}}
.vig{position:absolute;inset:0;background:radial-gradient(ellipse at center,transparent 30%,rgba(0,0,0,.82) 100%)}
.stripes{position:absolute;inset:-200px;background:repeating-linear-gradient(-45deg,rgba(255,255,255,var(--so,.07)) 0 40px,transparent 40px 80px);animation:strp 1.6s linear infinite}
@keyframes strp{to{transform:translateX(113.14px)}}

/* overlays */
.fl,.tcover{position:absolute;inset:0}
.inv{position:absolute;inset:0;background:#fff;mix-blend-mode:difference}
.gbar{position:absolute;left:-100px;right:-100px;mix-blend-mode:screen}
.sweep{position:absolute;left:0;width:260px;background:linear-gradient(90deg,transparent,rgba(255,255,255,.6),transparent);pointer-events:none}
.svgw{position:absolute;inset:0;pointer-events:none}
.dim{position:absolute;inset:0;background:#000}
.shard{position:absolute;background:linear-gradient(135deg,#fff,#e2eaff)}
.tstrip{position:absolute;left:0;width:1920px}
.tpanel{position:absolute;left:0;width:1920px;height:540px;background:#05040c}
.tpanel.t{top:0;border-bottom:8px solid var(--pink);box-shadow:0 0 50px var(--pink)}
.tpanel.b{top:540px;border-top:8px solid var(--cyan);box-shadow:0 0 50px var(--cyan)}
.tbar{position:absolute;top:-60px;width:300px;height:1200px}
.iris{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);border-radius:50%;box-shadow:0 0 0 3000px #000,inset 0 0 0 14px var(--gold)}

/* shared components */
.cap{font-family:var(--f-body);font-weight:900;font-size:60px;line-height:1.28;background:#fff;color:#0a0a12;padding:12px 36px 16px;border-radius:12px;box-shadow:10px 10px 0 var(--pink)}
.cap.y{background:var(--gold);box-shadow:10px 10px 0 #000}
.cap em{font-style:normal;color:var(--red)}
.chip{font-family:var(--f-body);font-weight:900;font-size:40px;line-height:1.2;padding:10px 30px 12px;border:4px solid var(--cc,var(--cyan));border-radius:22px;background:rgba(5,5,15,.8);color:#fff;box-shadow:0 0 24px var(--cc,var(--cyan))}
.chip small{display:block;font-family:var(--f-num);font-size:22px;letter-spacing:.2em;color:var(--cc,var(--cyan))}
.chip.big{font-size:52px;border-radius:999px;padding:12px 44px 14px}
.bandw{position:absolute;left:-240px;width:2400px;height:96px}
.band{width:100%;height:100%;overflow:hidden;display:flex;align-items:center;font-family:var(--f-num);font-weight:900;font-size:50px;letter-spacing:.05em;box-shadow:0 12px 30px rgba(0,0,0,.5)}
.band .tape{display:flex;white-space:nowrap;animation:tape 8s linear infinite}

/* HUD */
#hud{transition:opacity .35s}
#hud.off{opacity:0}
.htl{position:absolute;left:34px;top:26px;display:flex;align-items:center;gap:14px;font-family:var(--f-num);font-weight:900;font-size:22px;letter-spacing:.16em;color:#fff;text-shadow:0 2px 0 #000}
.htl .lg{background:var(--paper);color:var(--ink);padding:5px 12px 4px;text-shadow:none}
.htl .st{color:var(--gold)}
.htr{position:absolute;right:34px;top:24px;display:flex;align-items:center;gap:12px;font-family:var(--f-num);font-weight:900;font-size:20px;letter-spacing:.18em;color:#fff;text-shadow:0 2px 0 #000}
.hype{display:flex;gap:4px;padding:4px;border:2px solid rgba(255,255,255,.5);background:rgba(0,0,0,.4)}
.hype i{display:block;width:20px;height:24px;background:rgba(255,255,255,.1);transform:skewX(-16deg)}
#hypeLbl{min-width:96px;text-align:right;color:var(--gold)}
.rec{position:absolute;right:34px;bottom:62px;display:flex;align-items:center;gap:10px;font-family:var(--f-num);font-weight:700;font-size:20px;letter-spacing:.14em;color:#fff;text-shadow:0 2px 0 #000}
.rec i{width:14px;height:14px;border-radius:50%;background:var(--red);animation:blink 1s steps(1) infinite}
.ticker{position:absolute;left:0;right:0;bottom:0;height:46px;background:rgba(3,3,10,.85);border-top:3px solid var(--pink);overflow:hidden;display:flex;align-items:center}
.ticker .tape{display:flex;white-space:nowrap;font-family:var(--f-body);font-weight:900;font-size:24px;color:#fff;animation:tape 70s linear infinite}

/* S0 hook */
.h100{font-size:400px;color:#fff;letter-spacing:-.02em}
.h100 .pc,.r100 .pc{font-size:.55em;margin-left:.04em}
.q{font-size:150px}
.q span{display:inline-block}
.ans{font-size:84px;color:#fff;letter-spacing:.12em;text-shadow:0 0 30px rgba(255,255,255,.6)}

/* S1 title */
.half{position:absolute;left:0;width:100%;height:50%;overflow:hidden}
.half.ht{top:0}.half.hb{top:50%}
.streak{position:absolute;left:0;top:538px;width:1920px;height:4px;background:#fff;box-shadow:0 0 30px #fff,0 0 60px var(--cyan);transform-origin:0 50%}
.logoL{font-size:360px;color:#fff}
.coname{font-size:68px;color:#fff;letter-spacing:.06em;min-height:1.3em;text-shadow:0 4px 0 #000}
.tg1{font-size:52px;color:#fff;text-shadow:0 3px 0 #000,0 0 20px rgba(0,0,0,.8)}
.tg2{font-size:100px;color:#fff;--sw:14px;position:relative}
.tg2 .mk{position:absolute;left:-24px;right:-24px;bottom:4px;height:46%;background:var(--pink);transform-origin:0 50%;z-index:-1}
.tg2 .tx{position:relative}

/* S2 vs */
.pnl{position:absolute;inset:0;overflow:hidden}
.pL{clip-path:polygon(0 0,58% 0,42% 100%,0 100%);background:linear-gradient(135deg,#0a1a8f,#1476ff 70%,#16e6ff)}
.pR{clip-path:polygon(58% 0,100% 0,100% 100%,42% 100%);background:linear-gradient(135deg,#ff7a1a,#e0001f 60%,#6a0010)}
.vs{font-size:260px;color:var(--gold);--sw:16px;--sc:#3a0008;font-style:italic}
.plab{font-size:36px;letter-spacing:.4em;color:rgba(255,255,255,.9)}
.ptl{font-size:84px;color:#fff;--sw:10px}
.ptb{font-size:140px;color:#fff;--sw:14px}
.ptb.r{font-size:108px}
.flick{font-size:54px;color:#fff;min-width:560px;padding:12px 30px;background:rgba(0,0,0,.55);border:4px solid var(--cyan);border-radius:12px}
.gbox{display:flex;align-items:center;gap:26px;padding:16px 36px;background:rgba(3,3,12,.82);border:3px solid rgba(255,255,255,.4);border-radius:14px}
.glab{font-size:30px;letter-spacing:.3em;color:#fff}
.gauge{width:1000px;height:42px;border:4px solid #fff;background:rgba(255,255,255,.08);transform:skewX(-14deg);overflow:hidden}
.gauge i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--cyan),var(--gold) 70%,var(--pink))}
.gnum{font-size:48px;min-width:170px;text-align:right;color:var(--gold)}
.gnum.warn{color:var(--red);animation:blink .2s steps(1) infinite}
.r1{font-size:100px;color:#fff;--sw:12px}
.r1 .hl{color:var(--gold)}
.r100{font-size:380px;color:#fff;--sw:18px;--sc:#5a2a00;text-shadow:0 0 60px rgba(255,210,26,.8)}
.sticker{display:flex;flex-direction:column;align-items:center;padding:14px 26px;background:var(--pink);color:#fff;border:5px solid #fff;border-radius:16px;box-shadow:8px 8px 0 #000}
.sticker b{font-size:52px}
.sticker span{font-family:var(--f-body);font-weight:900;font-size:28px}
.flow{display:flex;align-items:center;gap:14px}
.fstep{font-family:var(--f-body);font-weight:900;font-size:40px;color:#fff;padding:8px 26px;background:rgba(0,0,0,.72);border:3px solid var(--gold);border-radius:999px}
.farr{font-family:var(--f-num);font-weight:900;font-size:30px;color:var(--gold)}

/* S3 salary */
.qtx{font-size:72px;color:#fff;min-height:1.3em;letter-spacing:.06em}
.qtx.big{font-size:110px}
.edge{position:absolute;inset:0;box-shadow:inset 0 0 160px 40px rgba(255,43,61,.9)}
.sfx{font-size:130px;color:var(--gold);--sw:10px}
.gogo{font-size:140px;color:#c3adff;--sw:10px;--sc:#1a0030}
.heatw{display:flex;align-items:center;gap:30px}
.hlab{font-size:56px;color:#fff}
.heat{display:flex;gap:16px}
.heat i{display:block;width:190px;height:76px;border:4px solid rgba(255,255,255,.55);background:rgba(255,255,255,.06);transform:skewX(-16deg)}
.rbw{background:linear-gradient(90deg,#ff2b3d,#ff7a1a,#ffd21a,#b4ff2e,#16e6ff,#7b4dff,#ff2b3d)!important;background-size:200% 100%!important;animation:rbw .5s linear infinite}
@keyframes rbw{to{background-position:200% 0}}
.heatcut{color:#fff;--sw:12px}
.rbwt{color:#ff2b3d!important;animation:hue .4s linear infinite}
.cd{font-size:560px;color:#fff;--sw:22px;--sc:var(--red)}
.cutin{width:2800px;padding:22px 0;background:repeating-linear-gradient(90deg,#000 0 46px,var(--gold) 46px 92px)}
.cib{height:280px;background:linear-gradient(90deg,#2a0006,#d0001e 50%,#2a0006);display:flex;align-items:center;justify-content:center}
.cib span{font-size:200px;color:#fff;--sw:14px}
.slab{font-size:120px;color:#fff;--sw:14px}
.salw{display:flex;align-items:baseline;gap:10px}
.sal{font-size:320px;color:var(--gold);--sw:16px;--sc:#3a0a00}
.unit{font-size:150px;color:#fff;--sw:14px}
.salw.hot .sal{text-shadow:0 0 50px rgba(255,210,26,.9),0 0 120px rgba(255,122,26,.7)}
.atsu{font-size:140px;color:var(--red);--sw:16px;--sc:#fff;text-shadow:0 0 40px rgba(255,43,61,.8)}
.upbox{display:flex;align-items:center;gap:22px;padding:16px 36px;background:rgba(0,0,0,.78);border:4px solid var(--lime);border-radius:16px}
.upbox .bd{font-size:44px;color:#fff}
.upv{font-size:84px;color:var(--lime);--sw:10px}
.arr{font-family:var(--f-num);font-weight:900;font-size:60px;color:var(--lime);animation:up .5s ease-in-out infinite alternate;display:inline-block}
.starb{position:relative;width:320px;height:320px;display:flex;align-items:center;justify-content:center}
.starb svg{position:absolute;inset:0}
.starb span{position:relative;font-size:34px;color:#000;line-height:1.15;text-align:center}

/* S4 guarantee */
.pwin{font-size:52px;color:#fff;padding:10px 40px;background:rgba(10,10,60,.88);border:5px solid #fff;outline:4px solid #3a55ff;outline-offset:4px;border-radius:10px}
.t16{display:flex;flex-direction:column;align-items:center}
.t16 .bd{font-size:56px;color:#fff}
.t16 .imp{font-size:140px;color:var(--gold);--sw:14px}
.row16{position:absolute;inset:0;transform-origin:960px 600px}
.slot{position:absolute;width:96px;height:150px;border:3px dashed rgba(255,255,255,.3);border-radius:10px}
.blk{position:absolute;width:96px;height:150px;border-radius:10px;background:var(--bc);border:4px solid rgba(255,255,255,.9);box-shadow:inset 0 -12px 0 rgba(0,0,0,.25),0 0 24px var(--bc);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;color:#06121a}
.blk b{font-size:34px}
.blk span{font-family:var(--f-body);font-weight:900;font-size:27px}
.blk .imp{font-family:var(--f-impact);font-size:62px}
.m12{--bc:var(--cyan)}.su{--bc:var(--orange)}.wi{--bc:var(--pink)}
.lab12{font-size:64px;color:var(--cyan);--sw:10px}
.lab2{font-size:34px;color:#fff;line-height:1.15;text-shadow:0 3px 0 #000}
.lab2 b{font-family:var(--f-num);font-size:44px}
.lclear{font-size:130px;color:#fff;--sw:14px;--sc:var(--violet)}
.shika{font-size:130px;color:#fff;--sw:12px;min-height:1.1em}
.noreason{font-size:64px;color:#fff;text-shadow:0 4px 0 #000}
.noreason em{font-style:normal;color:var(--gold)}
.stamp{display:flex;flex-direction:column;align-items:center;padding:14px 50px 18px;border:14px solid var(--red);border-radius:26px;background:rgba(255,248,240,.96);box-shadow:0 0 0 6px rgba(255,255,255,.9),0 20px 60px rgba(0,0,0,.6)}
.stamp .imp{font-size:180px;color:var(--red);line-height:1.05}
.stamp .num{font-size:40px;letter-spacing:.4em;color:var(--red)}

/* S5 status */
.win{position:absolute;left:200px;top:150px;width:1520px;height:760px;background:rgba(3,8,40,.9);border:6px solid #fff;border-radius:16px;box-shadow:0 0 0 6px #1b37ff,0 30px 80px rgba(0,0,0,.6);transform-origin:50% 50%}
.whead{position:absolute;left:40px;right:40px;top:26px;display:flex;align-items:center;gap:30px;font-size:40px;color:#fff;border-bottom:4px solid rgba(255,255,255,.35);padding-bottom:18px}
.whead .wname{flex:1;min-height:1.2em;text-align:left}
.whead .wsince{color:var(--gold)}
.wrow{position:absolute;left:50px;right:50px;height:150px}
.wl{position:absolute;left:0;top:34px;font-size:48px;color:#fff}
.wl i{font-style:normal;color:var(--cyan);margin-right:14px;animation:blink .5s steps(1) infinite}
.wv{position:absolute;right:0;top:0;display:flex;align-items:baseline;gap:4px}
.wv b{font-size:100px;color:#fff}
.wv i{font-style:normal;font-size:60px;color:var(--gold)}
.wbar{position:absolute;left:0;right:0;bottom:4px;height:14px;background:rgba(255,255,255,.12)}
.wbar i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--cyan),#fff)}
.wrow.hi .wl{color:var(--gold)}
.wrow.hi .wbar i{background:linear-gradient(90deg,var(--gold),var(--red))}
.soshite{font-size:64px;color:var(--gold)}
.critw{display:flex;align-items:baseline;gap:10px}
.crit{font-size:320px;color:#fff;--sw:16px;--sc:var(--red);text-shadow:0 0 60px rgba(255,43,61,.8)}
.unit2{font-size:150px;color:#fff;--sw:14px;--sc:var(--red)}
.crit2{font-size:150px;font-style:italic;color:var(--gold);--sw:14px;--sc:var(--red)}
.critl{font-size:60px;color:#fff;text-shadow:0 4px 0 #000}
.lvup{font-size:84px;color:var(--lime);text-shadow:0 0 30px var(--lime),0 4px 0 #000}

/* S6 benefits */
.bhead{display:flex;align-items:baseline;gap:30px}
.bhead .num{font-size:66px;font-style:italic;color:#fff;letter-spacing:.06em;text-shadow:0 4px 0 #000}
.bhead .imp{font-size:72px;color:var(--pink);text-shadow:0 4px 0 #000}
.brow{width:1320px;height:96px;display:flex;align-items:center;gap:26px;padding:0 30px;background:rgba(12,4,32,.88);border:3px solid var(--rc);border-radius:14px;box-shadow:0 0 22px var(--rc)}
.brow .no{font-size:36px;color:var(--rc)}
.brow .tt{font-family:var(--f-body);font-weight:900;font-size:46px;color:#fff;text-align:left}
.brow .tt em{font-style:normal;color:var(--gold)}
.brow .jd{margin-left:auto;font-size:24px;letter-spacing:.16em;color:var(--rc)}
.blinkem{animation:emflash .3s steps(1) 6}
@keyframes emflash{50%{color:#fff;text-shadow:0 0 18px var(--gold),0 0 36px var(--gold)}}
.combo{display:flex;flex-direction:column;align-items:center}
.combo .cl{font-size:50px;letter-spacing:.2em;color:#fff;font-style:italic;text-shadow:0 4px 0 #000}
.combo .cn{font-size:260px;color:var(--pink);line-height:1;-webkit-text-stroke:10px #000;paint-order:stroke fill;display:inline-block}
.combo .cn.max{color:var(--gold)}
.judge{font-size:60px;color:#fff;--sw:8px;--sc:var(--pink);font-style:italic}
.fever{font-size:280px;color:#fff;--sw:18px;--sc:var(--pink);text-shadow:0 0 40px var(--gold)}

/* S7 classes */
.selh{font-size:84px;font-style:italic;color:#fff;--sw:10px;--sc:var(--violet);letter-spacing:.06em}

<body>
<div id="viewport">
  <div id="stage">
    <div id="cam"><div id="rig">
      <div id="bg"></div>
      <canvas id="cvBack" class="fx" width="1920" height="1080"></canvas>
      <div id="scene"></div>
      <canvas id="cvFront" class="fx" width="1920" height="1080"></canvas>
    </div></div>
    <div id="hud" class="off">
      <div class="htl"><span class="lg">ITZ</span><span>RECRUIT</span><span id="hudStage" class="st">STAGE 01/10</span></div>
      <div class="htr"><span>HYPE</span><div class="hype" id="hype"></div><span id="hypeLbl">LV.1</span></div>
      <div class="rec"><i></i>REC <span id="tc">00:00.0</span></div>
      <div class="ticker"><div class="tape" id="tickerTape"></div></div>
    </div>
    <div id="fxo"></div>
    <div id="trans"></div>
    <div id="scan"><div id="noise"></div></div>
  </div>
  <div id="pauseTag" hidden>PAUSE</div>
  <div id="ctrl" role="toolbar" aria-label="再生コントロール">
    <button id="bPrev" type="button" aria-label="前のシーン">◀◀</button>
    <button id="bPlay" type="button" aria-label="一時停止">❚❚</button>
    <button id="bNext" type="button" aria-label="次のシーン">▶▶</button>
    <button id="bRe" type="button" aria-label="最初から">↺</button>
    <button id="bFs" type="button" aria-label="全画面">全画面</button>
    <span id="cInfo">01/10</span>
    <span class="keys">Space 一時停止 ／ ← → 前後 ／ R 最初から ／ F 全画面</span>
  </div>
</div>
<script id="main">
(()=>{
'use strict';
/* =========================================================
   設定：BEAT（150BPM=0.4秒）を単位に尺を決める。
   各シーンの dur と、build() 内の at(秒, 関数) を書き換えると演出タイミングを調整できる。
   ========================================================= */
const W=1920,H=1080,BEAT=0.4,TR=0.4,TAU=Math.PI*2;
const b=n=>n*BEAT;
const RM=matchMedia('(prefers-reduced-motion: reduce)').matches;
const $=s=>document.querySelector(s);
const vp=$('#viewport'),stage=$('#stage'),cam=$('#cam'),rig=$('#rig'),bgL=$('#bg'),scene=$('#scene'),hud=$('#hud'),fxo=$('#fxo'),trans=$('#trans'),ctrl=$('#ctrl');
const cvB=$('#cvBack'),cvF=$('#cvFront'),gB=cvB.getContext('2d'),gF=cvF.getContext('2d');
const css=getComputedStyle(document.documentElement);
const C={};for(const k of ['cyan','pink','gold','orange','violet','red','lime','paper','ink'])C[k]=css.getPropertyValue('--'+k).trim();
const rnd=(a,c)=>a+Math.random()*(c-a),pick=a=>a[Math.random()*a.length|0],clamp=(v,a,c)=>Math.max(a,Math.min(c,v));
const eo3=p=>1-Math.pow(1-p,3),eio3=p=>p<.5?4*p*p*p:1-Math.pow(-2*p+2,3)/2,lin=p=>p;

/* ---------- 画面フィット ---------- */
function fit(){const s=Math.min(innerWidth/W,innerHeight/H);stage.style.transform=`scale(${s})`;}
addEventListener('resize',fit);fit();

/* ---------- DOMヘルパー ---------- */
function el(tag,cls,html,parent){const e=document.createElement(tag);if(cls)e.className=cls;if(html!=null)e.innerHTML=html;if(parent)parent.appendChild(e);return e;}
function P(parent,x,y,cls,html){const pin=el('div','pin',null,parent);pin.style.left=x+'px';pin.style.top=y+'px';const m=el('div','m',null,pin);return el('div',cls,html,m);}
function unpin(n){const p=n&&n.closest('.pin');if(p)p.remove();}
function A(node,kf,dur,o={}){const opt={duration:Math.max(1,dur*1000),fill:o.fill||'both',easing:o.ease||'cubic-bezier(.2,.9,.25,1)'};if(o.delay)opt.delay=o.delay*1000;if(o.iter)opt.iterations=o.iter;if(o.dir)opt.direction=o.dir;if(o.comp)opt.composite=o.comp;return node.animate(kf,opt);}
function ctr(n){const r=n.getBoundingClientRect(),s=stage.getBoundingClientRect(),k=s.width/W;return[(r.left+r.width/2-s.left)/k,(r.top+r.height/2-s.top)/k];}
const K={
  slam:(s=3.2,r=0)=>[{transform:`scale(${s}) rotate(${r}deg)`,opacity:0},{transform:`scale(.94) rotate(${r}deg)`,opacity:1,offset:.72},{transform:`scale(1) rotate(${r}deg)`,opacity:1}],
  pop:(r=0)=>[{transform:`scale(0) rotate(${r-10}deg)`,opacity:0},{transform:`scale(1.14) rotate(${r}deg)`,opacity:1,offset:.65},{transform:`scale(1) rotate(${r}deg)`,opacity:1}],
  fromX:(x,r=0)=>[{transform:`translateX(${x}px) rotate(${r}deg)`,opacity:0},{transform:`translateX(0) rotate(${r}deg)`,opacity:1}],
  fromY:(y,r=0)=>[{transform:`translateY(${y}px) rotate(${r}deg)`,opacity:0},{transform:`translateY(0) rotate(${r}deg)`,opacity:1}],
  fade:[{opacity:0},{opacity:1}],
  out:[{opacity:1},{opacity:0}],
};
function bgSolid(c){const d=el('div','solid',null,bgL);d.style.background=c;return d;}
function bgRays(c1,c2,sp=16,parent=bgL){const d=el('div','rays',null,parent);d.style.setProperty('--r1',c1);d.style.setProperty('--r2',c2);d.style.setProperty('--rs',sp+'s');return d;}
function bgGrid(c,sp=1,parent=bgL){const d=el('div','grid',null,parent);d.style.setProperty('--gl',c);d.style.setProperty('--gs',sp+'s');return d;}
function bgVig(parent=bgL){return el('div','vig',null,parent);}
function starPts(n,r1,r2,cx,cy){const p=[];for(let j=0;j<n*2;j++){const r=j%2?r2:r1,a=j/(n*2)*TAU-Math.PI/2;p.push((cx+Math.cos(a)*r).toFixed(1)+','+(cy+Math.sin(a)*r).toFixed(1));}return p.join(' ');}

/* ---------- タイムライン・エンジン ---------- */
const E={i:0,t:0,playing:false,started:false,ended:false,ev:[],evi:0,tw:[],held:[],hype:0,hypeV:0,amb:null,mode:null,charge:false,autoP:false};
function at(t,fn){const ev=E.ev;let k=ev.length;while(k>E.evi&&ev[k-1].t>t)k--;ev.splice(k,0,{t,fn});}
function tw(t0,dur,fn,ease=eo3){E.tw.push({t0,dur,fn,ease,done:false});}
function typeOn(node,text,t0,cps=.05){node.textContent='';[...text].forEach((ch,k)=>at(t0+k*cps,()=>{node.textContent+=ch;}));}
function hype(v){E.hype=clamp(v,0,1);}
function ambient(c,n=40){E.amb={c,n};}

/* ---------- 画面エフェクト ---------- */
function flash(color='#fff',dur=.3,op=1){if(RM)op=Math.min(op,.3);const d=el('div','fl',null,fxo);d.style.background=color;A(d,[{opacity:op},{opacity:0}],dur,{ease:'ease-out'}).onfinish=()=>d.remove();}
function invert(dur=.1){if(RM)return;const d=el('div','inv',null,fxo);A(d,[{opacity:1},{opacity:1}],dur,{ease:'linear'}).onfinish=()=>d.remove();}
function shake(pw=20,dur=.4){if(RM)pw*=.15;const n=Math.max(4,Math.round(dur*28)),k=[];for(let j=0;j<n;j++){const f=1-j/n;k.push({transform:`translate(${rnd(-pw,pw)*f}px,${rnd(-pw,pw)*f}px) rotate(${rnd(-.6,.6)*f*pw/20}deg)`});}k.push({transform:'translate(0px,0px) rotate(0deg)'});A(rig,k,dur,{ease:'linear',fill:'none',comp:'add'});}
function punch(s=1.05,dur=.3){if(RM)s=1+(s-1)*.3;A(rig,[{transform:`scale(${s})`},{transform:'scale(1)'}],dur,{ease:'cubic-bezier(.1,.8,.3,1)',fill:'none',comp:'add'});}
function glitch(dur=.3,n=8){if(RM)n=2;for(let j=0;j<n;j++){const bar=el('div','gbar',null,fxo);bar.style.top=rnd(0,1040)+'px';bar.style.height=rnd(6,80)+'px';bar.style.background=pick(['rgba(22,230,255,.6)','rgba(255,46,138,.6)','rgba(255,255,255,.45)','rgba(180,255,46,.5)']);const d=rnd(.06,dur);A(bar,[{transform:`translateX(${rnd(-260,260)}px)`},{transform:`translateX(${rnd(-260,260)}px)`},{transform:`translateX(${rnd(-260,260)}px)`}],d,{ease:'steps(3)',delay:rnd(0,Math.max(0,dur-d))}).onfinish=()=>bar.remove();}shake(10,dur);}
function sweep(y,h=300,dur=.6,rot=-18){const s=el('div','sweep',null,scene);s.style.top=(y-h/2)+'px';s.style.height=h+'px';A(s,[{transform:`translateX(-600px) skewX(${rot}deg)`},{transform:`translateX(2400px) skewX(${rot}deg)`}],dur,{ease:'cubic-bezier(.5,0,.5,1)'}).onfinish=()=>s.remove();}
function bolt(x1=1114,y1=0,x2=806,y2=1080){const pts=[];const n=14;for(let j=0;j<=n;j++){const t=j/n;pts.push([(x1+(x2-x1)*t+(j&&j<n?rnd(-50,50):0)).toFixed(0),(y1+(y2-y1)*t).toFixed(0)]);}const ps=pts.map(p=>p.join(',')).join(' ');const w=el('div','svgw',`<svg width="1920" height="1080" viewBox="0 0 1920 1080"><polyline points="${ps}" fill="none" stroke="${C.cyan}" stroke-opacity=".4" stroke-width="36" stroke-linejoin="round"/><polyline points="${ps}" fill="none" stroke="#fff" stroke-width="12" stroke-linejoin="round"/></svg>`,scene);A(w,[{opacity:1},{opacity:0},{opacity:1},{opacity:0}],.45,{ease:'steps(4)'}).onfinish=()=>w.remove();}
function band(y,rot,bg,fg,text,dir=-1,sp=8){const w=el('div','bandw',null,scene);w.style.top=(y-48)+'px';w.style.transform=`rotate(${rot}deg)`;const bn=el('div','band',null,w);bn.style.background=bg;bn.style.color=fg;const tp=el('div','tape',null,bn);const s=text.repeat(6);tp.innerHTML=`<span>${s}</span><span>${s}</span>`;tp.style.animationDuration=sp+'s';if(dir>0)tp.style.animationDirection='reverse';A(bn,[{transform:`translateX(${dir*-2400}px)`},{transform:'translateX(0)'}],.3);return w;}

/* ---------- パーティクル（Canvas） ---------- */
const PS=[];
function burst(x,y,o={}){const n=Math.round((o.n||90)*(RM?.35:1));const cols=o.colors||['#fff',C.gold,C.cyan,C.pink];for(let j=0;j<n;j++){const a=o.ang!=null?o.ang+rnd(-(o.spread||.5),o.spread||.5):rnd(0,TAU);const sp=rnd(o.s0||350,o.s1||1500);const life=rnd(o.l0||.45,o.l1||1.1);PS.push({t:o.type||'spark',x,y,vx:Math.cos(a)*sp,vy:Math.sin(a)*sp,g:o.g??700,dr:o.dr??.9,life,max:life,sz:rnd(o.z0||2,o.z1||5),c:pick(cols),L:o.L||'f',rot:rnd(0,TAU),vr:rnd(-12,12),w:rnd(12,24),h:rnd(7,13)});}}
function confetti(x,y,n,ang,spread,s0=700,s1=1600){burst(x,y,{n,type:'conf',ang,spread,s0,s1,g:900,dr:.965,l0:1.6,l1:3.2,colors:[C.gold,C.cyan,C.pink,C.lime,'#fff',C.violet,C.orange]});}
function ring(x,y,c='#fff',r=900,dur=.6,w=16){PS.push({t:'ring',x,y,r:8,vr:r/dur,life:dur,max:dur,sz:w,c,L:'f'});}
function ringIn(x,y,c='#fff',r=1100,dur=.5,w=10){PS.push({t:'ring',x,y,r,vr:-r/dur,life:dur,max:dur,sz:w,c,L:'f'});}
const CODECH='01{}<>/=;()[]+*アイティ#$&ITZ'.split('');
const VY=110,JY=960;
const hwyX=(lane,s)=>{const xb=960+(lane-2.5)*300,xt=960+(lane-2.5)*44;return xt+(xb-xt)*s;};
const hwyY=s=>VY+(JY-VY)*s;
const laneX=i=>960+(i-2)*300;
function modeStep(dt){const M=E.mode;if(!M)return;
  if(M.k==='rain'){if(!M.drops){M.drops=[];for(let j=0;j<140;j++)M.drops.push({x:rnd(-200,2200),y:rnd(-100,1100),l:rnd(60,160),v:rnd(1400,2200)});}for(const d of M.drops){d.y+=d.v*dt;d.x-=d.v*dt*.18;if(d.y>1180){d.y=rnd(-200,-40);d.x=rnd(0,2300);}}}
  else if(M.k==='code'){if(!M.cols){M.cols=[];for(let j=0;j<34;j++)M.cols.push({x:j*58+20,y:rnd(-600,1080),v:rnd(500,1100)});}for(const c of M.cols){c.y+=c.v*dt;if(c.y>1560)c.y=rnd(-400,-50);}}
  else if(M.k==='hwy'){M.s=(M.s+dt*1.6)%1;}
}
function drawMode(g){const M=E.mode;if(!M)return;g.save();
  if(M.k==='speed'){g.fillStyle=M.c;g.globalAlpha=M.a;for(let j=0;j<M.n;j++){const a=rnd(0,TAU),r0=M.r0+rnd(0,300),w=rnd(.003,.014);g.beginPath();g.moveTo(M.x+Math.cos(a)*r0,M.y+Math.sin(a)*r0);g.lineTo(M.x+Math.cos(a-w)*1700,M.y+Math.sin(a-w)*1700);g.lineTo(M.x+Math.cos(a+w)*1700,M.y+Math.sin(a+w)*1700);g.closePath();g.fill();}}
  else if(M.k==='rain'&&M.drops){g.strokeStyle='rgba(170,190,255,.35)';g.lineWidth=2;g.beginPath();for(const d of M.drops){g.moveTo(d.x,d.y);g.lineTo(d.x+d.l*.18,d.y-d.l);}g.stroke();}

  if(!E.ended){
    E.t+=dt;
    while(E.evi<E.ev.length&&E.ev[E.evi].t<=E.t){const e=E.ev[E.evi++];try{e.fn();}catch(err){console.error(err);}}
    for(const w of E.tw){if(w.done||E.t<w.t0)continue;const p=clamp((E.t-w.t0)/w.dur,0,1);try{w.fn(w.ease(p),p);}catch(err){console.error(err);w.done=true;}if(p>=1)w.done=true;}
    if(E.t>=SL[E.i].dur){if(E.i<SL.length-1)go(E.i+1,true);else{E.ended=true;ui();}}
  }
  fxStep(dt);fxDraw();hudStep(dt);
  infoT+=dt;if(infoT>.2){infoT=0;info();}
}
function pause(){if(!E.playing)return;E.playing=false;E.held=document.getAnimations().filter(a=>a.playState==='running'&&!(a.effect&&a.effect.target&&ctrl.contains(a.effect.target)));E.held.forEach(a=>a.pause());ui();}
function resume(){if(E.playing)return;E.playing=true;E.held.forEach(a=>{try{a.play();}catch(e){}});E.held=[];last=null;ui();}
function toggle(){if(E.ended){restart();return;}E.playing?pause():resume();}
function jump(i){resume();go(i,false);}
function next(){if(E.i<SL.length-1)jump(E.i+1);}
function prev(){jump(E.t>1.5?E.i:E.i-1);}
function restart(){jump(0);}
function fs(){const d=document;try{if(d.fullscreenElement){const r=d.exitFullscreen();r&&r.catch&&r.catch(()=>{});}else if(d.documentElement.requestFullscreen){const r=d.documentElement.requestFullscreen();r&&r.catch&&r.catch(()=>{});}}catch(e){}}

addEventListener('keydown',e=>{
  if(e.altKey||e.ctrlKey||e.metaKey)return;
  const k=e.key;
  if(k===' '||k==='k'||k==='K'){e.preventDefault();toggle();}
  else if(k==='ArrowRight'||k==='l'||k==='L'||k==='PageDown'){e.preventDefault();next();}
  else if(k==='ArrowLeft'||k==='j'||k==='J'||k==='PageUp'){e.preventDefault();prev();}
  else if(k==='r'||k==='R'||k==='Home'){e.preventDefault();restart();}
  else if(k==='f'||k==='F'){e.preventDefault();fs();}
  else if(/^[0-9]$/.test(k)){const n=k==='0'?9:parseInt(k,10)-1;if(n<SL.length)jump(n);}
});
const btn=(id,fn)=>$(id).addEventListener('click',e=>{e.stopPropagation();fn();e.currentTarget.blur();});
btn('#bPrev',prev);btn('#bPlay',toggle);btn('#bNext',next);btn('#bRe',restart);btn('#bFs',fs);
vp.addEventListener('click',e=>{if(e.target.closest('#ctrl')||e.target.closest('a'))return;const r=vp.getBoundingClientRect(),x=(e.clientX-r.left)/r.width;if(x<.22)prev();else if(x>.78)next();else toggle();});
let hideT=0;
const showCtrl=()=>{ctrl.classList.add('show');vp.classList.remove('idle');clearTimeout(hideT);hideT=setTimeout(()=>{if(!ctrl.matches(':hover')){ctrl.classList.remove('show');vp.classList.add('idle');}},2200);};
vp.addEventListener('mousemove',showCtrl);vp.addEventListener('touchstart',showCtrl,{passive:true});
document.addEventListener('visibilitychange',()=>{if(document.hidden){if(E.started&&E.playing){pause();E.autoP=true;}}else if(E.autoP){E.autoP=false;resume();}});

window.DOPA={slides:SL,go:jump,pause,resume,restart,get state(){return{i:E.i,id:SL[E.i].id,t:E.t,playing:E.playing,ended:E.ended,elapsed:elapsed(),total:TOTAL};}};

/* ---------- 起動：フォントを読み込んでからAUTO再生 ---------- */
async function boot(){
  const warm=el('div','warm',null,document.body);const src=$('#main').textContent;
  for(const [f,w] of [['var(--f-impact)',400],['var(--f-body)',900],['var(--f-body)',700],['var(--f-num)',900],['var(--f-num)',700],['var(--f-pixel)',400]]){const d=el('div',null,null,warm);d.style.fontFamily=f;d.style.fontWeight=w;d.textContent=src;}
  void warm.offsetWidth;
  try{await Promise.race([document.fonts.ready,new Promise(r=>setTimeout(r,4000))]);}catch(e){}
  warm.remove();
  const m=/^#s(\d+)$/.exec(location.hash);
  E.started=true;E.playing=true;go(m?clamp(parseInt(m[1],10)-1,0,SL.length-1):0,false);
}
requestAnimationFrame(tick);
boot();
})();
</script>
