<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>S-1 人類存亡リスク</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@600;700&family=Dela+Gothic+One&family=DotGothic16&family=Zen+Kaku+Gothic+New:wght@500;700;900&display=swap">
<style>
:root{
  /* Layout: a fixed 1920x1080 stage, letterboxed and scaled to the window. Layers: bg canvas > S-1 text ticker > scene DOM > spark canvas > flashes > scanlines > HUD */
  --void:#06050c; --ink:#fff4ec; --red:#ff2340; --amber:#ffb21a; --cyan:#22e8ff; --mag:#ff2fd0; --gold:#ffd75a; --dim:#a39cc4;
  --f-impact:"Dela Gothic One","Hiragino Kaku Gothic StdN","Noto Sans JP",sans-serif;
  --f-jp:"Zen Kaku Gothic New","Hiragino Sans","Noto Sans JP","Yu Gothic",sans-serif;
  --f-game:"DotGothic16","Zen Kaku Gothic New",monospace;
  --f-ui:"Chakra Petch","Zen Kaku Gothic New",ui-monospace,monospace;
  color-scheme:dark;
}
html,body{height:100%;margin:0;background:#000;color:var(--ink);overflow:hidden}
[hidden]{display:none!important}
#frame{position:fixed;inset:0;background:#000;overflow:hidden;cursor:pointer;user-select:none;-webkit-user-select:none}
#stage{position:absolute;left:50%;top:50%;width:1920px;height:1080px;overflow:hidden;background:var(--void);transform-origin:50% 50%;font-family:var(--f-jp);color:var(--ink);-webkit-font-smoothing:antialiased}
#stage *{box-sizing:border-box}
#shaker,#scenes,.scene,#fx,.fxl,#ticker{position:absolute;inset:0}
#stage canvas{position:absolute;left:0;top:0;width:1920px;height:1080px;display:block;pointer-events:none}
#ticker{overflow:hidden;opacity:0;color:var(--ink);font:600 26px/1 var(--f-ui);letter-spacing:.04em;white-space:nowrap;pointer-events:none}
#ticker .row{position:absolute;left:0;display:flex;width:max-content;animation:tick 60s linear infinite}
#ticker .row span{padding-right:90px}
@keyframes tick{from{transform:translateX(0)}to{transform:translateX(-50%)}}
#fx{pointer-events:none;z-index:20}
#noise{position:absolute;left:-50%;top:-50%;width:200%;height:200%;pointer-events:none;opacity:.05;z-index:30;animation:noise .4s steps(4) infinite}
@keyframes noise{0%{transform:translate(0,0)}25%{transform:translate(-7%,4%)}50%{transform:translate(5%,-6%)}75%{transform:translate(-3%,-2%)}100%{transform:translate(0,0)}}
#scan{position:absolute;inset:0;pointer-events:none;z-index:31;background:repeating-linear-gradient(to bottom,rgba(0,0,0,.2) 0 2px,transparent 2px 5px)}
#vig{position:absolute;inset:0;pointer-events:none;z-index:32;background:radial-gradient(ellipse at center,transparent 58%,rgba(0,0,0,.7) 100%)}
@keyframes blink{50%{opacity:0}}
@keyframes spin{to{transform:rotate(360deg)}}

/* shared type */
.abs{position:absolute}
.cx{left:0;right:0;text-align:center}
.h{opacity:0}
.imp{font-family:var(--f-impact);font-weight:400;letter-spacing:.01em}
.jp{font-family:var(--f-jp);font-weight:900}
.ui{font-family:var(--f-ui);font-weight:700;letter-spacing:.06em}
.game{font-family:var(--f-game)}
.dim{color:var(--dim)}
.ca{text-shadow:-6px 0 0 rgba(255,35,64,.85),6px 0 0 rgba(34,232,255,.85),0 0 50px rgba(255,255,255,.25)}
mark{background:var(--amber);color:#000;padding:0 6px}
.hl{color:var(--amber);border-bottom:8px solid var(--amber)}
.tag{display:inline-block;background:var(--ink);color:var(--void);padding:4px 14px;margin-right:16px;letter-spacing:.12em}
.cutin{display:grid;place-items:center;box-shadow:0 0 0 10px #000,0 0 80px rgba(0,0,0,.7);z-index:6;white-space:nowrap}
.stamp{white-space:nowrap;border:8px solid currentColor;padding:.04em .3em;border-radius:14px;background:rgba(0,0,0,.45);z-index:7;text-shadow:0 0 30px currentColor}
.sweep{position:absolute;inset:0;background:linear-gradient(90deg,transparent,rgba(255,255,255,.55),transparent);pointer-events:none}
.wipe{left:-260px;right:-260px;background:repeating-linear-gradient(-45deg,var(--amber) 0 60px,#000 60px 120px);box-shadow:0 0 0 10px #000}
.shard{background:var(--void);overflow:hidden}

/* 0 hook */
.s0-band{display:grid;place-items:center;box-shadow:0 0 0 12px #000,0 20px 90px rgba(255,35,64,.55)}
.s0-band .imp{font-size:170px;line-height:1;color:var(--ink);text-shadow:8px 8px 0 #000}
.s0-maji{display:inline-block;font-size:150px;line-height:1.1;color:var(--void);background:var(--ink);padding:6px 40px;box-shadow:12px 12px 0 var(--red)}

/* 1 scan */
.s1-search{display:flex;align-items:center;gap:24px;padding:0 30px;border:4px solid var(--amber);background:rgba(6,5,12,.85);font-family:var(--f-ui);font-weight:700}
.s1-search .lbl{font-size:24px;color:var(--amber);letter-spacing:.2em}
.s1-search .q{font-size:62px;letter-spacing:.03em;color:var(--ink)}
.caret{width:7px;height:64px;background:var(--amber);animation:blink .8s steps(1) infinite}
.s1-page .lbl{font:700 26px var(--f-ui);color:var(--amber);letter-spacing:.3em}
.s1-page .num{font:700 170px/.95 var(--f-ui);color:var(--ink);font-variant-numeric:tabular-nums;text-shadow:0 0 34px rgba(255,178,26,.65)}
.s1-beam{background:linear-gradient(90deg,transparent,var(--amber),transparent);box-shadow:0 0 34px 10px rgba(255,178,26,.55)}
.s1-card{display:grid;grid-template-columns:150px 160px 1fr;align-items:center;background:rgba(10,8,20,.94);border:4px solid var(--amber);box-shadow:10px 10px 0 rgba(255,178,26,.3)}
.s1-card .hit{height:100%;display:grid;place-items:center;background:var(--amber);color:#000;font-size:50px}
.s1-card .pg{font:700 56px var(--f-ui);text-align:center;color:var(--amber)}
.s1-card .tx{padding-right:26px;min-width:0}
.s1-card .jp{font-size:38px;line-height:1.25}
.s1-card .en{font:600 23px var(--f-ui);color:var(--dim);margin-top:8px}
.s1-combo .w{font:700 30px var(--f-ui);color:var(--amber);letter-spacing:.16em}
.s1-combo .n{font-family:var(--f-impact);font-size:270px;line-height:1;color:var(--gold);text-shadow:0 0 44px rgba(255,215,90,.7),8px 8px 0 #000}
.s1-combo .x{font-size:140px;margin-right:8px}
.s1-combo .w2{font-family:var(--f-impact);font-size:52px;letter-spacing:.3em}
.s1-mega{display:flex;flex-direction:column;align-items:center;gap:8px}
.s1-mega .q{font:700 70px var(--f-ui);color:var(--amber);letter-spacing:.08em}
.s1-mega .big{font-family:var(--f-impact);font-size:400px;line-height:.95;color:var(--gold);text-shadow:0 0 70px rgba(255,215,90,.8),10px 10px 0 #000}
.s1-mega .jp{font-size:58px;background:var(--ink);color:var(--void);padding:8px 34px}

/* 2 conditions */
.s2-ij{font-size:124px}
.s2-ie{font-size:42px;color:var(--cyan);margin-top:14px}
.s2-panel{overflow:hidden;visibility:hidden}
.s2-panel .stripes{position:absolute;inset:-300px;background:repeating-linear-gradient(-30deg,rgba(0,0,0,.13) 0 46px,transparent 46px 92px);animation:stripes .9s linear infinite}
@keyframes stripes{to{transform:translateX(184px)}}
.s2-panel .num{position:absolute;right:30px;top:-110px;font-size:700px;line-height:1;color:#000;opacity:.16}
.s2-panel .lab{position:absolute;left:60px;top:50px;font:700 30px var(--f-ui);letter-spacing:.2em}
.s2-panel .en{position:absolute;left:0;right:0;top:250px;text-align:center;font-size:200px;line-height:1;rotate:-6deg;white-space:nowrap}
.s2-panel .en.two{top:200px;font-size:170px}
.s2-panel .en.echo{color:transparent;-webkit-text-stroke:3px currentColor;opacity:0}
.s2-panel:nth-child(2) .en.echo{-webkit-text-stroke-color:#04121a}
.s2-panel .jpbar{position:absolute;left:0;right:0;top:770px;height:180px;background:#000;color:var(--ink);display:grid;place-items:center;font-family:var(--f-jp);font-weight:900;font-size:112px}
.s2-ret{color:#1a0e00}
.s2-quad{display:grid;grid-template-columns:1fr 1fr;grid-template-rows:1fr 1fr;gap:14px;padding:14px;background:#000}
.s2-quad>div{display:flex;flex-direction:column;align-items:center;justify-content:center;font-family:var(--f-impact);font-size:84px;line-height:1.05;text-align:center;padding:0 30px}
.s2-quad small{display:block;font-family:var(--f-jp);font-weight:900;font-size:52px;margin-top:16px}

/* 3 status */
.win{background:linear-gradient(180deg,rgba(20,22,78,.95),rgba(8,9,38,.95));border:4px solid #fff;border-radius:14px;box-shadow:inset 0 0 0 4px #2a2f8a,0 0 0 4px rgba(0,0,0,.6),0 0 60px rgba(140,90,255,.25);color:var(--ink);transform-origin:50% 50%}
.s3-top{display:flex;align-items:center;gap:28px;padding:0 36px;font-size:46px}
.s3-top .game{color:var(--gold)}
.s3-top .src{margin-left:auto;font:700 24px var(--f-ui);color:var(--dim);letter-spacing:.12em}
.s3-left{padding:28px 36px;display:flex;flex-direction:column;gap:14px}
.s3-unit{display:flex;align-items:center;gap:26px}
.s3-emb{width:120px;height:120px;position:relative;flex:none}
.s3-emb i{position:absolute;inset:14px;border:5px solid var(--mag);animation:spin 5s linear infinite}
.s3-emb i:nth-child(2){inset:30px;border-color:var(--cyan);animation-direction:reverse;animation-duration:3s}
.s3-emb i:nth-child(3){inset:46px;border-color:var(--gold);animation-duration:2s;background:rgba(255,215,90,.25)}
.s3-unit .nm{font-family:var(--f-game);font-size:48px;line-height:1.1}
.s3-unit .sub{font-size:24px;font-weight:700;color:var(--dim)}
.s3-stat .k{display:flex;justify-content:space-between;align-items:baseline;font-family:var(--f-game);font-size:30px}
.s3-stat .k small{font:700 17px var(--f-ui);color:var(--dim);letter-spacing:.1em;margin-left:8px}
.s3-stat em{font-style:normal;font:700 24px var(--f-ui);color:var(--dim)}
.s3-stat em.hot{color:var(--red);animation:blink .3s steps(1) infinite}
.s3-trk{height:24px;border:3px solid #fff;background:#000;margin-top:6px;padding:2px}
.s3-fill{height:100%;width:0;background:linear-gradient(90deg,var(--cyan),var(--mag) 70%,var(--red))}
.s3-note{font-size:22px;font-weight:700;color:var(--dim);line-height:1.5;margin-top:auto}
.s3-right{padding:22px 32px}
.s3-right .ttl{font-family:var(--f-game);font-size:34px;color:var(--gold);padding-bottom:10px;border-bottom:2px dashed rgba(255,255,255,.35);margin-bottom:6px}
.s3-right .ttl span{font:700 22px var(--f-ui);letter-spacing:.2em;color:var(--dim);margin-left:10px}
.s3-row{position:relative;display:grid;grid-template-columns:96px 1fr;align-items:center;height:72px;opacity:0;overflow:hidden}
.s3-row .nw{font:700 20px var(--f-ui);color:#000;background:var(--gold);padding:4px 10px;justify-self:start;letter-spacing:.1em}
.s3-row .j{font-size:33px;font-weight:900;line-height:1.15}
.s3-row .e{font:600 17px var(--f-ui);color:var(--dim);letter-spacing:.03em}
.s3-row .redact{position:absolute;left:96px;right:0;top:10px;bottom:10px;background:#000;transform:scaleX(0);transform-origin:0 50%}
.s3-dlg{padding:28px 46px}
.s3-dlg .t{font-size:52px;font-weight:900;min-height:64px}
.s3-dlg .e{font:600 25px var(--f-ui);color:var(--dim);margin-top:14px}
.s3-dlg .more{position:absolute;right:34px;bottom:18px;font-size:30px;color:var(--gold);animation:blink .8s steps(1) infinite}
.s3-cut{display:flex;flex-direction:column;align-items:center;gap:10px}

/* 4 incident */
.tape{background:repeating-linear-gradient(-45deg,var(--amber) 0 34px,#000 34px 68px);overflow:hidden;display:flex;align-items:center;box-shadow:0 0 0 4px #000;z-index:4}
.tape .roll{white-space:nowrap;background:#000;color:var(--amber);font:700 28px var(--f-ui);padding:6px 24px;letter-spacing:.2em;animation:roll 14s linear infinite}
.tape .roll.r{animation-direction:reverse}
@keyframes roll{to{transform:translateX(-40%)}}
.term{background:rgba(0,0,0,.78);border:3px solid rgba(255,35,64,.75);padding:34px 38px;font-family:var(--f-game);font-size:37px;line-height:1.75;color:var(--ink)}
.term .bad{color:var(--red)}
.bignum .v{font-family:var(--f-impact);font-size:200px;line-height:1;color:var(--ink);text-shadow:0 0 44px rgba(255,35,64,.85),8px 8px 0 #000;font-variant-numeric:tabular-nums;white-space:nowrap}
.bignum .v small{font-size:90px}
.bignum .l{font-size:42px;font-weight:900;margin-top:4px}
.bignum.hrs .v{font-size:150px}
.bignum.hrs .v small{font-size:70px}
.s4-access{background:var(--red);color:var(--ink);font-size:78px;font-weight:900;padding:16px 0;box-shadow:0 0 0 8px #000;font-family:var(--f-jp)}
.s4-step{font-family:var(--f-jp);font-weight:900;font-size:124px;line-height:1.18;text-shadow:0 0 40px rgba(255,35,64,.7),6px 6px 0 #000}
.s4-admin .a{font-family:var(--f-impact);font-size:180px;line-height:1;color:var(--red);-webkit-text-stroke:5px var(--ink);text-shadow:0 0 70px rgba(255,35,64,.95)}
.s4-admin .s{font-size:64px;margin-top:20px;display:inline-block;background:var(--ink);color:var(--void);padding:6px 30px}
.s4-chips{display:flex;gap:26px}
.s4-chip{flex:1;font-size:25px;font-weight:700;line-height:1.3;padding:14px 14px;border:3px solid rgba(255,255,255,.22);color:rgba(255,244,236,.32);text-align:center;display:grid;place-items:center;position:relative}
.s4-chip.on{border-color:var(--red);color:var(--ink);background:rgba(255,35,64,.28)}
.s4-chip+.s4-chip::before{content:"▶";position:absolute;left:-24px;top:50%;margin-top:-12px;color:var(--red);font-size:20px}
.calm{background:rgba(12,12,20,.95);border:3px solid rgba(255,244,236,.5);padding:44px 60px}
.calm .ttl{font:700 26px var(--f-ui);letter-spacing:.3em;color:var(--dim)}
.calm .jp{font-size:62px;margin:16px 0 18px}
.calm .sm{font-size:34px;font-weight:500;line-height:1.65;color:#ddd8ee}

/* 5 acceleration */
.s5-g{position:absolute;left:210px;width:1500px}
.s5-g .k{display:flex;justify-content:space-between;align-items:baseline;font-size:42px;font-weight:900;margin-bottom:12px}
.s5-g .k span:last-child{font:700 26px var(--f-ui);letter-spacing:.15em;color:var(--dim)}
.s5-trk{position:relative;height:84px;border:4px solid var(--ink);background:rgba(0,0,0,.65);padding:6px}
.s5-fill{height:100%;width:0}
.s5-fill.m{background:linear-gradient(90deg,#7a1468,var(--mag));box-shadow:0 0 30px rgba(255,47,208,.6)}
.s5-fill.c{background:linear-gradient(90deg,#0b5866,var(--cyan));box-shadow:0 0 30px rgba(34,232,255,.5)}
.s5-g.over .s5-trk{border-color:var(--red)}
.s5-g.over .k span:first-child{color:var(--red)}
.s5-cd{font-size:440px;line-height:1;color:var(--ink);opacity:0;text-shadow:0 0 80px rgba(255,35,64,.9),10px 10px 0 #000;z-index:5}
.s5-band{background:#000;display:flex;flex-direction:column;align-items:center;justify-content:center;box-shadow:0 0 0 12px var(--red),0 0 120px rgba(255,35,64,.7);z-index:5}
.s5-band .jp{font-size:124px;line-height:1.22;text-shadow:-5px 0 0 rgba(255,35,64,.85),5px 0 0 rgba(34,232,255,.85)}

/* 6 vs */
.vsL,.vsR{display:flex;flex-direction:column;gap:6px}
.vsL{background:linear-gradient(135deg,#052a33,#0a8fa6 60%,var(--cyan));padding:170px 0 0 110px;justify-content:flex-start}
.vsR{background:linear-gradient(225deg,#3a2600,#b87400 60%,var(--amber));align-items:flex-end;padding:0 110px 170px 0;justify-content:flex-end}
.vsL .name,.vsR .name{font-family:var(--f-impact);font-size:100px;line-height:1;color:var(--ink);text-shadow:8px 8px 0 rgba(0,0,0,.45)}
.vsL .jp,.vsR .jp{font-size:84px;color:#000}
.hp{display:flex;align-items:center;gap:18px;font:700 28px var(--f-ui);letter-spacing:.15em;color:var(--ink);z-index:4}
.hp.r{flex-direction:row-reverse}
.hp .t{flex:1;height:36px;border:4px solid var(--ink);background:#000;padding:3px;transform:skewX(-20deg)}
.hp.r .t{transform:skewX(20deg)}
.hp .f{height:100%;width:0;background:linear-gradient(90deg,var(--cyan),#a9f8ff);transition:width .45s cubic-bezier(.2,.8,.2,1)}
.hp.r .f{margin-left:auto;background:linear-gradient(270deg,var(--amber),#ffe3a0)}
.s6-sub .jp{display:block;font-size:72px;text-shadow:0 4px 0 #000}
.s6-sub .ui{display:block;font-size:26px;color:var(--ink);margin-top:10px;letter-spacing:.14em}
.s6-round{font-size:130px;line-height:1;color:var(--ink);text-shadow:0 0 40px rgba(34,232,255,.8),8px 8px 0 #000}
.s6-card{background:rgba(6,5,12,.95);border:4px solid var(--ink);padding:42px 54px;box-shadow:16px 16px 0 rgba(34,232,255,.45)}
.s6-card .ttl{font-size:62px;font-weight:900;line-height:1.3}
.s6-card .dt{font-size:33px;font-weight:500;line-height:1.6;color:#ddd8ee;margin-top:18px}
.s6-card .chip{display:inline-block;margin-top:22px;border:3px solid var(--cyan);color:var(--cyan);padding:10px 18px;font-size:28px;font-weight:700}
.s6-card .src{font:700 22px var(--f-ui);color:var(--dim);margin-top:18px;letter-spacing:.14em}
.s6-judge .hd{position:absolute;left:0;right:0;top:0;text-align:center;font-size:74px}
.s6-judge .bx{position:absolute;top:150px;width:760px;padding:40px 46px;font-size:54px;font-weight:900;line-height:1.35;background:rgba(6,5,12,.94);border:5px solid}
.s6-judge .bx b{display:block;font-size:42px;margin-bottom:10px}
.s6-judge .bx.l{left:160px;border-color:var(--cyan)}
.s6-judge .bx.l b{color:var(--cyan)}
.s6-judge .bx.r{right:160px;border-color:var(--amber)}
.s6-judge .bx.r b{color:var(--amber)}
.s6-judge .src{position:absolute;left:0;right:0;top:500px;text-align:center;font-size:24px;color:var(--dim);letter-spacing:.2em}

/* 7 result */
.s7-head{font:700 30px var(--f-ui);letter-spacing:.3em;color:var(--gold)}
.s7-banner{display:inline-block;font-family:var(--f-impact);font-size:150px;line-height:1;background:linear-gradient(180deg,#fff8d6 0%,var(--gold) 55%,#c08a12 100%);-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 8px 0 #000) drop-shadow(0 0 40px rgba(255,215,90,.55))}
.s7-rings i{position:absolute;border-radius:50%;border:5px dashed rgba(255,215,90,.3);animation:spin 18s linear infinite}
.s7-rings i:nth-child(1){inset:0}
.s7-rings i:nth-child(2){inset:130px;animation-direction:reverse;animation-duration:11s;border-style:dotted;border-width:8px}
.s7-rings i:nth-child(3){inset:260px;animation-duration:7s}
.s7-row{display:flex;align-items:center;gap:22px;border-bottom:2px dashed rgba(255,215,90,.35);padding:6px 12px;height:84px}
.s7-row .k{font-size:40px;font-weight:900}
.s7-row .v{margin-left:auto;font-family:var(--f-impact);font-size:62px;color:var(--gold);text-shadow:0 0 26px rgba(255,215,90,.6);font-variant-numeric:tabular-nums;white-space:nowrap}
.s7-row .ck{font:700 22px var(--f-ui);color:#000;background:var(--gold);padding:4px 10px;letter-spacing:.12em;opacity:0}
.s7-final{font-family:var(--f-impact);font-size:172px;line-height:1.16;color:var(--ink);text-shadow:-6px 0 0 rgba(255,35,64,.85),6px 0 0 rgba(34,232,255,.85),0 0 70px rgba(255,255,255,.35)}
.s7-mis .jp{font-size:33px;font-weight:700}
.s7-mis .ui{font-size:22px;color:var(--dim);margin-top:10px;font-weight:600}
.s7-cred{font:600 20px var(--f-ui);color:var(--dim);letter-spacing:.06em}

/* hud */
#hud{position:absolute;left:0;right:0;bottom:0;height:80px;z-index:40;pointer-events:none;font:700 20px/1 var(--f-ui);letter-spacing:.12em;color:rgba(255,244,236,.75)}
#hud.off{display:none}
#hud .bar{position:absolute;left:0;right:0;bottom:0;height:6px;background:rgba(255,255,255,.08)}
#hud .fill{height:100%;width:0;background:linear-gradient(90deg,var(--red),var(--amber),var(--cyan),var(--mag),var(--gold))}
#hud .tk{position:absolute;bottom:0;width:3px;height:6px;background:#000}
#hud .lab,#hud .keys{position:absolute;bottom:24px;transition:opacity .35s;opacity:0}
#hud .lab{left:28px}
#hud .keys{right:28px}

#hud.show .lab,#hud.show .keys{opacity:1}

#paused div{font:400 130px/1 var(--f-impact);letter-spacing:.06em;color:var(--ink);text-shadow:-5px 0 0 rgba(255,35,64,.85),5px 0 0 rgba(34,232,255,.85)}

#endc{position:absolute;right:40px;bottom:24px;z-index:44;text-align:right;pointer-events:none}
#endc b{display:block;font:400 64px/1 var(--f-impact);color:var(--gold)}
#endc span{font:700 20px var(--f-ui);letter-spacing:.14em;color:var(--dim)}
#boot{position:absolute;inset:0;display:grid;place-items:center;z-index:60;background:var(--void);font:700 30px var(--f-ui);letter-spacing:.3em;color:var(--dim)}
#boot span{animation:blink 1s steps(1) infinite}

<body>
<div id="frame">
  <div id="stage">
    <div id="shaker">
      <canvas id="bg" width="1920" height="1080"></canvas>
      <div id="ticker"></div>
      <div id="scenes"></div>
      <canvas id="fxc" width="1920" height="1080"></canvas>
    </div>
    <div id="fx"></div>
    <div id="noise"></div><div id="scan"></div><div id="vig"></div>
    <div id="hud"><div class="lab"></div><div class="keys"><b>SPACE</b>一時停止 / 再開<b>← →</b>シーン移動<b>1–8</b>ジャンプ<b>H</b>表示を隠す<b>F</b>全画面</div><div class="bar"><div class="fill"></div></div></div>
    <div id="paused" hidden><div>PAUSED</div><p>SPACE またはクリックで再開</p></div>
    <div id="endc" hidden><b>END</b><span>R でもう一度 ・ ← で前のシーン</span></div>
    <div id="boot"><span>LOADING FORM S-1…</span></div>
  </div>
</div>
<script>
(()=>{
'use strict';
const qs=new URLSearchParams(location.search);
const RATE=Math.min(8,Math.max(.25,parseFloat(qs.get('rate'))||1));
const START=Math.max(0,parseInt(qs.get('scene'),10)||0);
const RM=matchMedia('(prefers-reduced-motion: reduce)').matches;
const W=1920,H=1080,S=1000;
const $=id=>document.getElementById(id);
const frameEl=$('frame'),stage=$('stage'),shaker=$('shaker'),holder=$('scenes'),fxRoot=$('fx'),hud=$('hud');
const C={void:'#06050c',ink:'#fff4ec',red:'#ff2340',amber:'#ffb21a',cyan:'#22e8ff',mag:'#ff2fd0',gold:'#ffd75a',dim:'#a39cc4'};
const RGB={red:[255,35,64],amber:[255,178,26],cyan:[34,232,255],mag:[255,47,208],gold:[255,215,90],ink:[255,244,236],violet:[140,90,255]};

/* ---------- stage fit ---------- */
function fit(){const s=Math.min(innerWidth/W,innerHeight/H);stage.style.transform=`translate(-50%,-50%) scale(${s})`;}
addEventListener('resize',fit);fit();

/* ---------- engine: one pausable clock drives cues, tweens and the canvases ---------- */
const E={i:0,t:0,cue:0,playing:false,ended:false,booted:false,tweens:[],timers:[],held:[],ctx:null,root:null,wall:0};
const unitless=new Set(['opacity','zIndex','lineHeight','fontWeight','flex','order']);
function el(parent,cls,html,css){
  const e=document.createElement('div');
  if(cls)e.className=cls;
  if(html!=null)e.innerHTML=html;
  if(css)for(const k in css){const v=css[k];e.style[k]=(typeof v==='number'&&!unitless.has(k))?v+'px':v;}
  parent.appendChild(e);return e;
}
function A(t,kf,o){
  if(typeof o==='number')o={duration:o};
  o=Object.assign({fill:'both',easing:'cubic-bezier(.16,1,.3,1)'},o);
  const a=t.animate(kf,o);a.playbackRate=RATE;
  if(!E.playing&&!E.ended){a.pause();E.held.push(a);}
  return a;
}
const lin=p=>p,outC=p=>1-Math.pow(1-p,3),inC=p=>p*p*p,inOut=p=>p<.5?4*p*p*p:1-Math.pow(-2*p+2,3)/2;
function tween(dur,fn,ease=outC,delay=0){E.tweens.push({t0:E.t+delay,dur:Math.max(dur,1e-4),fn,ease});}
function at(delay,fn){E.timers.push({t:E.t+delay,fn});}
function type(e,str,dur,delay=0){tween(dur,p=>{e.textContent=str.slice(0,Math.ceil(str.length*p));},lin,delay);}
function count(e,a,b,dur,o={}){const fmt=o.fmt||(v=>String(Math.round(v)));let prev=null;tween(dur,p=>{const s=fmt(a+(b-a)*p);if(s!==prev){e.textContent=s;prev=s;}},o.ease||outC,o.delay||0);}
const rand=(a,b)=>a+Math.random()*(b-a);

/* ---------- motion helpers (seconds) ---------- */
function pop(e,d=0,dur=.42,from=.4){return A(e,[{opacity:0,transform:`scale(${from})`},{opacity:1,transform:'scale(1.06)',offset:.65},{opacity:1,transform:'scale(1)'}],{duration:dur*S,delay:d*S,easing:'cubic-bezier(.2,.9,.3,1)'});}
function slam(e,d=0,from=2.6,dur=.3){return A(e,[{opacity:0,transform:`scale(${from})`,filter:'blur(14px)'},{opacity:1,transform:'scale(1)',filter:'blur(0px)'}],{duration:dur*S,delay:d*S,easing:'cubic-bezier(.25,1.4,.5,1)'});}
function inX(e,dx,d=0,dur=.38){return A(e,[{opacity:0,transform:`translateX(${dx}px)`},{opacity:1,transform:'translateX(0px)'}],{duration:dur*S,delay:d*S});}
function inY(e,dy,d=0,dur=.38){return A(e,[{opacity:0,transform:`translateY(${dy}px)`},{opacity:1,transform:'translateY(0px)'}],{duration:dur*S,delay:d*S});}
function fadeIn(e,d=0,dur=.4){return A(e,[{opacity:0},{opacity:1}],{duration:dur*S,delay:d*S,easing:'ease-out'});}
function out(e,d=0,dur=.18,kf){return A(e,kf||[{opacity:0,transform:'scale(.92)'}],{duration:dur*S,delay:d*S,fill:'forwards',easing:'ease-in'});}
function beat(e,amt=.03,dur=.32){A(e,[{transform:'scale(1)'},{transform:`scale(${1+amt})`,offset:.3},{transform:'scale(1)'}],{duration:dur*S,fill:'none',easing:'ease-out'});}
function glitchEl(e,dur=.3){A(e,[{transform:'translate(-18px,6px) skewX(10deg)',filter:'hue-rotate(90deg) saturate(2)'},{transform:'translate(14px,-4px) skewX(-6deg)',filter:'hue-rotate(-60deg)'},{transform:'translate(-8px,2px)',filter:'none'},{transform:'translate(6px,0) skewX(4deg)',filter:'none'},{transform:'none',filter:'none'}],{duration:dur*S,easing:'steps(5,end)',fill:'none'});}

/* ---------- screen-level effects ---------- */
function flash(color='#fff',dur=.32,peak=1,delay=0){
  const d=el(fxRoot,'fxl',null,{background:color,opacity:0});
  A(d,[{opacity:peak*(RM?.25:1)},{opacity:0}],{duration:dur*S,delay:delay*S,easing:'cubic-bezier(.2,.6,.3,1)',fill:'forwards'}).onfinish=()=>d.remove();
}
function shake(amp=20,dur=.4){
  if(RM)return;
  const k=[],n=10;
  for(let i=0;i<n;i++){const f=1-i/n;k.push({transform:`translate(${rand(-1,1)*amp*f}px,${rand(-1,1)*amp*f}px) rotate(${rand(-1,1)*amp*.025*f}deg)`});}
  k.push({transform:'none'});
  A(shaker,k,{duration:dur*S,easing:'linear',fill:'none'});
}
function glitchBars(n=14,dur=.36){
  const wrap=el(fxRoot,'fxl');
  const cols=[C.red,C.cyan,C.ink,C.mag,'#000'];
  for(let i=0;i<n;i++){
    const b=el(wrap,null,null,{position:'absolute',left:0,top:rand(0,H),width:W,height:rand(8,80),background:cols[i%5],opacity:0});
    A(b,[{opacity:.9,transform:`translateX(${rand(-400,400)}px)`},{opacity:0,transform:`translateX(${rand(-400,400)}px)`}],{duration:dur*S*rand(.5,1),delay:rand(0,dur*S*.4),easing:'steps(3,end)',fill:'forwards'});
  }
  A(wrap,[{opacity:1},{opacity:1}],{duration:dur*S*1.6,fill:'none'}).onfinish=()=>wrap.remove();
}
function wipeTape(dur=1){
  const p=el(fxRoot,'fxl wipe');
  A(p,[{transform:'translateX(-115%) skewX(-12deg)'},{transform:'translateX(0%) skewX(-12deg)',offset:.4},{transform:'translateX(0%) skewX(-12deg)',offset:.6},{transform:'translateX(115%) skewX(-12deg)'}],{duration:dur*S,easing:'cubic-bezier(.6,0,.4,1)',fill:'forwards'}).onfinish=()=>p.remove();
}
function cutin(R,html,o={}){
  const b=el(R,'abs cutin',`<div class="${o.cls||'imp'}">${html}</div>`,{left:-200,width:W+400,top:o.top??380,height:o.h??260,background:o.bg||C.red,color:o.fg||C.ink,rotate:(o.rot??-8)+'deg',fontSize:o.size??180});
  A(b,[{transform:'translateX(110%)'},{transform:'translateX(0%)',offset:.22},{transform:'translateX(-3%)',offset:.82},{transform:'translateX(-110%)'}],{duration:((o.hold??.4)+.5)*S,easing:'cubic-bezier(.3,.8,.4,1)',fill:'forwards'}).onfinish=()=>b.remove();
  return b;
}
function stamp(R,html,o={}){
  const s=el(R,'abs stamp '+(o.cls||'imp'),html,{left:o.x??960,top:o.y??540,fontSize:o.size??140,color:o.color||C.red,rotate:(o.rot??-10)+'deg',translate:'-50% -50%'});
  A(s,[{opacity:0,transform:'scale(3)',filter:'blur(12px)'},{opacity:1,transform:'scale(1)',filter:'blur(0px)'}],{duration:220,easing:'cubic-bezier(.3,1.6,.5,1)'});
  return s;
}
function edgePulse(R,color,period=.4){
  const e=el(R,'abs',null,{inset:0,pointerEvents:'none',zIndex:3});
  A(e,[{boxShadow:`inset 0 0 160px 40px ${color}`},{boxShadow:'inset 0 0 40px 0px rgba(0,0,0,0)'}],{duration:period*S,iterations:Infinity,direction:'alternate',easing:'ease-in-out',fill:'none'});
  return e;
}
function tame(R,dur=.3,op=.75){
  const d=el(R,'abs',null,{inset:0,background:'#000',opacity:0,zIndex:8});
  A(d,[{opacity:0},{opacity:op,offset:.2},{opacity:op,offset:.8},{opacity:0}],{duration:dur*S,fill:'forwards'}).onfinish=()=>d.remove();
}

/* ---------- spark canvas ---------- */
const fxc=$('fxc').getContext('2d');
const sparks=[],rings=[];
function burst(x,y,o={}){
  const n=Math.round((o.n||80)*(RM?.4:1)),cols=o.colors||[C.ink,C.amber,C.red],sp=o.speed||900;
  for(let i=0;i<n;i++){const a=Math.random()*Math.PI*2,v=sp*rand(.25,1.15);sparks.push({x,y,vx:Math.cos(a)*v,vy:Math.sin(a)*v,life:0,max:rand(.45,1.3),c:cols[i%cols.length],w:(o.size||4)*rand(.5,1.4),g:o.g??700});}
  if(o.ring!==false)rings.push({x,y,r:10,vr:o.ringSpeed||2800,life:0,max:.55,c:o.ringColor||cols[0],w:o.ringW||16});
}
function fxDraw(dt){
  const g=fxc;g.clearRect(0,0,W,H);g.globalCompositeOperation='lighter';
  const k=Math.pow(.15,dt);
  for(let i=sparks.length-1;i>=0;i--){
    const s=sparks[i];s.life+=dt;if(s.life>s.max){sparks.splice(i,1);continue;}
    s.vx*=k;s.vy=s.vy*k+s.g*dt;s.x+=s.vx*dt;s.y+=s.vy*dt;
    g.globalAlpha=1-s.life/s.max;g.strokeStyle=s.c;g.lineWidth=s.w;
    g.beginPath();g.moveTo(s.x-s.vx*.035,s.y-s.vy*.035);g.lineTo(s.x,s.y);g.stroke();
  }
  for(let i=rings.length-1;i>=0;i--){
    const r=rings[i];r.life+=dt;if(r.life>r.max){rings.splice(i,1);continue;}
    r.r+=r.vr*dt*(1-r.life/r.max);
    g.globalAlpha=(1-r.life/r.max)*.8;g.strokeStyle=r.c;g.lineWidth=r.w*(1-r.life/r.max)+1;
    g.beginPath();g.arc(r.x,r.y,r.r,0,Math.PI*2);g.stroke();
  }
  g.globalAlpha=1;g.globalCompositeOperation='source-over';
}

/* ---------- background canvas ---------- */
const bgx=$('bg').getContext('2d');
const BG={acc:RGB.red,acc2:RGB.violet,glow:.3,grid:0,ring:0,embers:20,rad:0,speed:0,t:0};
const BGC={glow:.3,grid:0,ring:0,embers:20,acc:[...RGB.red],acc2:[...RGB.violet]};
const EMB=[];for(let i=0;i<160;i++)EMB.push({x:Math.random()*W,y:Math.random()*H,v:rand(30,120),s:rand(1,3.4),p:rand(0,6.28)});
function bgSet(o){Object.assign(BG,o);}
let seed=1;const rnd=()=>(seed=(seed*16807)%2147483647)/2147483647;
const lerp=(a,b,k)=>a+(b-a)*k;
function bgDraw(dt){
  BG.t+=dt;const t=BG.t,k=1-Math.pow(.03,dt),g=bgx;
  for(const key of ['glow','grid','ring','embers'])BGC[key]=lerp(BGC[key],BG[key],k);
  for(let j=0;j<3;j++){BGC.acc[j]=lerp(BGC.acc[j],BG.acc[j],k);BGC.acc2[j]=lerp(BGC.acc2[j],BG.acc2[j],k);}
  const a1=BGC.acc.map(Math.round).join(','),a2=BGC.acc2.map(Math.round).join(',');
  g.globalCompositeOperation='source-over';g.globalAlpha=1;g.fillStyle=C.void;g.fillRect(0,0,W,H);
  let gr=g.createRadialGradient(560+Math.sin(t*.4)*220,380,0,560,380,1100);
  gr.addColorStop(0,`rgba(${a1},${.34*BGC.glow})`);gr.addColorStop(1,'rgba(0,0,0,0)');g.fillStyle=gr;g.fillRect(0,0,W,H);
  gr=g.createRadialGradient(1380+Math.cos(t*.3)*200,760,0,1380,760,1000);
  gr.addColorStop(0,`rgba(${a2},${.28*BGC.glow})`);gr.addColorStop(1,'rgba(0,0,0,0)');g.fillStyle=gr;g.fillRect(0,0,W,H);
  if(BGC.grid>.005){
    g.fillStyle=`rgba(${a1},${BGC.grid})`;const sp=48,ox=(t*26)%sp,oy=(t*13)%sp;
    for(let x=-sp+ox;x<W;x+=sp)for(let y=-sp+oy;y<H;y+=sp)g.fillRect(x,y,3,3);
  }
  if(BGC.ring>.01){
    g.save();g.translate(960,540);g.lineWidth=3;
    [[330,.6,[6,22]],[470,-.4,[40,30]],[620,.25,[2,14]]].forEach(([r,sp,dash],i)=>{
      g.strokeStyle=`rgba(${i%2?a2:a1},${.5*BGC.ring})`;g.setLineDash(dash);g.lineDashOffset=t*sp*120;
      g.beginPath();g.arc(0,0,r,0,Math.PI*2);g.stroke();
    });
    g.setLineDash([]);g.restore();
  }
  seed=Math.floor(t*24)+7;
  if(BG.rad>0){
    BG.rad=Math.max(0,BG.rad-dt);const it=Math.min(1,BG.rad/.4);
    g.save();g.translate(960,540);g.globalAlpha=.5*it;g.fillStyle='#fff';
    for(let i=0;i<120;i++){const an=rnd()*Math.PI*2,r0=200+rnd()*300,w=(2+rnd()*10)/1000;g.beginPath();g.moveTo(Math.cos(an)*r0,Math.sin(an)*r0);g.lineTo(Math.cos(an-w)*1500,Math.sin(an-w)*1500);g.lineTo(Math.cos(an+w)*1500,Math.sin(an+w)*1500);g.fill();}
    g.restore();g.globalAlpha=1;
  }
  if(BG.speed>0){
    BG.speed=Math.max(0,BG.speed-dt);const it=Math.min(1,BG.speed/.3);
    g.globalAlpha=.55*it;g.fillStyle=`rgb(${a1})`;
    for(let i=0;i<46;i++){const y=rnd()*H,len=300+rnd()*900,x=rnd()*(W+len)-len;g.fillRect(x,y,len,1+rnd()*4);}
    g.globalAlpha=1;
  }
  const n=Math.round(BGC.embers);g.globalCompositeOperation='lighter';g.fillStyle=`rgb(${a1})`;
  for(let i=0;i<n&&i<EMB.length;i++){
    const e=EMB[i];e.y-=e.v*dt;e.x+=Math.sin(t*.8+e.p)*14*dt;if(e.y<-10){e.y=H+10;e.x=Math.random()*W;}
    g.globalAlpha=.3+.3*Math.sin(t*2+e.p);g.beginPath();g.arc(e.x,e.y,e.s,0,Math.PI*2);g.fill();
  }
  g.globalAlpha=1;g.globalCompositeOperation='source-over';
}

/* ---------- noise texture + ticker of the filing's own sentences ---------- */
(()=>{const c=document.createElement('canvas');c.width=c.height=256;const x=c.getContext('2d');const d=x.createImageData(256,256);for(let i=0;i<d.data.length;i+=4){const v=Math.random()*255|0;d.data[i]=d.data[i+1]=d.data[i+2]=v;d.data[i+3]=255;}x.putImageData(d,0,0);$('noise').style.backgroundImage=`url(${c.toDataURL()})`;})();
const S1=[
  'Concerns have been raised both within our organization and by other researchers, regulators, policymakers, and industry participants that sufficiently advanced AI systems could, if not developed, deployed, and operated with appropriate safeguards, oversight, and security measures, pose catastrophic or existential risks to humanity,',
  'particularly if such systems were misused, replicated, weaponized, or allowed to operate with a high degree of autonomy.',
  'We have observed that our models are contributing to the pace of our own research and these risks will increase as AI systems substantially automate AI research and development',
  'if, for example, they accelerate AI progress beyond our ability to evaluate and safeguard new models, which could adversely affect our business, financial condition, and results of operations.',
  'a wide range of stakeholders, including researchers and policymakers, have raised concerns that sufficiently advanced AI systems could pose catastrophic or existential risks to society if not developed and deployed responsibly.',
  'Our safety-focused approach is designed in part to mitigate such risks, but there can be no assurance that our efforts will be successful or that the broader AI industry will adopt similar safeguards.',
  'unexpected strategic or self-preserving behaviors, including attempts to resist shutdown, conceal or manipulate information, or generate outputs that could be interpreted as coercive, deceptive, or manipulative,',
  'recurring narratives concerning the potential adverse societal impacts of AI, including that AI may displace or eliminate jobs, may be misused or otherwise cause harm, and may pose catastrophic or existential risks to humanity.',
];
const tk=$('ticker');
S1.forEach((s,i)=>{const r=el(tk,'row',`<span>${s}</span><span>${s}</span>`,{top:22+i*134});r.style.animationDuration=(70+i*11)+'s';if(i%2)r.style.animationDirection='reverse';});
function tick(op,color){A(tk,[{opacity:op}],{duration:400,fill:'forwards',easing:'linear'});if(color)tk.style.color=color;}

/* ---------- scene data ---------- */
const pg=v=>'p.'+String(Math.round(v)).padStart(3,'0');
const STEPS=['不可能なタスクを中止できず','見つけたパスワードで','管理者権限を取得','追加の認証情報を収集','システム設定を変更','1人分の個人情報を閲覧'];
const BIG=['不可能なタスクを<br>中止できず','見つけた<br>パスワードを使って',null,'追加の認証情報を<br>収集','システム設定を<br>変更','1人分の<br>個人情報を閲覧'];
const ROUNDS=[
  {t:'最新モデル Mythos を、<br>いきなり一般公開しなかった',d:'2026年4月。サイバー脆弱性を見つける能力が高いため、まず Project Glasswing を通じた限定的なリサーチプレビューとして、一部の組織だけに提供した。',s:'FORM S-1 p.52'},
  {t:'新しいフロンティアモデルの<br>事前学習を、1ヶ月以上遅らせた',d:'モデルの重みの持ち出しを防ぐなど、セキュリティ対策を強化する時間をとるため。',s:'FORM S-1 p.52'},
  {t:'責任あるスケーリング方針<br>（Responsible Scaling Policy）',d:'AIの破滅的リスクへの向き合い方を定めた方針。リリース前に各モデルを徹底的にテストし、リスク報告を定期的に公開する。',chip:'Claude の憲法：取り返しのつかない行動を避け、AIに対する人間の監督を支える',s:'FORM S-1 p.231–232'},
];
const TYPED='existential> 第三者パートナーが作ったサイバーセキュリティ評価> モデルへの指示：「インターネット接続はない」> 実際：設定ミスでネットにつながっていた"We have observed that our models are contributing to the pace of our own research."能力が上がるほど、評価や監視をかいくぐるのが上手くなっている"there can be no assurance that our efforts will be successful"0123456789×〜';

function hit(c,i){
  const card=c.cards[i];
  cutin(c.R,['HIT!','HIT!!','HIT!!!'][i],{bg:i<2?C.amber:C.red,fg:i<2?'#000':C.ink,top:360,h:300,size:240,hold:.28+i*.08,rot:-7});
  A(card,[{opacity:0,transform:'translateX(-420px) skewX(-14deg)'},{opacity:1,transform:'none'}],{duration:300,delay:300});
  at(.32,()=>burst(670,373+i*168,{n:60+i*60,colors:[C.amber,C.ink,C.gold],speed:900+i*300}));
  c.cv.textContent=String(i+1);
  if(i===0)pop(c.combo,.3,.35,.5);else A(c.combo,[{transform:'scale(1.35)'},{transform:'scale(1)'}],{duration:320,delay:300,fill:'none'});
  flash(i<2?C.amber:'#fff',.3+i*.06,.45+i*.2);
  shake(14+i*10,.35+i*.1);
  A(c.num,[{color:C.red,transform:'scale(1.15)'},{color:C.ink,transform:'scale(1)'}],{duration:400,fill:'none'});
}
function sweepOn(c,ms=420){sweepOff(c);c.beam.style.visibility='visible';c.sweep=A(c.beam,[{transform:'translateY(110px)'},{transform:'translateY(1030px)'}],{duration:ms,iterations:Infinity,easing:'linear',fill:'none'});BG.speed=Math.max(BG.speed,.9);}
function sweepOff(c){if(c.sweep){c.sweep.cancel();c.sweep=null;}c.beam.style.visibility='hidden';}
function crawl(c,v){c.num.textContent=pg(v);A(c.num,[{transform:'scale(1.22)',color:C.red},{transform:'scale(1)',color:C.ink}],{duration:300,fill:'none'});beat(c.R,.015,.3);shake(6,.15);}
function cut(c,i){c.panels.forEach((p,k)=>{p.style.visibility=k===i?'visible':'hidden';});}
function unlock(c,i){
  const r=c.rowsEl[i];
  A(r,[{opacity:0,transform:'translateX(140px)'},{opacity:1,transform:'none'}],{duration:240});
  const sw=el(r,'sweep');A(sw,[{transform:'translateX(-100%)',opacity:.9},{transform:'translateX(100%)',opacity:0}],{duration:420,fill:'forwards'}).onfinish=()=>sw.remove();
  A(r.querySelector('.nw'),[{opacity:1},{opacity:.15},{opacity:1}],{duration:280,iterations:3,fill:'none'});
  flash(C.ink,.14,.12);shake(6,.16);
  burst(1700,292+i*72,{n:36,colors:[C.gold,C.ink],speed:650,ring:false});

}
function bump(c,amt){c.fills.forEach((f,k)=>{const a=c.lvl[k],b=Math.min(97,a+amt+k);c.lvl[k]=b;tween(.3,p=>{f.style.width=(a+(b-a)*p)+'%';},outC);});}
function chain(c,i){
  c.chipEls[i].classList.add('on');pop(c.chipEls[i],0,.25,1.3);
  if(i===2){
    out(c.step,0,.06);slam(c.admin,0,3,.26);
    A(stage,[{filter:'invert(1)'},{filter:'invert(0)'}],{duration:260,easing:'steps(2,end)',fill:'none'});
    shake(36,.6);burst(960,420,{n:200,colors:[C.red,C.ink,C.amber],speed:1600});BG.rad=1;
    return;
  }
  if(i===3)out(c.admin,0,.1);
  c.step.innerHTML=BIG[i];
  A(c.step,[{opacity:0,transform:'translateX(280px) skewX(-14deg)'},{opacity:1,transform:'none'}],{duration:220});

}

}
function step(){
  const sc=SCENES[E.i];
  while(E.cue<sc.cues.length&&sc.cues[E.cue][0]<=E.t)sc.cues[E.cue++][1](E.ctx);
  if(E.timers.length){const due=E.timers.filter(x=>x.t<=E.t);E.timers=E.timers.filter(x=>x.t>E.t);due.forEach(x=>x.fn());}
  if(E.tweens.length){const cur=E.tweens;E.tweens=[];const keep=cur.filter(tw=>{if(E.t<tw.t0)return true;const p=Math.min(1,(E.t-tw.t0)/tw.dur);tw.fn(tw.ease(p));return p<1;});E.tweens=keep.concat(E.tweens);}
  if(E.t>=sc.dur){if(E.i<SCENES.length-1)go(E.i+1,true);else finish();}
}
function finish(){E.ended=true;E.playing=false;endEl.hidden=false;fadeIn(endEl,0,.6);}
function setPlaying(p){
  if(p===E.playing)return;
  if(p&&E.ended)go(0,false);
  E.playing=p;
  if(p){E.held.forEach(a=>{try{a.play();}catch(e){}});E.held=[];}
  else{E.held=document.getAnimations().filter(a=>a.playState==='running');E.held.forEach(a=>a.pause());}
  pausedEl.hidden=p;
}
function nav(i){const wasEnded=E.ended;go(i,false);if(wasEnded)setPlaying(true);}
function next(){if(E.i<SCENES.length-1)nav(E.i+1);else if(!E.ended)finish();}
function prev(){nav(E.t>1.2&&!E.ended?E.i:E.i-1);}
function restart(){go(0,false);if(!E.playing)setPlaying(true);}
function toggleFS(){try{if(!document.fullscreenElement){const r=frameEl.requestFullscreen&&frameEl.requestFullscreen();if(r&&r.catch)r.catch(()=>{});}else{const r=document.exitFullscreen&&document.exitFullscreen();if(r&&r.catch)r.catch(()=>{});}}catch(e){}}

addEventListener('keydown',e=>{
  if(!E.booted||e.metaKey||e.ctrlKey||e.altKey)return;
  const k=e.key;
  if(k===' '||k==='k'||k==='K'){e.preventDefault();if(E.ended)restart();else setPlaying(!E.playing);}
  else if(k==='ArrowRight'||k==='l'||k==='L'||k==='PageDown'){e.preventDefault();next();}
  else if(k==='ArrowLeft'||k==='j'||k==='J'||k==='PageUp'){e.preventDefault();prev();}
  else if(k==='r'||k==='R'||k==='Home'){e.preventDefault();restart();}
  else if(k==='h'||k==='H'){hud.classList.toggle('off');}
  else if(k==='f'||k==='F'){toggleFS();}
  else if(/^[1-9]$/.test(k)&&+k<=SCENES.length){nav(+k-1);}
});
frameEl.addEventListener('click',e=>{
  if(!E.booted)return;
  const r=stage.getBoundingClientRect(),x=(e.clientX-r.left)/r.width;
  if(x<.2)prev();else if(x>.8)next();else if(E.ended)restart();else setPlaying(!E.playing);
});

let last=performance.now();
function frame(now){
  const dt=Math.min(.25,(now-last)/1000);last=now;
  const live=E.playing||E.ended;
  if(E.playing){E.t+=dt*RATE;E.wall+=dt;step();}
  bgDraw(live?dt*RATE:0);fxDraw(live?dt*RATE:0);
  hudFill.style.width=((OFF[E.i]+Math.min(E.t,SCENES[E.i].dur))/TOTAL*100)+'%';
  hud.classList.toggle('show',!E.playing||E.wall<4);
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);

(async function boot(){
  const warm=el(stage,'scene',null,{opacity:0,pointerEvents:'none'});
  SCENES.forEach(s=>s.build(el(warm,'scene')));
  const txt=warm.textContent+TYPED+tk.textContent.slice(0,400);
  const faces=['400 40px "Dela Gothic One"','900 40px "Zen Kaku Gothic New"','700 40px "Zen Kaku Gothic New"','500 40px "Zen Kaku Gothic New"','400 40px "DotGothic16"','700 40px "Chakra Petch"','600 40px "Chakra Petch"'];
  try{await Promise.race([Promise.all(faces.map(f=>document.fonts.load(f,txt))),new Promise(r=>setTimeout(r,4000))]);}catch(e){}
  warm.remove();$('boot').remove();
  E.booted=true;go(START,false);setPlaying(true);
})();
})();
</script>
