<style>
/* Layout: fixed 1920x1080 stage scaled to fit and letterboxed on black; depth = bg canvas (voice waveform etc.) / slide DOM / fx canvas, framed by a game HUD */
:root{
  --ink:#06050a; --paper:#f5f7ff; --dim:#8f96b3;
  --hot:#ff2d6f; --cyan:#19e8ff; --gold:#ffd23f; --lime:#a6ff3a; --red:#ff3131; --violet:#8b5cff;
  --f-disp:"Dela Gothic One","Noto Sans JP","Hiragino Kaku Gothic ProN","Yu Gothic",sans-serif;
  --f-body:"Noto Sans JP","Hiragino Kaku Gothic ProN","Yu Gothic","Meiryo",sans-serif;
  --f-hud:"Chakra Petch","Noto Sans JP",ui-monospace,monospace;
  color-scheme:dark;
}
html,body{height:100%;margin:0;background:#000;overflow:hidden}
body{color:var(--paper);font-family:var(--f-body);-webkit-font-smoothing:antialiased}
#viewport{position:fixed;inset:0;overflow:hidden;background:#000;user-select:none;-webkit-user-select:none}
#viewport.idle{cursor:none}
#stage{position:absolute;left:50%;top:50%;width:1920px;height:1080px;margin:-540px 0 0 -960px;transform-origin:50% 50%;overflow:hidden;background:var(--ink)}
#cam{position:absolute;inset:0;transform-origin:50% 50%}
#bg{position:absolute;inset:0;width:100%;height:100%}
#layer,#out{position:absolute;inset:0}
#fx{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
#overlay{position:absolute;inset:0;pointer-events:none;background:repeating-linear-gradient(0deg,rgba(0,0,0,.16) 0 2px,transparent 2px 4px),radial-gradient(ellipse at center,transparent 58%,rgba(0,0,0,.6) 100%)}
#noise{position:absolute;inset:-100px;pointer-events:none;opacity:.07;background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='220' height='220'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.85' numOctaves='2' stitchTiles='stitch'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>");animation:noise .5s steps(5) infinite}
@keyframes noise{0%{transform:translate(0,0)}20%{transform:translate(-40px,20px)}40%{transform:translate(30px,-50px)}60%{transform:translate(-60px,-10px)}80%{transform:translate(20px,40px)}100%{transform:translate(0,0)}}
#flash{position:absolute;inset:0;pointer-events:none}
.flash{position:absolute;inset:0}

/* ---------- typography primitives ---------- */
.slide{position:absolute;inset:0;overflow:hidden}
.full{position:absolute;inset:0}
.pos{position:absolute;white-space:nowrap}
.disp{font-family:var(--f-disp);font-weight:900;font-synthesis:none;line-height:1.04;letter-spacing:-.01em}
.jp{font-family:var(--f-body);font-weight:900;line-height:1.3}
.hudf{font-family:var(--f-hud);font-weight:700;letter-spacing:.16em}
.tabnum{font-variant-numeric:tabular-nums}
.ch{display:inline-block;white-space:pre}
.rgb{text-shadow:-.03em 0 rgba(255,30,100,.95),.03em 0 rgba(20,230,255,.95),0 0 .12em rgba(255,255,255,.35)}
.goldx{color:#fff4b8;text-shadow:0 .015em 0 #ffb300,0 .03em 0 #e08a00,0 .045em 0 #b86400,0 .06em 0 #7a3f00,0 .075em 0 #3d1f00,0 0 .2em rgba(255,190,40,.8),0 0 .5em rgba(255,110,0,.5)}
.hotx{color:#fff;text-shadow:0 .025em 0 #ff2d6f,0 .05em 0 #b3004a,0 .075em 0 #5c0026,0 0 .25em rgba(255,45,111,.85)}
.kyk{color:#fff;text-shadow:0 .02em 0 #ff3131,0 .04em 0 #b00010,0 .06em 0 #5c0008,0 0 .2em rgba(255,49,49,.9),0 0 .5em rgba(255,0,0,.45)}
.stroke-g{color:transparent;-webkit-text-stroke:10px var(--gold);filter:drop-shadow(0 0 30px rgba(255,210,63,.6))}
.cap{background:#ffe600;color:#0a0a0a;padding:.06em .4em .12em;box-shadow:.12em .12em 0 #000;font-family:var(--f-body);font-weight:900}
.chip{display:inline-block;font:700 26px/1 var(--f-hud);letter-spacing:.2em;padding:12px 18px 10px;border:3px solid currentColor}
.hdr{display:flex;align-items:center;gap:30px}
.h1{font-size:70px;color:#fff;line-height:1.1}
.hsub{font-size:27px;color:var(--dim);font-weight:700;margin-top:6px}
.cur{color:var(--hot);animation:blink .5s steps(1) infinite}
@keyframes blink{50%{opacity:0}}
.halftone{background-image:radial-gradient(rgba(0,0,0,.2) 22%,transparent 24%);background-size:22px 22px}

/* ---------- hook / opening ---------- */
.bub{position:relative;font:900 40px/1.2 var(--f-body);color:#07060d;background:#fff;padding:14px 28px 16px;border-radius:44px;box-shadow:0 0 0 5px #07060d,0 0 36px rgba(25,232,255,.55)}
.bub::after{content:"";position:absolute;left:46px;bottom:-24px;border-left:16px solid transparent;border-right:16px solid transparent;border-top:26px solid #fff}
.bub.r::after{left:auto;right:46px}
.bub small{display:block;font:700 18px/1 var(--f-hud);letter-spacing:.24em;color:var(--hot);margin-bottom:6px}
.slash{width:2700px;height:190px;background:#07060d;border-block:8px solid var(--hot);display:flex;align-items:center;justify-content:center;gap:48px;font:900 96px/1 var(--f-disp);font-synthesis:none;color:#fff;transform:rotate(-7deg)}
.slash b{color:var(--hot);font-family:var(--f-hud);font-size:80px}
.sweep{color:transparent;background:linear-gradient(100deg,transparent 42%,rgba(255,255,255,.95) 50%,transparent 58%) no-repeat;background-size:300% 100%;-webkit-background-clip:text;background-clip:text}
.chap{display:flex;gap:22px}
.chap span{font:900 34px/1 var(--f-body);padding:14px 22px;color:#07060d}
.chap i{font:700 22px var(--f-hud);font-style:normal;margin-right:10px;letter-spacing:.1em}
.chip-w{display:inline-block;background:#fff;color:#07060d;padding:4px 16px;margin-right:14px}
.wvb{display:flex;align-items:center;gap:10px;height:700px}
.wvb i{width:16px;border-radius:8px;background:rgba(25,232,255,.38);animation:wvb .45s ease-in-out infinite alternate}
@keyframes wvb{from{height:40px}to{height:640px}}

/* ---------- versus ---------- */
.vsL{background:linear-gradient(160deg,#ff2d6f,#6d0030 70%);clip-path:polygon(0 0,58% 0,42% 100%,0 100%)}
.vsR{background:linear-gradient(200deg,#19e8ff,#063a5c 70%);clip-path:polygon(58% 0,100% 0,100% 100%,42% 100%)}
.who{white-space:normal;width:700px}
.who.r{text-align:right}
.who .role{display:inline-block;font:900 44px/1 var(--f-body);background:#07060d;color:#fff;padding:12px 24px 14px}
.who .nm{font:900 130px/1.02 var(--f-disp);font-synthesis:none;color:#fff;margin:24px 0 18px;text-shadow:0 8px 0 rgba(0,0,0,.35)}
.who .nm small{display:block;font:700 44px/1.2 var(--f-hud);letter-spacing:.1em;margin-top:8px}
.who .ds{font:900 36px/1.5 var(--f-body);color:#fff}
.who .ds b{background:#07060d;padding:2px 12px}
.vs{color:#fff;-webkit-text-stroke:8px #07060d;text-shadow:0 0 50px var(--gold),0 0 100px rgba(255,210,63,.6)}
.unk{background:#07060d;border:4px dashed rgba(255,255,255,.75);padding:16px 40px 18px;text-align:center;white-space:normal;box-shadow:0 0 0 10px rgba(7,6,13,.6)}
.unk b{display:block;font:900 60px/1 var(--f-disp);font-synthesis:none;color:#fff;letter-spacing:.1em}
.unk span{display:block;font:900 32px/1.4 var(--f-body);color:#fff;margin-top:10px}
.unk small{display:block;font:700 24px/1.4 var(--f-body);color:#c9cfe6}
.bandw>div{transform:rotate(-3deg)}
.band{width:2400px;padding:22px 0 26px;background:#07060d;border-block:6px solid var(--gold);display:flex;justify-content:center;align-items:center;gap:30px;font:900 56px/1 var(--f-body);color:#fff}
.band b{font:900 84px/1 var(--f-disp);color:var(--gold);font-synthesis:none}

/* ---------- status ---------- */
.panel{position:absolute;box-sizing:border-box;padding:30px 40px;display:flex;flex-direction:column;gap:6px;background:linear-gradient(180deg,rgba(14,22,40,.88),rgba(6,8,18,.92));border:2px solid rgba(25,232,255,.6);box-shadow:inset 0 0 0 1px rgba(25,232,255,.12),0 0 50px rgba(25,232,255,.16)}
.srow{display:grid;grid-template-columns:230px 1fr;align-items:center;gap:20px;min-height:150px;padding:6px 18px;box-sizing:border-box;border-left:4px solid rgba(25,232,255,.6);background:linear-gradient(90deg,rgba(25,232,255,.1),transparent 70%)}
.srow .lbl{font:900 36px var(--f-body);color:#9fb3d9}
.srow .val{font:900 96px/1 var(--f-disp);font-synthesis:none;color:#fff;display:flex;align-items:baseline;gap:14px}
.srow .val small{font:900 40px var(--f-body);color:#fff}
.srow .nt{font:700 25px/1.3 var(--f-body);color:#9fb3d9;margin-top:8px}
.meter{height:14px;background:rgba(255,255,255,.1);margin-top:12px;position:relative;overflow:hidden}
.meter i{position:absolute;inset:0;background:linear-gradient(90deg,var(--cyan),var(--gold));transform-origin:0 50%;transform:scaleX(0)}
.per{display:flex;align-items:center;gap:18px;font:900 50px/1 var(--f-disp);font-synthesis:none;color:#fff}
.per .ln{display:block;width:160px;height:10px;background:var(--gold);transform-origin:0 50%;box-shadow:0 0 16px var(--gold)}
.pr2{gap:22px;border-color:rgba(255,45,111,.7);box-shadow:inset 0 0 0 1px rgba(255,45,111,.12),0 0 50px rgba(255,45,111,.16)}
.rp-h{font:900 40px var(--f-body);color:var(--hot)}
.formula{display:flex;flex-wrap:wrap;gap:12px;align-items:center}
.formula span{font:900 38px/1 var(--f-body);padding:12px 18px;border:3px solid #fff;color:#fff}
.formula i{font:900 40px/1 var(--f-disp);font-style:normal;color:var(--gold)}
.formula span.v{background:var(--hot);border-color:var(--hot)}
.tags{display:flex;gap:12px;flex-wrap:wrap}
.tags span{font:900 30px/1 var(--f-body);background:#fff;color:#07060d;padding:10px 16px}
.wv{display:flex;align-items:center;gap:7px;height:100px}
.wv i{width:11px;border-radius:6px;background:var(--hot);animation:wv .5s ease-in-out infinite alternate}
@keyframes wv{from{height:10px}to{height:96px}}
.rp-n{font:900 38px/1.4 var(--f-body);color:#fff}
.rp-n b{color:var(--gold);font-size:52px}

/* ---------- comments ---------- */
.cm{position:absolute;left:1920px;white-space:nowrap;font:900 50px/1 var(--f-body);color:#fff;text-shadow:3px 3px 0 #000,-2px -2px 0 #000,0 0 14px rgba(0,0,0,.8);will-change:transform}
.cm.y{color:#ffe600}.cm.p{color:#ff8fb5}.cm.c{color:#8ff4ff}
.msgw{width:1500px;box-sizing:border-box;white-space:normal;background:rgba(6,10,40,.95);border:6px solid #fff;border-radius:18px;box-shadow:0 0 0 6px #07060d,0 0 0 10px rgba(255,255,255,.35),0 0 70px rgba(25,232,255,.35);padding:26px 46px 30px}
.msgw .mh{display:flex;justify-content:space-between;align-items:center;font:900 30px var(--f-body);color:var(--gold);border-bottom:2px solid rgba(255,255,255,.3);padding-bottom:14px;margin-bottom:18px}
.msgw .mh .hudf{font-size:22px;color:var(--cyan)}
.msgw p{margin:0;font:900 48px/1.55 var(--f-body);color:#fff;min-height:225px}

/* ---------- mission ---------- */
.mc{width:500px;height:500px;box-sizing:border-box;padding:30px 36px;display:flex;flex-direction:column;gap:10px;white-space:normal;background:linear-gradient(180deg,rgba(10,14,30,.94),rgba(4,6,14,.96));border:4px solid var(--c);box-shadow:0 0 0 2px #07060d,0 0 40px -6px var(--c)}
.mc .f{font:700 24px var(--f-hud);letter-spacing:.2em;color:var(--c)}
.mc .n{font:900 150px/1 var(--f-disp);color:transparent;-webkit-text-stroke:4px var(--c);font-synthesis:none}
.mc .t{font:900 50px/1.15 var(--f-body);color:#fff}
.mc .q{font:900 32px/1.45 var(--f-body);color:#d8dcf0;margin-top:auto}
.mc.warn{animation:warnb .5s steps(1) infinite}
@keyframes warnb{50%{border-color:#ff3131;box-shadow:0 0 0 2px #07060d,0 0 70px rgba(255,49,49,.9)}}
.bang{font:900 120px/1 var(--f-disp);color:#ff3131;-webkit-text-stroke:4px #fff;font-synthesis:none}
.ystripw>div{transform:skewX(-10deg)}
.ystrip{background:var(--gold);color:#07060d;font:900 44px/1 var(--f-body);padding:18px 44px}

/* ---------- battle ---------- */
.plate{display:flex;align-items:center;gap:18px;font:900 46px/1 var(--f-body);color:#fff;padding:14px 26px;background:#07060d;border:4px solid}
.plate.p1{border-color:var(--hot);box-shadow:-10px 10px 0 var(--hot)}
.plate.p2{border-color:var(--cyan);box-shadow:10px 10px 0 var(--cyan)}
.plate .hudf{font-size:28px}
.combo{font:700 28px/1 var(--f-hud);letter-spacing:.14em;display:flex;align-items:baseline}
.combo b{display:inline-block;font:900 60px/1 var(--f-disp);font-synthesis:none;margin-left:10px}
.atk{width:850px;box-sizing:border-box;min-height:140px;padding:14px 26px;white-space:normal;display:flex;flex-direction:column;justify-content:center;gap:4px;background:linear-gradient(90deg,rgba(255,45,111,.34),rgba(8,6,16,.92) 70%);border-left:12px solid var(--hot);transition:opacity .3s}
.atk.d{background:linear-gradient(270deg,rgba(25,232,255,.3),rgba(8,6,16,.92) 70%);border-left:0;border-right:12px solid var(--cyan)}
.atk .tg{font:700 20px var(--f-hud);letter-spacing:.2em;color:var(--hot)}
.atk.d .tg{color:var(--cyan)}
.atk p{margin:0;font:900 33px/1.4 var(--f-body);color:#fff}
.atk p b{color:var(--gold)}
.atk.key{box-shadow:0 0 0 4px #ff3131,0 0 60px rgba(255,49,49,.75);border-right-color:#ff3131}
.atk.dim{opacity:.3}

/* ---------- judge 01 ---------- */
.say{width:1400px;box-sizing:border-box;white-space:normal;display:grid;grid-template-columns:190px 1fr;align-items:center;gap:26px;padding:22px 34px;background:rgba(7,6,13,.9);border:4px solid}
.say .who2{font:900 40px/1.1 var(--f-body);text-align:center;padding:14px 0;color:#07060d}
.say p{margin:0;font:900 42px/1.45 var(--f-body);color:#fff}
.say p b{color:var(--gold)}
.say.d{border-color:var(--cyan)}.say.d .who2{background:var(--cyan)}
.say.j{border-color:var(--gold)}.say.j .who2{background:var(--gold)}
.say.p{border-color:var(--hot)}.say.p .who2{background:var(--hot);color:#fff}
.say.sm{width:830px;grid-template-columns:130px 1fr;gap:20px;padding:18px 24px}
.say.sm .who2{font-size:30px;padding:10px 0}
.say.sm p{font-size:30px;line-height:1.45}
.rej{font:900 60px/1 var(--f-hud);letter-spacing:.1em;color:#ff3131;border:8px solid #ff3131;padding:12px 22px 8px;transform:rotate(-10deg);background:rgba(7,6,13,.85)}

/* ---------- reach ---------- */
.vig{background:radial-gradient(ellipse at center,transparent 35%,rgba(255,0,40,.55) 100%);animation:beat .8s ease-out infinite}
@keyframes beat{0%{opacity:.95}18%{opacity:.35}32%{opacity:.8}100%{opacity:.2}}
.orb{width:230px;height:230px;border-radius:50%;background:radial-gradient(circle,#fff 0 18%,var(--oc,#fff) 45%,transparent 70%);box-shadow:0 0 90px 24px var(--oc,#fff)}
.orb.max{animation:hue .35s linear infinite}
@keyframes hue{to{filter:hue-rotate(360deg)}}
.fchip{font:900 44px var(--f-body);padding:14px 26px;border:4px solid;background:rgba(0,0,0,.75)}
.gauge{display:flex;align-items:center;gap:12px}
.gauge i{width:110px;height:34px;border:3px solid rgba(255,255,255,.5);transform:skewX(-20deg)}
.gauge i.on{background:var(--gold);box-shadow:0 0 24px var(--gold);border-color:var(--gold)}
.g-l{font:900 30px var(--f-body);color:#fff;margin-right:14px}
.g-m{font:700 30px var(--f-hud);color:rgba(255,255,255,.3);margin-left:14px;letter-spacing:.2em}
.g-m.on{color:var(--gold);animation:blink .25s steps(1) infinite}
.cd{font-size:430px;color:#fff;text-shadow:0 0 40px var(--hot),0 0 100px var(--hot)}
.cutin>div{width:2500px;height:124px;background:var(--hot);color:#07060d;display:flex;align-items:center;font:900 72px/1 var(--f-disp);font-synthesis:none;transform:rotate(-4deg);overflow:hidden;border-block:6px solid #fff}
.cutin span{display:block;white-space:nowrap}
.stampr>div{font:900 70px/1 var(--f-disp);font-synthesis:none;color:var(--red);border:10px solid var(--red);padding:16px 26px 18px;transform:rotate(10deg);background:rgba(255,255,255,.94);box-shadow:0 0 40px rgba(255,49,49,.6)}

/* ---------- rule ---------- */
.cond{width:1560px;box-sizing:border-box;display:grid;grid-template-columns:84px 1fr;gap:30px;align-items:center;padding:22px 34px;white-space:normal;background:rgba(20,12,0,.82);border:4px solid rgba(255,210,63,.35)}
.cond .ck{position:relative;width:84px;height:84px;box-sizing:border-box;border:6px solid var(--gold)}
.cond .ck::after{content:"";position:absolute;left:24px;top:6px;width:20px;height:40px;border:solid #07060d;border-width:0 10px 10px 0;transform:rotate(45deg);opacity:0}
.cond.on{border-color:var(--gold);box-shadow:0 0 50px rgba(255,210,63,.45)}
.cond.on .ck{background:var(--gold)}
.cond.on .ck::after{opacity:1}
.cond .cl{font:700 24px var(--f-hud);letter-spacing:.2em;color:var(--gold)}
.cond p{margin:4px 0 0;font:900 44px/1.4 var(--f-body);color:#fff}
.cond em{font-style:normal;color:var(--gold)}
.caut{display:flex;align-items:center;gap:18px;background:#07060d;border:4px solid #fff;padding:14px 30px;font:900 34px/1.2 var(--f-body);color:#fff}
.caut b{font:700 26px/1 var(--f-hud);background:#fff;color:#07060d;padding:8px 12px 6px;letter-spacing:.14em}

/* ---------- twist ---------- */
.siren{position:absolute;left:50%;top:50%;width:3200px;height:3200px;margin:-1600px 0 0 -1600px;background:conic-gradient(from 0deg,rgba(255,40,40,.3) 0 16deg,transparent 16deg 180deg,rgba(255,40,40,.3) 180deg 196deg,transparent 196deg);animation:spin 1.6s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.tape{position:absolute;left:-100px;width:2120px;height:44px;background:repeating-linear-gradient(-45deg,var(--gold) 0 34px,#07060d 34px 68px);animation:tape .9s linear infinite}
@keyframes tape{to{background-position:96.17px 0}}
.warn{color:var(--red);-webkit-text-stroke:6px #fff;text-shadow:0 0 70px rgba(255,0,0,.8)}
.tline{position:absolute;left:160px;top:556px;width:1600px;height:8px;transform-origin:0 50%}
.tdot{width:44px;height:44px;border-radius:50%;background:#07060d;border:6px solid #fff;box-sizing:border-box}
.tdot.on{background:var(--gold);box-shadow:0 0 30px var(--gold)}
.tdot.key{background:#ff3131;box-shadow:0 0 40px #ff3131}
.tdate{font:900 50px/1 var(--f-disp);color:#fff;font-synthesis:none;text-align:center}
.tdate small{display:block;font:700 22px/1 var(--f-hud);letter-spacing:.2em;color:var(--gold);margin-bottom:10px}
.tdesc{font:900 31px/1.4 var(--f-body);color:#fff;text-align:center;white-space:normal;width:350px;box-sizing:border-box;background:rgba(7,6,13,.85);padding:12px 14px;border-top:4px solid var(--gold)}
.tdesc.key{border-top-color:#ff3131;background:rgba(90,0,12,.9)}
.tseg{font:900 26px/1 var(--f-body);color:#07060d;background:var(--gold);padding:8px 14px}
.comet2{width:30px;height:30px;border-radius:50%;background:#fff;box-shadow:0 0 20px 8px #fff,0 0 50px 20px var(--gold)}
.hanko{font:900 180px/1 var(--f-disp);font-synthesis:none;color:#ff2230;border:16px solid #ff2230;border-radius:28px;padding:22px 44px 20px;background:rgba(255,248,240,.95);transform:rotate(-8deg);box-shadow:0 0 0 8px rgba(255,248,240,.95),0 0 80px rgba(255,34,48,.6)}
.hanko small{display:block;font:900 46px/1 var(--f-body);text-align:right;margin-top:12px}

/* ---------- verdict ---------- */
.crack{position:absolute;inset:0;filter:drop-shadow(0 0 6px #fff)}

<script id="main">

      <div class="rr" data-row><span>争点2<small>パブリシティ権</small></span><b>声は肖像と同様に「人格の象徴」。侵害の判断枠組みを示す（本件へのあてはめはなし）</b><i class="bd-r">RULE</i></div>
      <div class="rr" data-row><span>争点3<small>削除済みか</small></span><b class="gold">2026年6月28日の経過をもって削除済みと認定</b><i class="bd-k">KEY</i></div>`);
    A(res, [{transform: 'scaleY(0)', opacity: 0}, {transform: 'scaleY(1)', opacity: 1}], .3, OUT);
    res.querySelectorAll('[data-row]').forEach(el => { el.style.opacity = 0; });
  });
  c.at(4.1, () => {
    res.querySelectorAll('.stats b').forEach((el, j) => { count(c, el, +el.dataset.v, .6 + j * .1); fx.pop(el.parentNode, {delay: j * .08}); });
    shake(12, .2); flash('#ffd23f', .15, .3);
  });
  [4.9, 5.4, 5.9, 6.4].forEach((t, j) => c.at(t, () => {
    const el = res.querySelectorAll('[data-row]')[j];
    fx.from(el, {x: -60, dur: .25, blur: 6});
    if (j === 0) { flash('#ff3131', .25, .5); shake(24, .3); punch(.04); FX.burst(640, 480, {n: 80, colors: ['#ff3131','#ffffff'], speed: [400, 1300], jx: 300}); }
    else if (j === 3) { flash('#19e8ff', .25, .5); shake(22, .3); punch(.04); FX.burst(CX, 800, {n: 90, colors: ['#19e8ff','#ffffff','#ffd23f'], speed: [400, 1400], jx: 400}); }
    else shake(9, .2);
  }));
  c.at(8.6, () => {
    A(res, [{transform: 'scale(1)', opacity: 1, filter: 'none'}, {transform: 'scale(1.8)', opacity: 0, filter: 'blur(20px)'}], .3, IN);
    FX.burst(CX, 560, {n: 260, colors: ['#ffd23f','#ffffff','#ff9d00'], speed: [500, 2200], jx: 700, jy: 330, life: [.5, 1.2]});
    flash('#fff', .5, 1); shake(40, .6);
  });
  c.at(9.0, () => {
    flash('#ffd23f', .5, .8);
    BG.set({mode: 'fever', hue: 45, energy: 1.2, speed: 1.1}); BG.kick(1.6);
    shake(60, 1.2); punch(.14);
    [0, .1, .2].forEach((d, j) => FX.ring(CX, 390, {color: ['#ffffff','#ffd23f','#ff2d6f'][j], r1: 1500 - j*200, w: 40 - j*10, life: .7 + d}));
    FX.burst(CX, 390, {n: 300, colors: ['#ffffff','#ffd23f','#ff2d6f','#19e8ff','#a6ff3a'], speed: [900, 2800], life: [.7, 1.5], size: [2, 7]});
    FX.confetti(240, {x: CX, y: 700});
    FX.rainOn({rate: 40});
    const s0 = P(r, CX, 205, 'jp', '東京地裁（判決理由より）', {fontSize: '40px', color: '#fff', background: 'rgba(0,0,0,.6)', padding: '4px 22px'}); fx.from(s0, {y: -30, dur: .3});
    const f = P(r, CX, 390, 'disp goldx', '声は、人格の象徴。', {fontSize: '180px'});
    fx.slam(f, {from: 5, dur: .34, blur: 26});
    camTo(c, {z: 1.04}, 7, eOut);
  });
  c.at(9.8, () => { const s = P(r, CX, 578, 'jp', '── 人の肖像と同様に', {fontSize: '58px', color: '#fff', textShadow: '0 0 24px rgba(0,0,0,.9)'}); fx.from(s, {y: 30, dur: .35}); shake(8, .2); });
  c.at(10.7, () => {
    const s = P(r, CX, 730, 'disp hotx', 'ただし本件は、請求棄却。', {fontSize: '104px'});
    fx.slam(s, {from: 3, dur: .3}); flash('#ff2d6f', .3, .6); shake(30, .4); punch(.05);
    FX.burst(CX, 730, {n: 140, colors: ['#ff2d6f','#ffffff'], speed: [500, 1700], jx: 500});
  });
  c.at(11.5, () => { const s = P(r, CX, 858, 'jp', '審理が終わる前に、問題の記事は消えていた', {fontSize: '50px', color: '#fff', background: 'rgba(0,0,0,.62)', padding: '6px 24px'}); fx.from(s, {y: 30, dur: .35}); });
  c.at(12.3, () => sweepText(r, CX, 390, '声は、人格の象徴。', 180));
  c.at(13.3, () => { const s = P(r, CX, 958, 'jp', '出典：東京地裁 令和8年9月30日判決（令和7年(ワ)第70635号）をもとにした非公式の要約演出です。法的助言ではありません。', {fontSize: '22px', color: 'rgba(255,255,255,.85)', background: 'rgba(0,0,0,.6)', padding: '6px 18px', fontWeight: 700}); fx.from(s, {dur: .5}); });
  c.at(14.6, () => sweepText(r, CX, 390, '声は、人格の象徴。', 180));
}},
];

/* ---------- transitions ---------- */
function freeze(node) { node.getAnimations({subtree: true}).forEach(a => { try { a.commitStyles(); } catch (e) {} a.cancel(); }); }
const TR = {
  cut(n) { n.remove(); },
  zoom(n) { A(n, [{transform: 'scale(1)', filter: 'blur(0px)', opacity: 1}, {transform: 'scale(2.4)', filter: 'blur(16px)', opacity: 0}], .42, IN).onfinish = () => n.remove(); flash('#fff', .4, .9); },
  spin(n) { A(n, [{transform: 'rotate(0deg) scale(1)', opacity: 1}, {transform: 'rotate(-40deg) scale(.05)', opacity: .2}], .42, IN).onfinish = () => n.remove(); flash('#fff', .3, .6); },
  shatter(n) {
    const cols = 4, rows = 3, pts = [];
    for (let j = 0; j <= rows; j++) { pts[j] = []; for (let i = 0; i <= cols; i++) { const ex = i === 0 || i === cols, ey = j === 0 || j === rows; pts[j][i] = [i / cols * 100 + (ex ? 0 : rnd(-7, 7)), j / rows * 100 + (ey ? 0 : rnd(-9, 9))]; } }
    const par = n.parentNode;
    for (let j = 0; j < rows; j++) for (let i = 0; i < cols; i++) {
      const p = [pts[j][i], pts[j][i+1], pts[j+1][i+1], pts[j+1][i]];
      const cl = n.cloneNode(true); cl.style.clipPath = 'polygon(' + p.map(q => q[0] + '% ' + q[1] + '%').join(',') + ')';
      par.appendChild(cl);
      const cx = (p[0][0] + p[2][0]) / 2 - 50, cy = (p[0][1] + p[2][1]) / 2 - 50;
      A(cl, [{transform: 'none', opacity: 1}, {transform: `translate(${cx * rnd(14, 24)}px,${cy * rnd(14, 24) + 300}px) rotate(${rnd(-50, 50)}deg) scale(${rnd(.6, .9)})`, opacity: 0}], rnd(.5, .7), 'cubic-bezier(.4,0,.8,.5)', {delay: Math.hypot(cx, cy) * .002}).onfinish = () => cl.remove();
    }
    n.remove(); flash('#fff', .3, .8); shake(18, .3);
  },
  split(n) {
    const a = n.cloneNode(true); a.style.clipPath = 'inset(0 0 50% 0)'; n.style.clipPath = 'inset(50% 0 0 0)'; n.parentNode.appendChild(a);
    A(a, [{transform: 'none'}, {transform: 'translateY(-110%) rotate(-3deg)'}], .45, IN).onfinish = () => a.remove();
    A(n, [{transform: 'none'}, {transform: 'translateY(110%) rotate(3deg)'}], .45, IN).onfinish = () => n.remove();
    flash('#fff', .25, .5);
  },
  glitch(n) {
    const k = [];
    for (let i = 0; i < 7; i++) k.push({transform: `translate(${rnd(-90, 90)}px,${rnd(-20, 20)}px) skewX(${rnd(-20, 20)}deg)`, clipPath: `inset(${rnd(0, 55)}% 0 ${rnd(0, 40)}% 0)`, filter: `hue-rotate(${rnd(0, 360)}deg) saturate(3)`, opacity: 1, easing: 'steps(1,end)'});
    k.push({opacity: 0});
    A(n, k, .38, 'linear').onfinish = () => n.remove();
  },
  invert(n) { n.style.filter = 'invert(1) hue-rotate(180deg)'; A(n, [{transform: 'scale(1)', opacity: 1}, {transform: 'scale(1.25)', opacity: 0}], .32, IN).onfinish = () => n.remove(); flash('#fff', .2, .5); },
  wipe(n) {
    const b = h('div', 'full', null, $('#out'), {top: '-20%', left: '-10%', width: '120%', height: '140%', background: 'linear-gradient(90deg,#a6ff3a 0 3%,#07060d 3% 97%,#a6ff3a 97%)'});
    A(b, [{transform: 'translateX(-130%) skewX(-18deg)'}, {transform: 'translateX(130%) skewX(-18deg)'}], .55, SNAP).onfinish = () => b.remove();
    A(n, [{opacity: 1}, {opacity: 1, offset: .45}, {opacity: 0, offset: .46}, {opacity: 0}], .55, 'linear').onfinish = () => n.remove();
  },
};

/* ---------- player ---------- */
const OFF = []; let TOTAL = 0;
SLIDES.forEach((s, i) => { OFF[i] = TOTAL; TOTAL += s.dur; });
const fmtT = s => { const m = Math.floor(s / 60), r = s - m * 60; return String(m).padStart(2, '0') + ':' + r.toFixed(1).padStart(4, '0'); };

function go(i, mode) {
  i = Math.max(0, Math.min(SLIDES.length - 1, i));
  const out = $('#out');
  if (E.slide) {
    const old = E.slide;
    freeze(old);
    if (mode === 'manual') out.innerHTML = '';
    out.appendChild(old);
    (TR[mode === 'manual' ? 'glitch' : SLIDES[E.i].trans] || TR.cut)(old);
  }
  E.i = i; E.t = 0; E.ci = 0; E.cues = []; E.ticks.clear(); E.ended = false;
  FX.stopStreams(); camReset();
  const def = SLIDES[i];
  BG.set(def.bg);
  const root = h('div', 'slide', null, $('#layer'));
  E.slide = root;
  def.build(makeCtx(root));
  const g = $('#hud-genre'); g.textContent = def.genre; fx.glitch(g, .3);
  $('#hud-stage').textContent = `STAGE ${String(i + 1).padStart(2, '0')}/${SLIDES.length}`;
  hudMode();
}
function end() { E.ended = true; hudMode(); }
let pausedAnims = [];
function setPlaying(p) {
  if (p === E.playing) return;
  E.playing = p;
  if (!p) { pausedAnims = document.getAnimations().filter(a => a.playState === 'running'); pausedAnims.forEach(a => a.pause()); }
  else { pausedAnims.forEach(a => { try { a.play(); } catch (e) {} }); pausedAnims = []; }
  hudMode();
}
function restart() { $('#out').innerHTML = ''; FX.clear(); setPlaying(true); go(0, 'manual'); }
function toggle() { if (E.ended) restart(); else setPlaying(!E.playing); }
function nav(d) { setPlaying(true); if (d > 0 && E.i === SLIDES.length - 1) { E.t = SLIDES[E.i].dur; return; } go(E.i + d, 'manual'); }
function hudMode() {
  const m = $('#hud-mode');
  m.textContent = E.ended ? '■ END · R' : E.playing ? '▶ AUTO' : '❚❚ PAUSE';
  m.classList.toggle('p', !E.playing || E.ended);
  const b = $('#b-play'); b.textContent = E.playing && !E.ended ? '❚❚' : '▶'; b.setAttribute('aria-label', E.playing && !E.ended ? '一時停止' : '再生');
}

let last = performance.now();
function loop(now) {
  let dt = (now - last) / 1000; last = now;
  if (dt > .25) dt = .25;
  const pdt = E.playing ? dt : 0;
  if (E.playing && !E.ended) {
    E.t += dt;
    while (E.ci < E.cues.length && E.cues[E.ci].t <= E.t) { const q = E.cues[E.ci++]; try { q.fn(); } catch (err) { console.error(err); } }
    for (const f of [...E.ticks]) f(E.t, dt);
    if (E.t >= SLIDES[E.i].dur) { if (E.i < SLIDES.length - 1) go(E.i + 1, 'auto'); else end(); }
  }
  BG.step(pdt); FX.step(pdt); camStep(pdt);
  const tot = OFF[E.i] + Math.min(E.t, SLIDES[E.i].dur);
  $('#hud-time').textContent = fmtT(tot) + ' / ' + fmtT(TOTAL);
  PSEG.forEach((s, i) => { s.style.transform = `scaleX(${i < E.i ? 1 : i === E.i ? Math.min(1, E.t / SLIDES[i].dur) : 0})`; });
  requestAnimationFrame(loop);
}

/* ---------- HUD / controls ---------- */
const PSEG = SLIDES.map(s => { const i = h('i', '', null, $('#prog'), {flex: String(s.dur)}); return h('b', '', null, i); });
const tk = TICKER.map(s => `${s}<em>◆</em>`).join('');
$('#ticker').innerHTML = tk + tk;

function fit() { const s = Math.min(innerWidth / W, innerHeight / H); $('#stage').style.transform = `scale(${s})`; }
addEventListener('resize', fit);

const ctrl = $('#ctrl'), vp = $('#viewport');
let idleT = 0;
function wake() { ctrl.classList.remove('hide'); vp.classList.remove('idle'); clearTimeout(idleT); idleT = setTimeout(() => { ctrl.classList.add('hide'); vp.classList.add('idle'); }, 2200); }
addEventListener('mousemove', wake); addEventListener('touchstart', wake, {passive: true});
async function fullscreen() { try { if (document.fullscreenElement) await document.exitFullscreen(); else await document.documentElement.requestFullscreen(); } catch (e) {} }
$('#b-prev').addEventListener('click', e => { e.stopPropagation(); nav(-1); });
$('#b-next').addEventListener('click', e => { e.stopPropagation(); nav(1); });
$('#b-play').addEventListener('click', e => { e.stopPropagation(); toggle(); });
$('#b-re').addEventListener('click', e => { e.stopPropagation(); restart(); });
$('#b-fs').addEventListener('click', e => { e.stopPropagation(); fullscreen(); });
ctrl.addEventListener('click', e => e.stopPropagation());
vp.addEventListener('click', e => {
  const x = e.clientX / innerWidth;
  if (x < .22) nav(-1); else if (x > .78) nav(1); else toggle();
});
addEventListener('keydown', e => {
  if (e.target.closest && e.target.closest('button') && (e.key === ' ' || e.key === 'Enter')) return;
  const k = e.key;
  if (k === ' ' || k === 'k' || k === 'K') { e.preventDefault(); toggle(); }
  else if (k === 'ArrowRight' || k === 'l' || k === 'L' || k === 'PageDown') { e.preventDefault(); nav(1); }
  else if (k === 'ArrowLeft' || k === 'j' || k === 'J' || k === 'PageUp') { e.preventDefault(); nav(-1); }
  else if (k === 'r' || k === 'R' || k === 'Home') restart();
  else if (k === 'f' || k === 'F') fullscreen();
  else if (k === 'h' || k === 'H') $('#hud').classList.toggle('off');
});
let autoPaused = false;
document.addEventListener('visibilitychange', () => {
  if (document.hidden && E.playing) { autoPaused = true; setPlaying(false); }
  else if (!document.hidden && autoPaused) { autoPaused = false; last = performance.now(); setPlaying(true); }
});

/* ---------- boot: 使う文字だけ先にフォント読み込み → AUTO再生 ---------- */
async function boot() {
  fit();
  const txt = [...new Set(($('#main').textContent + document.body.innerText).replace(/[\x00-\x7f]/g, ''))].join('') + '0123456789%+.!?ABCDEFGHIJKLMNOPQRSTUVWXYZ';
  try {
    await Promise.race([
      Promise.all(['900 100px "Dela Gothic One"', '900 40px "Noto Sans JP"', '700 40px "Noto Sans JP"', '500 20px "Noto Sans JP"', '700 20px "Chakra Petch"'].map(f => document.fonts.load(f, txt))),
      new Promise(res => setTimeout(res, 4000)),
    ]);
  } catch (e) {}
  wake();
  go(0, 'auto');
  last = performance.now();
  requestAnimationFrame(loop);
}
boot();
})();
</script>
