<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>日銀展望レポート ドパガキ版</title>
<meta name="description" content="日本銀行「経済・物価情勢の展望（2026年7月）【基本的見解】」を、ゲーム×パチンコ×アニメOP×ショート動画の過剰演出で見せるAUTO再生モーションプレゼン（非公式の要約演出）。">
<meta property="og:type" content="website">
<meta property="og:title" content="日銀展望レポート ドパガキ版">
<meta property="og:description" content="展望レポート（2026年7月）を約105秒のAUTO再生モーションプレゼンに。dopagaki-generator スキルの作例（非公式の要約演出）。">
<meta name="twitter:card" content="summary">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;700&family=Dela+Gothic+One&family=Noto+Sans+JP:wght@500;700;900&display=swap">
<style>
/* Layout: fixed 1920x1080 stage scaled to fit and letterboxed on black; depth = bg canvas / slide DOM / fx canvas, framed by a game HUD */
:root{
  --ink:#06050a; --paper:#f5f7ff; --dim:#8f96b3;
  --hot:#ff2d6f; --cyan:#19e8ff; --gold:#ffd23f; --lime:#a6ff3a; --red:#ff3131; --violet:#8b5cff;
  --f-disp:"Dela Gothic One","Noto Sans JP","Hiragino Kaku Gothic ProN","Yu Gothic",sans-serif;
  --f-body:"Noto Sans JP","Hiragino Kaku Gothic ProN","Yu Gothic","Meiryo",sans-serif;
  --f-hud:"Chakra Petch","Noto Sans JP",ui-monospace,monospace;
  color-scheme:dark;
}
html,body{height:100%;margin:0;background:#000;overflow:hidden}
body{color:var(--paper);font-family:var(--f-body);-webkit-font-smoothing:antialiased}
#viewport{position:fixed;inset:0;overflow:hidden;background:#000;user-select:none;-webkit-user-select:none}
#viewport.idle{cursor:none}
#stage{position:absolute;left:50%;top:50%;width:1920px;height:1080px;margin:-540px 0 0 -960px;transform-origin:50% 50%;overflow:hidden;background:var(--ink)}
#cam{position:absolute;inset:0;transform-origin:50% 50%}
#bg{position:absolute;inset:0;width:100%;height:100%}
#layer,#out{position:absolute;inset:0}
#fx{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
#overlay{position:absolute;inset:0;pointer-events:none;background:repeating-linear-gradient(0deg,rgba(0,0,0,.16) 0 2px,transparent 2px 4px),radial-gradient(ellipse at center,transparent 58%,rgba(0,0,0,.6) 100%)}
#noise{position:absolute;inset:-100px;pointer-events:none;opacity:.07;background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='220' height='220'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.85' numOctaves='2' stitchTiles='stitch'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>");animation:noise .5s steps(5) infinite}
@keyframes noise{0%{transform:translate(0,0)}20%{transform:translate(-40px,20px)}40%{transform:translate(30px,-50px)}60%{transform:translate(-60px,-10px)}80%{transform:translate(20px,40px)}100%{transform:translate(0,0)}}
#flash{position:absolute;inset:0;pointer-events:none}
.flash{position:absolute;inset:0}

/* ---------- typography primitives ---------- */
.slide{position:absolute;inset:0;overflow:hidden}
.full{position:absolute;inset:0}
.pos{position:absolute;white-space:nowrap}
.disp{font-family:var(--f-disp);font-weight:900;font-synthesis:none;line-height:1.04;letter-spacing:-.01em}
.jp{font-family:var(--f-body);font-weight:900;line-height:1.3}
.hudf{font-family:var(--f-hud);font-weight:700;letter-spacing:.16em}
.tabnum{font-variant-numeric:tabular-nums}
.ch{display:inline-block;white-space:pre}
.pct{font-size:.6em}
.rgb{text-shadow:-.03em 0 rgba(255,30,100,.95),.03em 0 rgba(20,230,255,.95),0 0 .12em rgba(255,255,255,.35)}
.goldx{color:#fff4b8;text-shadow:0 .015em 0 #ffb300,0 .03em 0 #e08a00,0 .045em 0 #b86400,0 .06em 0 #7a3f00,0 .075em 0 #3d1f00,0 0 .2em rgba(255,190,40,.8),0 0 .5em rgba(255,110,0,.5)}
.hotx{color:#fff;text-shadow:0 .025em 0 #ff2d6f,0 .05em 0 #b3004a,0 .075em 0 #5c0026,0 0 .25em rgba(255,45,111,.85)}
.stroke-w{color:transparent;-webkit-text-stroke:8px #fff}
.stroke-g{color:transparent;-webkit-text-stroke:10px var(--gold);filter:drop-shadow(0 0 30px rgba(255,210,63,.6))}
.cap{background:#ffe600;color:#0a0a0a;padding:.06em .4em .12em;box-shadow:.12em .12em 0 #000;font-family:var(--f-body);font-weight:900}
.chip{display:inline-block;font:700 26px/1 var(--f-hud);letter-spacing:.2em;padding:12px 18px 10px;border:3px solid currentColor}
.hdr{display:flex;align-items:center;gap:30px}
.h1{font-size:70px;color:#fff;line-height:1.1}
.hsub{font-size:27px;color:var(--dim);font-weight:700;margin-top:6px}
.cur{color:var(--hot);animation:blink .5s steps(1) infinite}
@keyframes blink{50%{opacity:0}}

/* ---------- hook / opening ---------- */
.stamp{text-align:left;transform:rotate(-6deg)}
.slash{width:2700px;height:190px;background:#07060d;border-block:8px solid var(--hot);display:flex;align-items:center;justify-content:center;gap:48px;font:900 96px/1 var(--f-disp);font-synthesis:none;color:#fff;transform:rotate(-7deg)}
.slash b{color:var(--hot);font-family:var(--f-hud);font-size:80px}
.sweep{color:transparent;background:linear-gradient(100deg,transparent 42%,rgba(255,255,255,.95) 50%,transparent 58%) no-repeat;background-size:300% 100%;-webkit-background-clip:text;background-clip:text}
.chap{display:flex;gap:22px}
.chap span{font:900 34px/1 var(--f-body);padding:14px 22px;color:#07060d}
.chap i{font:700 22px var(--f-hud);font-style:normal;margin-right:10px;letter-spacing:.1em}
.chip-w{display:inline-block;background:#fff;color:#07060d;padding:4px 16px;margin-right:14px}

/* ---------- status ---------- */
.panel{position:absolute;box-sizing:border-box;padding:30px 40px;display:flex;flex-direction:column;gap:6px;background:linear-gradient(180deg,rgba(14,22,40,.88),rgba(6,8,18,.92));border:2px solid rgba(25,232,255,.6);box-shadow:inset 0 0 0 1px rgba(25,232,255,.12),0 0 50px rgba(25,232,255,.16)}
.st-head{display:flex;align-items:center;gap:24px;height:84px;font-family:var(--f-body);font-weight:900}
.st-head .lbl{font-size:38px;color:#9fb3d9}
.st-head .val{font-size:60px;color:var(--gold);text-shadow:0 0 24px rgba(255,210,63,.5)}
.st-note{font:700 25px/36px var(--f-body);color:#c9cfe6;height:36px;margin-bottom:10px}
.st-row{display:grid;grid-template-columns:230px 1fr 190px;align-items:center;height:58px;padding:0 14px;font:900 34px var(--f-body);color:#fff;background:linear-gradient(90deg,rgba(25,232,255,.1),transparent 70%);border-left:4px solid rgba(25,232,255,.6)}
.st-row .lbl{color:#9fb3d9;font-size:30px}
.bdg{justify-self:end;font:700 22px/1 var(--f-hud);letter-spacing:.12em;padding:9px 12px 7px;color:#07060d}
.bdg.up{background:var(--lime)}.bdg.high{background:var(--gold)}.bdg.steady{background:var(--cyan)}.bdg.flat{background:#fff}
.bdg.down{background:var(--red);color:#fff}.bdg.tight{background:var(--hot);color:#fff}.bdg.easy{background:var(--violet);color:#fff}
.pr{padding:36px 40px;gap:8px;border-color:rgba(255,45,111,.75)}
.pm{font-size:24px;color:var(--hot)}
.pr-l{font-size:40px;color:#fff;line-height:1.2}
.pr-s{font-size:26px;color:var(--dim)}
.pr-v{font-size:104px;color:#fff;margin:16px 0 8px;height:118px;text-shadow:0 0 30px rgba(255,45,111,.8)}
.pr-n{font-size:25px;color:#c9cfe6;white-space:normal}
.pr-sep{height:2px;background:rgba(255,255,255,.2);margin:18px 0 10px}
.pr-l2{font-size:34px;color:#fff}
.pr-v2{font-size:50px;color:var(--lime)}
.teaser{width:1920px;height:100px;display:flex;align-items:center;justify-content:center;gap:30px;background:#07060d;border-top:6px solid var(--hot);font:900 54px var(--f-body);color:#fff}
.teaser b{font:900 76px/1 var(--f-disp);font-synthesis:none;color:var(--gold)}
.teaser i{font:700 34px var(--f-hud);font-style:normal;color:var(--hot);letter-spacing:.2em;animation:blink .5s steps(1) infinite}

/* ---------- characters ---------- */
.halftone{background-image:radial-gradient(rgba(0,0,0,.2) 22%,transparent 24%);background-size:22px 22px}
.cnum{font-size:280px;color:transparent;-webkit-text-stroke:5px currentColor;opacity:.4}
.cbs{display:flex;flex-direction:column;gap:22px;width:680px;white-space:normal}
.cb{display:grid;grid-template-columns:96px 64px 1fr;align-items:center;gap:14px;background:rgba(255,255,255,.06);border-left:8px solid;padding:16px 20px}
.cb .k{font:900 36px var(--f-body);color:#fff}
.cb .a{font:900 58px/1 var(--f-disp);font-synthesis:none}
.cb .v{font:900 36px/1.25 var(--f-body);color:#fff}
.cb.up{border-color:var(--lime)}.cb.up .a{color:var(--lime)}
.cb.down{border-color:var(--red)}.cb.down .a{color:var(--red)}
.cb.mix{border-color:var(--gold)}.cb.mix .a{color:var(--gold)}
.cfact{font:700 30px/1.5 var(--f-body);color:#d8dcf0;white-space:normal;width:680px;border-top:2px solid rgba(255,255,255,.2);padding-top:18px}
.strips{position:absolute;inset:0;display:flex}
.strip{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:24px;position:relative;overflow:hidden}
.vt{writing-mode:vertical-rl;text-orientation:upright;font:900 150px/1 var(--f-disp);font-synthesis:none}
.band2>div{background:#07060d;color:#fff;font:900 88px/1 var(--f-disp);font-synthesis:none;padding:30px 80px;border:6px solid #fff;transform:rotate(-4deg);box-shadow:0 0 0 14px #07060d}

/* ---------- charts ---------- */
.gl{position:absolute;height:2px;background:rgba(255,255,255,.16);transform-origin:0 50%}
.gl.base{height:4px;background:rgba(255,255,255,.65)}
.axl{color:#9fb3d9}
.bar{position:absolute;transform-origin:50% 100%;background:linear-gradient(180deg,#eaffc8,var(--lime) 28%,#2f9e00);box-shadow:0 0 30px rgba(166,255,58,.45);z-index:1}
.ghost{position:absolute;border:3px dashed rgba(255,255,255,.7);box-sizing:border-box;z-index:2;background:rgba(255,255,255,.03)}
.diff{font:700 28px/1 var(--f-hud);letter-spacing:.04em;padding:10px 16px 8px;border:3px solid}
.diff.up{color:var(--lime);border-color:var(--lime);background:rgba(166,255,58,.12)}
.diff.keep{color:#fff;border-color:#fff;background:rgba(255,255,255,.08)}
.diff.down{color:var(--red);border-color:var(--red);background:rgba(255,49,49,.14)}
.gp{display:flex;flex-direction:column;gap:34px;width:430px;white-space:normal}
.gp-i b{display:block;font:900 30px var(--f-body);margin-bottom:6px}
.gp-i p{margin:0;font:900 40px/1.3 var(--f-body);color:#fff}
.mbar{position:absolute;transform-origin:50% 100%;background:linear-gradient(180deg,#ffd0e0,var(--hot) 28%,#8a0034);box-shadow:0 0 36px rgba(255,45,111,.55);z-index:1}
.sbar{position:absolute;transform-origin:50% 100%;background:linear-gradient(180deg,#d6fbff,var(--cyan) 28%,#006f86);box-shadow:0 0 24px rgba(25,232,255,.45);z-index:1}
.tline{position:absolute;height:6px;background:var(--gold);box-shadow:0 0 18px var(--gold),0 0 50px rgba(255,210,63,.6);transform-origin:0 50%;z-index:3}
.tlabel{font:900 28px/1.1 var(--f-body);color:var(--gold)}
.tlabel b{font:900 56px/1 var(--f-disp);font-synthesis:none;display:block}
.aline{position:absolute;height:0;border-top:4px dashed rgba(255,255,255,.85);z-index:4}
.legend{display:flex;flex-direction:column;gap:12px;font:900 25px var(--f-body);color:#fff}
.legend i{display:inline-block;width:30px;height:18px;margin-right:12px;vertical-align:middle}
.rp{display:flex;flex-direction:column;gap:8px;font:900 28px/1.3 var(--f-body);color:#d8dcf0}
.rp b{font-size:40px;color:#fff;display:block}
.rp .arr{color:var(--gold);font-size:34px}

/* ---------- reach ---------- */
.vig{background:radial-gradient(ellipse at center,transparent 35%,rgba(255,0,40,.55) 100%);animation:beat .8s ease-out infinite}
@keyframes beat{0%{opacity:.95}18%{opacity:.35}32%{opacity:.8}100%{opacity:.2}}
.orb{width:230px;height:230px;border-radius:50%;background:radial-gradient(circle,#fff 0 18%,var(--oc,#fff) 45%,transparent 70%);box-shadow:0 0 90px 24px var(--oc,#fff)}
.orb.max{animation:hue .35s linear infinite}
@keyframes hue{to{filter:hue-rotate(360deg)}}
.fchip{font:900 40px var(--f-body);padding:14px 26px;border:4px solid;background:rgba(0,0,0,.75)}
.gauge{display:flex;align-items:center;gap:12px}
.gauge i{width:110px;height:34px;border:3px solid rgba(255,255,255,.5);transform:skewX(-20deg)}
.gauge i.on{background:var(--gold);box-shadow:0 0 24px var(--gold);border-color:var(--gold)}
.g-l{font:900 30px var(--f-body);color:#fff;margin-right:14px}
.g-m{font:700 30px var(--f-hud);color:rgba(255,255,255,.3);margin-left:14px;letter-spacing:.2em}
.g-m.on{color:var(--gold);animation:blink .25s steps(1) infinite}
.cd{font-size:430px;color:#fff;text-shadow:0 0 40px var(--hot),0 0 100px var(--hot)}
.cutin>div{width:2500px;height:124px;background:var(--red);color:#07060d;display:flex;align-items:center;font:900 72px/1 var(--f-disp);font-synthesis:none;transform:rotate(-4deg);overflow:hidden;border-block:6px solid #fff}
.cutin span{display:block;white-space:nowrap}
.stampr>div{font:900 70px/1 var(--f-disp);font-synthesis:none;color:var(--red);border:10px solid var(--red);padding:16px 26px 18px;transform:rotate(10deg);background:rgba(255,255,255,.94);box-shadow:0 0 40px rgba(255,49,49,.6)}

/* ---------- fever ---------- */
.loopbox{position:relative;width:520px;height:520px}
.loopbox svg{position:absolute;inset:0;overflow:visible}
.lp-track{fill:none;stroke:rgba(139,92,255,.3);stroke-width:26}
.lp-flow{fill:none;stroke:#b79bff;stroke-width:8;stroke-dasharray:30 26;animation:flow .7s linear infinite}
@keyframes flow{to{stroke-dashoffset:-56}}
.lp-arr{fill:#b79bff}
.node{position:absolute;width:190px;height:190px;border-radius:50%;display:grid;place-items:center;font:900 64px/1 var(--f-disp);font-synthesis:none;color:#fff;background:radial-gradient(circle,#2a1460,#10052a);border:6px solid var(--violet);box-shadow:0 0 40px rgba(139,92,255,.7);box-sizing:border-box}
.comet{position:absolute;width:34px;height:34px;margin:-17px 0 0 -17px;border-radius:50%;background:#fff;box-shadow:0 0 20px 8px #fff,0 0 50px 20px var(--violet)}
.chain{font:700 36px var(--f-hud);color:var(--gold);letter-spacing:.12em;text-shadow:0 0 20px rgba(255,210,63,.8)}
.gz{width:780px;white-space:normal}
.gz-t{font:900 38px var(--f-body);color:#fff}
.gz-track{position:relative;height:46px;margin-top:56px;background:rgba(255,255,255,.08);border:2px solid rgba(255,255,255,.35)}
.gz-fill{position:absolute;left:0;top:0;bottom:0;width:80%;transform-origin:0 50%;background:linear-gradient(90deg,#3b1d8f,var(--violet),var(--gold))}
.gz-mk{position:absolute;left:80%;top:-44px;bottom:-10px;width:5px;margin-left:-2px;background:var(--gold);box-shadow:0 0 14px var(--gold)}
.gz-mk span{position:absolute;top:-8px;left:14px;font:900 38px/1 var(--f-disp);font-synthesis:none;color:var(--gold)}
.gz-r{font:900 30px/1.4 var(--f-body);color:var(--gold);margin-top:16px;min-height:42px}
.banner>div{width:1920px;padding:30px 0;background:#07060d;border-block:6px solid var(--gold);display:flex;align-items:center;justify-content:center;gap:40px;font:900 76px/1 var(--f-disp);font-synthesis:none;color:#fff}
.banner .hudf{font-size:30px;color:var(--gold)}

/* ---------- warning ---------- */
.siren{position:absolute;left:50%;top:50%;width:3200px;height:3200px;margin:-1600px 0 0 -1600px;background:conic-gradient(from 0deg,rgba(255,40,40,.3) 0 16deg,transparent 16deg 180deg,rgba(255,40,40,.3) 180deg 196deg,transparent 196deg);animation:spin 1.6s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.tape{position:absolute;left:-100px;width:2120px;height:44px;background:repeating-linear-gradient(-45deg,var(--gold) 0 34px,#07060d 34px 68px);animation:tape .9s linear infinite}
@keyframes tape{to{background-position:96.17px 0}}
.warn{font-size:300px;color:var(--red);-webkit-text-stroke:6px #fff;text-shadow:0 0 70px rgba(255,0,0,.8)}
.rlist{display:flex;flex-direction:column;gap:26px;white-space:normal;width:1650px}
.rlist>div{display:flex;gap:24px;align-items:center;font:900 46px/1.35 var(--f-body);color:#fff}
.rlist .ic{flex:none;width:64px;height:64px;display:grid;place-items:center;font:900 40px/1 var(--f-disp);font-synthesis:none;color:#07060d}
.rlist b{color:var(--gold)}
.vsbox{width:720px;white-space:normal}
.vsbox h3{margin:0 0 18px;font:900 110px/1 var(--f-disp);font-synthesis:none}
.vsbox p{margin:0;font:900 40px/1.45 var(--f-body);color:#fff}
.vs{font-size:280px;color:#fff;-webkit-text-stroke:8px #07060d;text-shadow:0 0 50px var(--gold),0 0 100px rgba(255,210,63,.6)}
.cbox{width:440px;min-height:230px;box-sizing:border-box;display:grid;place-items:center;text-align:center;white-space:normal;font:900 40px/1.35 var(--f-body);color:#fff;border:4px solid var(--gold);background:rgba(20,10,0,.78);padding:20px}
.cbox.big{font:900 76px/1 var(--f-disp);font-synthesis:none;color:var(--gold)}
.arrow-r{font:900 90px/1 var(--f-disp);font-synthesis:none;color:var(--gold)}
.scale{position:relative;width:560px;height:420px}
.scale .post{position:absolute;left:274px;top:60px;width:12px;height:300px;background:#cfd6ee}
.scale .foot{position:absolute;left:180px;top:350px;width:200px;height:18px;background:#cfd6ee}
.scale .beam{position:absolute;left:20px;top:54px;width:520px;height:14px;background:#fff;transform-origin:50% 50%}
.scale .pivot{position:absolute;left:266px;top:47px;width:28px;height:28px;border-radius:50%;background:var(--gold)}
.pan{position:absolute;top:7px;width:0;height:0;transform-origin:0 0}
.pan.l{left:10px}.pan.r{left:510px}
.pan .str{position:absolute;left:-1px;top:0;width:3px;height:120px;background:#cfd6ee}
.pan .dish{position:absolute;left:-90px;top:120px;width:180px;height:28px;border-radius:0 0 90px 90px;background:#cfd6ee}
.pan .pl{position:absolute;left:-100px;width:200px;top:160px;text-align:center;font:900 32px var(--f-body);color:#fff}
.sc-v{font:900 56px/1.1 var(--f-disp);font-synthesis:none;text-align:center}
.wstrip{background:var(--red);color:#fff;font:900 40px var(--f-body);padding:14px 36px}

/* ---------- build ---------- */
.fb{display:flex;flex-direction:column;align-items:center;gap:12px}
.fb small{font:900 56px var(--f-body);color:var(--cyan)}
.fb b{font:900 190px/1 var(--f-disp);font-synthesis:none;color:#fff}
.fb em{font:900 36px var(--f-body);font-style:normal;color:#b9c6e6}
.fband>div{width:2600px;padding:40px 0;background:var(--cyan);transform:rotate(-6deg);display:flex;justify-content:center}
.fband small,.fband b,.fband em{color:#07060d}
.fstroke b{color:transparent;-webkit-text-stroke:6px var(--cyan)}
.flist{display:flex;flex-direction:column}
.flist>div{display:grid;grid-template-columns:56px 220px auto;align-items:center;gap:14px;height:84px;font:900 40px var(--f-body);color:#fff}
.flist i{font-style:normal;color:var(--lime)}
.flist span{color:#9fb3d9;font-size:34px}

/* ---------- final ---------- */
.crack{position:absolute;inset:0;filter:drop-shadow(0 0 6px #fff)}
.crack path{fill:none;stroke:#fff;stroke-width:3;stroke-dasharray:1;stroke-dashoffset:1;animation:crack .25s ease-out forwards}
@keyframes crack{to{stroke-dashoffset:0}}
.res{width:1500px;box-sizing:border-box;padding:30px 50px;background:linear-gradient(180deg,rgba(30,20,4,.93),rgba(10,6,0,.95));border:4px solid var(--gold);box-shadow:0 0 0 2px #07060d,0 0 80px rgba(255,210,63,.45);white-space:normal;display:flex;flex-direction:column;gap:14px}
.res-h{display:flex;align-items:baseline;justify-content:space-between;border-bottom:2px solid rgba(255,210,63,.5);padding-bottom:12px}
.res-h .hudf{font-size:44px;color:var(--gold)}
.res-h .jp{font-size:28px;color:#e8dcc0}
.rg{display:grid;grid-template-columns:420px repeat(3,1fr);row-gap:4px;align-items:center}
.rg .hh{font:700 26px var(--f-body);color:#bfb49a;text-align:center}
.rg .l{font:900 34px/1.2 var(--f-body);color:#fff}
.rg .l small{display:block;font-size:22px;color:#bfb49a}
.rg .v{font:900 68px/1.05 var(--f-disp);font-synthesis:none;text-align:center;color:#fff}
.rr{display:grid;grid-template-columns:420px 1fr;align-items:center;min-height:58px;border-top:1px solid rgba(255,255,255,.14)}
.rr span{font:900 30px var(--f-body);color:#bfb49a}
.rr b{font:900 36px var(--f-body);color:#fff}
.rr b.gold{color:var(--gold);font-size:42px}
.goal{display:flex;align-items:center;gap:24px;background:var(--gold);color:#07060d;padding:16px 26px;font:900 40px var(--f-body)}
.goal .hudf{font-size:26px;border:3px solid #07060d;padding:6px 10px}
.wipe{position:absolute;top:-20%;left:-10%;width:120%;height:140%;background:linear-gradient(90deg,var(--lime) 0 3%,#07060d 3% 97%,var(--lime) 97%)}

/* ---------- HUD ---------- */
#hud{position:absolute;inset:0;pointer-events:none;font-family:var(--f-hud);color:rgba(235,245,255,.92)}
#hud.off{display:none}
.hud-top{position:absolute;left:40px;right:40px;top:22px;height:44px;display:flex;align-items:center;justify-content:space-between;gap:24px}
.hud-l,.hud-r{display:flex;align-items:center;gap:18px}
.hud-chip{font:900 20px/1 var(--f-body);background:#fff;color:#000;padding:8px 12px}
.hud-t{font-size:20px;letter-spacing:.22em;font-weight:700}
#hud-genre{font-size:20px;letter-spacing:.3em;color:var(--gold);padding:7px 14px 5px;border:2px solid var(--gold);font-weight:700}
.hud-bot{position:absolute;left:40px;right:40px;bottom:18px;height:44px;display:flex;align-items:center;gap:22px}
#hud-mode{font-size:20px;letter-spacing:.2em;min-width:150px;font-weight:700;color:var(--lime)}
#hud-mode.p{color:var(--gold)}
#hud-time{font-size:20px;letter-spacing:.12em;font-weight:700;min-width:210px;text-align:right}
.ticker{flex:1;overflow:hidden;height:30px;border-inline:2px solid rgba(255,255,255,.25);position:relative;mask-image:linear-gradient(90deg,transparent,#000 6%,#000 94%,transparent);-webkit-mask-image:linear-gradient(90deg,transparent,#000 6%,#000 94%,transparent)}
.ticker-in{position:absolute;left:0;top:0;white-space:nowrap;font:700 21px/30px var(--f-body);color:rgba(235,245,255,.75);animation:tick 70s linear infinite}
.ticker-in em{font-style:normal;color:var(--gold);margin:0 18px}
@keyframes tick{to{transform:translateX(-50%)}}
#prog{position:absolute;left:0;right:0;bottom:0;height:6px;display:flex;gap:4px}

.corner.a{left:12px;top:12px;border-right:0;border-bottom:0}.corner.b{right:12px;top:12px;border-left:0;border-bottom:0}
.corner.c{left:12px;bottom:12px;border-right:0;border-top:0}.corner.d{right:12px;bottom:12px;border-left:0;border-top:0}

/* ---------- controls (outside the stage, not scaled) ---------- */
#ctrl{position:fixed;left:50%;bottom:calc(14px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);display:flex;flex-wrap:wrap;justify-content:center;gap:8px;align-items:center;padding:8px 10px;max-width:calc(100vw - 32px);box-sizing:border-box;background:rgba(10,10,18,.86);border:1px solid rgba(255,255,255,.22);border-radius:6px;transition:opacity .3s;z-index:10}

#ctrl button{font:700 15px/1 var(--f-hud);color:#fff;background:transparent;border:1px solid rgba(255,255,255,.35);border-radius:4px;padding:9px 12px;min-width:44px;min-height:36px;cursor:pointer}

@media (max-width:640px){#ctrl .keys{display:none}}

<body>
<div id="viewport">
  <div id="stage">
    <div id="cam">
      <canvas id="bg"></canvas>
      <div id="layer"></div>
      <div id="out"></div>
      <canvas id="fx"></canvas>
    </div>
    <div id="overlay"></div>
    <div id="noise"></div>
    <div id="hud">
      <i class="corner a"></i><i class="corner b"></i><i class="corner c"></i><i class="corner d"></i>
      <div class="hud-top">
        <div class="hud-l"><span class="hud-chip">展望レポート</span><span class="hud-t">2026.07 // 基本的見解</span></div>
        <div class="hud-r"><span id="hud-genre">HOOK</span><span id="hud-stage" class="hud-t">STAGE 01/11</span></div>
      </div>
      <div class="hud-bot">
        <span id="hud-mode">▶ AUTO</span>
        <div class="ticker"><div class="ticker-in" id="ticker"></div></div>
        <span id="hud-time" class="tabnum">00:00.0</span>
      </div>
      <div id="prog"></div>
    </div>
    <div id="flash"></div>
  </div>
  <div id="ctrl" role="toolbar" aria-label="再生コントロール">
    <button id="b-prev" type="button" aria-label="前のステージ">◀◀</button>
    <button id="b-play" type="button" aria-label="一時停止">❚❚</button>
    <button id="b-next" type="button" aria-label="次のステージ">▶▶</button>
    <button id="b-re" type="button" aria-label="最初から再生">⟲</button>
    <button id="b-fs" type="button" aria-label="全画面">⛶</button>
    <span class="keys">Space 停止/再開 · ←→ 前後 · R 最初から · F 全画面 · H HUD</span>
  </div>
</div>
<script id="main">
(() => {
'use strict';
/* =========================================================
   素材データ（出典：日本銀行「経済・物価情勢の展望（2026年7月）【基本的見解】」）
   数値はすべて原文の「政策委員の大勢見通し」中央値・幅
   ========================================================= */
const DATA = {
  gdp:  [ {fy:'2026', v:0.6, apr:0.5, range:'+0.6～+0.7'}, {fy:'2027', v:0.8, apr:0.7, range:'+0.7～+0.8'}, {fy:'2028', v:0.8, apr:0.8, range:'+0.7～+0.8'} ],
  cpi:  [ {fy:'2026', v:2.5, apr:2.8, range:'+2.3～+2.7'}, {fy:'2027', v:2.4, apr:2.3, range:'+2.2～+2.5'}, {fy:'2028', v:2.0, apr:2.0, range:'+2.0～+2.2'} ],
  core: [ {fy:'2026', v:2.5}, {fy:'2027', v:2.6}, {fy:'2028', v:2.2} ],
};
const TICKER = ['景気は緩やかに回復','企業収益は高水準','労働需給は引き締まった状態','消費者物価（除く生鮮）は2026年度後半以降 2%をはっきり上回る水準へ','その後 見通し期間後半に2%程度へ','物価の見通しは上振れリスクの方が大きい','金融環境は緩和した状態','引き続き政策金利を引き上げ、金融緩和の度合いを調整','原油（ドバイ）1バレル80ドル程度→見通し期間終盤70ドル程度の想定'];

/* ---------- basics ---------- */
const $ = s => document.querySelector(s);
const W = 1920, H = 1080, CX = 960, CY = 540;
const RM = matchMedia('(prefers-reduced-motion: reduce)').matches;
const rnd = (a, b) => a + Math.random() * (b - a);
const OUT = 'cubic-bezier(.16,1,.3,1)', BACK = 'cubic-bezier(.34,1.56,.64,1)', IN = 'cubic-bezier(.7,0,.84,0)', SNAP = 'cubic-bezier(.85,0,.15,1)';
const eOut = k => 1 - Math.pow(1 - k, 3), eInOut = k => k < .5 ? 4*k*k*k : 1 - Math.pow(-2*k + 2, 3) / 2, eExpo = k => k >= 1 ? 1 : 1 - Math.pow(2, -10*k);

function h(tag, cls, html, parent, style) {
  const e = document.createElement(tag);
  if (cls) e.className = cls;
  if (html != null) e.innerHTML = html;
  if (style) Object.assign(e.style, style);
  if (parent) parent.appendChild(e);
  return e;
}
/* 位置決めラッパー（translateで中心合わせ）＋ アニメ用の中身を返す */
function P(parent, x, y, cls, html, style, ax = .5, ay = .5) {
  const w = h('div', 'pos', null, parent, {left: x + 'px', top: y + 'px', transform: `translate(${-ax*100}%,${-ay*100}%)`});
  return h('div', cls, html, w, style);
}
function A(el, kf, dur, ease = OUT, o = {}) {
  return el.animate(kf, Object.assign({fill: 'both'}, o, {duration: dur * 1000, easing: ease, delay: (o.delay || 0) * 1000}));
}
const fx = {
  slam(el, {from = 3, dur = .3, rot = 0, blur = 18, delay = 0} = {}) {
    return A(el, [
      {transform: `scale(${from}) rotate(${rot}deg)`, opacity: 0, filter: `blur(${blur}px)`},
      {transform: 'scale(.94) rotate(0deg)', opacity: 1, filter: 'blur(0px)', offset: .72},
      {transform: 'scale(1) rotate(0deg)', opacity: 1, filter: 'none'}], dur, 'cubic-bezier(.3,.7,.2,1)', {delay});
  },
  pop(el, {dur = .38, delay = 0} = {}) {
    return A(el, [{transform: 'scale(0)', opacity: 0}, {transform: 'scale(1.2)', opacity: 1, offset: .6}, {transform: 'scale(1)', opacity: 1}], dur, 'ease-out', {delay});
  },
  from(el, {x = 0, y = 0, dur = .4, delay = 0, blur = 0, ease = OUT, rot = 0, scale = 1} = {}) {
    return A(el, [{transform: `translate(${x}px,${y}px) rotate(${rot}deg) scale(${scale})`, opacity: 0, filter: `blur(${blur}px)`}, {transform: 'none', opacity: 1, filter: 'none'}], dur, ease, {delay});
  },
  out(el, {dur = .25, scale = 1.25, delay = 0} = {}) {
    return A(el, [{opacity: 1, transform: 'scale(1)'}, {opacity: 0, transform: `scale(${scale})`}], dur, IN, {delay});
  },
  glitch(el, d = .35) {
    const kf = [];
    for (let i = 0; i < 8; i++) {
      const y1 = rnd(0, 70), y2 = Math.min(100, y1 + rnd(10, 40));
      kf.push({transform: `translate(${rnd(-36,36)}px,${rnd(-8,8)}px) skewX(${rnd(-14,14)}deg)`, clipPath: `inset(${y1}% 0 ${100-y2}% 0)`, easing: 'steps(1,end)'});
    }
    kf.push({transform: 'none', clipPath: 'inset(0% 0 0% 0)'});
    return el.animate(kf, {duration: d * 1000, easing: 'linear'});
  },
  blink(el, n = 3, d = .6) { return el.animate([{opacity: 1}, {opacity: .12}, {opacity: 1}], {duration: d / n * 1000, iterations: n, easing: 'steps(2,end)'}); },
};

/* ---------- flash / camera ---------- */
let lastFlash = 0;
function flash(col = '#fff', dur = .3, peak = 1) {
  const now = performance.now();
  if (now - lastFlash < 300) peak *= .45;           // 光の点滅は 1秒あたり約3回以下に抑える
  lastFlash = now;
  if (RM) peak *= .3;
  const f = h('div', 'flash', null, $('#flash'), {background: col});
  f.animate([{opacity: peak}, {opacity: 0}], {duration: dur * 1000, easing: 'ease-out', fill: 'forwards'}).onfinish = () => f.remove();
}
const CAM = {z: 1, r: 0, x: 0, y: 0, pz: 0, amp: 0, t: 0, d: 1};
function shake(a = 20, d = .4) {
  if (RM) a *= .15;
  const cur = CAM.t > 0 ? CAM.amp * (CAM.t / CAM.d) : 0;
  if (a >= cur) { CAM.amp = a; CAM.t = d; CAM.d = d; }
}
function punch(z = .06) { CAM.pz = Math.max(CAM.pz, RM ? z * .2 : z); }
function camReset() { Object.assign(CAM, {z: 1, r: 0, x: 0, y: 0, pz: 0, t: 0}); }
function camStep(dt) {
  if (dt <= 0) return;
  CAM.t = Math.max(0, CAM.t - dt);
  CAM.pz *= Math.exp(-dt * 8);
  let sx = 0, sy = 0, sr = 0;
  if (CAM.t > 0) { const k = CAM.t / CAM.d, a = CAM.amp * k * k; sx = rnd(-a, a); sy = rnd(-a, a); sr = rnd(-a, a) * .02; }
  $('#cam').style.transform = `translate(${CAM.x + sx}px,${CAM.y + sy}px) rotate(${CAM.r + sr}deg) scale(${CAM.z + CAM.pz})`;
}

/* ---------- background canvas (half resolution) ---------- */
const BG = (() => {
  const cv = $('#bg'), g = cv.getContext('2d'), w = 960, hh = 540;
  cv.width = w; cv.height = hh;
  const D = {mode: 'dark', hue: 340, hue2: 190, speed: 1, energy: .5};
  const S = Object.assign({}, D);
  let t = 0, pulse = 0;
  const dust = Array.from({length: 80}, () => ({x: Math.random()*w, y: Math.random()*hh, z: rnd(.3, 1), p: rnd(0, 6.28)}));
  const NUMS = ['0.6','0.8','2.5','2.4','2.0','2.2','2.6','%','+','80','70','2%'];
  const cols = Array.from({length: 30}, (_, i) => ({x: i*32 + 8, y: rnd(0, hh), v: rnd(30, 110), s: Array.from({length: 12}, () => NUMS[Math.random()*NUMS.length | 0])}));
  const set = o => Object.assign(S, D, o || {});
  const mod = o => Object.assign(S, o);
  const kick = (v = 1) => { pulse = Math.min(1.6, pulse + v); };
  function step(dt) { if (dt <= 0) return; t += dt * S.speed; pulse = Math.max(0, pulse - dt * 1.8); draw(dt); }
  function draw(dt) {
    const e = Math.min(1.6, S.energy + pulse * .7), H1 = S.hue, H2 = S.hue2, m = S.mode;
    g.globalCompositeOperation = 'source-over'; g.globalAlpha = 1;
    const gr = g.createRadialGradient(w/2, hh/2, 20, w/2, hh/2, w*.75);
    gr.addColorStop(0, `hsl(${H1},60%,${5 + e*9}%)`); gr.addColorStop(1, `hsl(${H1},50%,2%)`);
    g.fillStyle = gr; g.fillRect(0, 0, w, hh);
    if (m === 'grid') {
      const hz = hh * .56;
      g.lineWidth = 1.2; g.strokeStyle = `hsla(${H1},100%,62%,${.18 + e*.3})`;
      g.beginPath(); for (let i = -18; i <= 18; i++) { g.moveTo(w/2 + i*10, hz); g.lineTo(w/2 + i*150, hh); } g.stroke();
      for (let i = 0; i < 16; i++) { const z = (i + (t*1.4) % 1) / 16, y = hz + (hh - hz) * z * z; g.globalAlpha = Math.min(1, z*1.6); g.beginPath(); g.moveTo(0, y); g.lineTo(w, y); g.stroke(); }
      g.globalAlpha = 1; g.strokeStyle = `hsla(${H2},100%,62%,${.07 + e*.12})`;
      g.beginPath(); for (let i = -18; i <= 18; i++) { g.moveTo(w/2 + i*10, hz - 60); g.lineTo(w/2 + i*150, 0); } g.stroke();
      for (let i = 0; i < 10; i++) { const z = (i + (t*1.4) % 1) / 10, y = (hz - 60) * (1 - z*z); g.globalAlpha = z * .6; g.beginPath(); g.moveTo(0, y); g.lineTo(w, y); g.stroke(); }
      g.globalAlpha = 1;
      const hg = g.createLinearGradient(0, hz - 80, 0, hz + 30);
      hg.addColorStop(0, 'rgba(0,0,0,0)'); hg.addColorStop(.7, `hsla(${H1},100%,60%,${.22 + e*.25})`); hg.addColorStop(1, 'rgba(0,0,0,0)');
      g.fillStyle = hg; g.fillRect(0, hz - 80, w, 110);
    } else if (m === 'rays' || m === 'fever') {
      const n = 22, rot = t * .22, fev = m === 'fever';
      g.save(); g.translate(w/2, hh/2);
      for (let i = 0; i < n; i++) {
        const a0 = rot + i * 6.2832 / n, a1 = a0 + 6.2832 / n * .55, hu = fev ? (t*120 + i*33) % 360 : (i % 2 ? H1 : H2);
        g.fillStyle = `hsla(${hu},100%,${fev ? 60 : 55}%,${(fev ? .2 : .08) + e*.18})`;
        g.beginPath(); g.moveTo(0, 0); g.arc(0, 0, 1200, a0, a1); g.closePath(); g.fill();
      }
      g.restore();
      const cg = g.createRadialGradient(w/2, hh/2, 0, w/2, hh/2, 300);
      cg.addColorStop(0, `hsla(${H1},100%,75%,${.12 + e*.3})`); cg.addColorStop(1, 'rgba(0,0,0,0)');
      g.fillStyle = cg; g.fillRect(0, 0, w, hh);
    } else if (m === 'tunnel') {
      g.save(); g.translate(w/2, hh/2);
      for (let i = 0; i < 18; i++) { const z = ((i/18) + t*.9) % 1, s = Math.pow(z, 2.4) * 1.3; g.strokeStyle = `hsla(${H1 + i*8},100%,60%,${z * (.25 + e*.5)})`; g.lineWidth = 1 + z*7; g.strokeRect(-w*s/2, -hh*s/2, w*s, hh*s); }
      g.restore();
    } else if (m === 'data') {
      g.strokeStyle = `hsla(${H1},80%,55%,.08)`; g.lineWidth = 1; g.beginPath();
      for (let x = 0; x <= w; x += 40) { g.moveTo(x, 0); g.lineTo(x, hh); }
      for (let y = 0; y <= hh; y += 40) { g.moveTo(0, y); g.lineTo(w, y); }
      g.stroke();
      g.font = '600 13px ui-monospace,monospace'; g.fillStyle = `hsla(${H1},100%,70%,${.12 + e*.16})`;
      for (const c of cols) { c.y += c.v * dt * S.speed; if (c.y - 12*18 > hh) c.y = -rnd(0, 200); for (let j = 0; j < c.s.length; j++) { g.globalAlpha = 1 - j / c.s.length; g.fillText(c.s[j], c.x, c.y - j*18); } }
      g.globalAlpha = 1;
    } else if (m === 'stripes') {
      const off = (t * 80) % 100; g.fillStyle = `hsla(0,100%,45%,${.08 + e*.14})`;
      for (let x = -hh - 100; x < w + 100; x += 100) { g.beginPath(); g.moveTo(x + off, 0); g.lineTo(x + off + 50, 0); g.lineTo(x + off + 50 + hh, hh); g.lineTo(x + off + hh, hh); g.closePath(); g.fill(); }
      const pul = (Math.sin(t*7) + 1) / 2; g.fillStyle = `rgba(255,0,30,${.04 + pul*.12*e})`; g.fillRect(0, 0, w, hh);
    }
    g.globalCompositeOperation = 'lighter';
    g.fillStyle = `hsl(${H2},100%,75%)`;
    for (const d of dust) {
      d.y -= d.z * 14 * dt * S.speed; d.x += Math.sin(t + d.p) * 4 * dt;
      if (d.y < -4) { d.y = hh + 4; d.x = Math.random() * w; }
      g.globalAlpha = (.25 + .35 * Math.sin(t*2 + d.p) ** 2) * d.z * (.4 + e*.5);
      g.fillRect(d.x, d.y, 1.6*d.z + .4, 1.6*d.z + .4);
    }
    g.globalAlpha = 1; g.globalCompositeOperation = 'source-over';
  }
  return {set, mod, kick, step};
})();

/* ---------- particle / fx canvas ---------- */
const FX = (() => {
  const cv = $('#fx'), g = cv.getContext('2d');
  cv.width = W; cv.height = H;
  let ps = [], speed = null, rain = null, imp = null;
  const spr = {};
  const pick = a => a[Math.random() * a.length | 0];
  function sprite(c) {
    if (spr[c]) return spr[c];
    const s = document.createElement('canvas'); s.width = s.height = 64;
    const x = s.getContext('2d'), gr = x.createRadialGradient(32, 32, 0, 32, 32, 32);
    gr.addColorStop(0, 'rgba(255,255,255,1)'); gr.addColorStop(.3, c); gr.addColorStop(1, 'rgba(0,0,0,0)');
    x.fillStyle = gr; x.fillRect(0, 0, 64, 64);
    return spr[c] = s;
  }
  const add = p => { if (ps.length < 1600) ps.push(p); };
  function burst(x, y, o = {}) {
    const n = Math.round((o.n ?? 80) * (RM ? .4 : 1)), cols = o.colors || ['#ffffff','#ffd23f','#ff2d6f'], sp = o.speed || [300, 1400], lf = o.life || [.5, 1.1], sz = o.size || [2, 5], spread = o.spread ?? Math.PI * 2, dir = o.dir ?? 0, jx = o.jx || 0, jy = o.jy || 0;
    for (let i = 0; i < n; i++) {
      const a = dir + rnd(-spread/2, spread/2), v = rnd(sp[0], sp[1]);
      add({k: o.type || 'spark', x: x + rnd(-jx, jx), y: y + rnd(-jy, jy), vx: Math.cos(a)*v, vy: Math.sin(a)*v, l: 0, L: rnd(lf[0], lf[1]), s: rnd(sz[0], sz[1]), c: pick(cols), g: o.grav ?? 600, dr: o.drag ?? 2.2, r: rnd(0, 6.28), vr: rnd(-12, 12)});
    }
  }
  const ring = (x, y, o = {}) => add({k: 'ring', x, y, l: 0, L: o.life ?? .55, r0: o.r0 ?? 20, r1: o.r1 ?? 900, w: o.w ?? 14, c: o.color || '#fff'});
  function confetti(n, o = {}) {
    const cols = o.colors || ['#ffd23f','#ff2d6f','#19e8ff','#a6ff3a','#ffffff','#8b5cff'];
    for (let i = 0; i < n; i++) {
      const top = o.x == null;
      add({k: 'conf', x: top ? rnd(0, W) : o.x + rnd(-40, 40), y: top ? rnd(-200, -20) : o.y, vx: top ? rnd(-80, 80) : rnd(-900, 900), vy: top ? rnd(150, 420) : rnd(-1500, -500), l: 0, L: rnd(2.5, 4.5), s: rnd(8, 16), c: pick(cols), g: top ? 120 : 900, dr: top ? .3 : 1.4, r: rnd(0, 6.28), vr: rnd(-8, 8)});
    }

const E = {i: 0, t: 0, playing: true, ended: false, cues: [], ci: 0, ticks: new Set(), slide: null};
function makeCtx(root) {
  return {
    root,
    at(t, fn) { const q = E.cues; let i = q.length; while (i > E.ci && q[i-1].t > t) i--; q.splice(i, 0, {t, fn}); },
    tick(f) { E.ticks.add(f); return f; },
    untick(f) { E.ticks.delete(f); },
  };
}
function count(c, el, to, dur, {from = 0, dec = 1, sign = true, ease = eOut, onStep, onDone} = {}) {
  const t0 = E.t;
  const f = c.tick(t => {
    const k = Math.min(1, (t - t0) / dur), v = from + (to - from) * ease(k);
    el.textContent = (sign && v > .0001 ? '+' : '') + v.toFixed(dec);
    if (onStep) onStep(v, k);
    if (k >= 1) { c.untick(f); if (onDone) onDone(); }
  });
}
function typeOn(c, el, text, cps = 30, onDone) {
  const t0 = E.t;
  const f = c.tick(t => {
    const n = Math.min(text.length, Math.floor((t - t0) * cps) + 1);
    el.innerHTML = text.slice(0, n) + (n < text.length ? '<span class="cur">▍</span>' : '');
    if (n >= text.length) { c.untick(f); if (onDone) onDone(); }
  });
}
function camTo(c, to, dur, ease = eInOut) {
  const from = {z: CAM.z, r: CAM.r, x: CAM.x, y: CAM.y}, t0 = E.t;

    const k = Math.min(1, (t - t0) / dur), e = ease(k);
    for (const key in to) CAM[key] = from[key] + (to[key] - from[key]) * e;

  });
}

      <div class="rr" data-row><span>金融環境</span><b>緩和した状態が維持</b></div>
      <div class="rr" data-row><span>金融政策運営</span><b class="gold">引き続き政策金利を引き上げ</b></div>
      <div class="goal" data-row><span class="hudf">MISSION</span>2%の「物価安定の目標」の持続的・安定的な実現</div>`);
    A(res, [{transform: 'scaleY(0)', opacity: 0}, {transform: 'scaleY(1)', opacity: 1}], .3, OUT);
    res.querySelectorAll('[data-row]').forEach(el => { el.style.opacity = 0; });
  });
  c.at(6.8, () => { res.querySelectorAll('.v').forEach((el, j) => { if (j < 3) { count(c, el, +el.dataset.v, .5); fx.pop(el, {delay: j*.06}); } }); shake(10, .15); });
  c.at(7.15, () => { res.querySelectorAll('.v').forEach((el, j) => { if (j >= 3) { count(c, el, +el.dataset.v, .5); fx.pop(el, {delay: (j - 3)*.06}); } }); shake(10, .15); });
  [7.55, 7.85, 8.15].forEach((t, j) => c.at(t, () => {
    const el = res.querySelectorAll('[data-row]')[j];
    fx.from(el, {x: -60, dur: .25, blur: 6}); shake(j === 2 ? 22 : 8, .2);
    if (j === 2) { flash('#ffd23f', .25, .5); punch(.04); FX.burst(CX, 740, {n: 90, colors: ['#ffd23f','#ffffff'], speed: [400, 1400], jx: 400}); }
  }));
  c.at(8.7, () => {
    const el = res.querySelectorAll('[data-row]')[3];
    fx.slam(el, {from: 1.6, dur: .3}); shake(26, .35); flash('#fff', .25, .6);
    FX.confetti(90, {x: CX, y: 860});
  });
  c.at(9.95, () => {
    A(res, [{transform: 'scale(1)', opacity: 1, filter: 'none'}, {transform: 'scale(1.8)', opacity: 0, filter: 'blur(20px)'}], .3, IN);
    FX.burst(CX, 560, {n: 260, colors: ['#ffd23f','#ffffff','#ff9d00'], speed: [500, 2200], jx: 700, jy: 330, life: [.5, 1.2]});
    flash('#fff', .5, 1); shake(40, .6);
  });
  c.at(10.3, () => {
    flash('#ffd23f', .5, .8);
    BG.set({mode: 'fever', hue: 45, energy: 1.2, speed: 1.1}); BG.kick(1.6);
    shake(60, 1.2); punch(.14);
    [0, .1, .2].forEach((d, j) => FX.ring(CX, 470, {color: ['#ffffff','#ffd23f','#ff2d6f'][j], r1: 1500 - j*200, w: 40 - j*10, life: .7 + d}));
    FX.burst(CX, 470, {n: 300, colors: ['#ffffff','#ffd23f','#ff2d6f','#19e8ff','#a6ff3a'], speed: [900, 2800], life: [.7, 1.5], size: [2, 7]});
    FX.confetti(260, {x: CX, y: 700});
    FX.rainOn({rate: 45});
    const f = P(r, CX, 470, 'disp goldx', '利上げ、継続へ。', {fontSize: '210px'});
    fx.slam(f, {from: 5, dur: .34, blur: 26});
    camTo(c, {z: 1.05}, 5.5, eOut);
  });
  c.at(11.1, () => { const s = P(r, CX, 690, 'jp', '基調的な物価上昇率を 2%程度で安定させるために', {fontSize: '54px', color: '#fff', textShadow: '0 0 24px rgba(0,0,0,.9)'}); fx.from(s, {y: 40, dur: .4}); shake(10, .2); });
  c.at(11.8, () => { const s = P(r, CX, 790, 'jp', '経済・物価・金融情勢に応じて、引き続き政策金利を引き上げ、金融緩和の度合いを調整していく', {fontSize: '28px', color: '#ffe9b0', background: 'rgba(0,0,0,.55)', padding: '6px 22px'}); fx.from(s, {y: 20, dur: .4}); });
  c.at(12.2, () => { const s = P(r, CX, 470, 'disp sweep', '利上げ、継続へ。', {fontSize: '210px'}); A(s, [{backgroundPosition: '120% 0'}, {backgroundPosition: '-40% 0'}], 1.1, 'ease-in-out'); });
  c.at(12.9, () => { const s = P(r, CX, 930, 'jp', '出典：日本銀行「経済・物価情勢の展望（2026年7月）【基本的見解】」をもとに作成した非公式の要約演出です', {fontSize: '22px', color: 'rgba(255,255,255,.8)', background: 'rgba(0,0,0,.6)', padding: '6px 18px', fontWeight: 700}); fx.from(s, {dur: .5}); });
}},
];

/* ---------- transitions ---------- */
function freeze(node) { node.getAnimations({subtree: true}).forEach(a => { try { a.commitStyles(); } catch (e) {} a.cancel(); }); }
const TR = {
  cut(n) { n.remove(); },
  zoom(n) { A(n, [{transform: 'scale(1)', filter: 'blur(0px)', opacity: 1}, {transform: 'scale(2.4)', filter: 'blur(16px)', opacity: 0}], .42, IN).onfinish = () => n.remove(); flash('#fff', .4, .9); },
  spin(n) { A(n, [{transform: 'rotate(0deg) scale(1)', opacity: 1}, {transform: 'rotate(-40deg) scale(.05)', opacity: .2}], .42, IN).onfinish = () => n.remove(); flash('#fff', .3, .6); },
  shatter(n) {
    const cols = 4, rows = 3, pts = [];
    for (let j = 0; j <= rows; j++) { pts[j] = []; for (let i = 0; i <= cols; i++) { const ex = i === 0 || i === cols, ey = j === 0 || j === rows; pts[j][i] = [i / cols * 100 + (ex ? 0 : rnd(-7, 7)), j / rows * 100 + (ey ? 0 : rnd(-9, 9))]; } }
    const par = n.parentNode;
    for (let j = 0; j < rows; j++) for (let i = 0; i < cols; i++) {
      const p = [pts[j][i], pts[j][i+1], pts[j+1][i+1], pts[j+1][i]];
      const cl = n.cloneNode(true); cl.style.clipPath = 'polygon(' + p.map(q => q[0] + '% ' + q[1] + '%').join(',') + ')';
      par.appendChild(cl);
      const cx = (p[0][0] + p[2][0]) / 2 - 50, cy = (p[0][1] + p[2][1]) / 2 - 50;
      A(cl, [{transform: 'none', opacity: 1}, {transform: `translate(${cx * rnd(14, 24)}px,${cy * rnd(14, 24) + 300}px) rotate(${rnd(-50, 50)}deg) scale(${rnd(.6, .9)})`, opacity: 0}], rnd(.5, .7), 'cubic-bezier(.4,0,.8,.5)', {delay: Math.hypot(cx, cy) * .002}).onfinish = () => cl.remove();
    }
    n.remove(); flash('#fff', .3, .8); shake(18, .3);
  },
  split(n) {
    const a = n.cloneNode(true); a.style.clipPath = 'inset(0 0 50% 0)'; n.style.clipPath = 'inset(50% 0 0 0)'; n.parentNode.appendChild(a);
    A(a, [{transform: 'none'}, {transform: 'translateY(-110%) rotate(-3deg)'}], .45, IN).onfinish = () => a.remove();
    A(n, [{transform: 'none'}, {transform: 'translateY(110%) rotate(3deg)'}], .45, IN).onfinish = () => n.remove();
    flash('#fff', .25, .5);
  },
  glitch(n) {
    const k = [];
    for (let i = 0; i < 7; i++) k.push({transform: `translate(${rnd(-90, 90)}px,${rnd(-20, 20)}px) skewX(${rnd(-20, 20)}deg)`, clipPath: `inset(${rnd(0, 55)}% 0 ${rnd(0, 40)}% 0)`, filter: `hue-rotate(${rnd(0, 360)}deg) saturate(3)`, opacity: 1, easing: 'steps(1,end)'});
    k.push({opacity: 0});
    A(n, k, .38, 'linear').onfinish = () => n.remove();
  },
  invert(n) { n.style.filter = 'invert(1) hue-rotate(180deg)'; A(n, [{transform: 'scale(1)', opacity: 1}, {transform: 'scale(1.25)', opacity: 0}], .32, IN).onfinish = () => n.remove(); flash('#fff', .2, .5); },
  wipe(n) {
    const b = h('div', 'wipe', null, $('#out'));
    A(b, [{transform: 'translateX(-130%) skewX(-18deg)'}, {transform: 'translateX(130%) skewX(-18deg)'}], .55, SNAP).onfinish = () => b.remove();
    A(n, [{opacity: 1}, {opacity: 1, offset: .45}, {opacity: 0, offset: .46}, {opacity: 0}], .55, 'linear').onfinish = () => n.remove();
  },
};

/* ---------- player ---------- */
const OFF = []; let TOTAL = 0;
SLIDES.forEach((s, i) => { OFF[i] = TOTAL; TOTAL += s.dur; });
const fmtT = s => { const m = Math.floor(s / 60), r = s - m * 60; return String(m).padStart(2, '0') + ':' + r.toFixed(1).padStart(4, '0'); };

function go(i, mode) {
  i = Math.max(0, Math.min(SLIDES.length - 1, i));
  const out = $('#out');
  if (E.slide) {
    const old = E.slide;
    freeze(old);
    if (mode === 'manual') out.innerHTML = '';
    out.appendChild(old);
    (TR[mode === 'manual' ? 'glitch' : SLIDES[E.i].trans] || TR.cut)(old);
  }
  E.i = i; E.t = 0; E.ci = 0; E.cues = []; E.ticks.clear(); E.ended = false;
  FX.stopStreams(); camReset();
  const def = SLIDES[i];
  BG.set(def.bg);
  const root = h('div', 'slide', null, $('#layer'));
  E.slide = root;
  def.build(makeCtx(root));
  const g = $('#hud-genre'); g.textContent = def.genre; fx.glitch(g, .3);
  $('#hud-stage').textContent = `STAGE ${String(i + 1).padStart(2, '0')}/${SLIDES.length}`;
  hudMode();
}
function end() { E.ended = true; hudMode(); }
let pausedAnims = [];
function setPlaying(p) {
  if (p === E.playing) return;
  E.playing = p;
  if (!p) { pausedAnims = document.getAnimations().filter(a => a.playState === 'running'); pausedAnims.forEach(a => a.pause()); }
  else { pausedAnims.forEach(a => { try { a.play(); } catch (e) {} }); pausedAnims = []; }
  hudMode();
}
function restart() { $('#out').innerHTML = ''; FX.clear(); setPlaying(true); go(0, 'manual'); }
function toggle() { if (E.ended) restart(); else setPlaying(!E.playing); }
function nav(d) { setPlaying(true); if (d > 0 && E.i === SLIDES.length - 1) { E.t = SLIDES[E.i].dur; return; } go(E.i + d, 'manual'); }
function hudMode() {
  const m = $('#hud-mode');
  m.textContent = E.ended ? '■ END · R' : E.playing ? '▶ AUTO' : '❚❚ PAUSE';
  m.classList.toggle('p', !E.playing || E.ended);
  const b = $('#b-play'); b.textContent = E.playing && !E.ended ? '❚❚' : '▶'; b.setAttribute('aria-label', E.playing && !E.ended ? '一時停止' : '再生');
}

let last = performance.now();
function loop(now) {
  let dt = (now - last) / 1000; last = now;
  if (dt > .25) dt = .25;
  const pdt = E.playing ? dt : 0;
  if (E.playing && !E.ended) {
    E.t += dt;
    while (E.ci < E.cues.length && E.cues[E.ci].t <= E.t) { const q = E.cues[E.ci++]; try { q.fn(); } catch (err) { console.error(err); } }
    for (const f of [...E.ticks]) f(E.t, dt);
    if (E.t >= SLIDES[E.i].dur) { if (E.i < SLIDES.length - 1) go(E.i + 1, 'auto'); else end(); }
  }
  BG.step(pdt); FX.step(pdt); camStep(pdt);
  const tot = OFF[E.i] + Math.min(E.t, SLIDES[E.i].dur);
  $('#hud-time').textContent = fmtT(tot) + ' / ' + fmtT(TOTAL);
  PSEG.forEach((s, i) => { s.style.transform = `scaleX(${i < E.i ? 1 : i === E.i ? Math.min(1, E.t / SLIDES[i].dur) : 0})`; });
  requestAnimationFrame(loop);
}

/* ---------- HUD / controls ---------- */
const PSEG = SLIDES.map(s => { const i = h('i', '', null, $('#prog'), {flex: String(s.dur)}); return h('b', '', null, i); });
const tk = TICKER.map(s => `${s}<em>◆</em>`).join('');
$('#ticker').innerHTML = tk + tk;

function fit() { const s = Math.min(innerWidth / W, innerHeight / H); $('#stage').style.transform = `scale(${s})`; }
addEventListener('resize', fit);

const ctrl = $('#ctrl'), vp = $('#viewport');
let idleT = 0;
function wake() { ctrl.classList.remove('hide'); vp.classList.remove('idle'); clearTimeout(idleT); idleT = setTimeout(() => { ctrl.classList.add('hide'); vp.classList.add('idle'); }, 2200); }
addEventListener('mousemove', wake); addEventListener('touchstart', wake, {passive: true});
async function fullscreen() { try { if (document.fullscreenElement) await document.exitFullscreen(); else await document.documentElement.requestFullscreen(); } catch (e) {} }
$('#b-prev').addEventListener('click', e => { e.stopPropagation(); nav(-1); });
$('#b-next').addEventListener('click', e => { e.stopPropagation(); nav(1); });
$('#b-play').addEventListener('click', e => { e.stopPropagation(); toggle(); });
$('#b-re').addEventListener('click', e => { e.stopPropagation(); restart(); });
$('#b-fs').addEventListener('click', e => { e.stopPropagation(); fullscreen(); });
ctrl.addEventListener('click', e => e.stopPropagation());
vp.addEventListener('click', e => {
  const x = e.clientX / innerWidth;
  if (x < .22) nav(-1); else if (x > .78) nav(1); else toggle();
});
addEventListener('keydown', e => {
  if (e.target.closest && e.target.closest('button') && (e.key === ' ' || e.key === 'Enter')) return;
  const k = e.key;
  if (k === ' ' || k === 'k' || k === 'K') { e.preventDefault(); toggle(); }
  else if (k === 'ArrowRight' || k === 'l' || k === 'L' || k === 'PageDown') { e.preventDefault(); nav(1); }
  else if (k === 'ArrowLeft' || k === 'j' || k === 'J' || k === 'PageUp') { e.preventDefault(); nav(-1); }
  else if (k === 'r' || k === 'R' || k === 'Home') restart();
  else if (k === 'f' || k === 'F') fullscreen();
  else if (k === 'h' || k === 'H') $('#hud').classList.toggle('off');
});
let autoPaused = false;
document.addEventListener('visibilitychange', () => {
  if (document.hidden && E.playing) { autoPaused = true; setPlaying(false); }
  else if (!document.hidden && autoPaused) { autoPaused = false; last = performance.now(); setPlaying(true); }
});

/* ---------- boot: 使う文字だけ先にフォント読み込み → AUTO再生 ---------- */
async function boot() {
  fit();
  const txt = [...new Set(($('#main').textContent + document.body.innerText).replace(/[\x00-\x7f]/g, ''))].join('') + '0123456789%+.ABCDEFGHIJKLMNOPQRSTUVWXYZ';
  try {
    await Promise.race([
      Promise.all(['900 100px "Dela Gothic One"', '900 40px "Noto Sans JP"', '700 40px "Noto Sans JP"', '500 20px "Noto Sans JP"', '700 20px "Chakra Petch"'].map(f => document.fonts.load(f, txt))),
      new Promise(res => setTimeout(res, 4000)),
    ]);
  } catch (e) {}
  wake();
  go(0, 'auto');
  last = performance.now();
  requestAnimationFrame(loop);
}
boot();
})();
</script>
