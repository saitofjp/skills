<title>経済・物価情勢の展望（2026年7月）基本的見解 — Semantic Model Viewer</title>
<meta name="description" content="A text and its model side by side. Rise from the text to its chunks to the model, and turn the model into structure, linear notes, a table or one sentence.">
<style>
/*
  Semantic Model Viewer — the Transform View of one Semantic Model (semantic-model/1).
  Concept: rise through the layers of meaning. The text is the ground; chunks lift off it;
  the model floats above, in a classical, unruly geometry composed from the model itself,
  which lies shattered near the text and comes together as you rise.
  Two moves: focus out / in (text ⇄ chunks ⇄ model) and transform (structure ⇄ linear ⇄ table ⇄ summary).
  The page never derives meaning from the text; everything it shows comes from the embedded model.
  See references/transform-view.md.
*/
:root {
  /* dark (default): luminous layers in a deep space */
  --space: #0a0d14;
  --ground: rgba(15, 19, 27, .9);    /* L0: the text */
  --sky: rgba(12, 16, 25, .28);       /* L2: the model's space, the figure shows through */
  --field: 165, 188, 240;             /* the field: shards on the ground, a composition above */
  --field-a: .075;
  --ink: #e8ecf4;
  --ink-2: #b4bdcd;
  --muted: #7d889d;
  --rule: rgba(160, 180, 225, .17);
  --card: #151a26;
  --card-hi: transparent;
  --card-line: #4a5570;
  --accent: #dfe6f5;          /* the bar on a card's left */
  --frame: rgba(120, 145, 200, .07);
  --slab: rgba(150, 175, 235, .07);
  --slab-line: rgba(160, 185, 240, .22);
  --bracket: rgba(165, 185, 230, .38);
  --thread: #c6dcff;
  --link: rgba(190, 205, 235, .5);
  --band: #e8ecf4; --band-fg: #0a0d14;
  /* data colors: one meaning each */
  --focus: #2dd4bf; --focus-rgb: 45, 212, 191; --focus-ink: #2dd4bf; --on-focus: #06201d;
  --rel: #9aa6bd; --rel-rgb: 154, 166, 189;
  --pos: #ff6b3d; --pos-rgb: 255, 107, 61;     /* + : moves with, raises */
  --neg: #4f9dff; --neg-rgb: 79, 157, 255;     /* − : moves against, lowers */
  --evidence: #a98bff; --evidence-rgb: 169, 139, 255;
  --ui: #e8ecf4; --ui-fg: #0a0d14;
  --chip: rgba(165, 185, 230, .12);
  --tone: rgba(165, 188, 240, .16);   /* screentone dots */
  --shadow: none;
  --font: system-ui, -apple-system, "Hiragino Sans", "Hiragino Kaku Gothic ProN", "Noto Sans JP", "Yu Gothic UI", "Yu Gothic", Meiryo, sans-serif;
  --mono: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  --ease-settle: cubic-bezier(.22, 1.18, .42, 1);
  color-scheme: dark;
}
:root[data-theme="light"] {
  --space: #e9edf3; --ground: rgba(246, 248, 251, .9); --sky: rgba(240, 244, 249, .3); --field: 30, 45, 85; --field-a: .06;
  --ink: #111622; --ink-2: #39414f; --muted: #687286; --rule: rgba(30, 50, 90, .14);
  --card: #ffffff; --card-hi: transparent; --card-line: #111622; --accent: #111622;
  --frame: rgba(30, 50, 90, .04); --slab: rgba(40, 70, 130, .05); --slab-line: rgba(40, 70, 130, .2); --bracket: rgba(30, 50, 90, .3);
  --thread: #1b2a47; --link: rgba(40, 55, 85, .45); --band: #111622; --band-fg: #f5f7fa;
  --focus: #0d9488; --focus-rgb: 13, 148, 136; --focus-ink: #0b7a70; --on-focus: #ffffff;
  --rel: #6d7689; --rel-rgb: 109, 118, 137; --pos: #d0451b; --pos-rgb: 208, 69, 27; --neg: #1f5fbf; --neg-rgb: 31, 95, 191;
  --evidence: #6f45e0; --evidence-rgb: 111, 69, 224; --ui: #111622; --ui-fg: #ffffff; --chip: rgba(30, 50, 90, .07); --tone: rgba(17, 22, 34, .16);
  --shadow: none;
  color-scheme: light;
}
* { box-sizing: border-box; }
html, body { height: 100%; }
body { margin: 0; background: var(--space); color: var(--ink); font: 14px/1.6 var(--font); display: grid; grid-template-rows: auto minmax(0, 1fr); grid-template-columns: minmax(0, 1fr); overflow: hidden; }
button, select { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }

/* ---------- header ---------- */
header { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 18px; padding: 10px 16px; border-bottom: 1px solid var(--rule); background: var(--space); position: relative; z-index: 20; }
.titles { min-width: 0; flex: 1 1 240px; }
.titles h1 { font-size: 15px; line-height: 1.3; margin: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; letter-spacing: .02em; }
.titles .src { color: var(--muted); font-size: 12px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

.theme-ctl { display: inline-flex; border: 1.5px solid var(--card-line); flex: none; }
.theme-ctl button { border: 0; background: transparent; padding: 4px 10px; font: 700 11px/1.2 var(--mono); letter-spacing: .08em; color: var(--muted); }
.theme-ctl button + button { border-left: 1.5px solid var(--card-line); }
.theme-ctl button[aria-pressed="true"] { background: var(--ui); color: var(--ui-fg); }

/* ---------- main: the ground (text) and the space above it (model) ---------- */
main { position: relative; display: flex; min-height: 0; overflow: hidden; }
#field { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; z-index: 0; }
#textPane { flex: none; height: 100%; overflow: auto; position: relative; z-index: 1; background: var(--ground); scrollbar-width: thin; transform-origin: 50% 60%; }
#page { position: relative; padding: 34px 0 120px var(--gutter, 48px); width: max-content; isolation: isolate; }
#slabs { position: absolute; left: 0; top: 0; overflow: visible; pointer-events: none; z-index: 0; }
#text { position: relative; z-index: 1; width: var(--col, 520px); font-size: 15px; line-height: 2; white-space: pre-wrap; overflow-wrap: anywhere; color: var(--ink-2); }
#marks { position: absolute; left: 0; top: 0; overflow: visible; pointer-events: none; z-index: 2; }
#tags { position: absolute; z-index: 3; top: 0; left: calc(var(--gutter, 48px) + var(--col, 520px) + 26px); width: calc(var(--tagw, 220px) - 34px); }
#modelPane { flex: 1 1 0; min-width: 0; position: relative; z-index: 1; background: var(--sky); border-left: 1px solid var(--rule); }
#stage { position: absolute; inset: 0; overflow: auto; scrollbar-width: thin; z-index: 1; }
#rep { position: relative; min-height: 100%; padding: var(--hud-clear, 28px) 28px 120px; }
body[data-stop="text"] #modelPane { display: none; }
body[data-stop="text"] #marks, body[data-stop="text"] #slabs { visibility: hidden; }

/* ---------- L0: text ---------- */
.seg.c { cursor: pointer; border-radius: 2px; transition: background-color .25s, box-shadow .25s, color .25s; }
body[data-stop="text"] .seg.c { cursor: text; }
.seg.hn { background: rgba(var(--focus-rgb), .08); color: var(--ink); }
.seg.hq { background: rgba(var(--focus-rgb), .16); color: var(--ink); box-shadow: inset 0 -1.5px rgba(var(--focus-rgb), .7); }
.seg.hp { background: rgba(var(--focus-rgb), .26); color: var(--ink); box-shadow: inset 0 -3px var(--focus); }
.seg.hr { box-shadow: inset 0 -2px var(--rel); color: var(--ink); }
.seg.hr.pos { box-shadow: inset 0 -2px var(--pos); background: rgba(var(--pos-rgb), .14); }
.seg.hr.neg { box-shadow: inset 0 -2px var(--neg); background: rgba(var(--neg-rgb), .14); }
.seg.hx { box-shadow: inset 0 -2px var(--focus); }
.seg.he { background: rgba(var(--evidence-rgb), .24); }
.seg.flash { animation: wash 1.5s ease-out; }
@keyframes wash { 0% { background: rgba(var(--focus-rgb), .3); color: var(--ink); } 100% { background: transparent; } }

/* ---------- L1: chunks lifted off the text ---------- */
#slabs rect.slab { fill: var(--slab); stroke: var(--slab-line); stroke-width: 1; }
#slabs rect.shadow { fill: none; stroke: var(--slab-line); stroke-width: 1; stroke-dasharray: 2 3; opacity: .7; }
#slabs g.f0 rect.slab { fill: rgba(var(--focus-rgb), .07); stroke: var(--focus); }
#slabs g.lift rect.slab { animation: lift .8s var(--ease-settle) both; }
#slabs g.lift rect.shadow { animation: fadein .8s ease-out both; }
@keyframes lift { from { transform: translate(5px, 5px); opacity: 0; } to { transform: none; opacity: 1; } }
#marks .br path.line { fill: none; stroke: var(--bracket); stroke-width: 1.6; transition: stroke .2s, stroke-width .2s; }
#marks .br path.hit { fill: none; stroke: transparent; stroke-width: 12; pointer-events: stroke; cursor: pointer; }
#marks .br text { font: 700 10.5px/1 var(--mono); fill: var(--muted); text-anchor: end; dominant-baseline: hanging; pointer-events: auto; cursor: pointer; }
#marks .br.reading path.line { stroke: var(--ink-2); }
#marks .br.f0 path.line { stroke: var(--focus); stroke-width: 3.5; }
#marks .br.f0 text { fill: var(--focus); }
#marks .br.f1 path.line { stroke: var(--rel); stroke-width: 2.4; }
#marks .br.f1.pos path.line { stroke: var(--pos); } #marks .br.f1.neg path.line { stroke: var(--neg); }
#marks .br.part path.line { stroke: var(--ink-2); stroke-width: 2; }
#marks .br.ev path.line { stroke: var(--evidence); stroke-width: 2.4; }
#marks .br.grow path.line { stroke: var(--ink); stroke-width: 3; stroke-dasharray: 1; animation: grow .7s var(--ease-settle) both; }
@keyframes grow { from { stroke-dashoffset: 1; } to { stroke-dashoffset: 0; } }
@keyframes fadein { from { opacity: 0; } }
/* slides: each note on a 16:9 page */
.rep.slides .deck { display: grid; grid-template-columns: minmax(0, 1fr); gap: 22px; max-width: 760px; }
.slide { position: relative; aspect-ratio: 16 / 9; background: var(--card); border: 1.5px solid var(--card-line); border-left: 6px solid var(--accent); padding: 4% 6% 5%; display: flex; flex-direction: column; justify-content: center; overflow: hidden; min-width: 0; }
.slide .sno { position: absolute; right: 14px; bottom: 10px; font: 700 10px/1 var(--mono); letter-spacing: .12em; color: var(--muted); }
.slide .kicker { display: block; font: 700 10px/1.2 var(--mono); letter-spacing: .26em; color: var(--muted); margin-bottom: 12px; }
.slide .sh { display: flex; gap: 16px; align-items: baseline; }
.slide .num { font: 800 clamp(20px, 2.6vw, 36px)/1 var(--mono); color: var(--muted); letter-spacing: -.02em; flex: none; }
.slide .head { font-size: clamp(17px, 2vw, 27px); font-weight: 900; line-height: 1.35; color: var(--ink); letter-spacing: .01em; }
.slide .pts { margin: 16px 0 0; padding: 0 0 0 22px; list-style: none; display: grid; gap: 4px; }
.slide .pt { font-size: clamp(12px, 1.2vw, 15px); }
.slide.section { background-image: radial-gradient(var(--tone) 1px, transparent 1.3px); background-size: 7px 7px; }
.slide.section .head { font-size: clamp(20px, 2.5vw, 33px); }
.slide.concl { background: var(--band); border-color: var(--band); }
.slide.concl .head, .slide.concl .pt { color: var(--band-fg); } .slide.concl .num, .slide.concl .kicker, .slide.concl .sno { color: var(--band-fg); opacity: .6; }
.slide.cover h2 { font-size: clamp(20px, 2.4vw, 32px); line-height: 1.4; margin: 0; }
.slide.cover .lede { margin: 18px 0 0; font-size: clamp(13px, 1.3vw, 16px); line-height: 1.8; color: var(--ink-2); border-left: 3px solid var(--focus); padding-left: 12px; }
.slide.closing { border-left-color: var(--focus); }
.slide.closing .gist { margin: 0; font-size: clamp(16px, 1.9vw, 25px); line-height: 1.75; font-weight: 800; }
.slide.f0 { border-color: var(--focus); box-shadow: 0 0 0 2px var(--focus); }
.slide.f1 { border-left-color: var(--rel); } .slide.f1.pos { border-left-color: var(--pos); } .slide.f1.neg { border-left-color: var(--neg); }
.focusing .slide.dim > :not(.sno) { opacity: .35; }

/* the chunks, listed: what chunks there are, at a glance */
.rep .kick { font: 700 10.5px/1 var(--mono); letter-spacing: .3em; color: var(--muted); margin: 0 0 16px; }
.rep.chunks .clist { display: grid; grid-template-columns: minmax(0, 1fr); gap: 4px; max-width: 560px; }
.crow { display: flex; gap: 9px; align-items: baseline; padding: 6px 10px 7px; border: 1.5px solid var(--card-line); border-left: 4px solid var(--accent); background: var(--card); cursor: pointer; transition: border-color .2s, opacity .2s; min-width: 0; }
.crow .num { font: 700 11px/1.5 var(--mono); color: var(--muted); flex: none; }
.crow .head { font-size: 13.5px; line-height: 1.45; font-weight: 800; color: var(--ink); }
.crow.again .head { font-weight: 700; color: var(--ink-2); }
.crow.concl { background: var(--band); border-color: var(--band); } .crow.concl .head { color: var(--band-fg); } .crow.concl .num { color: var(--band-fg); opacity: .6; }
.crow.reading { border-color: var(--ink-2); }
.crow.f0 { border-color: var(--focus); box-shadow: 0 0 0 2px var(--focus); } .crow.f0 .head { background: linear-gradient(transparent 62%, rgba(var(--focus-rgb), .28) 62%); }
.crow.f1 { border-left-color: var(--rel); } .crow.f1.pos { border-left-color: var(--pos); } .crow.f1.neg { border-left-color: var(--neg); }
.focusing .crow.dim { opacity: .35; }

/* ---------- L2: the model ---------- */
.card { position: relative; background: var(--card); border: 1.5px solid var(--card-line); border-left: 4px solid var(--accent); border-radius: 0; padding: 10px 14px 11px 12px; transition: border-color .2s, box-shadow .2s, background .2s; }
.card .ch { display: flex; gap: 9px; align-items: baseline; }
.card .num { font: 700 12px/1.4 var(--mono); color: var(--muted); flex: none; letter-spacing: .02em; }
.card .kicker { display: block; font: 700 9.5px/1.2 var(--mono); letter-spacing: .2em; color: var(--muted); margin: 0 0 4px; }
.card .head { font-size: 15.5px; line-height: 1.45; font-weight: 800; color: var(--ink); letter-spacing: .01em; }
.card.d1 { border-left-width: 2px; }
.card.d1 .head { font-size: 14.5px; }
.card .pts { margin: 8px 0 0; padding: 0 0 0 18px; list-style: none; }
.pt { position: relative; font-size: 13.5px; line-height: 1.6; color: var(--ink-2); padding: 1px 4px; margin-left: -4px; border-radius: 4px; cursor: pointer; transition: background .2s, color .2s; }
.pts .pt::before { content: ""; position: absolute; left: -13px; top: .8em; width: 7px; height: 1.5px; background: var(--bracket); }
.pt + .pt { margin-top: 2px; }
.when { display: inline-block; font: 700 11px/1.5 var(--mono); color: var(--ink); background: var(--chip); border: 1px solid var(--rule); border-radius: 4px; padding: 0 5px; margin-right: 6px; }
.card .kids { margin-top: 12px; display: grid; grid-template-columns: minmax(0, 1fr); gap: 10px; }
.card { min-width: 0; }
.card.concl { background: var(--band); border-color: var(--band); border-left: 4px solid var(--band); }
.card.concl .head, .card.concl .pt { color: var(--band-fg); }
.card.concl .num, .card.concl .kicker { color: var(--band-fg); opacity: .6; }
.card.concl .when { color: var(--band-fg); border-color: rgba(0, 0, 0, .2); background: rgba(0, 0, 0, .06); }
:root[data-theme="light"] .rep.structure .card:has(> .kids):not(.concl), :root[data-theme="light"] .slide.section { background-image: none; }
:root[data-theme="light"] .card.concl .when { border-color: rgba(255, 255, 255, .25); background: rgba(255, 255, 255, .08); }
.card.concl .pts .pt::before { background: var(--band-fg); opacity: .5; }
.card.prov-inferred, .card.prov-uncertain { border-style: dashed; border-left-style: solid; }
.card.prov-abstracted { border-style: dotted; border-left-style: solid; }
.card.reading { border-color: var(--ink-2); }
.card.f0 { border-color: var(--focus); box-shadow: 0 0 0 3px var(--focus); }
.card.f0 > .ch .head { background: linear-gradient(transparent 62%, rgba(var(--focus-rgb), .28) 62%); }
.card.f1 { border-color: var(--rel); box-shadow: 0 0 0 1px var(--rel); }
.card.f1.pos { border-color: var(--pos); box-shadow: 0 0 0 1px var(--pos); }
.card.f1.neg { border-color: var(--neg); box-shadow: 0 0 0 1px var(--neg); }
.card.ev { border-color: var(--evidence); box-shadow: 0 0 0 1px var(--evidence); }
.card.cur { border-color: var(--ink); box-shadow: 0 0 0 2px var(--ink); }
.pt.fp { background: rgba(var(--focus-rgb), .18); color: var(--ink); box-shadow: inset 3px 0 var(--focus); }
.focusing .card.dim > .ch, .focusing .card.dim > .pts, .focusing .card.dim > .kicker { opacity: .28; }
.focusing .card.dim { border-color: var(--rule); box-shadow: none; }
.card.stamp { animation: stamp .7s var(--ease-settle); }
@keyframes stamp { 0% { transform: scale(1.05); } 35% { box-shadow: 0 0 0 6px var(--focus); } 100% { transform: none; } }

/* linear: the notes in reading order */
.rep.linear .stack { max-width: 720px; display: grid; gap: 14px; margin-right: 130px; }
/* structure: columns that flow toward the conclusion */
.rep.structure .cols { display: flex; align-items: center; gap: 88px; min-height: calc(100% - 20px); }
.rep.structure .col { flex: 1 1 0; min-width: 0; max-width: 320px; display: grid; grid-template-columns: minmax(0, 1fr); gap: 14px; }
.rep.structure .card { padding: 8px 12px 9px 10px; }
.rep.structure .card .head { font-size: 14px; }
.rep.structure .card.d1 .head { font-size: 13px; }
.rep.structure .card .kids { margin-top: 9px; gap: 6px; }
.rep.structure .card.d1 { padding: 5px 10px 6px 9px; }
.rep.structure .card.d1 .kicker { display: none; }
.rep.structure .card.d1 .head { display: block; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.rep.structure .card.d1 .ch { min-width: 0; }
.rep.structure .card:has(> .kids):not(.concl) { background: var(--card); background-image: radial-gradient(var(--tone) 1px, transparent 1.3px); background-size: 6px 6px; }
.rep.structure .card.d1 { background: var(--card); }
/* table */
.rep.table table { border-collapse: separate; border-spacing: 0; width: 100%; min-width: 640px; font-size: 13px; }
.rep.table th, .rep.table td { text-align: left; vertical-align: top; padding: 8px 10px; border-bottom: 1px solid var(--rule); }
.rep.table thead th { font: 700 10.5px/1.3 var(--mono); letter-spacing: .1em; color: var(--muted); border-bottom: 1px solid var(--ink-2); position: sticky; top: -28px; background: var(--space); z-index: 3; }
.rep.table tbody tr { background: var(--card); transition: opacity .2s; }
.rep.table tbody tr.d1 th.rowh { padding-left: 24px; }
.rep.table th.rowh { width: 26%; border-left: 3px solid var(--accent); }
.rep.table tr.d1 th.rowh { border-left-width: 2px; }
.rep.table th.rowh .num { font: 700 11px/1.5 var(--mono); color: var(--muted); display: block; }
.rep.table th.rowh .head { font-weight: 800; color: var(--ink); line-height: 1.45; }
.rep.table tr.concl th.rowh { background: var(--band); border-left-color: var(--band); } .rep.table tr.concl th.rowh .head { color: var(--band-fg); } .rep.table tr.concl th.rowh .num { color: var(--band-fg); opacity: .6; }
.rep.table ul { margin: 0; padding: 0; list-style: none; display: grid; gap: 4px; }
.rep.table .pt { font-size: 12.5px; }
.rep.table tr.f0 th.rowh .head { background: linear-gradient(transparent 62%, rgba(var(--focus-rgb), .28) 62%); }
.rep.table tr.f0 th.rowh { border-left-color: var(--focus); }
.rep.table tr.f1 th.rowh { border-left-color: var(--rel); } .rep.table tr.f1.pos th.rowh { border-left-color: var(--pos); } .rep.table tr.f1.neg th.rowh { border-left-color: var(--neg); }
.focusing .rep.table tr.dim { opacity: .35; }
/* summary: one sentence at the top */
.rep.summary { display: flex; flex-direction: column; justify-content: center; }
.rep.summary .kick { margin: 0 auto 20px; max-width: 34em; width: 100%; }
.rep.summary .gist { font-size: clamp(20px, 2.3vw, 30px); line-height: 1.8; font-weight: 800; letter-spacing: .03em; max-width: 34em; margin: 0 auto; color: var(--ink); }
.phrase { cursor: pointer; background-image: linear-gradient(var(--ink), var(--ink)); background-size: 100% 2px; background-repeat: no-repeat; background-position: 0 94%; transition: background-color .2s, opacity .2s; border-radius: 3px; }
.phrase sup { font: 700 11px/1 var(--mono); color: var(--muted); margin-left: 3px; letter-spacing: 0; }
.phrase.f0 { background-color: rgba(var(--focus-rgb), .2); background-image: linear-gradient(var(--focus), var(--focus)); background-size: 100% 4px; }
.phrase.f0 sup { color: var(--focus-ink); }
.focusing .gist .phrase.dim { opacity: .35; }
.rep.summary.sweep .phrase { animation: sweep .8s var(--ease-settle) both; }
@keyframes sweep { from { background-size: 0 2px; opacity: .15; } to { background-size: 100% 2px; opacity: 1; } }
.rep.summary .rest { max-width: 34em; width: 100%; margin: 36px auto 0; display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.rep.summary .rest .rest-label { font: 700 10px/1 var(--mono); letter-spacing: .2em; color: var(--muted); margin-right: 4px; }
.chip { display: inline-flex; gap: 6px; align-items: baseline; padding: 4px 9px; border: 1.5px solid var(--card-line); border-left: 3px solid var(--accent); background: var(--card); border-radius: 0; font-size: 12px; cursor: pointer; color: var(--ink-2); }
.chip .num { font: 700 11px/1 var(--mono); color: var(--muted); }
.chip.f0 { border-color: var(--focus); color: var(--ink); }
.focusing .chip.dim { opacity: .4; }
.anchor { position: absolute; pointer-events: none; opacity: 0; }
.rep .empty { color: var(--muted); }

/* relation lines: thin lines of light */

 "sourceText": "＜概要＞\n先行きのわが国経済を展望すると、2026年度については、中東情勢の影響を受けた春先以降の原油価格上昇が下押し要因となるものの、グローバルなＡＩ関連需要の増加に加え、政府による各種施策や緩和的な金融環境等が経済を下支えすると考えられるため、わが国経済は、伸び率を縮小しつつも、緩やかな成長を続けるとみられる。2027年度以降は、原油高のマイナスの影響が減衰し、所得から支出への前向きな循環メカニズムが徐々に強まっていくことから、わが国経済は成長率を緩やかに高めていくと考えられる。\n物価の先行きを展望すると、消費者物価（除く生鮮食品）の前年比は、賃金上昇を販売価格に転嫁する動きが続くもとで、これまでの原油価格上昇が、エネルギーや財を中心に価格を押し上げるほか、グローバルなＡＩ関連需要の増加に伴う半導体価格等の上昇や最近の為替円安が耐久財等の価格上昇につながることから、2026年度後半以降、２％をはっきりと上回る水準まで伸び率を高めていくと予想される。その後、見通し期間後半には、原油高の影響が減衰していくもとで、２％程度に向けてプラス幅を縮小していくと考えられる。この間、人手不足感の強い状況が続くなかで、賃金と物価が相互に参照しながら緩やかに上昇していくメカニズムは維持され、中長期的な予想物価上昇率は上昇していくと見込まれる。こうしたもとで、消費者物価の基調的な上昇率は、徐々に高まっていくと予想され、2026年度後半から2027年度にかけて「物価安定の目標」と概ね整合的な水準となり、その後も同程度で推移すると考えられる。\n前回の見通しと比べると、成長率は概ね不変である。消費者物価（除く生鮮食品）の前年比は、政府による夏場のエネルギー負担緩和策（電気・ガス代）の効果等から、2026年度が下振れている。\nリスク要因としては様々なものがあるが、当面は、中東情勢が金融・為替市場やわが国の経済・物価に及ぼす影響をとくに注視する必要がある。このほか、グローバルなＡＩ関連需要の動向や今後の為替相場の変動が、わが国の経済・物価に及ぼす影響にも留意が必要である。\nリスクバランスをみると、経済の見通しについては、概ねバランスしている。消費者物価の見通しについては、上振れリスクの方が大きい。基調的な物価上昇率については、企業の賃金・価格設定行動が積極化していることや、中長期的な予想物価上昇率が引き続き上昇していることなどを踏まえると、２％の「物価安定の目標」を超えて上振れていくリスクがある。こうしたリスクが顕在化し、それがその後の経済に悪影響を及ぼすことがないよう、十分に留意する必要がある。\n１．わが国の経済・物価の現状\nわが国の景気は、中東情勢の影響もあって一部に弱めの動きもみられるが、緩やかに回復している。海外経済は、一部に弱めの動きもみられるが、総じてみれば緩やかに成長している。輸出や鉱工業生産は、基調としては横ばい圏内の動きを続けている。グローバルなＡＩ関連需要の堅調な増加などを背景に、企業収益は高水準で推移しており、業況感も良好な水準で推移している。こうしたもとで、設備投資は緩やかな増加傾向にある。個人消費は、家計マインドに弱さがみられるものの、雇用・所得環境の改善を背景に底堅く推移している。一方、住宅投資は減少傾向にある。公共投資は横ばい圏内の動きを続けている。この間、労働需給は、引き締まった状態が続いている。わが国の金融環境は、緩和した状態にある。物価面では、消費者物価（除く生鮮食品）の前年比をみると、賃金上昇の販売価格への転嫁の動きが続くなか、足もとでは、政府によるエネルギー負担緩和策の効果などから、１％台半ばとなっている。予想物価上昇率は、緩やかに上昇している。\n２．わが国の経済・物価の中心的な見通し\n（１）経済の中心的な見通し\n先行きのわが国経済を展望すると、2026年度については、中東情勢の影響を受けた春先以降の原油価格上昇が、交易条件の悪化などを通じて企業収益や家計の実質所得に対する下押し要因となるものの、グローバルなＡＩ関連需要の増加や春季労使交渉におけるしっかりとした賃上げの実現に加えて、政府による各種施策（エネルギー負担緩和策等）や緩和的な金融環境などが経済を下支えすると考えられる。こうしたもとで、わが国経済は、伸び率を縮小しつつも、緩やかな成長を続けるとみられる。\nすなわち、企業部門をみると、輸出や生産は、中東情勢の影響を受けつつも、グローバルなＡＩ関連需要の強さが押し上げ要因として作用することから、当面は横ばい圏内の動きになると見込まれる。企業収益は、原油価格上昇に伴う交易条件悪化の影響を受けつつも、ＡＩ関連需要の強さなどを背景に高水準が続くとみられる。そうしたもとで、設備投資は、既往案件の受注残を解消する動きに加え、政府の経済対策や緩和的な金融環境が下支え要因として作用し、緩やかな増加傾向が続くと考えられる。\n家計部門をみると、雇用面では、労働需給は引き締まった状態が続き、名目賃金は、本年の春季労使交渉の結果などを反映して現状程度の伸びが続くと見込まれる。個人消費は、賃金の増加や株価上昇による資産効果に加えて、政府による各種施策を通じた家計への所得移転が下支え要因となるものの、エネルギーを中心とした物価上昇の影響から、横ばい圏内の動きになるとみられる。住宅投資は、住宅価格の上昇や人口動態等を反映して、緩やかな減少傾向をたどるとみられる。この間、公共投資は横ばい圏内で推移し、政府消費は、医療・介護費の趨勢的な増加や防衛関連支出の増加などを反映し、緩やかに増加していくと想定している。\n2027年度以降については、原油高のマイナスの影響が減衰し、所得から支出への前向きな循環メカニズムが徐々に強まっていくことから、わが国経済は成長率を緩やかに高めていくと考えられる。輸出や生産は、中東情勢の影響が和らぎ、海外経済の緩やかな成長が続くなか、グローバルなＡＩ関連需要の強さなどにも支えられ、緩やかに増加していくと考えられる。企業収益は、原油価格の下落に伴う交易条件の改善や内外需要の増加に支えられて、改善していくとみられ、そうしたもとで、設備投資は、人手不足対応の省力化投資やＡＩ関連等の成長分野への能力増強投資に加え、貿易構造やサプライチェーンの変容に適合するための投資案件なども押し上げ要因となり、増加傾向を維持すると考えられる。雇用・所得環境をみると、労働需給は引き締まった状況が続き、名目賃金は着実な増加が続くとみられる。これに加え、物価の上昇ペースが徐々に落ち着いていくと見込まれるなか、個人消費は、緩やかな増加基調に復していくとみられる。\nこうした見通しを前回の展望レポートにおける見通しと比較すると、見通し期間を通じて概ね不変となっている。\nこの間、潜在成長率は、政府による各種の施策の後押しなどもあって、デジタル化や人的資本投資の進展による生産性の上昇、資本ストックの着実な増加などを背景に、小幅のプラスが続くとみられる。\n（２）物価の中心的な見通し\n消費者物価（除く生鮮食品）の前年比は、賃金上昇を販売価格に転嫁する動きが続くもとで、これまでの原油価格上昇が、エネルギーや財を中心に価格を押し上げるほか、グローバルなＡＩ関連需要の増加に伴う半導体価格等の上昇や最近の為替円安が耐久財等の価格上昇につながることから、2026年度後半以降、２％をはっきりと上回る水準まで伸び率を高めていくと予想される。その後、見通し期間後半には、原油高の影響が減衰していくもとで、２％程度に向けてプラス幅を縮小していくと考えられる。\nこの間、人手不足感の強い状況が続くなかで、賃金と物価が相互に参照しながら緩やかに上昇していくメカニズムは維持され、中長期的な予想物価上昇率は上昇していくと見込まれる。こうしたもとで、消費者物価の基調的な上昇率は、徐々に高まっていくと予想され、2026年度後半から2027年度にかけて「物価安定の目標」と概ね整合的な水準となり、その後も同程度で推移すると考えられる。基調的な物価上昇率が２％に近づいていることを踏まえると、今後は、「物価安定の目標」の持続的・安定的な実現という観点から、これが２％程度の水準で定着するかどうかを確認していくことが重要となってくる。\nなお、消費者物価（除く生鮮食品）の見通しは、原油価格の動向や政府による各種施策の影響も受ける。原油価格については、先物市場の動向などを参考に、見通し期間終盤にかけて緩やかに低下していく前提としているが、中東以外の地域からの代替調達に伴って輸送コストが増加していることを踏まえると、わが国の企業が直面する調達価格は、国際市況ほどには低下しないと考えられる。政府による施策については、燃料油補助金などのエネルギー負担緩和策や教育無償化政策等が行われており、2026年度の消費者物価の前年比を押し下げる方向に作用する。\nエネルギー価格の変動の直接的な影響を受けない消費者物価（除く生鮮食品・エネルギー）の前年比は、これまでの原油価格上昇が財を中心に価格を押し上げることに加え、半導体価格等の上昇や最近の為替円安が耐久財等の価格上昇につながることから、２％を超える水準で推移したあと、原油高の影響が減衰していくもとで、プラス幅を縮小すると見込まれる。\nこうした見通しを前回の展望レポートにおける見通しと比較すると、消費者物価（除く生鮮食品）は、政府による夏場のエネルギー負担緩和策（電気・ガス代）の効果等から、2026年度が下振れているが、消費者物価（除く生鮮食品・エネルギー）は、見通し期間を通じて概ね不変である。\n物価の基調を規定する主たる要因について点検すると、労働や設備の稼働状況を表すマクロ的な需給ギャップは、振れを伴いつつも、改善傾向をたどっており、足もとでは小幅のプラスとなっている。先行きの需給ギャップは、上記の経済の見通しのもとで、現状程度のプラスが続くと予想される。この間、女性や高齢者による労働参加の増加ペースの鈍化もあって、労働需給はマクロ的な需給ギャップ以上に引き締まっている。こうしたもと、労働集約的な業種を中心に企業が労働の供給制約に直面しつつある状況を踏まえると、マクロ的な需給ギャップが示唆する以上に、賃金や物価には上昇圧力がかかりやすくなっているとみられる。\n次に、中長期的な予想物価上昇率をみると、緩やかに上昇している。先行きについては、労働需給の引き締まりなどを背景に、企業の積極的な賃金・価格設定行動が続き、予想物価上昇率は緩やかな上昇が続くと予想される。その水準は、2026年度後半から2027年度にかけて２％程度となり、その後も同程度で推移すると考えられる。\n３．経済・物価のリスク要因\n上記の中心的な経済・物価の見通しに対する上振れないし下振れの可能性（リスク要因）としては、主に以下の点に注意が必要である。\n第１に、中東情勢がわが国経済・物価に及ぼす影響である。中東情勢については、なお不透明な状況が続いているが、原油価格は一頃に比べて下落しており、前回の展望レポートで指摘したような、経済の大幅な下振れリスクや物価の大幅な上振れリスクは低下している。とくに、サプライチェーンの大規模な混乱が生じ、わが国企業の生産活動に大きな影響をもたらすリスクは、中東依存度の高い原材料の代替調達が進展していることもあり、低下している。もっとも、これまでの原油価格上昇が経済・物価に及ぼす影響については、引き続き注意が必要である。実体経済面では、原油高に伴う原材料等の価格上昇が、企業収益や家計の実質所得を想定以上に下押しすることがないか、確認していく必要がある。物価面では、原油高を起点に企業間取引における価格転嫁がやや速いスピードで進んでおり、これが、今後、消費者段階における幅広い品目の価格上昇に波及していく可能性が高いと考えられる。これらに加え、中長期の予想物価上昇率が引き続き上昇していることも踏まえると、消費者物価の基調的な上昇率が２％の「物価安定の目標」を超えて上振れていくリスクがある。\nこの間、原油価格については、なお振れの大きい展開が続いている。今後の原油価格の変動がわが国の経済・物価に及ぼす影響については、引き続き留意が必要である。\n第２に、ＡＩ関連需要を含む内外の経済・物価動向である。ＡＩ関連については、その用途の急速な広がりとともに、グローバルな需要拡大が続いており、旺盛な設備投資が世界経済を一段と押し上げる可能性がある。一方、投資に見合った形で収益の拡大が実現しない場合には、資産価格の変動なども伴って、調整圧力が生じる可能性もある。物価面では、最近の半導体価格の上昇は、関連する耐久財の価格を押し上げるとみられるほか、企業間取引において、銅などの素材価格や機械類の価格が上昇していることも踏まえると、今後は、消費者段階においても、様々な品目の価格上昇につながる可能性がある。こうしたＡＩ関連の材料・部品などに対する内外の需要が想定以上に増加した場合には、価格面での上昇圧力が一段と高まるリスクもある。なお、ＡＩ関連需要拡大の好影響は、これまでのところ、ＩＴ関連セクターの収益拡大や株価上昇に伴う資産効果などを中心に現れている面があるが、今後、ＡＩの利活用による生産性向上などを通じて、その恩恵が幅広いセクターに広がるか、注意を払う必要がある。\nこのほか、米欧を含む各国の財政拡張的な動きなどが、世界経済・物価や金融市場に及ぼす影響にも留意が必要である。中国経済については、不動産市場や労働市場における調整圧力が続くなか、先行きの成長ペースを巡る不確実性は引き続き高いほか、一部の財における供給能力の過剰が世界経済・物価に及ぼす影響についても注意を払う必要がある。\n第３に、為替相場の変動がわが国の経済・物価に及ぼす影響である。これについては様々な経路が考えられるが、為替円安の進行は、グローバル企業の収益などにプラスの影響を及ぼす一方、輸入物価の上昇などを通じて、家計の実質所得を下押しするほか、中小企業などの収益にマイナスに作用する面がある。また、企業の賃金・価格設定行動が積極化するもとで、過去と比べると、為替の変動が物価に影響を及ぼしやすくなっている面があることや、そうした動きが、予想物価上昇率の変化を通じて基調的な物価上昇率に影響する可能性があることにも留意が必要である。この点、原油高等の市況要因に加え、為替円安の進行から、足もと輸入物価の前年比が大きく上昇していることは、先行き、耐久財をはじめとした幅広い品目の価格を押し上げる方向に作用すると考えられ、その影響を十分注視する必要がある。\nこれらのリスクに加え、やや長い目でみたリスク要因としては、わが国を巡る様々な環境変化が企業や家計の中長期的な成長期待や潜在成長率に与える影響がある。人口動態の構造的な変化等に伴う人手不足感の強まりは、デジタル化やＡＩの利活用などによる省力化投資の動きを加速させる可能性があり、政府が進めている成長分野への投資増加に向けた取り組みと相俟って、成長期待や潜在成長率を押し上げることも考えられる。この点、投資の制約要因として、人手不足とともに、資材価格の高騰等を指摘する声が多いことを踏まえると、適切な金融政策運営を通じて物価の安定を実現することは、わが国の成長投資の拡大を支える観点からも重要である。一方、人手不足下において、資本と労働の代替が十分に進展しない場合には、供給制約によって成長率が下押しされるリスクがあることには注意が必要である。この間、これまで打ち出された各国の通商政策はグローバル化の潮流に変化を及ぼしている面があり、今後の各国の政策の展開次第では、そうした変化が急速に進むことも考えられる。\n４．金融政策運営\n以上の経済・物価情勢について、「物価安定の目標」のもとで、２つの「柱」による点検を行い、先行きの金融政策運営の考え方を整理する。\nまず、第１の柱、すなわち中心的な見通しについて点検すると、消費者物価（除く生鮮食品）の前年比は、賃金上昇を販売価格に転嫁する動きが続くもとで、これまでの原油価格上昇が、エネルギーや財を中心に価格を押し上げるほか、グローバルなＡＩ関連需要の増加に伴う半導体価格等の上昇や最近の為替円安が耐久財等の価格上昇につながることから、2026年度後半以降、２％をはっきりと上回る水準まで伸び率を高めていくと予想される。その後、見通し期間後半には、原油高の影響が減衰していくもとで、２％程度に向けてプラス幅を縮小していくと考えられる。この間、人手不足感の強い状況が続くなかで、賃金と物価が相互に参照しながら緩やかに上昇していくメカニズムは維持され、中長期的な予想物価上昇率は上昇していくと見込まれる。こうしたもとで、消費者物価の基調的な上昇率は、徐々に高まっていくと予想され、2026年度後半から2027年度にかけて「物価安定の目標」と概ね整合的な水準となり、その後も同程度で推移すると考えられる。\n政策金利の水準が一頃に比べて上昇しているなかにあっては、金融環境がどのように変化していくかを点検していくことも重要である。この点、実質金利は短中期ゾーンを中心にマイナスとなっているほか、企業全体の収益性と比較した金利コストはなお十分に低い状況が続いている。こうしたなか、企業等の資金需要は増加しており、金融機関の貸出態度も引き続き積極的である。ＣＰ・社債市場でも良好な発行環境が続いている。これらの動きを踏まえると、わが国の金融環境は緩和した状態が維持されており、引き続き、経済活動をしっかりとサポートしていくと考えられる。\n次に、第２の柱、すなわち金融政策運営の観点から重視すべきリスクについて点検する。わが国経済・物価を巡るリスク要因としては様々なものがあるが、当面は、中東情勢が金融・為替市場やわが国の経済・物価に及ぼす影響をとくに注視する必要がある。このほか、グローバルなＡＩ関連需要の動向や今後の為替相場の変動が、わが国の経済・物価に及ぼす影響にも留意が必要である。リスクバランスは、経済の見通しについては、概ねバランスしている。消費者物価の見通しについては、上振れリスクの方が大きい。前述したとおり、基調的な物価上昇率が２％に近づいているなか、企業の賃金・価格設定行動が積極化していることや、中長期的な予想物価上昇率が引き続き上昇していることなどを踏まえると、基調的な物価上昇率が２％の「物価安定の目標」を超えて上振れていくリスクがある。こうしたリスクが顕在化し、それがその後の経済に悪影響を及ぼすことがないよう、十分に留意する必要がある。\n金融面のリスクについてみると、不動産価格や株価といった資産価格の動向には引き続き留意が必要であるものの、貸出などの金融仲介活動は円滑に行われており、現在の金融活動に大きな不均衡はみられていない。わが国の金融システムは、全体として安定性を維持している。内外の実体経済や国際金融市場が調整する状況を想定しても、わが国の金融機関が充実した資本基盤を備えていることなどを踏まえると、全体として相応の頑健性を有している。そのうえで、今後の中東情勢やＡＩ関連投資の収益性、海外ノンバンク部門の動向等が、様々な経路を通じて金融システムに及ぼす影響については丁寧にみていく必要がある。\n金融政策運営については、基調的な物価上昇率が２％に近づいているなか、現在の金融環境が緩和的であることを踏まえると、経済・物価・金融情勢に応じて、引き続き政策金利を引き上げ、金融緩和の度合いを調整していくことになると考えている。そのうえで、調整のタイミングやペースについては、中東情勢やＡＩ関連需要の拡大、為替相場の変動の影響を含め、経済・物価の中心的な見通しが実現する確度やリスクを点検しながら、検討していく方針である。とくに、基調的な物価上昇率が２％の「物価安定の目標」を超えて上振れていくリスクが顕在化し、それがその後の経済に悪影響を及ぼすことがないよう、基調的な物価上昇率を２％程度の水準で安定させていくという観点が重要になると考えている。日本銀行は、２％の「物価安定の目標」のもとで、その持続的・安定的な実現という観点から、適切に金融政策を運営していく。\n（注）\n注１　本基本的見解は、７月30、31日開催の政策委員会・金融政策決定会合で決定されたものである。\n注２　各政策委員は、既に決定した政策を前提として、また、先行きの政策運営については、市場の織り込みを参考にして、見通しを作成している。なお、原油価格（ドバイ原油）については、先物市場の動向などを参考に、１バレル80ドル程度を出発点に、見通し期間の終盤にかけて、70ドル程度まで下落していくと想定している。\n注３　わが国の潜在成長率を、一定の手法で推計すると、足もとでは「０％台半ばから後半」と計算される。ただし、潜在成長率は、推計手法や今後蓄積されていくデータに左右されるうえ、デジタル化の進展などに伴い生産性や労働供給のトレンドがどのように変化するかといった点を巡る不確実性も高いため、相当の幅をもってみる必要がある。\n注４　「物価安定の目標」のもとでの２つの「柱」による点検については、日本銀行「金融政策運営の枠組みのもとでの「物価安定の目標」について」（2013年１月22日）参照。",

     "text": "第２に、ＡＩ関連需要を含む内外の経済・物価動向である。ＡＩ関連については、その用途の急速な広がりとともに、グローバルな需要拡大が続いており、旺盛な設備投資が世界経済を一段と押し上げる可能性がある。一方、投資に見合った形で収益の拡大が実現しない場合には、資産価格の変動なども伴って、調整圧力が生じる可能性もある。物価面では、最近の半導体価格の上昇は、関連する耐久財の価格を押し上げるとみられるほか、企業間取引において、銅などの素材価格や機械類の価格が上昇していることも踏まえると、今後は、消費者段階においても、様々な品目の価格上昇につながる可能性がある。こうしたＡＩ関連の材料・部品などに対する内外の需要が想定以上に増加した場合には、価格面での上昇圧力が一段と高まるリスクもある。なお、ＡＩ関連需要拡大の好影響は、これまでのところ、ＩＴ関連セクターの収益拡大や株価上昇に伴う資産効果などを中心に現れている面があるが、今後、ＡＩの利活用による生産性向上などを通じて、その恩恵が幅広いセクターに広がるか、注意を払う必要がある。\nこのほか、米欧を含む各国の財政拡張的な動きなどが、世界経済・物価や金融市場に及ぼす影響にも留意が必要である。中国経済については、不動産市場や労働市場における調整圧力が続くなか、先行きの成長ペースを巡る不確実性は引き続き高いほか、一部の財における供給能力の過剰が世界経済・物価に及ぼす影響についても注意を払う必要がある。"
    }

     "start": 5707,

     "text": "第３に、為替相場の変動がわが国の経済・物価に及ぼす影響である。これについては様々な経路が考えられるが、為替円安の進行は、グローバル企業の収益などにプラスの影響を及ぼす一方、輸入物価の上昇などを通じて、家計の実質所得を下押しするほか、中小企業などの収益にマイナスに作用する面がある。また、企業の賃金・価格設定行動が積極化するもとで、過去と比べると、為替の変動が物価に影響を及ぼしやすくなっている面があることや、そうした動きが、予想物価上昇率の変化を通じて基調的な物価上昇率に影響する可能性があることにも留意が必要である。この点、原油高等の市況要因に加え、為替円安の進行から、足もと輸入物価の前年比が大きく上昇していることは、先行き、耐久財をはじめとした幅広い品目の価格を押し上げる方向に作用すると考えられ、その影響を十分注視する必要がある。"

     "start": 6077,
     "end": 6530,
     "text": "これらのリスクに加え、やや長い目でみたリスク要因としては、わが国を巡る様々な環境変化が企業や家計の中長期的な成長期待や潜在成長率に与える影響がある。人口動態の構造的な変化等に伴う人手不足感の強まりは、デジタル化やＡＩの利活用などによる省力化投資の動きを加速させる可能性があり、政府が進めている成長分野への投資増加に向けた取り組みと相俟って、成長期待や潜在成長率を押し上げることも考えられる。この点、投資の制約要因として、人手不足とともに、資材価格の高騰等を指摘する声が多いことを踏まえると、適切な金融政策運営を通じて物価の安定を実現することは、わが国の成長投資の拡大を支える観点からも重要である。一方、人手不足下において、資本と労働の代替が十分に進展しない場合には、供給制約によって成長率が下押しされるリスクがあることには注意が必要である。この間、これまで打ち出された各国の通商政策はグローバル化の潮流に変化を及ぼしている面があり、今後の各国の政策の展開次第では、そうした変化が急速に進むことも考えられる。"

addEventListener('resize', () => { clearTimeout(resizeTO); resizeTO = setTimeout(() => { if (sess) endSeg(sess.u >= 0.5 ? 1 : 0); renderAll(); afterRender(); drawGauge(); }, 120); });

/* =====================================================================
   10. Start
   ===================================================================== */
$('#title').textContent = meta.title || (LANG === 'ja' ? '無題' : 'Untitled');
document.title = (meta.title ? meta.title + ' — ' : '') + 'Semantic Model';
if (meta.source) $('#sourceLine').textContent = meta.source;
if (problems.length) {
  const p = $('#problems'); p.hidden = false;
  p.append(h('b', {}, T.problems), h('ul', {}, ...problems.slice(0, 8).map(x => h('li', {}, x))));
}
showTheme();
buildGauge();
buildMinimap();
renderAll();
afterRender();
drawGauge();
if (viewOpt.focus && nodes.get(viewOpt.focus)) setPinned(nodes.get(viewOpt.focus), { scroll: true });
(document.fonts ? document.fonts.ready : Promise.resolve()).then(() => { if (!sess) { layoutText(); afterRender(); } });

window.__semanticViewer = {
  get state() { return { stage: S.stage, stop: S.stop, rep: S.rep, u: sess ? sess.u : null, moving: !!sess, pinned: S.pinned ? keyOf(S.pinned) : null, hover: S.hover ? keyOf(S.hover) : null }; },
  problems, order: order.map(n => ({ id: n.id, num: n.num })),
  goTo: (st, o) => goTo(st, o),
  scrub: (a, b, u) => { if (!sess || sess.a !== a || sess.b !== b) { if (sess) endSeg(0); beginSeg(a, b); } frame(u); },
  release: () => release(),
  gauge: { w: GW, h: GH, at: GP },
  pin: id => setPinned(elsById.get(id) || null, { scroll: true }), hover: id => setHover(elsById.get(id) || null),
};
})();
</script>
