<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>経済・物価情勢の展望（2026年7月）基本的見解 — Semantic Model Viewer</title>
<meta name="description" content="Source text and its Semantic Model side by side (Two Pane), or the model forming step by step (Formation).">
<style>
/*
  Semantic Model Viewer — one HTML, two views of one Semantic Model (semantic-model/1).
  Two Pane: source and model side by side, synchronized both ways.
  Formation: the model forming from a focus, or in reading order, with each element rising from its words.
  The page never derives meaning from the source text; it only reads the embedded model.
*/
:root {
  --bg: #f6f6f3;
  --panel: #ffffff;
  --fg: #1c1e23;
  --muted: #646a75;
  --line: #d8dadf;
  --node: #ffffff;
  --node-line: #8f96a3;
  --edge: #7c8390;
  /* data colors: one meaning each (see references/two-pane.md) */
  --focus: #ffd21f;          /* what you are looking at: a highlighter */
  --focus-rgb: 255, 210, 31;
  --focus-ink: #b38f00;      /* the same, for thin marks */
  --rel: #7c8594;            /* related, without a sign */
  --rel-rgb: 124, 133, 148;
  --pos: #d9480f;            /* + moves with */
  --pos-rgb: 217, 72, 15;
  --neg: #1c6fd6;            /* − moves against */
  --neg-rgb: 28, 111, 214;
  --evidence: #7048e8;       /* what an inference rests on */
  --evidence-rgb: 112, 72, 232;
  --uncertain: #7a5230;
  --ui: #2b2f36;             /* controls, kept apart from data colors */
  --ui-fg: #ffffff;
  --chip: #eef0f4;
  --shadow: 0 8px 28px rgba(20, 24, 33, .12);
  --font: system-ui, -apple-system, "Hiragino Sans", "Hiragino Kaku Gothic ProN", "Noto Sans JP", "Yu Gothic UI", "Yu Gothic", Meiryo, sans-serif;
  --mono: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #121418; --panel: #1a1d23; --fg: #e8eaee; --muted: #9aa1ad; --line: #2c3038;
    --node: #1f232a; --node-line: #737b88; --edge: #8a919d;
    --focus: #ffd21f; --focus-rgb: 255, 210, 31; --focus-ink: #ffd21f; --rel: #9aa1ad; --rel-rgb: 154, 161, 173;
    --pos: #ff8a4c; --pos-rgb: 255, 138, 76; --neg: #6ba8ff; --neg-rgb: 107, 168, 255;
    --evidence: #a78bfa; --evidence-rgb: 167, 139, 250; --uncertain: #c9a27e; --ui: #e8eaee; --ui-fg: #121418;
    --chip: #262a32; --shadow: 0 8px 28px rgba(0, 0, 0, .45);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #121418; --panel: #1a1d23; --fg: #e8eaee; --muted: #9aa1ad; --line: #2c3038;
  --node: #1f232a; --node-line: #737b88; --edge: #8a919d;
  --focus: #ffd21f; --focus-rgb: 255, 210, 31; --focus-ink: #ffd21f; --rel: #9aa1ad; --rel-rgb: 154, 161, 173;
  --pos: #ff8a4c; --pos-rgb: 255, 138, 76; --neg: #6ba8ff; --neg-rgb: 107, 168, 255;
  --evidence: #a78bfa; --evidence-rgb: 167, 139, 250; --uncertain: #c9a27e; --ui: #e8eaee; --ui-fg: #121418;
  --chip: #262a32; --shadow: 0 8px 28px rgba(0, 0, 0, .45);
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { height: 100%; }
body { margin: 0; background: var(--bg); color: var(--fg); font: 14px/1.6 var(--font); display: grid; grid-template-rows: auto minmax(0, 1fr); grid-template-columns: minmax(0, 1fr); overflow: hidden; }
button, select { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--ui); outline-offset: 2px; }

/* ---------- header ---------- */
header { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 16px; padding: 10px 16px; border-bottom: 1px solid var(--line); background: var(--panel); }
.titles { min-width: 0; flex: 1 1 260px; }
.titles h1 { font-size: 16px; line-height: 1.3; margin: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.titles .src { color: var(--muted); font-size: 12px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.titles .src a { color: inherit; }
.seg-ctl { display: inline-flex; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; background: var(--bg); }
.seg-ctl button { border: 0; background: transparent; padding: 5px 12px; font-size: 13px; }
.seg-ctl button + button { border-left: 1px solid var(--line); }
.seg-ctl button[aria-pressed="true"] { background: var(--ui); color: var(--ui-fg); }
.ctl-label { font-size: 11px; color: var(--muted); margin-right: 6px; letter-spacing: .04em; }
.ctl { display: inline-flex; align-items: center; }
.ctl[hidden] { display: none; }

/* ---------- panes ---------- */
main { display: grid; grid-template-columns: minmax(280px, 41%) minmax(0, 1fr); min-height: 0; }
#sourceWrap { position: relative; min-height: 0; border-right: 1px solid var(--line); background: var(--panel); }
#sourcePane { position: absolute; inset: 0; overflow: auto; padding: 22px 30px 40vh 26px; scroll-behavior: auto; }
#source { white-space: pre-wrap; font-size: 15px; line-height: 2; max-width: 44em; margin: 0; overflow-wrap: anywhere; }
#ticks { position: absolute; top: 0; right: 0; width: 8px; bottom: 0; pointer-events: none; }
#ticks i { position: absolute; right: 1px; width: 6px; height: 3px; border-radius: 2px; background: var(--focus-ink); pointer-events: auto; cursor: pointer; }
#ticks i.ev { background: var(--evidence); }
#ticks i.weak { opacity: .45; }
#ticks i.pos { background: var(--pos); }
#ticks i.neg { background: var(--neg); }

.seg { border-radius: 3px; cursor: pointer; transition: background-color .15s, box-shadow .15s; text-decoration: underline dotted rgba(var(--rel-rgb), .45); text-underline-offset: 4px; text-decoration-thickness: 1px; }
body.focusing .seg { text-decoration-color: transparent; }
.seg.lit { background-color: rgba(var(--rel-rgb), calc(var(--hl) * .38)); }
.seg.lit.pos { background-color: rgba(var(--pos-rgb), calc(var(--hl) * .44)); }
.seg.lit.neg { background-color: rgba(var(--neg-rgb), calc(var(--hl) * .44)); }
.seg.hot { box-shadow: inset 0 -2px 0 var(--fg); background-color: rgba(var(--focus-rgb), .55); }
.seg.ev { background-color: rgba(var(--evidence-rgb), .2); box-shadow: inset 0 -2px 0 var(--evidence); }
.seg.flash { animation: flash 1.2s ease-out; }
@keyframes flash { 0%, 30% { background-color: rgba(var(--focus-rgb), .8); } 100% { background-color: transparent; } }
/* formation states */
body.formation .seg { cursor: default; text-decoration-color: transparent; }
body.formation #source { color: var(--muted); }
.seg.formed { color: var(--fg); background-color: rgba(var(--rel-rgb), .1); }
.seg.current { color: var(--fg); background-color: rgba(var(--focus-rgb), .55); box-shadow: inset 0 -2px 0 var(--fg); }
#source .reading { color: var(--fg); }

#graphPane { position: relative; min-height: 0; overflow: hidden; }
#graph { position: absolute; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; cursor: grab; user-select: none; -webkit-user-select: none; }
#graph.panning { cursor: grabbing; }

/* ---------- graph ---------- */
.node { --hl: 1; opacity: calc(.12 + .88 * var(--hl)); transition: opacity .2s; cursor: pointer; }
.node .box { fill: var(--node); stroke: var(--node-line); stroke-width: 1.2; }
.node .box2 { fill: none; stroke: var(--node-line); stroke-width: .9; }
.node text { fill: var(--fg); dominant-baseline: central; text-anchor: middle; pointer-events: none; }
.node .tag { fill: var(--muted); font-family: var(--mono); letter-spacing: .02em; }
.node .badge circle { fill: var(--chip); stroke: var(--node-line); stroke-width: .8; }
.node .badge text { fill: var(--muted); font-weight: 700; }
.node .qmark circle { fill: var(--uncertain); }
.node .qmark text { fill: #fff; font-weight: 700; }
.node.prov-inferred .box, .node.prov-uncertain .box { stroke-dasharray: 5 3; }
.node.prov-uncertain .box { stroke: var(--uncertain); }
.node.prov-abstracted .box { stroke-dasharray: 1.5 2.5; stroke-width: 1.6; }
.node.is-focus .box { stroke: var(--fg); stroke-width: 2.8; fill: color-mix(in srgb, var(--focus) 34%, var(--node)); }
.node.is-near .box { stroke: var(--rel); stroke-width: 1.9; }
.node.is-evidence .box { stroke: var(--evidence); stroke-width: 2.2; }
.node.is-hover .box { stroke-width: 2.6; }
.node.in-view .box { fill: color-mix(in srgb, var(--focus) 12%, var(--node)); }
.node.tiny text, .node.tiny .badge, .node.tiny .qmark, .node.tiny .box, .node.tiny .box2 { display: none; }
.node .dot { display: none; fill: var(--node-line); }
.node.tiny .dot { display: inline; }
.node.tiny.is-focus .dot { fill: var(--focus-ink); }
.node.tiny.is-near .dot { fill: var(--rel); }
.node.tiny.is-evidence .dot { fill: var(--evidence); }
.node.notag .tag { display: none; }
.node .ring { fill: none; stroke: var(--focus-ink); stroke-width: 2.4; opacity: 0; }

.edge { --hl: 1; opacity: calc(var(--edge-idle, .55) * (1 - var(--focusing, 0)) + var(--focusing, 0) * (.06 + .94 * var(--hl))); transition: opacity .2s; cursor: pointer; }
.edge .line { fill: none; stroke: var(--edge); stroke-width: 1.3; }
.edge .arrow { fill: var(--edge); }
.edge .hit { fill: none; stroke: transparent; stroke-width: 12; }
.edge .elabel { fill: var(--muted); font-size: 10.5px; text-anchor: middle; dominant-baseline: central; paint-order: stroke; stroke: var(--bg); stroke-width: 3.5px; stroke-linejoin: round; pointer-events: none; }
.edge.prov-inferred .line, .edge.prov-uncertain .line { stroke-dasharray: 6 4; }
.edge.prov-uncertain .line { stroke: var(--uncertain); }
.edge.prov-abstracted .line { stroke-dasharray: 1.5 3; }
.edge.pol-plus .line { stroke: var(--pos); }
.edge.pol-plus .arrow { fill: var(--pos); }
.edge.pol-minus .line { stroke: var(--neg); }
.edge.pol-minus .arrow { fill: var(--neg); }
.node text.state { fill: var(--muted); text-anchor: start; }
.node .state-when { fill: var(--fg); font-weight: 700; }
.node.nostate .state, .node.nostate .state-when, .node.nostate .sep { display: none; }
.node .sep { stroke: var(--line); stroke-width: 1; }
.node.role-conclusion .box { stroke-width: 2.4; stroke: var(--fg); }
.node.role-conclusion .box2 { stroke: var(--fg); }
.edge.is-focus .line { stroke: var(--fg); stroke-width: 2.6; }
.edge.is-focus .arrow { fill: var(--fg); }
.edge.is-near .line { stroke: var(--rel); stroke-width: 2.2; }
.edge.is-near .arrow { fill: var(--rel); }
.edge.is-focus.pol-plus .line, .edge.is-focus.pol-minus .line { stroke-width: 3; }
.edge.is-near.pol-plus .line, .edge.is-focus.pol-plus .line { stroke: var(--pos); }
.edge.is-near.pol-plus .arrow, .edge.is-focus.pol-plus .arrow { fill: var(--pos); }
.edge.is-near.pol-minus .line, .edge.is-focus.pol-minus .line { stroke: var(--neg); }
.edge.is-near.pol-minus .arrow, .edge.is-focus.pol-minus .arrow { fill: var(--neg); }
.node.is-near.near-plus .box { stroke: var(--pos); }
.node.is-near.near-minus .box { stroke: var(--neg); }
.node.tiny.is-near.near-plus .dot { fill: var(--pos); }
.node.tiny.is-near.near-minus .dot { fill: var(--neg); }
.edge.is-focus .elabel, .edge.is-near .elabel { fill: var(--fg); font-weight: 600; }
.edge.is-evidence .line { stroke: var(--evidence); stroke-width: 2.2; }
.edge.is-evidence .arrow { fill: var(--evidence); }
.edge.is-hover .line { stroke-width: 2.6; }
.edge.nolabel .elabel { display: none; }
.edge.is-focus.nolabel .elabel, .edge.is-near.nolabel .elabel, .edge.is-evidence.nolabel .elabel { display: inline; }

.partof { fill: none; stroke: var(--node-line); stroke-width: 1; stroke-dasharray: 1 4; stroke-linecap: round; opacity: .55; pointer-events: none; }
.basis { fill: none; stroke: var(--evidence); stroke-width: 1.4; stroke-dasharray: 2 4; stroke-linecap: round; opacity: 0; pointer-events: none; transition: opacity .2s; }
.basis.on { opacity: .9; }
body.focusing .partof { opacity: .18; }

/* formation visibility */
.f-hidden { display: none; }
body.formation .node, body.formation .edge { --focusing: 1; }
body.formation .node.formed { --hl: .62; }
body.formation .edge.formed { --hl: .5; }
body.formation .node.current { --hl: 1; }
body.formation .node.current .box { stroke: var(--fg); stroke-width: 2.6; fill: color-mix(in srgb, var(--focus) 34%, var(--node)); }
body.formation .edge.current { --hl: 1; }
body.formation .edge.current .line { stroke-width: 2.8; }
body.formation .edge.current:not(.pol-plus):not(.pol-minus) .line { stroke: var(--fg); }
body.formation .edge.current:not(.pol-plus):not(.pol-minus) .arrow { fill: var(--fg); }
body.formation .edge.current .elabel { display: inline; fill: var(--fg); font-weight: 600; }
body.formation.complete .node, body.formation.complete .edge { --hl: 1; }
body.formation .partof { opacity: .35; }

/* ---------- overlays ---------- */
.overlay { position: absolute; pointer-events: none; }
.overlay > * { pointer-events: auto; }
#tools { right: 12px; bottom: 12px; display: flex; gap: 6px; }
.icon-btn { width: 32px; height: 32px; border-radius: 8px; border: 1px solid var(--line); background: var(--panel); box-shadow: var(--shadow); display: grid; place-items: center; font-size: 16px; line-height: 1; }
.icon-btn[aria-pressed="true"] { background: var(--ui); color: var(--ui-fg); border-color: var(--ui); }
.text-btn { height: 32px; padding: 0 10px; border-radius: 8px; border: 1px solid var(--line); background: var(--panel); box-shadow: var(--shadow); font-size: 12px; }
.text-btn[aria-pressed="true"] { background: var(--ui); color: var(--ui-fg); border-color: var(--ui); }
#legend { left: 12px; bottom: 12px; background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 8px 10px; font-size: 11.5px; color: var(--muted); box-shadow: var(--shadow); display: grid; gap: 3px; }
#legend svg { vertical-align: middle; margin-right: 6px; }
#legend[hidden] { display: none; }
#offscreen { inset: 0; }
#offscreen .chip { position: absolute; transform: translate(-50%, -50%); max-width: 150px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; font-size: 11px; padding: 2px 8px; border-radius: 999px; background: var(--panel); border: 1.5px solid var(--fg); color: var(--fg); box-shadow: var(--shadow); cursor: pointer; }
#offscreen .chip.ev { border-color: var(--evidence); }
#offscreen .chip.weak { opacity: .7; border-style: dashed; }

#details { right: 12px; top: 12px; width: min(340px, calc(100% - 24px)); max-height: calc(100% - 76px); overflow: auto; background: var(--panel); border: 1px solid var(--line); border-radius: 12px; box-shadow: var(--shadow); padding: 12px 14px; font-size: 13px; }
#details[hidden] { display: none; }
#details.compact { width: min(300px, calc(100% - 24px)); padding: 8px 12px; opacity: .96; }
#details.compact h2 { font-size: 14px; margin: 2px 0 2px; }
#details h2 { font-size: 15px; line-height: 1.35; margin: 4px 0 8px; }
#details .meta { display: flex; flex-wrap: wrap; gap: 4px; }
#details .pill { font-size: 11px; padding: 1px 8px; border-radius: 999px; background: var(--chip); color: var(--muted); }
#details .pill.prov-explicit { color: var(--fg); }
#details .pill.prov-inferred, #details .pill.prov-abstracted { color: var(--evidence); }
#details .pill.prov-uncertain { color: var(--uncertain); }
#details .pin { font-size: 11px; color: var(--fg); }
#details .close { margin-left: auto; border: 0; background: transparent; color: var(--muted); font-size: 18px; line-height: 1; padding: 0 2px; }
#details h3 { font-size: 11px; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); margin: 12px 0 4px; font-weight: 600; }
#details ul { list-style: none; margin: 0; padding: 0; display: grid; gap: 3px; }
#details li button { all: unset; cursor: pointer; display: block; width: 100%; border-radius: 6px; padding: 2px 6px; margin: 0 -6px; }
#details li button:hover, #details li button:focus-visible { background: var(--chip); }
#details .q { color: var(--fg); }
#details .q::before { content: "「"; color: var(--muted); }
#details .q::after { content: "」"; color: var(--muted); }
#details .note { background: var(--chip); border-radius: 8px; padding: 6px 8px; margin-top: 8px; }
#details .arrowtxt { color: var(--muted); }
#details .extra { font-family: var(--mono); font-size: 11.5px; white-space: pre-wrap; overflow-wrap: anywhere; color: var(--muted); }
#details .hint { color: var(--muted); }
#details .actions { margin-top: 10px; display: flex; gap: 6px; flex-wrap: wrap; }
#details .actions button { border: 1px solid var(--line); background: var(--bg); border-radius: 8px; padding: 3px 10px; font-size: 12px; }

#problems { left: 12px; top: 12px; max-width: min(420px, calc(100% - 24px)); background: var(--panel); border: 1px solid var(--uncertain); color: var(--uncertain); border-radius: 10px; padding: 6px 10px; font-size: 12px; box-shadow: var(--shadow); }
#problems[hidden] { display: none; }

/* formation bar */
#fbar { left: 12px; right: 12px; bottom: 12px; display: none; flex-direction: column; gap: 8px; }
body.formation #fbar { display: flex; }
body.formation #tools, body.formation #legend, body.formation #details { display: none; }
#caption { align-self: center; max-width: min(760px, 100%); background: var(--panel); border: 1px solid var(--line); border-radius: 12px; box-shadow: var(--shadow); padding: 8px 14px; text-align: center; }
#caption .phase { font-size: 11px; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); font-weight: 700; }
#caption .main { font-size: 15px; font-weight: 600; line-height: 1.45; }
#caption .quote { font-size: 12.5px; color: var(--muted); margin-top: 2px; overflow: hidden; text-overflow: ellipsis; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; }
#controls { align-self: center; display: flex; flex-wrap: wrap; justify-content: center; align-items: center; gap: 6px; background: var(--panel); border: 1px solid var(--line); border-radius: 12px; box-shadow: var(--shadow); padding: 6px 8px; }
#controls select { border: 1px solid var(--line); border-radius: 8px; background: var(--bg); padding: 3px 6px; font-size: 12px; max-width: 180px; }
#progress { font-family: var(--mono); font-size: 12px; color: var(--muted); min-width: 64px; text-align: center; }
#steps { right: 12px; top: 12px; width: min(300px, calc(100% - 24px)); max-height: calc(100% - 210px); overflow: auto; background: var(--panel); border: 1px solid var(--line); border-radius: 12px; box-shadow: var(--shadow); padding: 8px; font-size: 12px; display: none; }
body.formation #steps.open { display: block; }
#steps h3 { font-size: 11px; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); margin: 8px 6px 2px; }
#steps button { all: unset; display: block; width: 100%; box-sizing: border-box; padding: 3px 6px; border-radius: 6px; cursor: pointer; color: var(--muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
#steps button:hover { background: var(--chip); }
#steps button.done { color: var(--fg); }
#steps button.now { background: rgba(var(--focus-rgb), .38); color: var(--fg); font-weight: 600; }

.ghost { position: fixed; left: 0; top: 0; z-index: 20; pointer-events: none; padding: 1px 6px; border-radius: 6px; background: rgba(var(--focus-rgb), .95); color: #1c1e23; font-size: 13px; white-space: nowrap; box-shadow: var(--shadow); }

@media (max-width: 860px) {
  body { overflow: auto; }
  main { grid-template-columns: minmax(0, 1fr); grid-template-rows: 42vh 58vh; }
  header { padding: 8px 12px; }
  #sourceWrap { border-right: 0; border-bottom: 1px solid var(--line); }
  #sourcePane { padding: 14px 18px 30vh 16px; }
  #details { top: auto; bottom: 56px; max-height: 45%; }
  #legend { display: none; }
  body.formation main { grid-template-rows: 30vh 70vh; }
  #caption { padding: 6px 10px; }
  #caption .main { font-size: 13.5px; }
  #caption .quote { display: none; }
  #controls { gap: 4px; padding: 5px 6px; }
  #controls select { max-width: 120px; }
  #controls .icon-btn { width: 30px; height: 30px; }
}
@media (prefers-reduced-motion: reduce) {
  * { transition: none !important; animation: none !important; }
}
</style>
</head>
<body>
<header>
  <div class="titles"><h1 id="title">Semantic Model</h1><div class="src" id="sourceLine"></div></div>
  <div class="ctl"><span class="ctl-label" data-i18n="view">VIEW</span>
    <div class="seg-ctl" id="modeCtl" role="group">
      <button type="button" data-mode="two-pane" aria-pressed="true" data-i18n="twoPane">Two Pane</button>
      <button type="button" data-mode="formation" aria-pressed="false" data-i18n="formation">Formation</button>
    </div>
  </div>
  <div class="ctl" id="levelWrap" hidden><span class="ctl-label" data-i18n="scale">SCALE</span>
    <div class="seg-ctl" id="levelCtl" role="group"></div>
  </div>
</header>
<main>
  <div id="sourceWrap">
    <div id="sourcePane" tabindex="0" aria-label="Source text"><p id="source"></p></div>
    <div id="ticks" aria-hidden="true"></div>
  </div>
  <div id="graphPane">
    <svg id="graph" role="group" aria-label="Semantic Model graph">
      <g id="layer-hulls"></g>
      <g id="layer-partof"></g>
      <g id="layer-basis"></g>
      <g id="layer-edges"></g>
      <g id="layer-nodes"></g>
    </svg>
    <div class="overlay" id="offscreen"></div>
    <div class="overlay" id="problems" hidden></div>
    <aside class="overlay" id="details" hidden aria-live="polite"></aside>
    <div class="overlay" id="legend"></div>
    <div class="overlay" id="tools">
      <button type="button" class="text-btn" id="followBtn" aria-pressed="false" data-i18n="follow">Follow text</button>

もとで、設備投資は、既往案件の受注残を解消する動きに加え、政府の経済対策や緩和的な金融環境が下支え要因として作用し、緩やかな増加傾向が続くと考えられる。\n家計部門をみると、雇用面では、労働需給は引き締まった状態が続き、名目賃金は、本年の春季労使交渉の結果などを反映して現状程度の伸びが続くと見込まれる。個人消費は、賃金の増加や株価上昇による資産効果に加えて、政府による各種施策を通じた家計への所得移転が下支え要因となるものの、エネルギーを中心とした物価上昇の影響から、横ばい圏内の動きになるとみられる。住宅投資は、住宅価格の上昇や人口動態等を反映して、緩やかな減少傾向をたどるとみられる。この間、公共投資は横ばい圏内で推移し、政府消費は、医療・介護費の趨勢的な増加や防衛関連支出の増加などを反映し、緩やかに増加していくと想定している。\n2027年度以降については、原油高のマイナスの影響が減衰し、所得から支出への前向きな循環メカニズムが徐々に強まっていくことから、わが国経済は成長率を緩やかに高めていくと考えられる。輸出や生産は、中東情勢の影響が和らぎ、海外経済の緩やかな成長が続くなか、グローバルなＡＩ関連需要の強さなどにも支えられ、緩やかに増加していくと考えられる。企業収益は、原油価格の下落に伴う交易条件の改善や内外需要の増加に支えられて、改善していくとみられ、そうしたもとで、設備投資は、人手不足対応の省力化投資やＡＩ関連等の成長分野への能力増強投資に加え、貿易構造やサプライチェーンの変容に適合するための投資案件なども押し上げ要因となり、増加傾向を維持すると考えられる。雇用・所得環境をみると、労働需給は引き締まった状況が続き、名目賃金は着実な増加が続くとみられる。これに加え、物価の上昇ペースが徐々に落ち着いていくと見込まれるなか、個人消費は、緩やかな増加基調に復していくとみられる。\nこうした見通しを前回の展望レポートにおける見通しと比較すると、見通し期間を通じて概ね不変となっている。\nこの間、潜在成長率は、政府による各種の施策の後押しなどもあって、デジタル化や人的資本投資の進展による生産性の上昇、資本ストックの着実な増加などを背景に、小幅のプラスが続くとみられる。\n（２）物価の中心的な見通し\n消費者物価（除く生鮮食品）の前年比は、賃金上昇を販売価格に転嫁する動きが続くもとで、これまでの原油価格上昇が、エネルギーや財を中心に価格を押し上げるほか、グローバルなＡＩ関連需要の増加に伴う半導体価格等の上昇や最近の為替円安が耐久財等の価格上昇につながることから、2026年度後半以降、２％をはっきりと上回る水準まで伸び率を高めていくと予想される。その後、見通し期間後半には、原油高の影響が減衰していくもとで、２％程度に向けてプラス幅を縮小していくと考えられる。\nこの間、人手不足感の強い状況が続くなかで、賃金と物価が相互に参照しながら緩やかに上昇していくメカニズムは維持され、中長期的な予想物価上昇率は上昇していくと見込まれる。こうしたもとで、消費者物価の基調的な上昇率は、徐々に高まっていくと予想され、2026年度後半から2027年度にかけて「物価安定の目標」と概ね整合的な水準となり、その後も同程度で推移すると考えられる。基調的な物価上昇率が２％に近づいていることを踏まえると、今後は、「物価安定の目標」の持続的・安定的な実現という観点から、これが２％程度の水準で定着するかどうかを確認していくことが重要となってくる。\nなお、消費者物価（除く生鮮食品）の見通しは、原油価格の動向や政府による各種施策の影響も受ける。原油価格については、先物市場の動向などを参考に、見通し期間終盤にかけて緩やかに低下していく前提としているが、中東以外の地域からの代替調達に伴って輸送コストが増加していることを踏まえると、わが国の企業が直面する調達価格は、国際市況ほどには低下しないと考えられる。政府による施策については、燃料油補助金などのエネルギー負担緩和策や教育無償化政策等が行われており、2026年度の消費者物価の前年比を押し下げる方向に作用する。\nエネルギー価格の変動の直接的な影響を受けない消費者物価（除く生鮮食品・エネルギー）の前年比は、これまでの原油価格上昇が財を中心に価格を押し上げることに加え、半導体価格等の上昇や最近の為替円安が耐久財等の価格上昇につながることから、２％を超える水準で推移したあと、原油高の影響が減衰していくもとで、プラス幅を縮小すると見込まれる。\nこうした見通しを前回の展望レポートにおける見通しと比較すると、消費者物価（除く生鮮食品）は、政府による夏場のエネルギー負担緩和策（電気・ガス代）の効果等から、2026年度が下振れているが、消費者物価（除く生鮮食品・エネルギー）は、見通し期間を通じて概ね不変である。\n物価の基調を規定する主たる要因について点検すると、労働や設備の稼働状況を表すマクロ的な需給ギャップは、振れを伴いつつも、改善傾向をたどっており、足もとでは小幅のプラスとなっている。先行きの需給ギャップは、上記の経済の見通しのもとで、現状程度のプラスが続くと予想される。この間、女性や高齢者による労働参加の増加ペースの鈍化もあって、労働需給はマクロ的な需給ギャップ以上に引き締まっている。こうしたもと、労働集約的な業種を中心に企業が労働の供給制約に直面しつつある状況を踏まえると、マクロ的な需給ギャップが示唆する以上に、賃金や物価には上昇圧力がかかりやすくなっているとみられる。\n次に、中長期的な予想物価上昇率をみると、緩やかに上昇している。先行きについては、労働需給の引き締まりなどを背景に、企業の積極的な賃金・価格設定行動が続き、予想物価上昇率は緩やかな上昇が続くと予想される。その水準は、2026年度後半から2027年度にかけて２％程度となり、その後も同程度で推移すると考えられる。\n３．経済・物価のリスク要因\n上記の中心的な経済・物価の見通しに対する上振れないし下振れの可能性（リスク要因）としては、主に以下の点に注意が必要である。\n第１に、中東情勢がわが国経済・物価に及ぼす影響である。中東情勢については、なお不透明な状況が続いているが、原油価格は一頃に比べて下落しており、前回の展望レポートで指摘したような、経済の大幅な下振れリスクや物価の大幅な上振れリスクは低下している。とくに、サプライチェーンの大規模な混乱が生じ、わが国企業の生産活動に大きな影響をもたらすリスクは、中東依存度の高い原材料の代替調達が進展していることもあり、低下している。もっとも、これまでの原油価格上昇が経済・物価に及ぼす影響については、引き続き注意が必要である。実体経済面では、原油高に伴う原材料等の価格上昇が、企業収益や家計の実質所得を想定以上に下押しすることがないか、確認していく必要がある。物価面では、原油高を起点に企業間取引における価格転嫁がやや速いスピードで進んでおり、これが、今後、消費者段階における幅広い品目の価格上昇に波及していく可能性が高いと考えられる。これらに加え、中長期の予想物価上昇率が引き続き上昇していることも踏まえると、消費者物価の基調的な上昇率が２％の「物価安定の目標」を超えて上振れていくリスクがある。\nこの間、原油価格については、なお振れの大きい展開が続いている。今後の原油価格の変動がわが国の経済・物価に及ぼす影響については、引き続き留意が必要である。\n第２に、ＡＩ関連需要を含む内外の経済・物価動向である。ＡＩ関連については、その用途の急速な広がりとともに、グローバルな需要拡大が続いており、旺盛な設備投資が世界経済を一段と押し上げる可能性がある。一方、投資に見合った形で収益の拡大が実現しない場合には、資産価格の変動なども伴って、調整圧力が生じる可能性もある。物価面では、最近の半導体価格の上昇は、関連する耐久財の価格を押し上げるとみられるほか、企業間取引において、銅などの素材価格や機械類の価格が上昇していることも踏まえると、今後は、消費者段階においても、様々な品目の価格上昇につながる可能性がある。こうしたＡＩ関連の材料・部品などに対する内外の需要が想定以上に増加した場合には、価格面での上昇圧力が一段と高まるリスクもある。なお、ＡＩ関連需要拡大の好影響は、これまでのところ、ＩＴ関連セクターの収益拡大や株価上昇に伴う資産効果などを中心に現れている面があるが、今後、ＡＩの利活用による生産性向上などを通じて、その恩恵が幅広いセクターに広がるか、注意を払う必要がある。\nこのほか、米欧を含む各国の財政拡張的な動きなどが、世界経済・物価や金融市場に及ぼす影響にも留意が必要である。中国経済については、不動産市場や労働市場における調整圧力が続くなか、先行きの成長ペースを巡る不確実性は引き続き高いほか、一部の財における供給能力の過剰が世界経済・物価に及ぼす影響についても注意を払う必要がある。\n第３に、為替相場の変動がわが国の経済・物価に及ぼす影響である。これについては様々な経路が考えられるが、為替円安の進行は、グローバル企業の収益などにプラスの影響を及ぼす一方、輸入物価の上昇などを通じて、家計の実質所得を下押しするほか、中小企業などの収益にマイナスに作用する面がある。また、企業の賃金・価格設定行動が積極化するもとで、過去と比べると、為替の変動が物価に影響を及ぼしやすくなっている面があることや、そうした動きが、予想物価上昇率の変化を通じて基調的な物価上昇率に影響する可能性があることにも留意が必要である。この点、原油高等の市況要因に加え、為替円安の進行から、足もと輸入物価の前年比が大きく上昇していることは、先行き、耐久財をはじめとした幅広い品目の価格を押し上げる方向に作用すると考えられ、その影響を十分注視する必要がある。\nこれらのリスクに加え、やや長い目でみたリスク要因としては、わが国を巡る様々な環境変化が企業や家計の中長期的な成長期待や潜在成長率に与える影響がある。人口動態の構造的な変化等に伴う人手不足感の強まりは、デジタル化やＡＩの利活用などによる省力化投資の動きを加速させる可能性があり、政府が進めている成長分野への投資増加に向けた取り組みと相俟って、成長期待や潜在成長率を押し上げることも考えられる。この点、投資の制約要因として、人手不足とともに、資材価格の高騰等を指摘する声が多いことを踏まえると、適切な金融政策運営を通じて物価の安定を実現することは、わが国の成長投資の拡大を支える観点からも重要である。一方、人手不足下において、資本と労働の代替が十分に進展しない場合には、供給制約によって成長率が下押しされるリスクがあることには注意が必要である。この間、これまで打ち出された各国の通商政策はグローバル化の潮流に変化を及ぼしている面があり、今後の各国の政策の展開次第では、そうした変化が急速に進むことも考えられる。\n４．金融政策運営\n以上の経済・物価情勢について、「物価安定の目標」のもとで、２つの「柱」による点検を行い、先行きの金融政策運営の考え方を整理する。\nまず、第１の柱、すなわち中心的な見通しについて点検すると、消費者物価（除く生鮮食品）の前年比は、賃金上昇を販売価格に転嫁する動きが続くもとで、これまでの原油価格上昇が、エネルギーや財を中心に価格を押し上げるほか、グローバルなＡＩ関連需要の増加に伴う半導体価格等の上昇や最近の為替円安が耐久財等の価格上昇につながることから、2026年度後半以降、２％をはっきりと上回る水準まで伸び率を高めていくと予想される。その後、見通し期間後半には、原油高の影響が減衰していくもとで、２％程度に向けてプラス幅を縮小していくと考えられる。この間、人手不足感の強い状況が続くなかで、賃金と物価が相互に参照しながら緩やかに上昇していくメカニズムは維持され、中長期的な予想物価上昇率は上昇していくと見込まれる。こうしたもとで、消費者物価の基調的な上昇率は、徐々に高まっていくと予想され、2026年度後半から2027年度にかけて「物価安定の目標」と概ね整合的な水準となり、その後も同程度で推移すると考えられる。\n政策金利の水準が一頃に比べて上昇しているなかにあっては、金融環境がどのように変化していくかを点検していくことも重要である。この点、実質金利は短中期ゾーンを中心にマイナスとなっているほか、企業全体の収益性と比較した金利コストはなお十分に低い状況が続いている。こうしたなか、企業等の資金需要は増加しており、金融機関の貸出態度も引き続き積極的である。ＣＰ・社債市場でも良好な発行環境が続いている。これらの動きを踏まえると、わが国の金融環境は緩和した状態が維持されており、引き続き、経済活動をしっかりとサポートしていくと考えられる。\n次に、第２の柱、すなわち金融政策運営の観点から重視すべきリスクについて点検する。わが国経済・物価を巡るリスク要因としては様々なものがあるが、当面は、中東情勢が金融・為替市場やわが国の経済・物価に及ぼす影響をとくに注視する必要がある。このほか、グローバルなＡＩ関連需要の動向や今後の為替相場の変動が、わが国の経済・物価に及ぼす影響にも留意が必要である。リスクバランスは、経済の見通しについては、概ねバランスしている。消費者物価の見通しについては、上振れリスクの方が大きい。前述したとおり、基調的な物価上昇率が２％に近づいているなか、企業の賃金・価格設定行動が積極化していることや、中長期的な予想物価上昇率が引き続き上昇していることなどを踏まえると、基調的な物価上昇率が２％の「物価安定の目標」を超えて上振れていくリスクがある。こうしたリスクが顕在化し、それがその後の経済に悪影響を及ぼすことがないよう、十分に留意する必要がある。\n金融面のリスクについてみると、不動産価格や株価といった資産価格の動向には引き続き留意が必要であるものの、貸出などの金融仲介活動は円滑に行われており、現在の金融活動に大きな不均衡はみられていない。わが国の金融システムは、全体として安定性を維持している。内外の実体経済や国際金融市場が調整する状況を想定しても、わが国の金融機関が充実した資本基盤を備えていることなどを踏まえると、全体として相応の頑健性を有している。そのうえで、今後の中東情勢やＡＩ関連投資の収益性、海外ノンバンク部門の動向等が、様々な経路を通じて金融システムに及ぼす影響については丁寧にみていく必要がある。\n金融政策運営については、基調的な物価上昇率が２％に近づいているなか、現在の金融環境が緩和的であることを踏まえると、経済・物価・金融情勢に応じて、引き続き政策金利を引き上げ、金融緩和の度合いを調整していくことになると考えている。そのうえで、調整のタイミングやペースについては、中東情勢やＡＩ関連需要の拡大、為替相場の変動の影響を含め、経済・物価の中心的な見通しが実現する確度やリスクを点検しながら、検討していく方針である。とくに、基調的な物価上昇率が２％の「物価安定の目標」を超えて上振れていくリスクが顕在化し、それがその後の経済に悪影響を及ぼすことがないよう、基調的な物価上昇率を２％程度の水準で安定させていくという観点が重要になると考えている。日本銀行は、２％の「物価安定の目標」のもとで、その持続的・安定的な実現という観点から、適切に金融政策を運営していく。\n（注）\n注１　本基本的見解は、７月30、31日開催の政策委員会・金融政策決定会合で決定されたものである。\n注２　各政策委員は、既に決定した政策を前提として、また、先行きの政策運営については、市場の織り込みを参考にして、見通しを作成している。なお、原油価格（ドバイ原油）については、先物市場の動向などを参考に、１バレル80ドル程度を出発点に、見通し期間の終盤にかけて、70ドル程度まで下落していくと想定している。\n注３　わが国の潜在成長率を、一定の手法で推計すると、足もとでは「０％台半ばから後半」と計算される。ただし、潜在成長率は、推計手法や今後蓄積されていくデータに左右されるうえ、デジタル化の進展などに伴い生産性や労働供給のトレンドがどのように変化するかといった点を巡る不確実性も高いため、相当の幅をもってみる必要がある。\n注４　「物価安定の目標」のもとでの２つの「柱」による点検については、日本銀行「金融政策運営の枠組みのもとでの「物価安定の目標」について」（2013年１月22日）参照。",

// animate the transition into step k: items start one after another, overlapping,

async function animateStep(k) {
  const token = ++formation.token;
  const st = formation.steps[k];
  if (!st) return;
  const prevFormed = formedThrough(k - 1);
  showStep(k, { ms: 650 });
  if (reduceMotion) return;
  const items = st.add.filter(it => !prevFormed.has(it.id));
  items.forEach(it => { const d = nodeDom.get(it.id) || edgeDom.get(it.id); if (d) d.g.style.visibility = 'hidden'; });
  await sleep(220 / formation.speed);
  const lead = items.filter(it => !it.via);
  const stagger = clamp(2400 / Math.max(1, lead.length), 120, 260) / formation.speed;
  const dur = clamp(1 - (lead.length - 3) * .06, .45, 1);
  const ready = new Map();
  let slot = 0, ghosts = 0;
  for (const it of items) {
    if (it.via) continue;                      // brought in by its relation
    const v = G.byId.get(it.id);
    const delay = slot++ * stagger;
    if (v.kind === 'node') {
      const fly = ghosts++ < 6;
      ready.set(v.id, (async () => { await sleep(delay); if (token === formation.token) await emergeNode(v, token, dur, fly); })());
    } else {
      const far = items.find(x => x.via === v.id);
      const ends = [ready.get(v.a.id), ready.get(v.b.id)].filter(Boolean);   // fixed now, before this relation registers its far end
      const run = (async () => {
        await sleep(delay);
        await Promise.all(ends);
        if (token !== formation.token) return;
        await growEdge(v, it.from, token, dur);
        if (far && token === formation.token) await popNode(G.byId.get(far.id), dur);
      })();
      ready.set(v.id, run);
      if (far) ready.set(far.id, run);
    }
  }
  await Promise.all(ready.values());
  if (token !== formation.token) return;
  (st.revisit || []).forEach(id => pulse(id));
  items.forEach(it => { const d = nodeDom.get(it.id) || edgeDom.get(it.id); if (d) d.g.style.visibility = ''; });
}

async function play() {
  if (formation.playing) return;
  formation.playing = true;
  $('#playBtn').textContent = '❚❚'; $('#playBtn').setAttribute('aria-label', 'Pause');
  const myToken = ++formation.playToken;
  if (formation.k >= formation.steps.length - 1) showStep(-1, { camera: false });
  while (formation.playing && formation.playToken === myToken && formation.k < formation.steps.length - 1) {
    const k = formation.k + 1;
    const t0 = performance.now();
    await animateStep(k);
    if (formation.playToken !== myToken || !formation.steps[k]) break;
    const rest = stepMs(formation.steps[k]) - (performance.now() - t0);
    if (rest > 0) await sleep(rest);
  }
  if (formation.playToken === myToken) pause();
}
function pause() {
  formation.playing = false;
  formation.playToken = (formation.playToken || 0) + 1;
  $('#playBtn').textContent = '▶'; $('#playBtn').setAttribute('aria-label', 'Play');
}
function stepBy(dir) {
  pause();
  const k = clamp(formation.k + dir, -1, formation.steps.length - 1);

}
function formationKey(ev) {
  if (ev.key === ' ') { ev.preventDefault(); formation.playing ? pause() : play(); }
  else if (ev.key === 'ArrowRight') { ev.preventDefault(); stepBy(1); }
  else if (ev.key === 'ArrowLeft') { ev.preventDefault(); stepBy(-1); }

  else if (ev.key === 'End') { ev.preventDefault(); pause(); showStep(formation.steps.length - 1); }
}

function setMode(m) {

  mode = m;
  $$('#modeCtl button').forEach(b => b.setAttribute('aria-pressed', String(b.dataset.mode === m)));
  document.body.classList.toggle('formation', m === 'formation');
  document.body.classList.remove('complete');
  if (m === 'formation') {
    if (pinned) {
      const v = G.byId.get(pinned.vid);
      if (v && v.kind === 'node' && !formation.pinnedUsed) formation.focusId = v.id;
    }
    hover = null; pinned = null;
    document.body.classList.remove('focusing');
    svg.style.setProperty('--focusing', 1);
    nodeDom.forEach(({ g }) => { g.classList.remove('is-focus', 'is-near', 'is-evidence', 'is-hover', 'in-view'); g.style.removeProperty('--hl'); });
    edgeDom.forEach(({ g }) => { g.classList.remove('is-focus', 'is-near', 'is-evidence', 'is-hover'); g.style.removeProperty('--hl'); });
    segs.forEach(s => { s.el.classList.remove('lit', 'hot', 'ev', 'pos', 'neg'); s.el.style.removeProperty('--hl'); });
    nodeDom.forEach(({ g }) => g.classList.remove('near-plus', 'near-minus'));
    $('#ticks').replaceChildren(); $('#offscreen').replaceChildren();
    restartFormation(true);
  } else {
    pause(); formation.token++;
    nodeDom.forEach(({ g }) => { g.classList.remove('f-hidden', 'formed', 'current'); g.style.visibility = ''; });
    edgeDom.forEach(({ g, line }) => { g.classList.remove('f-hidden', 'formed', 'current'); g.style.visibility = ''; line.style.strokeDasharray = ''; });
    $$('.partof').forEach(p => p.classList.remove('f-hidden'));
    segs.forEach(s => s.el.classList.remove('formed', 'current', 'reading'));

  }
}
