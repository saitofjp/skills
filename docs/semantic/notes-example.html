<!doctype html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>駅前商店街の空き店舗（作例） — Semantic Model Viewer</title>
<meta name="description" content="A text and its model side by side. Rise from the text to its chunks to the model, and turn the model into structure, linear notes, a table or one sentence.">
<style>
/*
  Semantic Model Viewer — the Transform View of one Semantic Model (semantic-model/1).
  Concept: rise through the layers of meaning. The text is the ground; chunks lift off it;
  the model floats above, in a classical, unruly geometry composed from the model itself,
  which lies shattered near the text and comes together as you rise.
  Two moves: focus out / in (text ⇄ chunks ⇄ model) and transform (structure ⇄ linear ⇄ table ⇄ summary).
  The page never derives meaning from the text; everything it shows comes from the embedded model.
  See references/transform-view.md.
*/
:root {
  /* dark (default): luminous layers in a deep space */
  --space: #0a0d14;
  --ground: rgba(15, 19, 27, .9);    /* L0: the text */
  --sky: rgba(12, 16, 25, .28);       /* L2: the model's space, the figure shows through */
  --field: 165, 188, 240;             /* the field: shards on the ground, a composition above */
  --field-a: .075;
  --ink: #e8ecf4;
  --ink-2: #b4bdcd;
  --muted: #7d889d;
  --rule: rgba(160, 180, 225, .17);
  --card: #151a26;
  --card-hi: transparent;
  --card-line: #4a5570;
  --accent: #dfe6f5;          /* the bar on a card's left */
  --frame: rgba(120, 145, 200, .07);
  --slab: rgba(150, 175, 235, .07);
  --slab-line: rgba(160, 185, 240, .22);
  --bracket: rgba(165, 185, 230, .38);
  --thread: #c6dcff;
  --link: rgba(190, 205, 235, .5);
  --band: #e8ecf4; --band-fg: #0a0d14;
  /* data colors: one meaning each */
  --focus: #ffd21f; --focus-rgb: 255, 210, 31; --focus-ink: #ffd21f;
  --rel: #9aa6bd; --rel-rgb: 154, 166, 189;
  --pos: #ff6b3d; --pos-rgb: 255, 107, 61;     /* + : moves with, raises */
  --neg: #4f9dff; --neg-rgb: 79, 157, 255;     /* − : moves against, lowers */
  --evidence: #a98bff; --evidence-rgb: 169, 139, 255;
  --ui: #e8ecf4; --ui-fg: #0a0d14;
  --chip: rgba(165, 185, 230, .12);
  --tone: rgba(165, 188, 240, .16);   /* screentone dots */
  --shadow: none;
  --font: system-ui, -apple-system, "Hiragino Sans", "Hiragino Kaku Gothic ProN", "Noto Sans JP", "Yu Gothic UI", "Yu Gothic", Meiryo, sans-serif;
  --mono: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  --ease-settle: cubic-bezier(.22, 1.18, .42, 1);
  color-scheme: dark;
}
:root[data-theme="light"] {
  --space: #e9edf3; --ground: rgba(246, 248, 251, .9); --sky: rgba(240, 244, 249, .3); --field: 30, 45, 85; --field-a: .06;
  --ink: #111622; --ink-2: #39414f; --muted: #687286; --rule: rgba(30, 50, 90, .14);
  --card: #ffffff; --card-hi: transparent; --card-line: #111622; --accent: #111622;
  --frame: rgba(30, 50, 90, .04); --slab: rgba(40, 70, 130, .05); --slab-line: rgba(40, 70, 130, .2); --bracket: rgba(30, 50, 90, .3);
  --thread: #1b2a47; --link: rgba(40, 55, 85, .45); --band: #111622; --band-fg: #f5f7fa;
  --focus: #ffd21f; --focus-rgb: 255, 210, 31; --focus-ink: #a37f00;
  --rel: #6d7689; --rel-rgb: 109, 118, 137; --pos: #d0451b; --pos-rgb: 208, 69, 27; --neg: #1f5fbf; --neg-rgb: 31, 95, 191;
  --evidence: #6f45e0; --evidence-rgb: 111, 69, 224; --ui: #111622; --ui-fg: #ffffff; --chip: rgba(30, 50, 90, .07); --tone: rgba(17, 22, 34, .16);
  --shadow: none;
  color-scheme: light;
}
* { box-sizing: border-box; }
html, body { height: 100%; }
body { margin: 0; background: var(--space); color: var(--ink); font: 14px/1.6 var(--font); display: grid; grid-template-rows: auto minmax(0, 1fr); grid-template-columns: minmax(0, 1fr); overflow: hidden; }
button, select { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }

/* ---------- header ---------- */
header { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 18px; padding: 10px 16px; border-bottom: 1px solid var(--rule); background: var(--space); position: relative; z-index: 20; }
.titles { min-width: 0; flex: 1 1 240px; }
.titles h1 { font-size: 15px; line-height: 1.3; margin: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; letter-spacing: .02em; }
.titles .src { color: var(--muted); font-size: 12px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.ctl { display: flex; align-items: center; gap: 8px; }
.ctl-label { font: 700 10px/1 var(--mono); letter-spacing: .16em; color: var(--muted); text-transform: uppercase; }
.seg-ctl { display: inline-flex; border: 1px solid var(--rule); border-radius: 8px; overflow: hidden; }
.seg-ctl button { border: 0; background: transparent; padding: 5px 11px; font-size: 13px; transition: background .2s, color .2s; }
.seg-ctl button + button { border-left: 1px solid var(--rule); }
.seg-ctl button[aria-pressed="true"] { background: var(--ui); color: var(--ui-fg); }
#stopCtl button::before { content: attr(data-level); font: 700 9px/1 var(--mono); opacity: .55; margin-right: 6px; letter-spacing: .06em; }
.icon-btn { border: 1px solid var(--rule); background: transparent; border-radius: 7px; min-width: 30px; height: 28px; padding: 0 7px; font-size: 12px; }
.icon-btn:hover, .seg-ctl button:hover:not([aria-pressed="true"]) { background: var(--chip); }

/* ---------- main: the ground (text) and the space above it (model) ---------- */
main { position: relative; display: flex; min-height: 0; overflow: hidden; }
#field { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; z-index: 0; }
#textPane { flex: none; height: 100%; overflow: auto; position: relative; z-index: 1; background: var(--ground); scrollbar-width: thin; transform-origin: 50% 60%; }
#page { position: relative; padding: 34px 0 170px var(--gutter, 48px); width: max-content; isolation: isolate; }
#slabs { position: absolute; left: 0; top: 0; overflow: visible; pointer-events: none; z-index: 0; }
#text { position: relative; z-index: 1; width: var(--col, 520px); font-size: 15px; line-height: 2; white-space: pre-wrap; overflow-wrap: anywhere; color: var(--ink-2); }
#marks { position: absolute; left: 0; top: 0; overflow: visible; pointer-events: none; z-index: 2; }
#tags { position: absolute; z-index: 3; top: 0; left: calc(var(--gutter, 48px) + var(--col, 520px) + 26px); width: calc(var(--tagw, 220px) - 34px); }
#modelPane { flex: 1 1 0; min-width: 0; position: relative; z-index: 1; background: var(--sky); border-left: 1px solid var(--rule); }
#stage { position: absolute; inset: 0; overflow: auto; scrollbar-width: thin; z-index: 1; }
#rep { position: relative; min-height: 100%; padding: 28px 28px 160px; }
body[data-stop="text"] #modelPane, body[data-stop="chunks"] #modelPane { display: none; }
body[data-stop="text"] #marks, body[data-stop="text"] #tags, body[data-stop="text"] #slabs { visibility: hidden; }
body:not([data-stop="chunks"]) #tags { display: none; }

/* ---------- L0: text ---------- */
.seg.c { cursor: pointer; border-radius: 2px; transition: background-color .25s, box-shadow .25s, color .25s; }
body[data-stop="text"] .seg.c { cursor: text; }
.seg.hn { background: rgba(var(--focus-rgb), .13); color: var(--ink); }
.seg.hq { background: rgba(var(--focus-rgb), .42); color: var(--ink); }
.seg.hp { background: rgba(var(--focus-rgb), .92); color: #111622; box-shadow: inset 0 -2px var(--focus-ink); }
.seg.hr { box-shadow: inset 0 -2px var(--rel); color: var(--ink); }
.seg.hr.pos { box-shadow: inset 0 -2px var(--pos); background: rgba(var(--pos-rgb), .14); }
.seg.hr.neg { box-shadow: inset 0 -2px var(--neg); background: rgba(var(--neg-rgb), .14); }
.seg.hx { box-shadow: inset 0 -2px var(--focus); }
.seg.he { background: rgba(var(--evidence-rgb), .24); }
.seg.flash { animation: wash 1.5s ease-out; }
@keyframes wash { 0% { background: rgba(var(--focus-rgb), .5); color: var(--ink); } 100% { background: transparent; } }

/* ---------- L1: chunks lifted off the text ---------- */
#slabs rect.slab { fill: var(--slab); stroke: var(--slab-line); stroke-width: 1; }
#slabs rect.shadow { fill: none; stroke: var(--slab-line); stroke-width: 1; stroke-dasharray: 2 3; opacity: .7; }
#slabs g.f0 rect.slab { fill: rgba(var(--focus-rgb), .07); stroke: var(--focus); }
#slabs g.lift rect.slab { animation: lift .8s var(--ease-settle) both; }
#slabs g.lift rect.shadow { animation: fadein .8s ease-out both; }
@keyframes lift { from { transform: translate(5px, 5px); opacity: 0; } to { transform: none; opacity: 1; } }
#marks .br path.line { fill: none; stroke: var(--bracket); stroke-width: 1.6; transition: stroke .2s, stroke-width .2s; }
#marks .br path.hit { fill: none; stroke: transparent; stroke-width: 12; pointer-events: stroke; cursor: pointer; }
#marks .br text { font: 700 10.5px/1 var(--mono); fill: var(--muted); text-anchor: end; dominant-baseline: hanging; pointer-events: auto; cursor: pointer; }
#marks .br.reading path.line { stroke: var(--ink-2); }
#marks .br.f0 path.line { stroke: var(--focus); stroke-width: 3; }
#marks .br.f0 text { fill: var(--focus); }
#marks .br.f1 path.line { stroke: var(--rel); stroke-width: 2.4; }
#marks .br.f1.pos path.line { stroke: var(--pos); } #marks .br.f1.neg path.line { stroke: var(--neg); }
#marks .br.part path.line { stroke: var(--ink-2); stroke-width: 2; }
#marks .br.ev path.line { stroke: var(--evidence); stroke-width: 2.4; }
#marks .br.grow path.line { stroke: var(--ink); stroke-width: 3; stroke-dasharray: 1; animation: grow .7s var(--ease-settle) both; }
#marks path.leader { fill: none; stroke: var(--rule); stroke-width: 1; }
@keyframes grow { from { stroke-dashoffset: 1; } to { stroke-dashoffset: 0; } }
@keyframes fadein { from { opacity: 0; } }
.tag { position: absolute; left: 0; width: 100%; display: flex; gap: 8px; align-items: baseline; padding: 5px 9px 6px; border: 1.5px solid var(--card-line); border-left: 4px solid var(--accent); background: var(--card); border-radius: 0; box-shadow: var(--shadow); cursor: pointer; transition: background .2s, border-color .2s, opacity .2s; }
.tag.d1 { border-left-width: 2px; }
.tag .num { font: 700 11px/1.5 var(--mono); color: var(--muted); flex: none; }
.tag .head { font-size: 12.5px; line-height: 1.45; font-weight: 700; color: var(--ink); }
.tag.f0 { border-color: var(--focus); }
.tag.f0 .head { background: linear-gradient(transparent 60%, rgba(var(--focus-rgb), .55) 60%); }
.tag.f1 { border-left-color: var(--rel); } .tag.f1.pos { border-left-color: var(--pos); } .tag.f1.neg { border-left-color: var(--neg); }
.tag.concl { background: var(--band); border-left-color: var(--focus); } .tag.concl .head { color: var(--band-fg); } .tag.concl .num { color: var(--band-fg); opacity: .6; }
.focusing .tag:not(.f0):not(.f1):not(.part) { opacity: .4; }

/* ---------- L2: the model ---------- */
.card { position: relative; background: var(--card); border: 1.5px solid var(--card-line); border-left: 4px solid var(--accent); border-radius: 0; padding: 10px 14px 11px 12px; transition: border-color .2s, box-shadow .2s, background .2s; }
.card .ch { display: flex; gap: 9px; align-items: baseline; }
.card .num { font: 700 12px/1.4 var(--mono); color: var(--muted); flex: none; letter-spacing: .02em; }
.card .kicker { display: block; font: 700 9.5px/1.2 var(--mono); letter-spacing: .2em; color: var(--muted); margin: 0 0 4px; }
.card .head { font-size: 15.5px; line-height: 1.45; font-weight: 800; color: var(--ink); letter-spacing: .01em; }
.card.d1 { border-left-width: 2px; }
.card.d1 .head { font-size: 14.5px; }
.card .pts { margin: 8px 0 0; padding: 0 0 0 18px; list-style: none; }
.pt { position: relative; font-size: 13.5px; line-height: 1.6; color: var(--ink-2); padding: 1px 4px; margin-left: -4px; border-radius: 4px; cursor: pointer; transition: background .2s, color .2s; }
.pts .pt::before { content: ""; position: absolute; left: -13px; top: .8em; width: 7px; height: 1.5px; background: var(--bracket); }
.pt + .pt { margin-top: 2px; }
.when { display: inline-block; font: 700 11px/1.5 var(--mono); color: var(--ink); background: var(--chip); border: 1px solid var(--rule); border-radius: 4px; padding: 0 5px; margin-right: 6px; }
.card .kids { margin-top: 12px; display: grid; grid-template-columns: minmax(0, 1fr); gap: 10px; }
.card { min-width: 0; }
.card.concl { background: var(--band); border-color: var(--band); border-left: 4px solid var(--focus); }
.card.concl .head, .card.concl .pt { color: var(--band-fg); }
.card.concl .num, .card.concl .kicker { color: var(--band-fg); opacity: .6; }
.card.concl .when { color: var(--band-fg); border-color: rgba(0, 0, 0, .2); background: rgba(0, 0, 0, .06); }
:root[data-theme="light"] .card.concl .when { border-color: rgba(255, 255, 255, .25); background: rgba(255, 255, 255, .08); }
.card.concl .pts .pt::before { background: var(--focus); }
.card.prov-inferred, .card.prov-uncertain { border-style: dashed; border-left-style: solid; }
.card.prov-abstracted { border-style: dotted; border-left-style: solid; }
.card.reading { border-color: var(--ink-2); }
.card.f0 { border-color: var(--focus); box-shadow: 0 0 0 2px var(--focus); }
.card.f0 > .ch .head { background: linear-gradient(transparent 60%, rgba(var(--focus-rgb), .55) 60%); }
.card.f1 { border-color: var(--rel); box-shadow: 0 0 0 1px var(--rel); }
.card.f1.pos { border-color: var(--pos); box-shadow: 0 0 0 1px var(--pos); }
.card.f1.neg { border-color: var(--neg); box-shadow: 0 0 0 1px var(--neg); }
.card.ev { border-color: var(--evidence); box-shadow: 0 0 0 1px var(--evidence); }
.card.cur { border-color: var(--ink); box-shadow: 0 0 0 2px var(--ink); }
.pt.fp { background: rgba(var(--focus-rgb), .85); color: #111622; }
.focusing .card.dim > .ch, .focusing .card.dim > .pts, .focusing .card.dim > .kicker { opacity: .28; }
.focusing .card.dim { border-color: var(--rule); box-shadow: none; }
.card.stamp { animation: stamp .7s var(--ease-settle); }
@keyframes stamp { 0% { transform: scale(1.05); } 35% { box-shadow: 0 0 0 6px var(--focus); } 100% { transform: none; } }

/* linear: the notes in reading order */
.rep.linear .stack { max-width: 720px; display: grid; gap: 14px; margin-right: 130px; }
/* structure: columns that flow toward the conclusion */
.rep.structure .cols { display: flex; align-items: center; gap: 88px; min-height: calc(100% - 20px); }
.rep.structure .col { flex: 1 1 0; min-width: 0; max-width: 320px; display: grid; grid-template-columns: minmax(0, 1fr); gap: 14px; }
.rep.structure .card { padding: 8px 12px 9px 10px; }
.rep.structure .card .head { font-size: 14px; }
.rep.structure .card.d1 .head { font-size: 13px; }
.rep.structure .card .kids { margin-top: 9px; gap: 6px; }
.rep.structure .card.d1 { padding: 5px 10px 6px 9px; }
.rep.structure .card.d1 .kicker { display: none; }
.rep.structure .card.d1 .head { display: block; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.rep.structure .card.d1 .ch { min-width: 0; }
.rep.structure .card:has(> .kids):not(.concl) { background: var(--card); background-image: radial-gradient(var(--tone) 1px, transparent 1.3px); background-size: 6px 6px; }
.rep.structure .card.d1 { background: var(--card); }
/* table */
.rep.table table { border-collapse: separate; border-spacing: 0; width: 100%; min-width: 640px; font-size: 13px; }
.rep.table th, .rep.table td { text-align: left; vertical-align: top; padding: 8px 10px; border-bottom: 1px solid var(--rule); }
.rep.table thead th { font: 700 10.5px/1.3 var(--mono); letter-spacing: .1em; color: var(--muted); border-bottom: 1px solid var(--ink-2); position: sticky; top: -28px; background: var(--space); z-index: 3; }
.rep.table tbody tr { background: var(--card); transition: opacity .2s; }
.rep.table tbody tr.d1 th.rowh { padding-left: 24px; }
.rep.table th.rowh { width: 26%; border-left: 3px solid var(--accent); }
.rep.table tr.d1 th.rowh { border-left-width: 2px; }
.rep.table th.rowh .num { font: 700 11px/1.5 var(--mono); color: var(--muted); display: block; }
.rep.table th.rowh .head { font-weight: 800; color: var(--ink); line-height: 1.45; }
.rep.table tr.concl th.rowh { background: var(--band); border-left-color: var(--focus); } .rep.table tr.concl th.rowh .head { color: var(--band-fg); } .rep.table tr.concl th.rowh .num { color: var(--band-fg); opacity: .6; }
.rep.table ul { margin: 0; padding: 0; list-style: none; display: grid; gap: 4px; }
.rep.table .pt { font-size: 12.5px; }
.rep.table tr.f0 th.rowh .head { background: linear-gradient(transparent 60%, rgba(var(--focus-rgb), .55) 60%); }
.rep.table tr.f0 th.rowh { border-left-color: var(--focus); }
.rep.table tr.f1 th.rowh { border-left-color: var(--rel); } .rep.table tr.f1.pos th.rowh { border-left-color: var(--pos); } .rep.table tr.f1.neg th.rowh { border-left-color: var(--neg); }
.focusing .rep.table tr.dim { opacity: .35; }
/* summary: one sentence at the top */
.rep.summary { display: flex; flex-direction: column; justify-content: center; }
.rep.summary .kick { font: 700 10.5px/1 var(--mono); letter-spacing: .3em; color: var(--muted); margin: 0 auto 20px; max-width: 34em; width: 100%; }
.rep.summary .gist { font-size: clamp(20px, 2.3vw, 30px); line-height: 1.8; font-weight: 800; letter-spacing: .03em; max-width: 34em; margin: 0 auto; color: var(--ink); }
.phrase { cursor: pointer; background-image: linear-gradient(var(--ink), var(--ink)); background-size: 100% 2px; background-repeat: no-repeat; background-position: 0 94%; transition: background-color .2s, opacity .2s; border-radius: 3px; }
.phrase sup { font: 700 11px/1 var(--mono); color: var(--muted); margin-left: 3px; letter-spacing: 0; }
.phrase.f0 { background-color: rgba(var(--focus-rgb), .85); color: #111622; background-image: linear-gradient(#111622, #111622); }
.phrase.f0 sup { color: #111622; }
.focusing .gist .phrase.dim { opacity: .35; }
.rep.summary.sweep .phrase { animation: sweep .8s var(--ease-settle) both; }
@keyframes sweep { from { background-size: 0 2px; opacity: .15; } to { background-size: 100% 2px; opacity: 1; } }
.rep.summary .rest { max-width: 34em; width: 100%; margin: 36px auto 0; display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.rep.summary .rest .rest-label { font: 700 10px/1 var(--mono); letter-spacing: .2em; color: var(--muted); margin-right: 4px; }
.chip { display: inline-flex; gap: 6px; align-items: baseline; padding: 4px 9px; border: 1.5px solid var(--card-line); border-left: 3px solid var(--accent); background: var(--card); border-radius: 0; font-size: 12px; cursor: pointer; color: var(--ink-2); }
.chip .num { font: 700 11px/1 var(--mono); color: var(--muted); }
.chip.f0 { border-color: var(--focus); color: var(--ink); }
.focusing .chip.dim { opacity: .4; }
.anchor { position: absolute; pointer-events: none; opacity: 0; }
.rep .empty { color: var(--muted); }

/* relation lines: thin lines of light */
#links { position: absolute; left: 0; top: 0; pointer-events: none; overflow: visible; z-index: 2; }
#links .link path.l { fill: none; stroke: var(--link); stroke-width: 1.4; transition: opacity .2s, stroke-width .2s; }
#links .link path.a { fill: var(--link); stroke: none; }
#links .link.pos path.l { stroke: var(--pos); opacity: .75; } #links .link.pos path.a { fill: var(--pos); }
#links .link.neg path.l { stroke: var(--neg); opacity: .75; } #links .link.neg path.a { fill: var(--neg); }
#links .link.prov-inferred path.l, #links .link.prov-uncertain path.l { stroke-dasharray: 5 4; }
#links .link.prov-abstracted path.l { stroke-dasharray: 1.5 3.5; }
#links .link path.hit { fill: none; stroke: transparent; stroke-width: 12; pointer-events: stroke; cursor: pointer; }
#links .link .lbl { opacity: 0; transition: opacity .2s; pointer-events: auto; cursor: pointer; }
#links .link.show .lbl, #links .link.f0 .lbl, #links .link.f1 .lbl { opacity: 1; }
#links .lbl rect { fill: var(--space); stroke: var(--rule); }
#links .lbl text { font-size: 11.5px; font-weight: 700; fill: var(--ink-2); dominant-baseline: middle; text-anchor: middle; }
#links .link.pos .lbl rect { stroke: rgba(var(--pos-rgb), .7); } #links .link.neg .lbl rect { stroke: rgba(var(--neg-rgb), .7); }
.focusing #links .link:not(.f0):not(.f1):not(.ev) { opacity: .14; }
#links .link.f0 path.l, #links .link.f1 path.l { opacity: 1; stroke-width: 2.2; }
#links .link.f0 path.l { stroke: var(--focus); } #links .link.f0 path.a { fill: var(--focus); }
#links .link.f0 .lbl rect { fill: var(--focus); stroke: var(--focus); }
#links .link.f0 .lbl text { fill: #111622; }
#links .link.ev path.l { stroke: var(--evidence); opacity: 1; stroke-width: 2.2; }
#links .link.grow path.l { stroke-dasharray: 1; animation: grow .8s var(--ease-settle) both; }
#links .link.grow.prov-inferred path.l, #links .link.grow.prov-uncertain path.l, #links .link.grow.prov-abstracted path.l { stroke-dasharray: 5 4; animation: fadein .6s ease-out both; }
#links .link.grow path.a, #links .link.grow .lbl { animation: fadein .35s ease-out both; }

/* the thread between a word on the ground and its note above */
#pointer { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; z-index: 8; overflow: visible; }
#pointer path { fill: none; stroke: var(--thread); stroke-width: 1.3; opacity: .8; }
#pointer path.glow { display: none; }

      caption: `${t.num} ${t.label}  ←  ` + rs.map(r => `${r.source.num} ${r.label}`).join(' / ') });
  });
  if (summary.length) steps.push({ phase: 'summary', stop: 'model', rep: 'summary', rels: null, caption: summary.map(p => p.text).join('') });
  return steps;
}
function stepDwell(st) {
  const major = st.node && (!st.node.parent || st.node.role === 'conclusion');
  const base = { text: 1500, wrap: major ? 700 : 450, notes: 2600, structure: 1500, link: 1000 + 260 * (st.grow || []).length, summary: 6000 }[st.phase] || 1200;
  return base / speed();
}
async function showStep(k, opts = {}) {
  if (!story.length) story = buildStory();
  k = clamp(k, 0, story.length - 1);
  const prev = at;
  at = k;
  const st = story[k];
  const my = ++token;
  const animate = opts.animate !== false && k - prev === 1 && !reduceMotion;
  setProgress(); setCaption(st);
  S.current = new Set(st.current || []);
  S.hover = null; S.pinned = null;
  S.shown = st.rels ? new Set(st.rels) : null;
  const next = { stop: st.stop, rep: st.rep || S.rep, wrapped: new Set(st.wrapped || order.map(n => n.id)) };
  if (st.phase === 'wrap' && animate) {
    await scrollTextAndWait(st.node.home);
    if (my !== token) return;
    const major = !st.node.parent || st.node.role === 'conclusion';
    const ci = cutIn(st.node, major ? 'major' : 'minor');
    await sleep((major ? 560 : 300) / speed());
    if (my !== token) return;
    await go(next, { ms: 600, lift: new Set([st.node.id]) });
    $$(`#marks .br[data-node="${st.node.id}"]`).forEach(b => b.classList.add('grow'));
    if (st.node.home) { const [a, z] = spanSegs(st.node.home); for (let i = a; i <= z; i++) { segEls[i].classList.remove('flash'); void segEls[i].offsetWidth; segEls[i].classList.add('flash'); } }
    await ci;
  } else if (st.phase === 'link') {
    await go(next, { instant: !animate, grow: animate ? new Set(st.grow) : new Set() });
    if (animate && st.node && st.node.role === 'conclusion') {
      await sleep(900 / speed());
      const c = repEl.querySelector(`.card[data-key="card:${st.node.id}"]`);
      if (c) { c.classList.remove('stamp'); void c.offsetWidth; c.classList.add('stamp'); }
    }
    if (st.node) revealInModel(st.node, true);
  } else {
    if (animate && st.phase !== 'text') slate(T['rep' + st.rep[0].toUpperCase() + st.rep.slice(1)], T['phase_' + st.phase]);
    if (st.phase === 'wrap' && st.node) scrollTextTo(st.node.home);
    await go(next, { instant: !animate, ms: st.phase === 'notes' ? 960 : st.phase === 'summary' ? 900 : 780 });
    if (st.phase === 'summary') sweepSummary();
  }
  applyFocus();
}
async function play() {
  if (!story.length) story = buildStory();
  if (at >= story.length - 1) at = -1;
  playing = true; setProgress();
  const me = ++run;
  while (playing && me === run) {
    const k = at + 1;
    if (k >= story.length) break;
    await showStep(k);
    if (!playing) break;
    const t0 = token;
    await sleep(stepDwell(story[k]));
    if (token !== t0 || !playing) break;
  }
  if (me === run) { playing = false; setProgress(); }
}
function stopStory() { clearTimeout(autoplay); playing = false; token++; run++; at = -1; S.current = new Set(); setCaption(null); setProgress(); }
function pause() { clearTimeout(autoplay); playing = false; token++; run++; setProgress(); }
function setProgress() {
  $('#progress').textContent = at >= 0 && story.length ? `${at + 1} / ${story.length}` : '–';
  $('#playBtn').textContent = playing ? '❚❚' : '▶';
  $('#playBtn').setAttribute('aria-label', playing ? 'Pause' : 'Play');
}
function setCaption(st) {
  const c = $('#caption');
  c.hidden = !st;
  if (!st) return;
  $('.phase', c).textContent = T['phase_' + st.phase] || '';
  $('.main', c).textContent = st.caption || '';
}

/* =====================================================================
   10. Events
   ===================================================================== */
const ownerNode = t => t.kind === 'point' ? t.node : t.kind === 'rel' ? t.source : t;
textEl.addEventListener('mousemove', ev => {
  if (S.stop === 'text') return;
  const seg = ev.target.closest('.seg');
  const k = seg ? +seg.dataset.k : null;
  const t = k != null ? targetOfSeg(k) : null;
  if (t && !isWrapped(ownerNode(t))) { setHover(null); return; }
  setHover(t, t ? k : null);
});
textEl.addEventListener('mouseleave', () => setHover(null));
textEl.addEventListener('click', ev => {
  if (S.stop === 'text') return;
  const seg = ev.target.closest('.seg');
  const t = seg ? targetOfSeg(+seg.dataset.k) : null;
  if (!t || !isWrapped(ownerNode(t))) { setPinned(null); return; }
  setPinned(S.pinned === t ? null : t, { scroll: true, fromText: true });
});
const targetOfEl = el => {
  if (!el || !el.closest) return null;
  const pt = el.closest('.pt');
  if (pt) return nodes.get(pt.dataset.node).points[+pt.dataset.pt];
  const ph = el.closest('.phrase');
  if (ph) return summary[+ph.dataset.phrase];
  const ln = el.closest('.link');
  if (ln) return elsById.get(ln.dataset.rel);
  const nd = el.closest('[data-node]');
  return nd ? nodes.get(nd.dataset.node) : null;
};
[repEl, tagsEl, marks].forEach(host => {
  host.addEventListener('mousemove', ev => setHover(targetOfEl(ev.target)));
  host.addEventListener('mouseleave', () => setHover(null));
  host.addEventListener('click', ev => {
    const t = targetOfEl(ev.target);
    if (!t) { if (host === repEl) setPinned(null); return; }
    ev.stopPropagation();
    setPinned(S.pinned === t ? null : t, { scroll: true });
  });
  host.addEventListener('dblclick', ev => { const t = targetOfEl(ev.target); const n = t && (t.kind === 'node' ? t : t.kind === 'point' ? t.node : null); if (n && S.stop === 'model') focusIn(n); });
});
let rafScroll = 0;
textPane.addEventListener('scroll', () => { cancelAnimationFrame(rafScroll); rafScroll = requestAnimationFrame(() => { drawPointer(); followReading(); }); }, { passive: true });
stage.addEventListener('scroll', () => requestAnimationFrame(drawPointer), { passive: true });
// the model follows the part of the text being read
let readingId = null, followTO = 0;
function followReading() {
  if (S.stop === 'text') return;
  const mid = textPane.scrollTop + textPane.clientHeight * 0.42;
  let best = null;
  order.forEach(n => (n.boxes || []).forEach(b => { if (b.top <= mid && b.bottom >= mid && isWrapped(n) && (!best || b.bottom - b.top < best.len)) best = { n, len: b.bottom - b.top }; }));
  const id = best ? best.n.id : null;
  if (id === readingId) return;
  readingId = id;
  $$('.reading').forEach(el => el.classList.remove('reading'));
  if (!best) return;
  $$(`#marks .br[data-node="${id}"]`).forEach(el => el.classList.add('reading'));
  const card = repEl.querySelector(`.card[data-key="card:${id}"]`);
  if (card) card.classList.add('reading');
  clearTimeout(followTO);
  if (S.follow && card && S.rep === 'linear' && !S.pinned && !playing && !S.hover) {
    followTO = setTimeout(() => {
      const c = stage.getBoundingClientRect(), r = card.getBoundingClientRect();
      if (r.top < c.top + 10 || r.top > c.bottom - 130) stage.scrollTo({ top: stage.scrollTop + r.top - c.top - 30, behavior: reduceMotion ? 'auto' : 'smooth' });
    }, 140);
  }
}
$('#stopCtl').addEventListener('click', ev => { const b = ev.target.closest('button'); if (b && b.dataset.stop !== S.stop) explore({ stop: b.dataset.stop }); });
$('#repCtl').addEventListener('click', ev => { const b = ev.target.closest('button'); if (b && (b.dataset.rep !== S.rep || S.stop !== 'model')) explore({ rep: b.dataset.rep, stop: 'model' }); });
$('#playBtn').addEventListener('click', () => playing ? pause() : play());
$('#nextBtn').addEventListener('click', () => { pause(); showStep(at + 1); });
$('#prevBtn').addEventListener('click', () => { pause(); showStep(Math.max(0, at - 1)); });
$('#firstBtn').addEventListener('click', () => { pause(); showStep(0, { animate: false }); });
$('#orderSel').addEventListener('change', () => { const was = playing; pause(); story = buildStory(); at = -1; if (was) play(); else showStep(0, { animate: false }); });
document.addEventListener('keydown', ev => {
  if (ev.target.closest && ev.target.closest('select, input, textarea')) return;
  if (ev.key === 'Escape') { if (S.pinned) setPinned(null); else setHover(null); }
  else if (ev.key === ' ') { ev.preventDefault(); playing ? pause() : play(); }
  else if (ev.key === 'ArrowRight') { ev.preventDefault(); pause(); showStep(at + 1); }
  else if (ev.key === 'ArrowLeft') { ev.preventDefault(); pause(); showStep(Math.max(0, at - 1)); }
  else if (ev.key === 'ArrowUp' || ev.key === 'PageUp' && ev.shiftKey) { ev.preventDefault(); focusOut(); }
  else if (ev.key === 'ArrowDown') { ev.preventDefault(); focusIn(S.pinned && S.pinned.kind === 'node' ? S.pinned : null); }
  else if (/^[1-4]$/.test(ev.key)) explore({ rep: REPS[+ev.key - 1], stop: 'model' });
});
let resizeTO = 0;
addEventListener('resize', () => { clearTimeout(resizeTO); resizeTO = setTimeout(() => { endFlight(); renderAll(); afterRender(); }, 120); });

/* =====================================================================
   11. Start
   ===================================================================== */
$('#title').textContent = meta.title || (LANG === 'ja' ? '無題' : 'Untitled');
document.title = (meta.title ? meta.title + ' — ' : '') + 'Semantic Model';
if (meta.source) $('#sourceLine').textContent = meta.source;
if (problems.length) {
  const p = $('#problems'); p.hidden = false;
  p.append(h('b', {}, T.problems), h('ul', {}, ...problems.slice(0, 8).map(x => h('li', {}, x))));
}
renderAll();
afterRender();
if (viewOpt.focus && nodes.get(viewOpt.focus)) setPinned(nodes.get(viewOpt.focus), { scroll: true });
(document.fonts ? document.fonts.ready : Promise.resolve()).then(() => { layoutText(); afterRender(); });
if (viewOpt.play) { story = buildStory(); autoplay = setTimeout(() => {}, 0); showStep(0, { animate: false }).then(() => { if (at === 0 && !playing) autoplay = setTimeout(play, 800); }); }

window.__semanticViewer = {
  get state() { return { stop: S.stop, rep: S.rep, step: at, steps: story.length, playing, pinned: S.pinned ? keyOf(S.pinned) : null, hover: S.hover ? keyOf(S.hover) : null, flying: !!flight }; },
  problems, order: order.map(n => ({ id: n.id, num: n.num })),
  explore, showStep: (k, o) => showStep(k, o), play, pause,
  story: () => (story.length ? story : (story = buildStory())).map(s => ({ phase: s.phase, caption: s.caption })),
  pin: id => setPinned(elsById.get(id) || null, { scroll: true }), hover: id => setHover(elsById.get(id) || null),
};
})();
